- record_id: ARENA-DLV-22027
  source_title: AHC - 100% Hydrogen Distribution Networks South Australia Feasibility
    Study
  publish_date: 2023-05
  project_name: 100% Hydrogen Distribution Networks South Australia Feasibility Study
  what_happened: Australia's digital television switchover demonstrated that customers
    who were responsible for elements of a technology transition (purchasing set-top
    boxes) failed to act without detailed information and financial incentives, and
    that a state-wide mandate combined with public communications campaigns was required
    to drive uptake. Phased switchovers also created path-dependency problems where
    initial technology choices constrained later stages.
  lesson_learnt: For hydrogen appliance conversion programs, customers cannot be expected
    to act without a combination of government mandate, financial incentives, and
    a sustained public communications campaign explaining what is required, by when,
    and why — the digital TV experience shows that without this, uptake is insufficient
    to support a scheduled network conversion; a staged approach starting with simpler
    regional networks allows lessons to be captured before converting complex urban
    networks.
