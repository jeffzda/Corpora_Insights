- record_id: ARENA-DLV-56757
  source_title: 'AHC - 10% Hydrogen Distribution Networks: Victoria Feasibility Study'
  publish_date: 2023-05
  project_name: '10% Hydrogen Distribution Networks: Victoria Feasibility Study'
  what_happened: Achieving 10% hydrogen in networks required a package of amendments
    to the national gas regulatory framework — including changes to the definition
    of 'natural gas' in the NGL/NGR, amendments to Part 19 of the NGR for distribution-connected
    production facilities, and changes to AEMO metering procedures for zonal heating
    values. At the time of the study, legislative changes were agreed but not yet
    enacted, with an expected 2023 legislative timeframe and AEMO targeting early
    2024 for metering procedure changes.
  lesson_learnt: Industrial operators with Type B appliances should be engaged early
    in any hydrogen blending program — individual certification requirements and the
    absence of blanket compatibility clearances mean the Type B pathway is more complex
    and time-consuming than for domestic appliances, and programs relying on industrial
    offtake may face delays if appliance assessment is not commenced concurrently
    with network infrastructure development.
  issue_severity: major
  project_type: null
