- record_id: ARENA-DLV-12559
  source_title: Australian Hydrogen Centre Regional Towns Study - Ballarat
  publish_date: 2022-07
  project_name: Australian Hydrogen Centre – Ballarat Hydrogen Blending Feasibility
    Study
  what_happened: Electricity cost modelling showed that the Ballarat electrolyser's
    economics are highly sensitive to Victorian wholesale electricity pool prices,
    with optimal operation requiring the facility to minimise production during high-price
    periods and exploit arbitrage between electricity spot prices and gas spot prices
    — but NEM price volatility through to 2030 due to plant retirements creates significant
    operational uncertainty.
  lesson_learnt: Hydrogen blending projects in Victorian gas networks face materially
    different market integration challenges than equivalent projects in other Australian
    states — the DWGM's meshed topology, limited line pack, and intraday volatility
    require bespoke operational control and market participation strategies; project
    developers should not assume that approaches developed for South Australian or
    Queensland gas networks will transfer to Victoria without significant adaptation.
