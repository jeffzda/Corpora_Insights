  publish_date: 2023-05
  project_name: 10% Hydrogen Distribution Networks South Australia Feasibility Study
  what_happened: The literature review of historic infrastructure conversions found
    that public acceptance is a critical success factor for major gas network transitions,
    and that large-scale conversion programs are more challenging today than historical
    precedents (e.g., the 1960s–70s town gas to natural gas conversion) due to lower
    trust in government and gas companies, reduced home access, and the amplifying
    effect of social media on safety incidents.
  lesson_learnt: Pipeline compatibility assessments for hydrogen blending projects
    should systematically test all distribution licensed pipelines against ASME B31.12
    design factor thresholds and MAOP limits, not just sample representative pipelines
    — the single excluded pipeline in SA demonstrates that individual pipeline characteristics
    can differ materially from network averages and must be assessed before blending
    commences on that section.
