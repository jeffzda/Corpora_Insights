- record_id: ARENA-DLV-48110
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: 'Monolithic perovskite – Si tandem cells: towards commercial reality (2017/RND018)'
  what_happened: ANU and Jinko Solar successfully collaborated to modify both academic and commercial processes to accommodate novel monolithic perovskite/Si tandem cell architectures. The collaboration
    required both parties to adapt their standard processes, demonstrating that researcher-manufacturer co-design is necessary for architectures that are simultaneously commercially and technically viable.
  lesson_learnt: For perovskite/Si tandem cell development to reach commercial viability, both research and manufacturing partners must be willing to modify their existing processes — structuring a project
    so that the industry partner actively co-designs the architecture (not merely receives outputs) increases the likelihood of commercially viable outcomes.
