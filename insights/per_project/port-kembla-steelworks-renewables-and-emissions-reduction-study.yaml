- record_id: ARENA-DLV-54902
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Pneumatic conveying trials found that biochar/coal blends could be
    proportioned and stored with existing equipment at up to 30% biochar, but pneumatic
    conveyance to the 28 tuyere lines was only successful up to approximately 20%
    biochar, creating a binding operational constraint below the handling/storage
    limit.
  lesson_learnt: Pneumatic conveying to injection points — not bulk handling or storage
    — is the binding constraint on biochar blend ratios in blast furnace PCI systems;
    conduct pneumatic conveying trials at realistic injection pressures and distances
    before setting target blend rates for project design.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Conducted dedicated laboratory-scale pneumatic conveying studies
    through Bulk Materials Engineering Australia (BMEA) at University of Wollongong
    prior to plant trials, which identified the 20% limit before full-scale commitment.
  transferability: moderate
  delay_magnitude: null
  technology_domain: industrial renewables
  source_pages: &id002
