- record_id: ARENA-DLV-54901
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: BlueScope conducted laboratory and plant biochar trials at Port Kembla
    Steelworks, procuring 1,000 tonnes of biochar and conducting pneumatic conveying
    studies through the University of Wollongong. Trials concluded that biochar/coal
    blends of up to approximately 20% biochar can successfully replace pulverised
    coal in blast furnace operations using existing PCI Plant equipment.
  lesson_learnt: Biochar can be integrated into existing blast furnace PCI infrastructure
    at up to 20% blend without capital equipment changes — projects targeting near-term
    blast furnace decarbonisation should validate blend limits through pneumatic conveying
    studies before assuming higher substitution rates are operationally viable.
