- record_id: ARENA-DLV-54903
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: 'BlueScope''s assessment of 17 technological areas and 100 processes
    identified that no single decarbonisation technology is sufficient, leading to
    adoption of a dual-stream strategy: near-term optimisation of existing blast furnace
    assets alongside longer-term pursuit of breakthrough ironmaking technologies such
    as hydrogen DRI.'
  lesson_learnt: Industrial decarbonisation projects at integrated steelworks should
    plan for parallel technology streams — near-term asset optimisation (biochar,
    scrap, energy efficiency) and long-term breakthrough technology — rather than
    waiting for breakthrough technology before acting, as the two streams operate
    on different capital and readiness timelines.
