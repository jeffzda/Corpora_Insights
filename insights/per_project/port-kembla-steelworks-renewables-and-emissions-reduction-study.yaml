- record_id: ARENA-DLV-54904
  source_title: ARENA Insights Green Steel Webinar
  publish_date: 2024-05
  project_name: Port Kembla Steelworks Renewables and Emissions Reduction Study
  what_happened: Assessment of decarbonisation options for the Port Kembla Steelworks
    found that natural gas DRI configured for later hydrogen transition delivers approximately
    60% reduction in carbon emissions relative to blast furnace operations, while
    preserving Australian ironmaking capability and avoiding market displacement by
    imports from natural-gas-DRI countries.
  lesson_learnt: For integrated steelworks projects evaluating ironmaking decarbonisation,
    designing DRI plant for natural gas operation with a hydrogen-ready configuration
    provides a commercially viable transition pathway — the ~60% emissions reduction
    is achievable now without waiting for competitive green hydrogen pricing, and
    protects domestic market position.
  issue_severity: none
  project_type: industrial decarbonisation
