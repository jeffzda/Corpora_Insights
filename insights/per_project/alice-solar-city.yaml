  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Alice Solar City
  what_happened: The Alice Solar City project found that Cost Reflective Tariff (CRT)
    customers received only small financial benefits, resulting in minimal leverage
    on energy usage behaviours, while solar hot water installation delivered the largest
    electricity consumption reductions of all energy efficiency measures (16% average
    annual reduction for electric-to-solar conversion).
  lesson_learnt: A cost reflective tariff must offer substantial financial attractiveness
    to meaningfully shift energy usage behaviours — small tariff differentials will
    not drive behaviour change. Solar hot water replacement is a more effective electricity
    consumption reduction measure than tariff restructuring alone.
