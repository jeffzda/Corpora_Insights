- record_id: ARENA-DLV-16254
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Smart Grid, Smart City — Newington Battery Trial
  what_happened: A planned field trial of network-attached batteries at Newington
    under the Smart Grid, Smart City program did not proceed due to unspecified challenges.
    Modelling using lead-acid batteries was conducted instead, indicating that under
    current tariff structures, energy storage would not be economically viable through
    to 2034 despite anticipated cost reductions.
  lesson_learnt: Network tariff structures are a critical determinant of behind-the-meter
    and grid-connected storage viability; projects should confirm the regulatory and
    tariff environment supports the business case before committing to deployment,
    as unfavourable tariffs can render storage uneconomic regardless of technology
    cost trajectories.
