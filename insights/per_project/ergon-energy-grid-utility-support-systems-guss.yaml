- record_id: ARENA-DLV-16259
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Ergon Energy Grid Utility Support Systems (GUSS)
  what_happened: Ergon Energy deployed 25 kVA / 100 kWh Grid Utility Support Systems (GUSS) on constrained SWER networks in Far North Queensland. The technology proved cost effective, with GUSS reducing
    electricity costs to consumers by up to 35% compared to traditional augmentation solutions costing over $2 million per intervention. Ergon subsequently called for tenders for 25 more units.
  lesson_learnt: Battery storage deployed as a non-network solution on constrained SWER fringe-of-grid lines can be faster and more cost effective than traditional augmentation; proponents should quantify
    the distribution loss factor and investment deferral benefits to build the regulatory and commercial case for replication.
