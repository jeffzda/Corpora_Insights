- record_id: ARENA-DLV-28251
  source_title: CSIRO Solar Air Turbine Project Final Report
  publish_date: '2014-07-29'
  project_name: Solar Air Turbine Project
  what_happened: The project successfully demonstrated solar power generation by integrating
    a turbine with a novel beam-redirection receiver, achieving 850°C outlet air temperature
    from a 600 kWth tubular cavity receiver — described as one of the world's highest
    at the time.
  lesson_learnt: High-temperature air receiver development is the critical path component
    for solar air turbine commercialisation; investing in scalable receiver design
    and demonstration at sub-commercial scale is a prerequisite before progressing
    to pilot or commercial deployment.
