  source_pages: &id006
  - 6
  - 7
  evidence_excerpt: Further gains in effectiveness could be achieved through allowing
    for extended operation of the designs... Experience with a 3 to 5 MWe scale pilot
    system should precede the commercial introduction of the plant and provide longer
    term durability test of heliostats and the developing or sourcing of a solarised
    turbine.
  confidence_note: lifecycle_phase set to close-out/post-project review because this
    finding was articulated at project conclusion as a gap identified through the
