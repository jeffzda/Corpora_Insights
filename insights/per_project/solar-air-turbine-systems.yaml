- record_id: ARENA-DLV-28255
  source_title: CSIRO Solar Air Turbine Project Final Report
  publish_date: '2014-07-29'
  project_name: Solar Air Turbine Project
  what_happened: The project adopted a 'fast development' style with multiple independent
    activities conducted in parallel, enabling several technology concepts to be evaluated
    and demonstrated within the project timeframe from December 2010 to March 2014.
  lesson_learnt: Parallel workstream structuring in early-stage R&D projects allows
    multiple concepts to reach proof-of-concept simultaneously; this approach is effective
    for technology programmes where the critical path is knowledge generation rather
    than sequential engineering delivery.
