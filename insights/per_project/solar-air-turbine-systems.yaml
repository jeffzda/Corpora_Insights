- record_id: ARENA-DLV-28256
  source_title: CSIRO Solar Air Turbine Project Final Report
  publish_date: '2014-07-29'
  project_name: Solar Air Turbine Project
  what_happened: The project identified that extended operation of demonstrated designs
    was not achieved within the project scope, with further operational durability
    testing of heliostats and development or sourcing of a solarised turbine identified
    as outstanding requirements before commercial introduction.
  lesson_learnt: Short-duration demonstration projects should explicitly plan for
    a follow-on pilot phase of 3–5 MWe scale to validate long-term durability of heliostats
    and turbine components before committing to commercial-scale deployment; absence
    of extended operation data is a material gap that must be closed.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: close-out/post-project review
  proponent_type: research organisation/university
  delay_category: null
