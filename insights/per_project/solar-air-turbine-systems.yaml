- record_id: ARENA-DLV-28254
  source_title: CSIRO Solar Air Turbine Project Final Report
  publish_date: '2014-07-29'
  project_name: Solar Air Turbine Project
  what_happened: System modelling projected an LCOE of 55 cent/kWh for a 2.5 MWe pilot
    system and 24 cent/kWh for a 10 MWe commercial system, both well above the threshold
    of less than 14 cent/kWh identified as necessary for the technology to be cost-competitive.
  lesson_learnt: Solar air turbine technology at pilot and early commercial scale
    remains significantly above competitive LCOE thresholds; future development programmes
    should target both thermal storage integration and capital cost reduction concurrently
    before progressing to commercial scale.
