- record_id: ARENA-DLV-28253
  source_title: CSIRO Solar Air Turbine Project Final Report
  publish_date: '2014-07-29'
  project_name: Solar Air Turbine Project
  what_happened: Thermal storage using liquid metal (lead-bismuth eutectic, LBE) was
    experimentally investigated but found to be immature; as a result, proposed pilot
    and commercial solar air turbine system designs did not incorporate thermal storage,
    limiting dispatchability.
  lesson_learnt: High-temperature thermal storage for solar air turbine systems is
    not yet commercially ready and should be excluded from near-term pilot and commercial
    designs; a dedicated storage development programme is needed before integration
    can be considered viable.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Proposed systems employed hybridisation with gas co-firing instead
    of thermal storage to provide dispatchable power while storage technology matures.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id003
  - 5
  - 6
  evidence_excerpt: In terms of system configuration, the proposed systems employed
    a hybridisation option but did not consider thermal storage due to its immaturity.
    However, it was found that in order to make very low cost (<14 cent/kWh) power
    generation achievable, thermal storage needs to be integrated along with further
    capital cost reduction of plant and equipment.
  confidence_note: null
  source_url: https://arena.gov.au/knowledge-bank/csiro-solar-air-turbine-project-final-report/
