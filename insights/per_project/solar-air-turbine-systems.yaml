- record_id: ARENA-DLV-28252
  source_title: CSIRO Solar Air Turbine Project Final Report
  publish_date: '2014-07-29'
  project_name: Solar Air Turbine Project
  what_happened: A costing study for low-cost heliostats targeting mass production
    found that a competitive cost as low as $100/m² could be achieved, below the project's
    initial target of $150/m², and fabrication and testing of a 150-metre focal length
    heliostat for larger-scale solar fields was completed.
  lesson_learnt: Parallel costing studies conducted alongside engineering and fabrication
    activities can identify more aggressive cost targets early; the $100/m² finding
    provides a design benchmark for future CSP tower projects seeking to reduce solar
    field capital costs.
