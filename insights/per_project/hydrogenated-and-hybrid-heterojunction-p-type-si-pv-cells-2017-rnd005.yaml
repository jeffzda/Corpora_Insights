- record_id: ARENA-DLV-48103
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Hydrogenated and Hybrid Heterojunction p-type Si PV Cells (2017/RND005)
  what_happened: The team successfully applied post-fabrication hydrogenation and gettering processes to p-type Si heterojunction cells, achieving open circuit voltages over 700 mV. Applying lessons from
    p-type work, they identified a rapid post-fabrication process (patent pending) for n-type heterojunction cells that improved efficiency by 0.7% absolute — attracting significant commercial interest
    from heterojunction cell manufacturers.
  lesson_learnt: Lessons from passivation process development on one cell type (p-type) can directly inform and accelerate process development for related cell types (n-type); cross-technology knowledge
    transfer within a research program should be explicitly planned and tracked.
