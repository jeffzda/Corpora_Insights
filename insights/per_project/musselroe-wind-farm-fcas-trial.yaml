  publish_date: 2022-01
  project_name: Musselroe Wind Farm FCAS Trial
  what_happened: The preliminary business case modelling for a co-located BESS at
    MRWF indicated that multiple configuration options were economically feasible,
    and that a battery could assist with CPF mitigation, power quality, and FCAS capability
    while also capturing otherwise curtailed wind energy.
  lesson_learnt: For wind farms with existing curtailment issues and run-back control
    schemes, co-located battery storage can deliver stacked value across FCAS, energy,
    CPF mitigation, and spilled wind capture — a multi-value business case model should
    be used from the outset rather than assessing FCAS revenue alone.
