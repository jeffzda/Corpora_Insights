  source_title: Mussleroe Wind Farm Lessons Learnt Progress Report 2019
  publish_date: 2019-11
  project_name: Musselroe Wind Farm FCAS Enablement Project
  what_happened: Rapid technological change in the wind industry reduced OEM capability
    to retain experienced engineering support for older generating platforms and their
    control systems. OEM knowledge of Australian grid and market requirements was
    also limited, and the time required to bring overseas and local OEM staff up to
    speed caused considerable project delays.
  lesson_learnt: When enabling new market services on legacy wind farm platforms,
    explicitly assess OEM support depth for that platform before project commencement
    — degraded OEM institutional knowledge for older systems is a predictable source
    of delay and should be factored into schedules and contingency budgets.
