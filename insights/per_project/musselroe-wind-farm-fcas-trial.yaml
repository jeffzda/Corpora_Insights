  project_name: Musselroe Wind Farm FCAS Trial
  what_happened: MRWF's very low connection point fault level (360 MVA, SCR 1.8–2.1)
    required installation of 4 STATCOMs, 4 capacitor banks, and 2 synchronous condensers
    to meet performance standards, adding significant plant complexity that in turn
    created the FCAS trapezium constraints experienced during the trial.
  lesson_learnt: Wind farms at weak grid connection points require extensive reactive
    compensation plant to meet performance standards; project developers should assess
    upfront how this compensation equipment will interact with future FCAS or ancillary
    service ambitions, as it can introduce operational limits not apparent at commissioning.
