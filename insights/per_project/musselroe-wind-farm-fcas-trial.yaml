  source_title: Musselroe Wind Farm Provision of FCAS
  publish_date: 2021-09
  project_name: Musselroe Wind Farm FCAS Project
  what_happened: The March 2021 test series was halted due to unexpected interactions
    with the Unconstrained Intermittent Generation Forecast (UIGF), adding an additional
    delay before the final successful tests in May 2021.
  lesson_learnt: FCAS test plans for semi-scheduled wind generators must account for
    UIGF interactions — NEMDE uses the UIGF as a binding constraint on the FCAS trapezium
    enablement maximum, and failure to manage this interaction can abort an otherwise
    successful test series.
