  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: A minimum enablement level of 50 MW and maximum of 129 MW were
    formally established as the FCAS operating envelope, constraining but enabling
    commercial participation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: wind
  source_pages:
  - 9
