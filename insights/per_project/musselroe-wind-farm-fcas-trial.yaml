  project_name: Musselroe Wind Farm FCAS Project
  what_happened: FCAS participation for wind generators requires co-optimisation of
    energy and FCAS revenues and costs simultaneously, which is significantly more
    complex than maximising energy generation alone; the project found that auto-bidding
    optimisation (rather than pure bid submission tools) is likely to become mandatory
    for viable participation.
  lesson_learnt: Prospective wind farm FCAS participants should invest in auto-bidding
    optimisation capability — the revenue and cost co-optimisation problem across
    energy and FCAS markets is too complex for manual bid management and requires
    automated systems aligned with real-time control outputs.
