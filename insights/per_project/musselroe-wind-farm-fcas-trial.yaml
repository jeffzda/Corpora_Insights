  project_name: Musselroe Wind Farm FCAS Enablement Project
  what_happened: Existing PSS/E network models for Musselroe were found to be generic,
    inadequate, and insufficiently detailed for frequency control assessment in the
    weak Tasmanian network. Manufacturers and equipment suppliers were also reluctant
    to provide detailed modelling information due to intellectual property concerns,
    resulting in additional delays and complexities.
  lesson_learnt: For FCAS enablement in weak grid environments, verify upfront that
    network models are sufficiently detailed for frequency control analysis — generic
    PSS/E models will not suffice; factor in time to update models, noting that OEM
    IP restrictions may prevent access to detailed control system model parameters.
