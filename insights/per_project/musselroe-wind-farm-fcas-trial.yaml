  - 12
  - 13
  evidence_excerpt: A maximum enablement limit of 129MW was required to prevent changes
    to the voltage management scheme of the site... A minimum enablement level of
    50MW was required to prevent the pausing of turbines (and switching to alternate
    control modes)... These limitations were not expected when the project was commenced.
