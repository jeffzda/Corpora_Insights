- record_id: ARENA-DLV-37110
  source_title: Musselroe Wind Farm Provision of FCAS
  publish_date: 2021-09
  project_name: Musselroe Wind Farm FCAS Project
  what_happened: In weak grid environments (such as MRWF with SCR of 1.8–2.1), active
    power and frequency control cannot be managed in isolation from voltage control
    — voltage disturbances trigger PPC freeze functions that suspend active power
    control, making simultaneous management of LVRT and FCAS structurally difficult.
  lesson_learnt: Projects providing FCAS from inverter-based plant in weak grids must
    treat voltage control, LVRT management, and frequency response as a unified control
    problem — PPC suspension during voltage disturbances fundamentally limits the
    achievable FCAS response speed and availability.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: wind
  source_pages: &id004
  - 14
  evidence_excerpt: Within weak networks it is not possible to look at AP or frequency
    control in isolation – the voltage control strategy must be also be carefully
    maintained and monitored. Most PPC's are designed to suspend any AP control during
    voltage disturbances. Due to filtering of the voltage signal in the PPC and inherent
    latency, a blocking/freeze function is required to prevent excited active power
    oscillations post a fault event. This potentially limits enablement of 6 second
    contingency frequency services at MRWF and all wind and solar sites across the
    NEM.
  confidence_note: null
