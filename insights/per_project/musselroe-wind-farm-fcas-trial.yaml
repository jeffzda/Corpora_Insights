- record_id: ARENA-DLV-37104
  source_title: Musselroe Wind Farm Provision of FCAS
  publish_date: 2021-09
  project_name: Musselroe Wind Farm FCAS Project
  what_happened: Capacitor bank (CapBank) availability was identified as the primary
    limitation on maximum FCAS supply, restricting FCAS provision to below 130 MW
    — a constraint that had been masked by earlier active power management issues
    and was not identified until the December 2020 test round.
  lesson_learnt: Capacitor bank switching limits must be explicitly modelled when
    deriving FCAS trapezium parameters for large wind farms — failure to account for
    these limits will result in unexpected FCAS trapping signals from AEMO and unreliable
    FCAS availability at higher generation levels.
  issue_severity: moderate
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: A maximum enablement limit of 129 MW was established as the FCAS
    operating ceiling to avoid triggering CapBank switching and associated GPS compliance
    issues.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 8
  - 10
  - 13
  evidence_excerpt: The availability of CapBanks is identified as the primary limitation
    on the provision of FCAS (this issue had been masked by the previous AP management
    issues)... MRWF will not be able to achieve FCAS above 130MW due to CapBank availability
    issues that cannot be changed easily without further voltage assessments and modelling.
