- record_id: ARENA-DLV-52660
  source_title: Mussleroe Wind Farm Lessons Learnt Progress Report 2019
  publish_date: 2019-11
  project_name: Musselroe Wind Farm FCAS Enablement Project
  what_happened: Ongoing and concurrent changes to the market regulatory environment
    — including changes to the Tasmanian Frequency Operating Standard, AEMO's proposed
    mandatory primary frequency control rule change, and consultations on the Market
    Ancillary Services Specification and Marginal Loss Factors — competed for limited
    internal and external resources and required repeated re-evaluation of technical
    requirements and economic benefits.
  lesson_learnt: FCAS enablement projects must build in explicit schedule and resource
    contingency for regulatory change — the Australian frequency control regulatory
    environment was in active flux during this project, requiring repeated re-evaluation
    of technical and commercial assumptions; treat regulatory stability as a risk,
    not an assumption.
