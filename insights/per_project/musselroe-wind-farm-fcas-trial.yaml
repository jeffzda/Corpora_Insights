  source_title: Mussleroe Wind Farm Lessons Learnt Progress Report 2019
  publish_date: 2019-11
  project_name: Musselroe Wind Farm FCAS Enablement Project
  what_happened: During May 2019 on-site testing, the existing Power Plant Controller
    (PPC) active power dispatch controller logic was found to not adhere to plant
    limits when frequency control was enabled, differing from the Functional Design
    Specification and preventing safe operational control. This required an unplanned
    PPC software and control logic change.
  lesson_learnt: Treat Functional Design Specifications for older wind farm control
    systems as unverified until on-site testing confirms conformance — PPC logic that
    deviates from the FDS under new operating modes (such as FCAS enablement) will
    require software changes and should be budgeted for at project outset.
