- record_id: ARENA-DLV-37101
  source_title: Musselroe Wind Farm Provision of FCAS
  publish_date: 2021-09
  project_name: Musselroe Wind Farm FCAS Project
  what_happened: The project required 21 separate tests over multiple years to verify
    FCAS capability, with each test group identifying the need for further control
    system refinements before the final successful tests in May 2021.
  lesson_learnt: When retrofitting FCAS capability to an existing wind farm, plan
    for an iterative multi-year testing program with multiple control system revision
    cycles — a single test campaign is insufficient to achieve market compliance.
