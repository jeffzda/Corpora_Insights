  project_name: Musselroe Wind Farm FCAS Trial
  what_happened: Despite MRWF being bid available in FCAS markets, actual enablement
    during November 2021 was minimal because FCAS service prices were stable and low,
    meaning the economic co-optimisation rarely favoured FCAS dispatch even when the
    plant was technically within its trapezium.
  lesson_learnt: Technical FCAS capability alone does not guarantee revenue — wind
    farm operators must model FCAS price dynamics and co-optimisation economics carefully
    before committing capital to FCAS enablement retrofits, as low FCAS prices can
    render participation uneconomic for extended periods.
