  project_name: Musselroe Wind Farm FCAS Project
  what_happened: AEMO does not configure its AGC system with new assets until market
    registration is completed, which meant no end-to-end AGC testing could be conducted
    at Musselroe prior to the registration milestone still being in progress at the
    time of this report.
