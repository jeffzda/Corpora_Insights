  evidence_excerpt: Given some of the existing wind curtailment issues on site at
    MRWF, 'filling' a storage device (and providing FCAS capability) is a technically
    plausible and economically viable option. In the preliminary business case model
    runs, several configurations' options have been considered and appear economically
    feasible.
