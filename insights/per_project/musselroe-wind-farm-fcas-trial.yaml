- record_id: ARENA-DLV-52651
  source_title: Mussleroe Wind Farm Lessons Learnt Progress Report 2019
  publish_date: 2019-11
  project_name: Musselroe Wind Farm FCAS Enablement Project
  what_happened: The individual wind turbine generator (WTG) frequency controllers
    documented in the Vestas controller design and maintenance manuals could not be
    enabled during on-site testing. Despite engagement with Vestas Australia and their
    Danish control experts, Vestas was unable to explain the discrepancy and stated
    they do not support frequency control enablement at the WTG level. The project
    team abandoned the WTG-level frequency control pathway.
  lesson_learnt: Before committing to a turbine-level frequency control design, confirm
    with the OEM that the feature can actually be enabled remotely and on-site — assuming
    turbine-level capability without vendor verification led to a fundamental design
    rework and fallback to Power Plant Controller level.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated integration
  intervention_note: Frequency control was successfully implemented at the Power Plant
    Controller (PPC) level as a fallback, replacing the originally planned turbine-level
    implementation.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 6
  - 11
  evidence_excerpt: The WTG controller design and maintenance manuals supplied with
    the project indicated a capability to provide a frequency response at the individual
    generator level... On-site testing was conducted in February and March 2019 to
    enable the frequency controller an individual turbine controller at WTG D08...
    The test results determined that the frequency controller function built into
    the individual WTG controllers cannot be enabled. Despite engagement with Vestas
    Australia and their control experts from Denmark in May and July 2019, Vestas
    were not able to verify the reason for the turbine controller discrepancies. Vestas
    also responded that they do not support enablement of frequency control at the
    WTG level.
