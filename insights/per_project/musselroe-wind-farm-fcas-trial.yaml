- record_id: ARENA-DLV-52657
  source_title: Mussleroe Wind Farm Lessons Learnt Progress Report 2019
  publish_date: 2019-11
  project_name: Musselroe Wind Farm FCAS Enablement Project
  what_happened: The weak grid connection at Musselroe (Short Circuit Ratio of 2.1
    at Derby substation) created a fundamental conflict between Low Voltage Fault
    Ride Through (LVRT) management and frequency control enablement. The PPC's blocking/freeze
    function — required to prevent active power oscillations post-fault — potentially
    limits enablement of 6-second contingency frequency services.
  lesson_learnt: In weak grid connections, active power and voltage control cannot
    be optimised independently — LVRT requirements will constrain frequency control
    capability and should be assessed together at the design stage; projects in low-SCR
    environments should expect that fast contingency FCAS services (6-second) may
    not be achievable.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Extensive interaction with TasNetworks and AEMO was undertaken
    to coordinate testing and ensure compliance standards were maintained while the
    team assessed changes to the LVRT freeze function.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 4
  - 9
  - 10
  - 14
  evidence_excerpt: Low Voltage Fault Ride Through (LVRT) remains a primary issue
    for all inverter-based equipment that must be managed at all times in conjunction
    with frequency control. This means that within weak networks it is not possible
    to look at AP or frequency control in isolation... This potentially limits enablement
    of 6 second contingency frequency services at Musselroe.
