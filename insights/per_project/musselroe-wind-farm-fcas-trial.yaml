  source_title: Musselroe Wind Farm FCAS Trial Public Report
  publish_date: 2022-01
  project_name: Musselroe Wind Farm FCAS Trial
  what_happened: On 18 November 2021, a rapid wind ramp event lifted MRWF generation
    from near 0 MW to full output in 30 minutes, pushing output above 129 MW and triggering
    FCAS trapping signals from AEMO — an expected but operationally significant outcome
    that temporarily locked the plant out of FCAS participation.
  lesson_learnt: Wind farms providing FCAS must establish automated protocols for
    handling rapid ramp events that push generation outside the FCAS trapezium — trapping
    signals from AEMO during ramp events are foreseeable and should be modelled in
    the operational playbook before market go-live.
