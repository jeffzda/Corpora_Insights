- record_id: ARENA-DLV-37106
  source_title: Musselroe Wind Farm Provision of FCAS
  publish_date: 2021-09
  project_name: Musselroe Wind Farm FCAS Project
  what_happened: FCAS provision at Musselroe was constrained to a narrow operating
    band of 50–129 MW due to the combination of CapBank switching limits at high output
    and wind turbine mode-switching (pausing) at low output, establishing an unexpected
    and narrow technical envelope not anticipated at project commencement.
  lesson_learnt: Existing wind farms retrofitting FCAS should map the full operating
    envelope constraints — both upper voltage management limits and lower turbine
    mode-switching thresholds — before commercial modelling, as the resulting FCAS
    availability window may be materially narrower than the installed capacity implies.
  issue_severity: major
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: null
