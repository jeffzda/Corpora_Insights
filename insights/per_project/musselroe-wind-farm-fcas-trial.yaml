  what_happened: The existing plant configuration at Musselroe did not adequately
    support active power dispatch accuracy and upper generation site limit management
    when FCAS was enabled, requiring extensive control system changes. Inherent latency
    in the OEM control system design also limited FCAS enablement capability.
  lesson_learnt: Before committing to an FCAS enablement project on an existing wind
    farm, conduct a detailed control system audit to assess whether the existing PPC
    and SCADA architecture can meet the active power accuracy and site limit management
    requirements — retrofitting these capabilities after project commencement is costly
    and time-consuming.
