- record_id: ARENA-DLV-53897
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ActewAGL Realising Electric Vehicle-to-Grid Services (REVS)
  what_happened: ActewAGL's REVS trial found that reactive power management and peak
    shaving could not be tested because they were not yet implemented in the JET Charge
    controller software, and reactive power was not tested due to lack of firmware
    support — limiting the range of grid services that could be demonstrated within
    the trial period.
  lesson_learnt: EV grid integration projects should conduct detailed firmware and
    software capability assessments of all hardware vendors before finalising the
    trial scope; committing to grid service demonstrations (reactive power, peak shaving,
    voltage management) that depend on vendor software readiness creates a risk of
    key trial objectives being unachievable within the project timeframe.
