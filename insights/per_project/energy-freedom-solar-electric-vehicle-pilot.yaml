- record_id: ARENA-DLV-4202
  source_title: Energy Freedom Solar Electric Vehicle Pilot Mid Project Report
  publish_date: 2020-08
  project_name: Energy Freedom Solar Electric Vehicle Pilot
  what_happened: The V1 solar roof's lower-cost circuit design resulted in significant
    shading-induced losses — when shadow fell on any part of the roof, solar charging
    output was substantially reduced or blocked across the array.
  lesson_learnt: For vehicle-integrated solar arrays, low-cost series circuit designs
    carry material shading sensitivity risk; specify the circuit topology (e.g. parallel
    or bypass configurations) based on real-world shading analysis before committing
    to a manufacturing design, not after prototype testing reveals the loss.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Identified circuit redesign as a mitigation path; revised solar
    roof and charging system design flagged for Prototype 2 (V2 system).
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id002
  - 5
  evidence_excerpt: The shading impact on the solar roof was significant due to its
    lower cost circuit design, causing a reduction in solar charging when a shadow
    lowered or blocked sunlight from parts of the roof. The design of the solar roof
    and charging systems can be revised to minimise this impact.
  confidence_note: null
