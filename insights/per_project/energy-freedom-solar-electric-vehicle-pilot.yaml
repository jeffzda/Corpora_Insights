  source_title: Energy Freedom Solar Electric Vehicle Pilot Mid Project Report
  publish_date: 2020-08
  project_name: Energy Freedom Solar Electric Vehicle Pilot
  what_happened: After prototype testing, the energy system specification required
    significant revision from the original design — adjustments were made to system
    voltage, battery chemistry, cell type and configuration, battery management system,
    and thermal management design.
  lesson_learnt: For novel EV development programs, expect the initial energy system
    specification to require substantial revision after prototype testing; budget
    and schedule for at least one full design iteration cycle before committing to
    a final configuration.
