- record_id: ARENA-DLV-4203
  source_title: Energy Freedom Solar Electric Vehicle Pilot Mid Project Report
  publish_date: 2020-08
  project_name: Energy Freedom Solar Electric Vehicle Pilot
  what_happened: Real-world solar gain from the vehicle roof array varied significantly
    because the curved surface and vehicle movement continuously changed the panel
    orientation relative to the sun, making it difficult to establish a single reliable
    performance metric.
  lesson_learnt: When evaluating solar-integrated vehicle performance, define multiple
    condition-based performance benchmarks (optimal, average, and worst-case) at the
    outset rather than a single rated output figure — vehicle movement and surface
    curvature mean a single metric will be misleading for technology assessment or
    commercialisation claims.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: Acknowledged that circuit and system design can be revised to
    minimise the impact of orientation variation on solar gain.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
