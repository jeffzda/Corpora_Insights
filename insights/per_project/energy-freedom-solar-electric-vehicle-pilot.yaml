- record_id: ARENA-DLV-4205
  source_title: Energy Freedom Solar Electric Vehicle Pilot Mid Project Report
  publish_date: 2020-08
  project_name: Energy Freedom Solar Electric Vehicle Pilot
  what_happened: Energy modelling identified four discrete subsystem categories —
    road losses, drivetrain, heating/cooling, and computing/control systems — as accounting
    for the bulk of energy consumption, enabling targeted efficiency R&D rather than
    broad-based optimisation.
  lesson_learnt: Develop a subsystem energy model early in EV design to identify the
    highest-impact efficiency targets; for lightweight low-speed EVs the compute and
    control systems load is a non-trivial energy category alongside the more obvious
    road and drivetrain losses, and should not be overlooked in early design trade-offs.
  issue_severity: none
  project_type: transport electrification
