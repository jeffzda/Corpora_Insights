- record_id: ARENA-DLV-52061
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: Curtin University Increasing the uptake of solar photovoltaics in
    strata residential developments
  what_happened: A demonstration of solar PV in strata developments tested a new governance
    model covering the relationships between developers, owners, tenants, strata bodies,
    and utilities, including energy system design, billing arrangements, and legal
    addendums for purchasers and lessees.
  lesson_learnt: Deploying solar PV in strata developments requires purpose-built
    governance frameworks addressing billing, legal documentation, and multi-party
    responsibilities — standard residential solar models do not transfer directly
    to strata contexts and bespoke legal and commercial instruments must be developed.
