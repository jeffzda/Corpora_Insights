  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: Electrolyser delivery lead times in the current market were found
    to range from 6 months to 2 years, introducing significant schedule uncertainty.
    Vendor selection was identified as a key driver of the ultimate delivery period
    for the demonstration scale project.
  lesson_learnt: Electrolyser procurement lead times of up to 2 years must be built
    into project schedules at the FEED stage — vendor selection decisions should be
    brought forward and procurement commenced early to avoid long-lead equipment becoming
    the critical path driver.
