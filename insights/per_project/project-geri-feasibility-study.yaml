  source_title: GERI Renewable Hydrogen and Ammonia Feasibility Study
  publish_date: 2021-03
  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: No capital cost data from electrolyser vendors was available for
    commercial scale; capital costs had to be scaled up from demonstration scale Class
    4 estimates using scaling factors and estimated technology learning rates. The
    learning rate assumption for electrolysers was 18% ± 6% per doubling of global
    production, analogous to photovoltaic cells and lithium-ion batteries, but this
    assumption introduced significant uncertainty into commercial scale economics.
  lesson_learnt: Commercial-scale hydrogen project economics are highly sensitive
    to electrolyser learning rate assumptions — at FEED stage, replace scaling-factor
    estimates with direct vendor pricing for commercial-scale units and track global
    electrolyser deployment data to update learning rate assumptions as the technology
    market matures.
