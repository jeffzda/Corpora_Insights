- record_id: ARENA-DLV-36455
  source_title: GERI Renewable Hydrogen and Ammonia Feasibility Study
  publish_date: 2021-03
  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: Vendor responses for electrolyser equipment at demonstration scale
    were found to be insufficiently detailed and variable to recommend a single technology
    or vendor. Total Installed Cost varied greatly across vendor quotes, and the complexity
    of the industry at this early stage meant a fully detailed comparison of all vendor
    responses could not be achieved during the feasibility study phase.
  lesson_learnt: Electrolyser vendor responses at feasibility stage lack the detail
    and pricing confidence needed to support investment decisions — a formal procurement
    process (RFP with structured technical and commercial requirements) is required
    in the next project phase to reduce cost uncertainty and enable technology selection.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: A representative sample of three electrolyser vendors was chosen
    for TEM modelling as a proxy; a formal procurement approach was recommended as
    the next step to obtain increased detail for decision-making.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id003
  - 33
  - 34
  evidence_excerpt: The vendor responses received, at this stage, do not provide enough
    detail or confidence to recommend a single technology or vendor. Furthermore,
    the Total Installed Cost (TIC) varies greatly across vendor quotes, highlighting
    the uncertainty and need for further vendor engagement on price and inclusions.
    A formal procurement approach would be required to obtain the increased detail
    required for the next level of analysis.
