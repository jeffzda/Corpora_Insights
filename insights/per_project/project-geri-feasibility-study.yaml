  what_happened: The commercial scale project (1,000ktpa ammonia) would require approximately
    1,370MW of load and a nameplate renewable capacity of around 4,000MW (2,000MW
    wind plus 2,000MW solar), resulting in 77% electrolyser capacity utilisation.
    Downstream plant was sized at 1,000ktpa before a firm capacity factor had been
    defined, meaning the equipment was not yet right-sized and would need optimisation.
  lesson_learnt: For commercial-scale hydrogen/ammonia plants driven by variable renewable
    energy, a firm electrolyser capacity factor must be determined before finalising
    downstream plant sizing — over-sizing to 100% utilisation potential inflates capital
    costs, while the optimal renewable generation mix and capacity factor should be
    determined through integrated power modelling before equipment specifications
    are locked in.
