- record_id: ARENA-DLV-36473
  source_title: GERI Renewable Hydrogen and Ammonia Feasibility Study
  publish_date: 2021-03
  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: For the commercial scale project, enabling infrastructure including
    transmission upgrades, port development, and desalination were identified as significant
    costs that were explicitly excluded from project economics on the assumption that
    government would fund them. The feasibility study identified this as a key challenge
    requiring prioritised stakeholder engagement with government bodies.
  lesson_learnt: Commercial-scale hydrogen projects in greenfield regional locations
    should establish government funding commitments for enabling infrastructure (grid
    transmission, port, water) before advancing to FEED — these costs are material,
    and treating them as government-funded without confirmed commitments creates a
