  what_happened: 'The feasibility study found that project economics improve substantially
    at commercial scale (~1,000ktpa ammonia) compared to demonstration scale (~20ktpa).
    The three main levers for LCOH reduction from demonstration to commercial scale
    were identified as: increased scale (from 20ktpa to 1Mtpa ammonia), reduction
    in electrolyser capex due to learning factors (estimated at 18% ± 6% per doubling
    of global production), and reduction in electricity PPA prices.'
  lesson_learnt: Hydrogen project developers should model the pathway from demonstration
    to commercial scale explicitly — the economics are substantially different at
    scale, and the investment case for demonstration facilities must reference the
    cost trajectory to commercial scale to justify the initial capital outlay to funders
    and off-takers.
