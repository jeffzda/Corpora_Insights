  - 74
  evidence_excerpt: The customer engagement activities for Project GERI found that
    the domestic market in Australia is currently in early stages, with few players
    being ready to receive hydrogen. Most of the Australian market requires further
    development, further investment in energy transition, or greater government support
    to become hydrogen or ammonia off-takers.
