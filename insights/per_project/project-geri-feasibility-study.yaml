  what_happened: Power supply grid reliability concerns were identified for the demonstration
    scale facility. Poor grid reliability was noted as potentially impacting plant
    operation, with electrolysers equipped with only short-duration uninterruptible
    power supply capable of absorbing brief interruptions before requiring shutdown.
    The impact of power intermittency on cost and performance for different electrolyser
    technologies was identified as requiring further dynamic modelling.
  lesson_learnt: Grid reliability must be assessed in detail before finalising the
    power supply strategy for hydrogen electrolysis plants — poor grid reliability
    increases production losses and may require a firming strategy (behind-the-meter
    storage, diesel backup, or grid upgrade) that adds to capital costs and must be
    modelled dynamically for each electrolyser technology.
