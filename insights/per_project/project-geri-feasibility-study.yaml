- record_id: ARENA-DLV-36457
  source_title: GERI Renewable Hydrogen and Ammonia Feasibility Study
  publish_date: 2021-03
  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: Power price and electrolyser capital cost were identified as the
    two dominant cost drivers for project economics, with electricity cost and Capex
    build costs driving most of the overall demonstration scale expenditure. Optimisation
    of PPA terms, capacity factor, and electrolyser utilisation was identified as
    the single most important lever for reducing levelised cost of hydrogen.
  lesson_learnt: For hydrogen electrolysis projects, optimising the relationship between
    PPA price, renewable generation profile, and electrolyser utilisation rate is
    the primary cost-reduction lever — project developers should invest in detailed
    power modelling and PPA structuring before finalising plant sizing and configuration.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Detailed analysis conducted in conjunction with Lightsource bp
    was used to estimate PPA price and energy availability; a firming PPA was recommended
    for the demonstration plant to maximise electrolyser utilisation given the Capex
    intensity of the project.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id005
  - 34
  - 65
  - 75
  evidence_excerpt: The cost of electricity and the Capex build costs are the two
    most significant cost drivers... Depending on scale, power is either the highest
    or second highest contributor to costs. Optimisation of capacity factor, utilisation
    and PPA pricing is essential. The most important optimisation lever in a project
    such as Project GERI is between PPA, generation profiles and electrolyser utilisation
    profiles.
