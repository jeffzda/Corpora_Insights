- record_id: ARENA-DLV-36453
  source_title: GERI Renewable Hydrogen and Ammonia Feasibility Study
  publish_date: 2021-03
  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: Neither the Port of Geraldton nor the proposed Oakajee port had facilities
    suitable for bulk liquid ammonia export operations. Both port locations would
    require significant infrastructure upgrades to accommodate commercial-scale ammonia
    export, and these enabling infrastructure costs were explicitly excluded from
    the project's economic model on the assumption that government would fund them.
  lesson_learnt: Do not assume the nearest port is export-capable for hazardous bulk
    liquids — verify infrastructure suitability (berth capacity, dangerous goods handling,
    storage buffer distances) before selecting the export pathway, as a forced substitution
    to a more distant port significantly increases logistics costs and complexity.
  issue_severity: major
