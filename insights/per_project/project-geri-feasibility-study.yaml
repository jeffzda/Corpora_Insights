- record_id: ARENA-DLV-36458
  source_title: GERI Renewable Hydrogen and Ammonia Feasibility Study
  publish_date: 2021-03
  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: No domestic or international certification scheme for renewable (green)
    hydrogen existed at the time of the feasibility study. The absence of a recognised
    guarantee-of-origin scheme meant that a 'premium for green' hydrogen above fossil-fuel
    or blue hydrogen could not be reliably priced into project economics, despite
    preliminary off-taker discussions suggesting willingness to pay a premium.
  lesson_learnt: Early-stage green hydrogen projects cannot rely on a green certification
    premium in their base-case economics — monitor the development of domestic and
    international guarantee-of-origin schemes and incorporate certification cost and
    premium as a scenario variable rather than a fixed assumption.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: approvals/regulatory
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: regulatory & approvals
  intervention_note: The project committed to monitoring the development of domestic
    and international certification schemes and recommended a lifecycle carbon assessment
    in subsequent project stages to support future certification applications.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id006
  - 33
  - 42
  - 43
  evidence_excerpt: There is no existing Australian-based certification scheme or
    method of carbon accounting that can be directly applied in a manner that creates
    a marketable 'label'... currently there is no evidence that renewable hydrogen
    attracts a price premium compared to blue or brown hydrogen.
  confidence_note: null
