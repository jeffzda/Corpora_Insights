  what_happened: Project economics for both demonstration and commercial scale were
    found to vary considerably depending on the chosen customer distribution pathway.
    Pipeline injection of hydrogen had significantly more favourable costs than road
    trucking, while export via ISOtainer had the highest LCOH due to ammonia synthesis
    costs and ISOtainer hire costs. The chosen logistics pathway was identified as
    having a material impact on project viability.
  lesson_learnt: The choice of hydrogen distribution pathway has a material impact
    on project economics — prioritise pipeline-delivered scenarios where possible,
    as they offer substantially lower LCOH than road transport. Logistics pathway
    optimisation should be conducted in parallel with off-take customer engagement
    to ensure the chosen pathway matches actual market requirements.
