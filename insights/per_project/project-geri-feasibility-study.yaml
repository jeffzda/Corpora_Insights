    and HECA in California) did not proceed beyond FEED or pre-FEED stages due to
    changing business priorities. The HPAD project completed FEED in 2009 and did
    not proceed; HECA was sold after pre-FEED completion. These projects represented
    significant sunk costs without achieving commercial deployment.
