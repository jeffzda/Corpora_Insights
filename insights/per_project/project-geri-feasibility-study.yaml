- record_id: ARENA-DLV-36451
  source_title: GERI Renewable Hydrogen and Ammonia Feasibility Study
  publish_date: 2021-03
  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: Customer engagement for the demonstration scale project found that
    the domestic Australian hydrogen market is in early stages, with few players ready
    to receive hydrogen. Most potential off-takers required further development, further
    investment in energy transition, or greater government support before committing
    to hydrogen or ammonia supply agreements.
  lesson_learnt: Securing anchor customer off-take agreements at an acceptable price
    point is the critical challenge for early-stage hydrogen projects — do not assume
    domestic market readiness. Project developers should engage potential off-takers
    extensively before finalising investment decisions and should model a wide range
    of pricing scenarios to account for the absence of an established green hydrogen
    market benchmark.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Multiple pricing scenarios ($1.50–$17.30/kg of hydrogen) were
    run through the Techno-Economic Model to bracket the range of viable outcomes
    in the absence of firm off-take pricing.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id001
