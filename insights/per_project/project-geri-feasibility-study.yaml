- record_id: ARENA-DLV-36466
  source_title: GERI Renewable Hydrogen and Ammonia Feasibility Study
  publish_date: 2021-03
  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: Community understanding of hydrogen was found to be relatively low
    in the Australian context, and community confidence in the safety of hydrogen
    production processes was identified by University of Queensland research as a
    critical success factor for the industry's development. Project GERI, as a prospective
    first large-scale demonstration project in the Mid-West region, was assessed as
    having a responsibility to demonstrate responsible leadership in stakeholder and
    community engagement.
