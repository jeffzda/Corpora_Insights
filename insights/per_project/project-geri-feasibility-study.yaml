  what_happened: An iterative Techno-Economic Model (TEM) was developed as a central
    tool for the feasibility study, linking technical, logistics, and commercial work
    streams and enabling rapid scenario modelling across a wide range of hydrogen
    price, customer pathway, and technology assumptions. The TEM was validated through
