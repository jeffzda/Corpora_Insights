- record_id: ARENA-DLV-36452
  source_title: GERI Renewable Hydrogen and Ammonia Feasibility Study
  publish_date: 2021-03
  project_name: Project GERI (Geraldton Export-Scale Renewable Investment)
  what_happened: The existing transmission network in the Narngulu region was found
    to be unable to support the 35.4MW load requirement of the demonstration scale
    facility, and the SWIS network was identified as constrained, meaning project
    load could be curtailed due to network constraints. Infrastructure investment
    in the transmission network would be required before the demonstration plant could
    operate.
  lesson_learnt: For greenfield hydrogen facilities in regional locations, verify
    transmission network capacity early — existing networks may be unable to support
    process loads, requiring government-funded upgrades that sit outside project economics
    and can affect both schedule and plant availability.
