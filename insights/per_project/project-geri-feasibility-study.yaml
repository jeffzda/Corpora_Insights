  secondary_failure_mode: coordination & stakeholders
  intervention_note: The feasibility study explicitly separated enabling infrastructure
    costs from project economics and recommended active stakeholder engagement with
    the Federal Government, WA State Government, DevelopmentWA, and Mid-West Ports
    Authority to secure government funding for port upgrades.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
