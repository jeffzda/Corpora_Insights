  what_happened: The Oakajee location was assessed as technically superior to the
    Port of Geraldton option for commercial scale due to proximity of the process
    plant to the port (circa 3km versus circa 15km), enabling ammonia transport via
    low-temperature pipeline rather than a long ambient-temperature pipeline with
    associated chilling costs at the port.
  lesson_learnt: For export-scale ammonia facilities, minimise the distance between
    the process plant and the export berth — a short low-temperature pipeline (3km)
    is substantially more cost-effective and technically simpler than a long ambient-temperature
    pipeline (15km) requiring a compression and refrigeration facility at the port
    end.
