- record_id: ARENA-DLV-20717
  source_title: Demand Response Short Notice RERT Trial Year 3 Report
  publish_date: 2021-10
  project_name: DR SN RERT Trial — Enel X automated vs manual dispatch performance
  what_happened: Enel X's C&I DR portfolio data across 13 events showed that automatically
    dispatched sites consistently outperformed manually dispatched sites in every
    single event — automated sites delivered 103% of contracted DR in Victoria and
    110% in NSW, compared to 81% and 84% respectively for manual sites.
  lesson_learnt: Automating DR dispatch at C&I sites reliably outperforms manual curtailment
    — by approximately 22–26 percentage points — because automation eliminates the
    human-factor risks of competing priorities, staff availability, and personnel
    turnover; where customers accept it, automation should be the preferred design
    for C&I DR programs where high delivery reliability is required.
