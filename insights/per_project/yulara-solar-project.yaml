- record_id: ARENA-DLV-34451
  source_title: 'The Power of Far Flung Arrays: Yulara''s Dispersed Design to Reduce
    System Variability'
  publish_date: 2018-12
  project_name: Yulara Solar Project
  what_happened: Geographic dispersion of five PV arrays across distances of 500 m
    to 5.5 km at the Yulara 1.8 MWP system demonstrably reduced maximum power ramp
    rates — modelling showed the dispersed configuration limited fluctuations to approximately
    28% (500 kW) per 5 seconds versus 44% (800 kW) for an equivalent centralised system,
    and capped daily maximum absolute ramp rates at around 40% of nameplate capacity
    versus nearly 70% for the centralised case.
  lesson_learnt: Deliberately spacing PV arrays across a site by at least 500 m to
    several kilometres is a low-infrastructure method to reduce high-power ramp rate
    events — the most operationally damaging form of variability — and should be considered
    during design wherever land availability permits, particularly for off-grid or
    weak-grid systems sensitive to rapid generation swings.
