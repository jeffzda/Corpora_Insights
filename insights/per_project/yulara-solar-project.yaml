- record_id: ARENA-DLV-34455
  source_title: 'The Power of Far Flung Arrays: Yulara''s Dispersed Design to Reduce
    System Variability'
  publish_date: 2018-12
  project_name: Yulara Solar Project
  what_happened: Co-locating PV arrays with their respective load centres across the
    five Yulara sites reduced electrical distribution losses and avoided additional
    cabling investment that would have been required for a single centralised array
    serving the whole township.
  lesson_learnt: In distributed energy systems, aligning individual sub-array locations
    with proximate load centres — rather than aggregating generation at a single optimal
    solar site — can reduce distribution losses and avoid downstream network augmentation
    costs; this load-proximity benefit should be explicitly valued in the business
    case for a dispersed layout.
