- record_id: ARENA-DLV-34453
  source_title: 'The Power of Far Flung Arrays: Yulara''s Dispersed Design to Reduce
    System Variability'
  publish_date: 2018-12
  project_name: Yulara Solar Project
  what_happened: High-resolution (5-second) irradiance data was unavailable from the
    Yulara system itself for variability analysis, requiring the study to rely on
    proxy data from five Alice Springs weather stations installed for a prior study;
    the 30-minute resolution data available from Yulara was insufficient to capture
    short-term ramp events critical to variability assessment.
  lesson_learnt: Install high-resolution (sub-minute) irradiance and power generation
    data logging from commissioning on any PV project where variability analysis is
    a design objective — 30-minute averaged data obscures the step-change information
    needed to validate dispersion or smoothing strategies and assess system performance
    against design intent.
