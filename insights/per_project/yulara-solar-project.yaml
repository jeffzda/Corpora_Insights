- record_id: ARENA-DLV-34452
  source_title: 'The Power of Far Flung Arrays: Yulara''s Dispersed Design to Reduce
    System Variability'
  publish_date: 2018-12
  project_name: Yulara Solar Project
  what_happened: Mandatory curtailment imposed by the incumbent power station operator
    on the Desert Gardens array (the largest, at 1,060 kWP) consumed a large share
    of the variability-reduction benefit achieved by geographic dispersion, with spilled
    PV energy reaching approximately 28% on an annual basis and up to 800 kW — nearly
    half the full installed PV capacity — curtailed in peak instances.
  lesson_learnt: Curtailment obligations imposed by incumbent operators on the dominant
    array in a dispersed PV system can negate much of the energy-yield benefit of
    the dispersed design strategy; proponents should negotiate curtailment terms before
    finalising system design and capacity allocation across sites, and consider technical
    alternatives such as sky-camera-assisted dynamic set-point adjustment to recover
    spilled energy.
