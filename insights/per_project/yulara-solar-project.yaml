- record_id: ARENA-DLV-34454
  source_title: 'The Power of Far Flung Arrays: Yulara''s Dispersed Design to Reduce
    System Variability'
  publish_date: 2018-12
  project_name: Yulara Solar Project
  what_happened: At the time of Yulara's design and financing, battery and flywheel
    storage systems for PV output smoothing were assessed as cost-prohibitive, meaning
    geographic dispersion and curtailment were relied upon as the primary variability-mitigation
    tools despite their limitations including significant energy spill.
  lesson_learnt: When evaluating variability-mitigation options for remote or off-grid
    PV systems, include storage cost-benefit analysis at the design stage — battery
    and flywheel costs have fallen substantially since Yulara was designed in 2016,
    and storage may now be economically competitive with curtailment-based smoothing
    strategies that sacrifice substantial generation yield.
