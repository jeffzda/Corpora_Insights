- record_id: ARENA-DLV-34456
  source_title: 'The Power of Far Flung Arrays: Yulara''s Dispersed Design to Reduce
    System Variability'
  publish_date: 2018-12
  project_name: Yulara Solar Project
  what_happened: 'Splitting the 1.8 MWP Yulara system across five sites increased
    installation complexity and cost: each site required its own scoping, ground preparation,
    equipment mobilisation, fencing, safety margins, and compliance infrastructure,
    reducing array packing efficiency and losing some economies of scale compared
    to a centralised design.'
  lesson_learnt: When adopting a geographically dispersed PV design, explicitly account
    for per-site fixed cost overheads — fencing, mobilisation, site preparation, and
    land negotiation — which multiply with the number of sites and can partially offset
    the variability-reduction and distribution-loss benefits; a multi-site cost premium
    should be modelled in the business case before committing to dispersion as the
    primary design strategy.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id006
  - 6
  evidence_excerpt: The added disadvantage is that some scale benefits are lost, as
    multiple sites need to be scoped, prepared and have equipment mobilised to these.
    Similarly, land acquisition costs are less apt to leverage the benefits of scaling
    when multiple locations are used.
  confidence_note: 'failure_mode: cost overrun used per indirect-language guidance
