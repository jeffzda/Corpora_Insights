    identified several missing or inadequate features in Rezonance that were not apparent
    from internal testing alone, including the need for segmented multi-tone scanning
    with automated result merging, impedance overlay capability, open-loop bode plots
    with stability margins, improved modal identification controls, PSCAD snapshot
    support, and an API for automated workflows.
  lesson_learnt: Engage target industry end-users as active testers throughout software
    development — not just at the end — since practitioners identify workflow gaps
    and usability deficiencies that internal developers and white-box test cases cannot
    reveal; building in structured feedback loops allows iterative refinement before
    final delivery.
