- record_id: ARENA-DLV-44302
  source_title: Monash University - Management of Oscillations in Australia's National
    Grid - Milestone 2 Interim Report
  publish_date: 2024-09
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: On 20 August 2020, a transmission fault caused tripping of a 220-kV
    line and several wind farms in northwest Victoria, after which 19-Hz voltage oscillations
    emerged at a tripped solar farm location with peak-to-peak oscillations ranging
    from 0.1% to 2%. Investigation found that three solar plants in the region exhibited
    oscillatory resonant behaviour around 17 Hz when operating under low irradiance
    and low short-circuit ratio (SCR) conditions.
  lesson_learnt: Solar farms in weak grid regions can exhibit inherent resonant oscillatory
    modes under low irradiance and low SCR conditions — grid connection studies and
    operational procedures should explicitly assess impedance-based stability under
    these combined conditions, particularly following network contingencies that reduce
    system strength.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: An impedance-based methodology was used to identify the resonant
    mode and determine each plant's contribution; recommendations to update IBR controls
    to address the inherent resonant mode were made.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id001
  - 11
  - 12
  evidence_excerpt: Subsequent investigation of this issue has revealed that three
    solar plant in this region can exhibit oscillatory resonant behaviour around 17
    Hz when operating under low irradiance and low SCR conditions on their own. Further
    studies using a wide area model also confirmed the risk of this mode of oscillation
    under low irradiance conditions for these solar farms and determined the level
    of contribution from each one. Recommendations to address this inherent resonant
    mode by updating the controls were made.
