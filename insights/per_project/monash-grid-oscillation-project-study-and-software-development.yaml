- record_id: ARENA-DLV-64460
  source_title: Grid Oscillation Project - Milestone 4 Report
  publish_date: 2025-11
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: The 2018–2020 West Murray Zone 7 Hz oscillations in Victoria's IBR-dominated
    network were ultimately resolved by AEMO retuning the PLL control systems of identified
    inverters, confirmed effective by post-retuning tests; a subsequent 19 Hz oscillation
    in August 2020 arising from a transmission fault was separately investigated using
    an impedance-based methodology and resolved through control update recommendations.
  lesson_learnt: IBR-induced oscillations in weak-grid, high-IBR-penetration zones
    can persist until specific inverter control parameters (particularly PLL tuning)
    are identified and corrected through coordinated AEMO-led wide-area EMT modelling
    and field testing — early use of impedance-based analysis to identify which plants
    are participating in which oscillatory modes can accelerate root-cause identification
    and reduce the duration of grid instability.
