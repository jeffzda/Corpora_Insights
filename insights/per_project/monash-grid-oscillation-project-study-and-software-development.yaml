  what_happened: Wide-area NEM PSCAD model scan simulations were found to be extremely
    slow due to the model's large and complex nature, making single-tone injection
    approaches impractical; additionally, running wide-area models presented integration
    difficulties due to the large number of individual PSCAD projects, and there was
    no robust method to efficiently screen which plants should be prioritised for
    impedance scanning.
  lesson_learnt: 'Wide-area impedance scanning at NEM scale requires dedicated workflow
    optimisation: single-tone injections are impractical due to simulation run times
    and should be replaced with segmented multi-tone methods; pre-screen candidate
    plants using individual SMIB impedance analysis before committing to full wide-area
    scanning; consider simplified co-simulation representations for distant network
    areas to reduce simulation complexity.'
