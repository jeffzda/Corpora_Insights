  publish_date: 2024-09
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: The Monash University Grid Innovation Hub established a formal Software
    Development Lifecycle (SDLC) process including continuous integration/continuous
    deployment (CI/CD), automated cybersecurity scanning, peer review requirements,
    and Extended Validation code signing for the ZAT application, integrating these
    practices before distributing the tool to industry users.
  lesson_learnt: Research-grade grid analysis tools intended for industry deployment
    require professional software engineering practices — including formal SDLC, automated
    CI/CD pipelines, cybersecurity scanning (SCA and SAST), and code signing — to
    be fit for purpose; these should be established at the outset of tool development,
    not retrofitted before release.
