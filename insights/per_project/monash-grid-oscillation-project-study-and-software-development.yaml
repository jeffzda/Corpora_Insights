  what_happened: The ZAT impedance prediction model trained on operating points that
    only sampled moderate combinations of voltage and power (Training Set 1) showed
    small but noticeable discrepancies in prediction accuracy, particularly for the
    Ydq admittance component. When trained on a second set that included more extreme
    boundary operating points (Training Set 2), prediction accuracy improved markedly
    across all tested operating points.
  lesson_learnt: When training impedance prediction models for IBR stability tools,
    training data should span the extremes of the expected operating range — using
    only moderate central operating points will result in degraded prediction accuracy
    at the boundaries where stability margins are typically tightest.
