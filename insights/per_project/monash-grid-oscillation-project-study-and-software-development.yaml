- record_id: ARENA-DLV-64466
  source_title: Grid Oscillation Project - Milestone 4 Report
  publish_date: 2025-11
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: The validation process confirmed that impedance-based stability analysis
    is fundamentally a small-signal method and cannot be applied to large-signal instability
    phenomena including transient instability during faults, protection operation,
    mode-switching (e.g., Fault Ride Through activation), current limiter activation,
    or voltage collapse — and is also impractical for low-frequency inter-area oscillations
    (below 1 Hz) involving large numbers of synchronous machines due to the prohibitively
    long EMT simulation durations required.
  lesson_learnt: When planning to use impedance-based stability analysis tools such
    as Rezonance, identify upfront whether the phenomena of concern are small-signal
    in nature — the method is not applicable to large-signal events (faults, protection,
    current limiting, voltage collapse) and is impractical for sub-1 Hz inter-area
    modes; EMT time-domain simulation remains necessary for large-signal validation
    and should always be performed as a complementary check even when impedance-based
    analysis is used for small-signal screening.
  issue_severity: none
