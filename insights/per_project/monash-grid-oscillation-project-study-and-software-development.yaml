- record_id: ARENA-DLV-64459
  source_title: Grid Oscillation Project - Milestone 4 Report
  publish_date: 2025-11
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: The impedance prediction algorithm's accuracy was found to be highly
    sensitive to the selection of training operating points. A first training set
    using centrally clustered operating points produced a prediction model with a
    visible mismatch for cross-coupling terms (Ydq); a second training set using extreme
    corner points of the operating range produced substantially better prediction
    accuracy across all admittance components.
  lesson_learnt: When training an impedance prediction model for an IBR, use training
    operating points that span the extremes of the expected operating range rather
    than clustering around a central point — corner-point training sets capture the
    full variation of the non-linear impedance response and yield significantly better
    prediction accuracy, particularly for cross-coupling terms.
