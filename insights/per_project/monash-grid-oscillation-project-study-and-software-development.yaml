  what_happened: The ZAT application was designed with a structured data management
    workflow that requires users to explicitly commit scan results only after interrogating
    data quality, rather than automatically accepting all simulation outputs. This
    quality gate was built into the tool to prevent poor-quality impedance data from
    entering the device library.
  lesson_learnt: Software tools for grid stability analysis used in industry should
    incorporate explicit data quality review gates — requiring users to interrogate
    and approve results before they enter a shared library — to prevent flawed simulation
    outputs from propagating into downstream stability assessments and potentially
    misinforming grid connection decisions.
