  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: The project identified that individual plant SMIB impedance analysis
    of IBRs within a wide-area network may miss interaction phenomena between multiple
    IBRs — a plant's dominant oscillatory mode can change in the presence of other
    IBRs due to inter-plant interactions that are not captured when each plant is
    analysed in isolation.
  lesson_learnt: Do not rely solely on individual plant SMIB impedance analysis to
    characterise oscillation risk in multi-IBR networks — interactions between plants
    can shift dominant oscillatory modes in ways that only emerge in multi-bus analysis;
    where wide-area multi-bus scanning is impractical, use SMIB results only as a
    screening tool to shortlist candidate plants for more comprehensive multi-bus
    analysis.
