  source_title: Grid Oscillation Project - Milestone 4 Report
  publish_date: 2025-11
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: Impedance scan accuracy for vendor models was found to be sensitive
    to the excitation waveform magnitude — if too high, model non-linearities were
    excited causing inaccuracies; if too low, the excitation response was indistinguishable
    from model noise. The optimal magnitude was model dependent but generally fell
    in the range of 0.5% to 2.0% for most models tested.
  lesson_learnt: When scanning vendor PSCAD models, begin with an excitation magnitude
    in the 0.5%–2.0% range and iterate — too high an amplitude excites model non-linearities
    while too low an amplitude is swamped by model noise; treat the optimal magnitude
    as model-specific and verify through comparison of scan quality metrics.
