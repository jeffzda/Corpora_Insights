  what_happened: Power Plant Controller (PPC) models with sample-and-hold type characteristics
    were identified as a specific challenge for impedance scanning, as the discrete
    sampling behaviour introduces aliasing effects that generate errors in scan results
    that are difficult to distinguish from genuine frequency response features.
  lesson_learnt: When impedance scanning plants with sample-and-hold Power Plant Controllers,
    be alert to aliasing artefacts in scan results that mimic genuine frequency response
    features — validate results carefully against time-domain simulations and consider
    whether disabling or modifying the discrete PPC sampling behaviour is appropriate
    for the small-signal scanning context.
