    covering wind, solar, BESS, hybrid, FACTS, and synchronous machine technologies
    revealed that impedance scanning of real-world vendor models was consistently
    more challenging than white-box test models, requiring iterative parameter tuning
    for each model to obtain high-quality results, with no single universal parameter
    set applicable across all models.
  lesson_learnt: 'Plan for significant iterative tuning effort when applying impedance
    scanning to real-world vendor PSCAD models — adopt a structured broad-to-narrow
    scanning process: start with a quick broad scan to identify frequency ranges of
    interest and noise, then progressively focus subsequent scans on those ranges
    for higher quality and resolution; this approach yields reliable results in the
    least total time.'
