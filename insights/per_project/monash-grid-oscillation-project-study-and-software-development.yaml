    results for industry vendor models whilst minimising engineering effort and scan
    simulation time remains an unresolved bottleneck, and that validation of frequency
    response data quality — though critical for user confidence — is itself time-consuming;
    these challenges were not fully resolved within the project scope and were recommended
    for future Rezonance development.
  lesson_learnt: Plan for impedance scan quality assurance as a distinct and time-intensive
    workstream when deploying impedance-based stability analysis in practice — the
    current state of the art requires manual iterative tuning of scan parameters and
    time-consuming result validation; future tool development should prioritise automation
    of parameter optimisation and quality assessment workflows to reduce the engineering
    burden on practitioners.
