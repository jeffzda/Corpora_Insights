  source_title: Monash University - Management of Oscillations in Australia's National
    Grid - Milestone 2 Interim Report
  publish_date: 2024-09
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: Grid-following IBRs operating in weak grid conditions (low short-circuit
    ratio) are susceptible to instability driven by PLL control loop interactions
    and park-level control delays, and the stability boundary is highly sensitive
    to SCR — the ZAT case study demonstrated that reducing SCR from 3.0 to 2.5 pushed
    an otherwise stable IBR system into instability.
  lesson_learnt: Project proponents and network operators should conduct impedance-based
    stability analysis across a range of SCR scenarios — not just at the design SCR
    — because small reductions in grid strength (e.g. following a network contingency)
    can push grid-following IBRs across the stability boundary; the stability margin
    to the SCR at which instability occurs should be a design criterion.
