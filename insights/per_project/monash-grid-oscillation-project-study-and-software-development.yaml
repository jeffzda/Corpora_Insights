- record_id: ARENA-DLV-64461
  source_title: Grid Oscillation Project - Milestone 4 Report
  publish_date: 2025-11
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: On 23 June 2022, voltage and reactive power oscillations emanating
    from the Port Augusta Renewable Energy Park in South Australia commenced several
    hours after communication fail-safe testing was completed, grew gradually, and
    lasted approximately five hours until the plant was de-energised. The root cause
    was determined to be human error in updates to the control code.
  lesson_learnt: Control code updates to IBR plants must be subject to rigorous change
    management and verification processes — the 2022 South Australian oscillation
    event demonstrates that software bugs introduced during routine code updates can
    trigger sustained grid oscillations that are not detectable through pre-event
    modelling, and the risk is only apparent after commissioning the change in the
    field.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: utility/large-scale
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: execution & logistics
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated integration
  intervention_note: The Port Augusta Renewable Energy Park was de-energised to halt
    the oscillations after approximately five hours of sustained disturbance.
  transferability: broad
  delay_magnitude: null
  technology_domain: grid/system stability
  source_pages:
  - 12
  - 15
  evidence_excerpt: On 23 June 2022, voltage and reactive power oscillations were
    observed in South Australia determined to be emanating from the Port Augusta Renewable
    Energy Park. These oscillations commenced and grew gradually several hours after
    the completion of communications fail-safe testing. They lasted for approximately
    five hours until the Port Augusta Renewable Energy Park was de-energised. The
    root cause for this event has been determined to be human error in the updates
    to the control code.
