- record_id: ARENA-DLV-44305
  source_title: Monash University - Management of Oscillations in Australia's National
    Grid - Milestone 2 Interim Report
  publish_date: 2024-09
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: Time-domain simulations in PSCAD/EMTDC are too time-consuming to
    exhaustively cover the potentially large number of operating points and grid conditions
    required for comprehensive IBR stability analysis, creating a practical bottleneck
    for grid connection studies and oscillation investigations.
  lesson_learnt: Relying solely on time-domain PSCAD simulation for IBR stability
    analysis is impractical for large operating point spaces — project proponents
    and network operators should use frequency-domain impedance-based tools (such
    as the ZAT application with impedance prediction) to efficiently characterise
    stability across multiple operating conditions without repeated full EMT simulations.
