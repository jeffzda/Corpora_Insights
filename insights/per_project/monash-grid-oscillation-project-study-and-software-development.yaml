  what_happened: Impedance scan results for vendor models were found to be sensitive
    to the number of concurrent frequency components injected simultaneously — broadband
    multi-tone injections frequently produced significant errors (particularly at
    low frequencies) due to non-linear inter-frequency couplings, while single-tone
    injections produced high-quality results but at the cost of much longer simulation
    run times.
  lesson_learnt: Use segmented multi-tone injections rather than a single broadband
    multi-tone sweep when scanning vendor PSCAD models — splitting the frequency range
    into segments mitigates non-linear coupling errors at low frequencies while remaining
    significantly faster than single-tone scanning; treat the optimal segmentation
    as model-dependent and verify against initial broad scans.
