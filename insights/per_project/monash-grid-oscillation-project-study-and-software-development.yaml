  what_happened: The project identified that IBR impedance frequency response data
    can be used for connection studies as a shareable, non-confidential alternative
    to proprietary PSCAD models — network operators can share grid impedance scans
    with plant proponents without disclosing which specific plants are operating in
    the network, and proponents can iteratively optimise plant design against this
    data before submitting a formal connection application.
  lesson_learnt: Network operators should establish an impedance frequency response
    data-sharing workflow for IBR connection studies — sharing grid impedance scans
    at the prospective connection point avoids the confidentiality barriers of model
    sharing while providing proponents with EMT-fidelity dynamic information needed
    to optimise controller tuning before formal connection assessment, reducing connection
    study iteration cycles.
