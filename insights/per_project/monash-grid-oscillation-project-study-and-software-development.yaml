- record_id: ARENA-DLV-64453
  source_title: Grid Oscillation Project - Milestone 4 Report
  publish_date: 2025-11
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: When performing impedance scanning of vendor (black-box) PSCAD models,
    errors were frequently introduced into scan results when the model was not in
    a fully stable steady state during the scan — caused by slow model start-up, unintentionally
    enabled time-triggered disturbances, discrete switching actions (thermal limiters,
    reactive shunt switching, transformer tap changes), or model instability at low
    SCR values.
  lesson_learnt: Before running an impedance scan on a vendor PSCAD model, verify
    that the model has reached a stable steady state and disable or configure around
    time-triggered disturbances and discrete switching actions; for grid-following
    inverter plants, use a high SCR in the SMIB configuration to ensure stable operation
    during the scan.
