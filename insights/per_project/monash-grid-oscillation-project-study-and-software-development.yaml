- record_id: ARENA-DLV-44304
  source_title: Monash University - Management of Oscillations in Australia's National
    Grid - Milestone 2 Interim Report
  publish_date: 2024-09
  project_name: Grid Oscillation Project (Study and Software Development)
  what_happened: IBR manufacturers routinely keep control structures and configurations
    encrypted or confidential for intellectual property reasons, which impedes accurate
    analytical derivation of impedance models needed for grid connection studies and
    oscillation investigations. This confidentiality barrier is a systemic challenge
    across the NEM.
  lesson_learnt: Because IBR control parameters and structures are almost universally
    withheld by OEMs for IP reasons, grid connection studies and oscillation investigations
    cannot rely on white-box analytical methods — project proponents and network operators
    should plan for black-box impedance measurement approaches (e.g. PRBS or multi-tone
    scanning) as the primary methodology for stability analysis of IBR plant.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: approvals/regulatory
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The ZAT application was developed as a black-box impedance analysis
    tool specifically to overcome the barrier of OEM confidentiality, enabling impedance-based
    stability analysis without requiring access to internal control designs.
  transferability: broad
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id002
