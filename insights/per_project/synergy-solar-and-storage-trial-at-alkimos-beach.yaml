- record_id: ARENA-DLV-42770
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Synergy Solar and Storage Trial at Alkimos Beach
  what_happened: The Synergy Alkimos Beach community battery project — the first community
    battery in Australia — could only capture energy arbitrage as a commercial value
    stream; network charges were too high relative to arbitrage revenue, preventing
    a viable business model from being demonstrated, and continued operation required
    ongoing ARENA financial support.
  lesson_learnt: For community battery projects, model the full cost stack including
    network charges before trial commencement; if network charges consume a large
    proportion of arbitrage revenue, target multiple value streams (e.g. FCAS, network
    support) or advocate for a regulatory accommodation before proceeding to commercial
    scale.
