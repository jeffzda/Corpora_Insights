- record_id: ARENA-DLV-42771
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Synergy Solar and Storage Trial at Alkimos Beach
  what_happened: The Synergy project operated in the isolated Western Australian market,
    and stakeholders noted that learnings from the project may not be as readily shared
    with east-coast jurisdictions as learnings from NEM-connected trials.
  lesson_earnt: When funding trials in isolated or non-NEM markets, build explicit
    knowledge-transfer mechanisms — such as cross-border workshops, joint publications,
    or direct engagement with NEM market participants — into contract knowledge-sharing
    requirements from the outset.
  lesson_learnt: When funding trials in isolated or non-NEM markets, build explicit
    knowledge-transfer mechanisms — such as cross-border workshops, joint publications,
    or direct engagement with NEM market participants — into contract knowledge-sharing
    requirements from the outset.
