- record_id: ARENA-DLV-42772
  source_title: Evaluation of ARENA's VPP Portfolio
  publish_date: 2021-06
  project_name: Synergy Solar and Storage Trial at Alkimos Beach
  what_happened: Synergy reported that overheads to manage the ARENA contract were
    cumbersome and that the intensive contracting process was challenging, slowing
    delivery relative to what was preferred.
  lesson_learnt: Optimise the ARENA contracting process and ongoing management overhead
    — particularly for smaller-scale or first community battery projects — to ease
    the funding application and management burden without compromising accountability.
