  source_title: Redeployable Hybrid Power Product Development Report
  publish_date: 2014-08
  project_name: Redeployable Hybrid Power (DfMA Solar Module) Product Development
  what_happened: The project identified that solar PV curtailment to protect diesel
    generators from operating below minimum loading can be avoided by using dispatchable
    loads (e.g. hot water tanks) as a demand-shifting mechanism, reducing wasted solar
    generation.
  lesson_learnt: Controlling dispatchable thermal loads (such as hot water systems)
    to absorb excess solar generation during the day is a low-cost control strategy
    that avoids PV curtailment caused by diesel generator minimum-load constraints
    — hybrid system designers should include dispatchable load management in the control
    architecture before sizing the solar array.
