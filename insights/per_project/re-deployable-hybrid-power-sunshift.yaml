- record_id: ARENA-DLV-14102
  source_title: Redeployable Hybrid Power Product Development Report
  publish_date: 2014-08
  project_name: Redeployable Hybrid Power (DfMA Solar Module) Product Development
  what_happened: The project applied a Design for Manufacture and Assembly (DfMA)
    approach to solar modules, manufacturing them off-site in a controlled factory
    environment and assembling them on-site, in contrast to the traditional approach
    of delivering raw materials to site for in-situ construction.
  lesson_learnt: Adopting DfMA for solar balance-of-system components significantly
    reduces on-site construction programme and risk, improves quality and safety by
    shifting work to controlled factory conditions, and enables iterative structural
    optimisation — project teams should consider DfMA as a standard approach for remote-site
    solar deployments where labour, logistics, and safety conditions are challenging.
