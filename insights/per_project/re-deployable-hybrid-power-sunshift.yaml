  intervention_note: Dynamic spinning reserve was reconfigured from 100% to 80% of
    real-time PV output following on-site commissioning observation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id033
  - 16
  evidence_excerpt: The system was originally configured to provide static spinning-reserve
    of 80kW for step loads from the village plus a dynamic spinning-reserve equal
    to 100% of the real-time PV output for cloud events. During commissioning on-site,
    it was observed that even on a day with complete cloud cover the PV still produces
    about 20% of its rated output. As a result the dynamic spinning-reserve was reduced
