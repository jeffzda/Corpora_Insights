  what_happened: HOMER modelling found that solar-diesel-flywheel systems were prohibitively
    expensive due to the flywheel acting as a parasitic load during the day and requiring
    bearing replacement every four years, making the technology uncompetitive for
    this application.
  lesson_learnt: Flywheel storage should be excluded from the shortlist for remote
    solar-diesel hybrid systems serving accommodation or mining loads — parasitic
    daytime loads and high O&M costs (bearing changes every four years) produce an
    LCOE above diesel-only; LCOE modelling including realistic O&M costs should be
    conducted before specifying storage technology.
