- record_id: ARENA-DLV-14106
  source_title: Redeployable Hybrid Power Product Development Report
  publish_date: 2014-08
  project_name: Redeployable Hybrid Power (DfMA Solar Module) Product Development
  what_happened: A digitally engineered construction sequence was developed using
    a 'build twice – once virtually' approach to detect clashes and optimise logistics
    before physical site work, with the engineering study finding that an excavator
    with tracks was the optimal machine for handling and transporting DSMs on site.
  lesson_learnt: Digital construction sequencing to detect clashes virtually before
    site mobilisation materially reduces on-site programme risk and costs — for modular
    remote-site installations, investing in 3D construction simulation during design
    is highly transferable and directly reduces rework and safety incidents.
