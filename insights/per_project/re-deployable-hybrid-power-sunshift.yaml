  project_name: Redeployable Hybrid Power (DfMA Solar Module) Product Development
  what_happened: The project developed a hybrid generator sizing strategy combining
    multiple equal-sized generators with one or two smaller generators from the same
    manufacturer, seeking to capture the fuel efficiency benefits of cascading dispatch
    while retaining the operational and maintenance simplicity of equal-sized fleets.
  lesson_learnt: A hybrid generator fleet architecture — equal-sized units plus one
    or two smaller units from the same manufacturer — provides better fuel efficiency
    than equal-sizing alone while avoiding the maintenance complexity of fully heterogeneous
    cascading fleets; this approach should be evaluated as a default configuration
    for new remote hybrid power installations.
