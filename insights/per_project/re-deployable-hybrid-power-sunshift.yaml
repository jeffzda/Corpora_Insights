  source_title: Sunshift Demonstration Report
  publish_date: '2015'
  project_name: SunSHIFT Re-deployable Hybrid Power Demonstration
  what_happened: For a new and unfamiliar technology, multiple internal and client-side
    stakeholders needed to complete many coordinated actions; unclear information
    flows and undefined responsibilities risked delays and miscommunication during
    the first commercial deployment.
  lesson_learnt: For novel technologies where delivery processes are being defined
    for the first time, document information flows, points of contact, and party responsibilities
    explicitly from the outset — ambiguity in these areas is far more damaging for
    first-of-kind deployments than for mature technologies where processes are well
    understood.
