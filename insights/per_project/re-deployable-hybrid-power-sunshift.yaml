- record_id: ARENA-DLV-51167
  source_title: Sunshift Demonstration Report
  publish_date: '2015'
  project_name: SunSHIFT Re-deployable Hybrid Power Demonstration
  what_happened: The SunSHIFT demonstration plant achieved a solar energy contribution
    of only 9.5% over the 81-day monitoring period, despite a 120 kWac solar array,
    because the accommodation village's load profile did not align well with daytime
    solar generation and no energy storage was deployed.
  lesson_learnt: Low solar power penetration does not necessarily mean low solar energy
    contribution — if loads such as hot water heating can be shifted to daytime via
    timers, solar modules can be increased to raise energy contribution without raising
    solar power penetration; feasibility modelling should test load-shifting scenarios
    before sizing the solar array.
