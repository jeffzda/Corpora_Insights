  what_happened: The design of the DfMA Solar Module (DSM) went through ten distinct
    concept options (A through J) assessed against a Functional Design Brief covering
    manufacture, transport, assembly, safety, and value for money before a final patent-pending
    design was selected.
  lesson_learnt: Writing a detailed Functional Design Brief at the outset and using
    it to score competing design options at each stage (concept, basic, preliminary,
    detailed) produces a defensible and optimised design outcome — projects developing
    novel hardware should front-load structured multi-criteria design assessment to
