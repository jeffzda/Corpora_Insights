  what_happened: HOMER modelling of the solar-diesel system showed that solar-diesel
    without storage achieves a lower LCOE than diesel-only only at low solar penetration
    levels; at high penetration, excess solar is curtailed because there is no storage,
    negating the economics of additional PV capacity.
  lesson_learnt: Solar-diesel systems without storage have an economic penetration
    ceiling — LCOE modelling should be used to identify the optimal penetration level
    before sizing the solar array, and project teams should not assume that more solar
    always reduces LCOE in a diesel hybrid without storage.
