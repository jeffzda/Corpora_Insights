- record_id: ARENA-DLV-14105
  source_title: Redeployable Hybrid Power Product Development Report
  publish_date: 2014-08
  project_name: Redeployable Hybrid Power (DfMA Solar Module) Product Development
  what_happened: An engineering study evaluated multiple ground restraint options
    (concrete pads, soil/water-fill footings, paving ballast, percussion-driven piles,
    screw-piles, rock anchors) against transport, reusability, installation effort,
    applicability to varied ground strengths and site reactivity classes, concluding
    that screw-piles were the most practical, economical, and safe solution for the
    redeployable DSM.
  lesson_learnt: For redeployable solar installations, screw-piles installed with
    an excavator and drilling attachment outperform alternative ground restraints
    across most soil types — they are recoverable, compact in transport, tool-free
    to remove, and applicable across the full range of Australian soil conditions
    except rock (where rock bolts apply); projects should evaluate ground restraint
    against reusability and recovery cost, not just installation cost.
  issue_severity: none
