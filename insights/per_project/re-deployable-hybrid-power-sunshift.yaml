- record_id: ARENA-DLV-14104
  source_title: Redeployable Hybrid Power Product Development Report
  publish_date: 2014-08
  project_name: Redeployable Hybrid Power (DfMA Solar Module) Product Development
  what_happened: Because the DSM was designed for repeated redeployment, PV panel
    fatigue was identified as a specific risk; SunPower was engaged as a consultant
    during design development to peer-review the evolving design and ensure panel
    product and power warranties would not be voided.
  lesson_learnt: When designing redeployable solar hardware, engage the panel manufacturer
    as a design consultant early — their peer-review can drive structural changes
    (such as isolated sub-frames and rubber isolation strips) that protect warranties
    and reduce long-term fatigue risk, and this is far cheaper than redesigning after
    warranty rejection.
