  source_title: Redeployable Hybrid Power Product Development Report
  publish_date: 2014-08
  project_name: Redeployable Hybrid Power (DfMA Solar Module) Product Development
  what_happened: HOMER modelling showed that solar-diesel-battery (lithium-ion) systems
    have a higher LCOE than diesel-only at low solar penetrations but achieve a lower
    LCOE than both diesel-only and solar-diesel at high solar penetrations, because
    storage allows the full value of solar generation to be captured.
  lesson_learnt: Lithium-ion battery storage in solar-diesel hybrid systems only delivers
    a positive LCOE case at high solar penetration levels — project teams should model
    LCOE across a range of solar penetrations to identify the battery crossover point
    before committing to a system configuration, and should not add storage to low-penetration
    systems without economic justification.
