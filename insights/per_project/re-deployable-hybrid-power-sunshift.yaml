- record_id: ARENA-DLV-51155
  source_title: Sunshift Demonstration Report
  publish_date: '2015'
  project_name: SunSHIFT Re-deployable Hybrid Power Demonstration
  what_happened: Fly-leads connecting adjacent solar modules were initially designed
    to be only as long as the socket-to-socket distance, making them difficult to
    install and risking cable damage due to insufficient bend radius.
  lesson_learnt: When designing electrical fly-leads, add length beyond the point-to-point
    socket distance to accommodate the minimum bend radius of the cable — undersized
    fly-leads are difficult to install and risk insulation damage.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Fly-lead lengths were increased in the design to exceed the minimum
    bend radius requirement.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hybrid systems
  source_pages: &id025
  - 11
  evidence_excerpt: Electrical cables have a radius of curvature. It is important
    to consider this radius when designing electrical cabling, otherwise the cables
