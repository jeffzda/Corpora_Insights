  source_title: Sunshift Demonstration Report
  publish_date: '2015'
  project_name: SunSHIFT Re-deployable Hybrid Power Demonstration
  what_happened: During fabrication development, changes to individual module digital
    models were made without cross-discipline review, creating a risk of unintended
    knock-on effects such as cabling lengths becoming mismatched after a height change
    to the Integrator.
  lesson_learnt: Any change to a module's digital model must be reviewed by all engineering
    disciplines before it is adopted — interdependencies (e.g. cable lengths driven
    by module height) should be automated in the model to prevent silent errors propagating
    through the design.
