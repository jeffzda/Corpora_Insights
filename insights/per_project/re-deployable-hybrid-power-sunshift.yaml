  source_title: Sunshift Demonstration Report
  publish_date: '2015'
  project_name: SunSHIFT Re-deployable Hybrid Power Demonstration
  what_happened: Operational issues at the remote site required intervention by the
    remote technical team, but site staff lacked the training to support the remote
    team, increasing the risk of costly physical mobilisations to resolve problems.
  lesson_learnt: Before handover of a remote renewable energy installation, provide
    basic operational training to on-site staff so they can support the remote monitoring
    team — this avoids the high mobilisation costs of sending technical personnel
    to resolve issues that a trained local operative could handle; the on-site HMI
    should also be designed for use by non-specialist local staff.
