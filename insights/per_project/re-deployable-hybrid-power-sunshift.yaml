  source_title: Redeployable Hybrid Power Product Development Report
  publish_date: 2014-08
  project_name: Redeployable Hybrid Power (DfMA Solar Module) Product Development
  what_happened: Laing O'Rourke progressed a modular solar-diesel hybrid concept from
    TRL 3 to TRL 7 through a first ARENA Emerging Renewables Program (ERP) Measure
    covering concept design, detailed design, and prototyping, then secured a second
    ERP Measure to advance to TRL 9 and CRL 3 through manufacture and first commercial
    deployment.
  lesson_learnt: Structuring product development in staged TRL/CRL tranches — with
    a formal go/no-go between concept and commercial deployment — allows a funder
    and proponent to validate technical feasibility before committing to full-scale
    manufacture, reducing capital risk on first-of-a-kind modular hardware.
