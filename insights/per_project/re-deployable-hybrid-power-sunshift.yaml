  what_happened: At a remote site, the cost of labour and machinery is significantly
    elevated; interdependent work packages (screw-pile installation and module placement)
    risked generating stand-down days if sequencing was not carefully managed.
  lesson_learnt: For remote deployments where labour and machinery costs are high,
    use critical path analysis and value stream mapping to stagger and decouple work
    packages — interdependencies between packages (e.g. screw-pile installation and
    module placement) should be minimised to eliminate costly stand-down time.
