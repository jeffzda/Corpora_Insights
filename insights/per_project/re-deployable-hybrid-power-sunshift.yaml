- record_id: ARENA-DLV-14107
  source_title: Redeployable Hybrid Power Product Development Report
  publish_date: 2014-08
  project_name: Redeployable Hybrid Power (DfMA Solar Module) Product Development
  what_happened: Four DSM prototypes were fabricated by Redispan in Newcastle and
    subjected to electroluminescence imaging of PV panels before and after manufacture,
    lifting, transport, and pack-down trials to check for micro-cracks; no micro-cracks
    were detected.
  lesson_learnt: Electroluminescence imaging before and after prototype handling trials
    is an effective and low-cost quality assurance method to verify that manufacturing,
    transport, and installation processes do not introduce micro-cracks in PV panels
    — this should be standard practice for any novel redeployable solar module design.
