  source_title: Sunshift Demonstration Report
  publish_date: '2015'
  project_name: SunSHIFT Re-deployable Hybrid Power Demonstration
  what_happened: During commissioning, the control system's dynamic spinning reserve
    was initially configured at 100% of real-time PV output to cover cloud events;
    on-site observation revealed that even full cloud cover left approximately 20%
    residual PV output, allowing the spinning reserve to be safely reduced to 80%.
  lesson_learnt: Do not assume zero PV output under full cloud cover when configuring
    spinning reserve for solar-diesel hybrid systems — field commissioning data at
    this site showed ~20% residual output even under complete overcast, enabling a
    20 percentage-point reduction in spinning reserve and improved fuel efficiency.
