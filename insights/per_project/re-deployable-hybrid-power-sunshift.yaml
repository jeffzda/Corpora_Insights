  what_happened: Remote monitoring via VPN was central to operations, but data connectivity
    to the remote Queensland site was not assessed at feasibility stage, risking inadequate
    bandwidth or no backup connectivity options.
  lesson_learnt: At feasibility stage for remote renewable energy installations, explicitly
    assess data access options, estimate bandwidth requirements, and identify backup
    connectivity — discovering connectivity constraints after installation in a remote
    location creates significant operational risk.
