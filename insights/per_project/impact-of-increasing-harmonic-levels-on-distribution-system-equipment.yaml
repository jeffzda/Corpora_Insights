- record_id: ARENA-DLV-72256
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Impact of Increasing Harmonic Levels on Distribution System Equipment
  what_happened: UNSW laboratory research found that harmonics generated by power
    electronic inverters (used in wind turbines and PV systems) are a significant
    source of increased losses in distribution transformers when adequate filtering
    is not applied, and that standard current transformers are insufficient to monitor
    harmonic losses accurately.
  lesson_learnt: Distribution transformer sizing and life assessment for networks
    with high renewable penetration must account for harmonic losses from inverter-based
    systems — adequate filtering should be specified at the design stage and higher-frequency
    current transformers should be installed to enable accurate harmonic loss monitoring.
