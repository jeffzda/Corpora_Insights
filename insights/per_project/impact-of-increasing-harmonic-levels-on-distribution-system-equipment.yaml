  evidence_excerpt: The project did determine that harmonics are a significant source
    of increased losses when power electronic control devices are used without adequate
    filtering, which is the most common situation. The monitoring of increased losses
    due to harmonics is important for determining useful life and effective loading
    of distribution transformers. This will require installation of improved monitoring
    means by using higher frequency-response current transformers.
