- record_id: ARENA-DLV-53899
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — EV Trials (AGL, Origin)
  what_happened: Origin found that private EV owners offered free chargers became
    unresponsive during the installation process or withdrew from the trial if unexpected
    additional costs were quoted, even when those costs were minor relative to the
    charger value.
  lesson_learnt: EV trial participants accepting free hardware have low tolerance
    for unexpected costs at any stage of the process; trial managers should conduct
    thorough site assessments before enrollment and provide firm cost commitments
    — or fully absorb all site-related costs — to prevent late-stage dropout from
    participants who were recruited on a 'no cost to me' basis.
