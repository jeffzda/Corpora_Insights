  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: CSIRO developed a novel composite electrode design using a symmetric
    material capable of serving as both anode and cathode, enabling hydrogen production
    without hydrogen recirculation and with lower heat-treatment temperatures (800–850°C
    vs. >1000–1400°C for conventional electrodes).
  transferability: moderate
