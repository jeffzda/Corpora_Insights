  publish_date: 2021-06
  project_name: CSIRO Solid Oxide Electrolysis Liquid Fuels R&D Project
  what_happened: CSIRO developed novel cathode materials for SOE that eliminate the
    requirement for a protective reducing gas (H2 or CO) in the feed stream during
    start-up and shutdown, unlike conventional Ni-YSZ electrodes which require such
    a gas to prevent nickel oxidation and performance degradation.
  lesson_learnt: Selecting cathode materials that are redox-stable without protective
    gas reduces system complexity, eliminates the need to recycle product gas to the
    feed stream, and lowers operating cost; future SOE projects should evaluate redox-stable
    electrode materials as a design priority to reduce balance-of-plant complexity.
