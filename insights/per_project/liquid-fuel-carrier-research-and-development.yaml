  what_happened: The project adopted a deliberate holistic development strategy —
    integrating solar energy source, SOE electrolyser, and downstream fuel synthesis
    reactor development in parallel across six partner organisations rather than developing
    components sequentially or in isolation — to avoid integration failures at later
    stages and accelerate the commercialisation pathway.
  lesson_learnt: For multi-component emerging energy technology projects, structure
    development as an integrated parallel program across all system components from
    the outset rather than sequential siloed development — early integration of component
    interfaces (e.g. power input characteristics, gas composition outputs) avoids
    costly redesign at later stages and enables faster scale-up.
