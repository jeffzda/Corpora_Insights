  publish_date: 2020-06
  project_name: CSIRO Solid Oxide Electrolysis Liquid Fuels R&D Project
  what_happened: SOE technology was identified as significantly less mature than competing
    electrolysis technologies (PEM and AEL), with high costs, limited scalability,
    slower start-up, and limited lifetime remaining as barriers to commercialisation
    — despite its theoretical cost and efficiency advantages over AEL ($4.78–5.84/kg)
    and PEM ($6.08–7.43/kg) electrolysis, with SOE projected at $2.14–2.74/kg.
  lesson_learnt: Projects deploying SOE technology should plan for an extended R&D
    and demonstration phase before commercial deployment — the technology readiness
    gap relative to PEM and AEL is substantial, and capital cost, lifetime, and scalability
    barriers must be addressed through systematic materials and design development
    before pilot or commercial commitments are made.
