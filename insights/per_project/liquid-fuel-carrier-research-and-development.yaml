  publish_date: 2020-06
  project_name: CSIRO Solid Oxide Electrolysis Liquid Fuels R&D Project
  what_happened: The conventional flat planar SOE cell design was found to require
    high-temperature gas sealing and complex manifolding to bundle cells into stacks,
    creating significant barriers to cost-effective fabrication and scale-up for the
    project's commercialisation pathway.
  lesson_learnt: For early-stage SOE R&D projects targeting commercialisation, prioritise
    cell geometries (e.g. tubular designs) that simplify stacking and fabrication
    over conventional planar designs — the complexity of high-temperature sealing
    and manifolding in planar designs adds cost and delays scale-up.
