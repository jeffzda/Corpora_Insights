  publish_date: 2021-06
  project_name: CSIRO Solid Oxide Electrolysis Liquid Fuels R&D Project
  what_happened: Technoeconomic analysis of a 420,000 tonne/year syngas plant using
    SOEC and renewable energy found the process economics highly sensitive to electricity
    price (electricity constituting ~52% of total operating cost), with a payback
    period of 19.2 years and NPV of only $14.5M on $108.8M capital cost at current
    market prices.
  lesson_learnt: SOE-based syngas production at commercial scale is economically marginal
    under current electricity pricing; project developers should structure offtake
    or power purchase agreements to lock in low renewable electricity costs before
    committing to capital investment, and should conduct sensitivity analysis on electricity
    price as a primary risk variable.
