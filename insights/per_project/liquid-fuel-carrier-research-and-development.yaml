  evidence_excerpt: A state-of-the-art cathode is a composite of Ni metal with yttria-stabilised
    zirconia ceramic, commonly referred to as Ni-YSZ. While a well-established fuel
    cell electrode, Ni-YSZ undergoes limiting degradation under electrolysis conditions
    reducing lifetime... In this phase of the project, a major emphasis of work at
