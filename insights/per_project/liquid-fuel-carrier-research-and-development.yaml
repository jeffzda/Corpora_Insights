- record_id: ARENA-DLV-7451
  source_title: 'CSIRO Solid Oxide Electrolysis: Liquid Fuels R&D Project – Midterm
    Activity Report September 2018 to June 2020'
  publish_date: 2020-06
  project_name: CSIRO Solid Oxide Electrolysis Liquid Fuels R&D Project
  what_happened: The standard state-of-the-art Ni-YSZ cathode material used in solid
    oxide electrolysis cells was found to undergo limiting degradation under electrolysis
    conditions, reducing cell lifetime and requiring hydrogen recirculation that further
    reduced efficiency — making it unsuitable as a long-term cathode solution for
    the project's SOE development goals.
  lesson_learnt: When developing SOE systems, do not assume fuel-cell electrode materials
    (e.g. Ni-YSZ) will perform adequately under electrolysis conditions — plan for
    dedicated cathode material development from the outset, as electrolysis-specific
    degradation mechanisms require alternative material solutions.
  issue_severity: moderate
  project_type: industrial decarbonisation
