- record_id: ARENA-DLV-11038
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Policy and market analysis identified that renewable heat targets
    or mandates exist in at least 48 countries, with at least 21 countries having
    heat obligations at national or state level. By contrast, the equivalent policy
    support for renewable electricity exists in 146 countries. Australia previously
    had programs (Clean Technology Program) assisting industry with renewable energy
    deployment, but these were discontinued. Without ongoing support mechanisms, industry
    adoption of economically viable renewable heat options was significantly slower
    than technical readiness warranted.
  lesson_learnt: Renewable process heat requires dedicated policy mechanisms comparable
    to those supporting renewable electricity — capital subsidies, long-term stable
    policy frameworks, and technology demonstration programs have proven effective
    internationally and are prerequisites for accelerating industrial uptake in Australia.
