  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Industry stakeholders interviewed consistently required simple payback
    periods of approximately two years for energy investments, with this expectation
    being linked to their specific production cycle and asset lifetimes. The timber
    industry was the only sector willing to accept paybacks of 8–15 years, consistent
    with tree growth cycles. The poultry industry required paybacks of 2–3 years due
    to rapidly changing processing requirements driven by genetics and corrosive environments.
  lesson_learnt: Renewable heat project developers must tailor investment structures
    to sector-specific payback expectations — sectors with short production cycles
    (poultry, food processing) require paybacks under 3 years while sectors with long
    asset cycles (timber) can accept 8–15 years, and this should inform technology
    selection and financing structures.
