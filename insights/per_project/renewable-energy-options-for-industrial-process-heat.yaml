- record_id: ARENA-DLV-11036
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Analysis of the food and beverage sector showed that many facilities
    have centralised heating and cooling systems with low efficiencies of supply to
    the point of use, yet there is no widespread interest in addressing individual
    small energy streams within complex factories, because introducing separate equipment
    for a small sub-process adds operational complexity, skills requirements, and
    maintenance obligations disproportionate to the energy saved.
  lesson_learnt: Small process heat streams within complex food manufacturing facilities
    are best served by one or two centralised renewable energy plants distributing
    to multiple uses — proposing individual renewable heat technologies for each small
    use within a large plant will typically fail to gain management support due to
    disproportionate operational burden.
