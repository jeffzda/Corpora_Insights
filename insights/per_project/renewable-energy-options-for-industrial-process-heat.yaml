- record_id: ARENA-DLV-11004
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Industry stakeholders reported that obtaining suitable long-term
    gas supply contracts on the east coast of Australia remained problematic even
    for very large gas users, creating a stark planning mismatch between the inability
    to secure even one-to-two year gas contracts and the 50–60 year lifetime of major
    industrial plant.
  lesson_learnt: Inability to secure long-term gas supply contracts is itself a driver
    for switching to renewable energy alternatives — project developers should quantify
    gas supply security risk as part of business case analysis for capital-intensive
    industrial plant.
