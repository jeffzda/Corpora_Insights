- record_id: ARENA-DLV-11024
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Industry stakeholders were broadly unwilling to enter into energy
    purchase agreements (where a third party owns and operates the heat asset and
    charges for energy supplied), primarily due to concern that mission-critical energy
    supply under the control of a non-regulated entity exposed them to unacceptable
    long-term risk from changes in the supplier's management, financial stability,
    and staff competency. Only one of the companies interviewed found such arrangements
    acceptable.
  lesson_learnt: Third-party heat supply agreements for mission-critical industrial
    processes face fundamental commercial acceptance barriers — unlike electricity
    where switching suppliers is possible, over-the-fence heat supply is a captive
    arrangement; project structures must address this risk explicitly to gain industry
    acceptance.
