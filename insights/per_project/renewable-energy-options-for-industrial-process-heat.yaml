- record_id: ARENA-DLV-11025
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Industry stakeholders universally required new energy technologies
    to be demonstrated at an operational scale commensurate with their own process
    before committing to adoption. Pilot plant evidence was generally insufficient;
    working single-plant examples were the minimum threshold, with multiple working
    examples strongly preferred. Some sectors with fine-tuned production processes
    required demonstration in the same industry, with the same operating parameters,
    and even in the same geographic region.
  lesson_learnt: Technology demonstration at the relevant industrial scale and in
    the relevant sector is a prerequisite for commercial adoption — funders should
    prioritise full-scale sector-specific demonstrations rather than cross-sector
    pilots when seeking to unlock uptake in specific industries.
