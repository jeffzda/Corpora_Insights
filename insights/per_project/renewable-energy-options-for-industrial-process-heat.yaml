- record_id: ARENA-DLV-11009
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: The BHP-Billiton Hot Briquetted Iron (Boodarie Iron) plant at Port
    Hedland, commissioned in 1999 using the Finmet direct reduction process, experienced
    persistent commissioning difficulties, large cost overruns, and significant operational
    issues resulting in a complete write-off of $1.7 billion in plant value between
    1998 and 2000. The plant operated until 2004 when a fatal gas explosion during
    scheduled maintenance led to its permanent shutdown and demolition in 2007.
  lesson_learnt: Advanced direct iron reduction processes involve substantial technical
    and financial risk that should not be underestimated — first-of-a-kind industrial-scale
    deployment requires rigorous risk assessment, and the technical gap between pilot
    and full commercial scale can result in complete project write-off.
