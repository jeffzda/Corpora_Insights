  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Short-term renewable heat opportunities estimated at 56 PJ/year (12%
    of industrial gas use for heat) were identified as already economic using existing
    technology, yet industry had not acted on them due to decision-making lag rather
    than economic barriers.
  lesson_learnt: Near-term renewable heat interventions that are already economic
    require targeted encouragement mechanisms to overcome decision-making inertia
    — economic viability alone is insufficient to drive uptake without visible examples
    and support programs.
