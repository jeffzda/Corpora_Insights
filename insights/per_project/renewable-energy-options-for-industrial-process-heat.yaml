- record_id: ARENA-DLV-11001
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Australian industrial process heat accounts for approximately 730
    PJ/year of end-use heat, overwhelmingly supplied by fossil fuels (predominantly
    natural gas), yet renewable energy options across all temperature ranges exist
    but have seen very low uptake. The level of industry experience with renewable
    heat remains low despite many options being economically competitive.
  lesson_learnt: Industrial decarbonisation programs should prioritise building visible
    working examples of renewable heat systems — the biggest driver for increased
    uptake is the visible presence of relevant working examples, and this may need
    assistance for initial pilot systems.
