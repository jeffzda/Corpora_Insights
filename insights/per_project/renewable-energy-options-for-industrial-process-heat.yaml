  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Solar thermal concentrating systems for temperatures of 200°C showed
    viable economics in locations with excellent solar resources (like Alice Springs,
    21.7% capacity factor) but were at borderline viability in Brisbane (14.1% capacity
    factor) and uneconomic in Melbourne (9.6% capacity factor) at current gas prices.
    This strong geographic dependence means that solar thermal feasibility cannot
    be generalised across Australian locations.
  lesson_learnt: Solar concentrating thermal systems at 200°C are only economic in
    high-DNI inland Australian locations — feasibility assessments must use site-specific
    solar resource data rather than national averages, and Melbourne or coastal southeast
    Australian sites will generally not support economic concentrating solar thermal.
