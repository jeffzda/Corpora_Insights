- record_id: ARENA-DLV-11007
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Low-temperature lift heat pumps were found to be economically attractive
    for industrial process heat below approximately 100°C when operated at high capacity
    utilisation, particularly when providing simultaneous heating and cooling. However,
    the economic case was highly sensitive to the electricity-to-fuel price ratio
    and capacity utilisation factor; low capacity utilisation due to use of intermittent
    renewable electricity sources substantially increased the levelised cost of heat.
  lesson_learnt: Heat pump feasibility analyses must explicitly model the electricity-to-fuel
    price ratio and expected capacity utilisation factor — operating a heat pump at
    low capacity factor (e.g. matching only daytime PV output) can negate apparent
    electricity cost savings and must be evaluated against thermal storage options.
