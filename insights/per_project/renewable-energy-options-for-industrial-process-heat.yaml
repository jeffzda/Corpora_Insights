  what_happened: The sugar industry in Australia has 24 mills, already operating as
    largely self-sufficient bioenergy CHP systems using bagasse. Some mills have been
    modernised to export significant proportions of their generated electricity. However,
    not all mills have been modernised, meaning there is untapped potential for additional
    dispatchable renewable electricity generation that would otherwise require no
    additional biomass feedstock.
  lesson_learnt: Modernisation of sugar mills across Australia represents an untapped
    source of dispatchable renewable electricity requiring no new feedstock — proponents
    and policy makers should target mill-by-mill CHP efficiency upgrades as a near-term
    renewable electricity opportunity with established supply chains.
