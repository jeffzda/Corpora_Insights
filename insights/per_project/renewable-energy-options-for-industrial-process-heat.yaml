  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Businesses with multiple production sites found it substantially
    easier to manage capital investment in new energy technologies at a single site
    compared to single-site operators, because the total investment represented a
    smaller proportion of overall business capital and the organisation had capacity
    to manage implementation risk. Single-site large industrial operators (minerals
    processing, chemicals) faced the greatest difficulty in funding first-of-a-kind
    energy transitions given long equipment lifetimes and commodity market exposure.
  lesson_learnt: Renewable heat transition programs should differentiate between multi-site
    operators (where incremental single-site pilots are feasible) and single-site
    large operators (where the transition cost is proportionally much greater and
    requires different financing and risk-sharing mechanisms).
