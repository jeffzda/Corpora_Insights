- record_id: ARENA-DLV-11008
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Renewable hydrogen was assessed as currently approximately four times
    more expensive than natural gas for process heat applications in Australia (approximately
    $38.8/GJ vs $10/GJ wholesale gas), but was projected to fall to competitive levels
    within a decade, particularly for ammonia production where eliminating steam reforming
    reduces capital requirements.
  lesson_learnt: Ammonia and other hydrogen-feedstock industries should plan for a
    transition to green hydrogen rather than renewable fuel substitution within the
    current steam methane reforming process — greenfield ammonia plants can eliminate
    the steam reforming capital investment, improving the economics of renewable hydrogen
    adoption.
