- record_id: ARENA-DLV-11027
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Process optimisation analysis showed that many industrial heat users
    have centralised boiler systems distributing steam over large distances, resulting
    in actual end-use efficiencies of 50% or lower due to distribution losses. Switching
    to renewable heat without first addressing process efficiency would over-size
    and over-cost renewable systems.
  lesson_learnt: Process efficiency should be evaluated before sizing renewable heat
    systems — improving end-use efficiency (especially in large distributed steam
    networks) can halve the required renewable capacity and substantially reduce capital
    costs, improving project economics.
