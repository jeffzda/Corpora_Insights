- record_id: ARENA-DLV-11039
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Analysis of biomass CHP economics showed that CHP configurations
    generating both electricity and process heat have lower effective levelised cost
    of heat than heat-only bioenergy systems when electricity has a value of around
    10 c/kWh or more and system sizes are sufficiently large. For small systems at
    low electricity prices, the extra capital cost of CHP turbines is not justified.
  lesson_learnt: Bioenergy process heat projects should evaluate CHP configurations
    as the default option when electricity prices exceed approximately 10 c/kWh —
    the additional turbine capital cost is typically recovered through electricity
    revenue, and only at low electricity prices and small system sizes does heat-only
    configuration become preferable.
