- record_id: ARENA-DLV-11033
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: 'Geothermal hot sedimentary aquifer systems in Australia are limited
    to temperatures up to 95°C. Analysis showed a strong economic crossover point:
    above approximately 20 TJ/year of heat demand, geothermal can be very cost-effective
    for low-temperature applications, but below that threshold capital costs of well
    pairs are not recoverable. Many food and meat processing sites on the Great Artesian
    Basin are potential candidates but the technology remains significantly underutilised.'
  lesson_learnt: Geothermal process heat from hot sedimentary aquifers should be assessed
    by any industrial operator with low-temperature heat demand above 20 TJ/year located
    on a suitable aquifer — a multi-use assessment combining water and heat applications
    typically strengthens the business case sufficiently to justify bore capital costs.
