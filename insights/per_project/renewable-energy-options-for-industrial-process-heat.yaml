- record_id: ARENA-DLV-11006
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Solar thermal process heat systems were assessed as economically
    competitive with fossil fuels for temperatures below approximately 150°C across
    most Australian sites, yet only a few pilot installations existed in Australia
    as of 2019. The chicken-and-egg problem of low visible examples suppressing industry
    confidence was identified as the dominant barrier.
  lesson_learnt: Solar thermal process heat faces a market-entry barrier where industry
    requires visible working examples before investing — targeted demonstration funding
    for first-of-a-kind installations in each key sector is needed to break this cycle.
