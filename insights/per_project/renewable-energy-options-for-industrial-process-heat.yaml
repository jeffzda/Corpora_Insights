- record_id: ARENA-DLV-11005
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Bioenergy systems were found to be the most commercially mature and
    widely deployed renewable heat technology in Australia, already providing heat
    at competitive cost wherever zero or low-cost biomass feedstock (such as waste
    streams) was available. However, feedstock availability, supply chain logistics
    and long-term contract security emerged as the primary barriers limiting further
    uptake.
  lesson_learnt: Bioenergy projects achieve the strongest business cases when the
    fuel arises on-site as a disposal-cost waste — developers should prioritise sites
    where feedstock is a by-product requiring disposal, and establish long-term supply
    contracts before committing capital.
