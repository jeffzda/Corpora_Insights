  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Analysis of the cement sector found that even if all fossil fuel
    combustion for heat were replaced by renewables, roughly half of the sector's
    CO2 emissions would remain due to the inherent calcination of calcium carbonate
    (limestone) producing CO2 as a chemical by-product. Bioenergy already contributes
    5% of the sector's energy demand and waste-derived fuels are used at multiple
    kilns, but the structural CO2 issue limits the long-term decarbonisation potential
    without CCS or alternative cement chemistries.
  lesson_learnt: Renewable heat substitution in cement manufacturing addresses only
    approximately half the sector's emissions — full decarbonisation requires either
    carbon capture and storage, adoption of geopolymer or alternative cementitious
    materials, or both, and project proponents should not represent renewable heat
    as a full decarbonisation solution in this sector.
