- record_id: ARENA-DLV-11003
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Following expansion of LNG exports from Gladstone, wholesale gas
    prices across eastern Australia rose to export netback price levels, roughly doubling
    costs for large industrial users (to $8–10/GJ) and increasing costs even more
    sharply for small users (over $20/GJ), permanently undermining the economics of
    gas-based process heat and creating urgency around renewable alternatives.
  lesson_learnt: Industrial heat investment cases must account for structural gas
    price exposure linked to LNG export parity — pre-2016 gas price assumptions are
    no longer valid for eastern Australia, and renewable alternatives now compete
    more favourably than historical analyses suggested.
