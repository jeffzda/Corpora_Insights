  what_happened: The Siemens green ammonia pilot plant near Oxford, UK (completed
    2018, £1.5 million) demonstrated the full round-trip from renewable electricity
    to ammonia and back to electricity using a PEM electrolyser, Haber-Bosch synthesis,
    and ammonia-adapted internal combustion engine. The 30 kg/day scale facility established
    proof-of-concept for ammonia as an energy storage medium and fertiliser, with
    applications including demand-side response and long-term large-scale electricity
    storage.
  lesson_learnt: Green ammonia pilot-scale demonstration confirms technical feasibility
    of the full power-to-ammonia-to-power cycle — Australian greenfield ammonia projects
    should reference this proof-of-concept when designing renewable hydrogen business
    cases, noting that integration of nitrogen separation, electrolysis, and ammonia
    synthesis requires careful sequencing.
