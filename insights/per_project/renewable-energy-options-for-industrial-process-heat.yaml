- record_id: ARENA-DLV-11028
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Renewable Energy Options for Industrial Process Heat
  what_happened: Economic analysis showed that the levelised cost of heat from renewable
    sources is strongly size-dependent, with higher specific capital costs at small
    system sizes raising the LCOH above the cost of fossil heat for small users. However,
    small industrial users also pay much higher fuel prices (up to $20–30/GJ for gas
    vs $8–10/GJ for large users), and this price differential largely offsets the
    scale disadvantage of smaller renewable systems, making renewables economic across
    most size ranges.
  lesson_learnt: Small and medium industrial heat users should not dismiss renewable
    heat options on the basis of scale economies alone — their higher fuel costs largely
    compensate for higher specific capital costs of smaller systems, and site-specific
    analysis frequently reveals viable renewable options.
