  source_title: MVR Evaporation Feasibility Study
  publish_date: 2022-11
  project_name: Mechanical Vapour Recompression (MVR) for Low Carbon Alumina Refining
    – Wagerup MVR Evaporation Project
  what_happened: The emergence of low-cost renewable power disrupted the economics
    of alumina refinery Combined Heat and Power (CHP) self-generation, shifting more
    costs onto steam and making conventional evaporation more expensive relative to
    MVR driven by renewable electricity; sensitivity analysis showed MVR's economic
    advantage over conventional evaporation is robust across a wide range of power,
    gas, and carbon price assumptions.
  lesson_learnt: Industrial decarbonisation projects substituting electrification
    for fossil-fuel process heat should reassess the incumbent CHP economic model,
    as falling renewable power prices can simultaneously erode the cost advantage
    of self-generated steam and improve the relative economics of electrified alternatives
    — carbon price trajectory further strengthens the case for early electrification
    investment.
