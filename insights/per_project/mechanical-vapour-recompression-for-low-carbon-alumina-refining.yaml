- record_id: ARENA-DLV-70214
  source_title: MVR Technical and Commercial Feasibility Studies Summary Report
  publish_date: 2022-11
  project_name: Alcoa Mechanical Vapour Recompression (MVR) for Low Carbon Alumina
    Refining
  what_happened: The commercial study found that in growth/expansion scenarios, MVR
    technology has similar capital cost to conventional technology but with lower
    operating cost, while in retrofit scenarios the economics depend heavily on renewable
    power and carbon prices — creating two materially different investment cases requiring
    separate analysis.
  lesson_learnt: Brownfield retrofit and greenfield/expansion scenarios for industrial
    decarbonisation technology should be evaluated under separate financial models
    — the drivers of commercial viability differ fundamentally (retrofit is opex and
    carbon-price sensitive; expansion is capex-comparable with opex advantage), and
    blending them in a single business case will misrepresent the investment decision
    for each.
