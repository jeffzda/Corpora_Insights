- record_id: ARENA-DLV-9254
  source_title: MVR for Low Carbon Alumina Refining Project - Close Out Report
  publish_date: 2024-04
  project_name: MVR for Low Carbon Alumina Refining Project (Wagerup MVR Evaporation
    Project)
  what_happened: The risk register was established and monthly risk reviews were conducted
    as planned, but the risk register was never applied to the project estimate through
    a probabilistic analysis. Unknown-unknown risk was formally accepted rather than
    being quantified and carried as contingency. This meant stakeholders were not
    informed of the realistic range of cost outcomes given the technology development
    risk profile.
  lesson_learnt: For first-of-a-kind or technology development projects, the risk
    register must be used to complete a full probabilistic estimate review (P10/P50/P90),
    not just to track qualitative risks — unknown-unknown risk should not be accepted
    without an associated contingency allowance.
