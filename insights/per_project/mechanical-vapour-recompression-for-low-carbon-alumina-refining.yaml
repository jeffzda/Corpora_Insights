  source_title: MVR Retrofit and Commercialisation Report
  publish_date: 2022-11
  project_name: Mechanical Vapour Recompression for Low Carbon Alumina Refining
  what_happened: The retrofit design's deliberate simplicity — chosen to minimise
    construction cost and process tie-ins — means it misses some opportunities to
    achieve optimum efficiency. An optimised greenfield flowsheet using single-stage
    falling film evaporators (FFEs) driven by MVR could use up to 2% less power than
    a conventional refinery retrofitted with MVR, and up to 6% less power per tonne
    of evaporation compared to a conventional evaporator.
  lesson_learnt: Retrofit designs constrained by existing infrastructure should explicitly
    quantify the efficiency gap relative to an optimised greenfield configuration,
    so that project proponents can make informed decisions about whether greater upfront
    complexity (and cost) is warranted to capture efficiency gains over the project
    lifetime.
