    Refining
  what_happened: The commercial study found that sector-wide industrial decarbonisation
    of alumina refining requires coordinated action across the alumina industry, the
    energy supply industry, energy planning authorities, and governments at all levels
    — with the implication that no single operator can achieve the transition independently.
  lesson_learnt: Hard-to-abate industrial sector decarbonisation programs should be
    designed from the outset as multi-stakeholder coordination exercises — technology
    deployment, firmed renewable energy supply, carbon market development, and government
    policy must be progressed in parallel; sequencing these as separate activities
    will delay the overall timeline beyond what global carbon commitments require.
