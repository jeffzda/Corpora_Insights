  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Market engagement was used to obtain a budgetary estimate for
    the re-tube; this became an input to the revised project estimate that ultimately
    demonstrated financial unviability.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: industrial renewables
  source_pages: &id003
