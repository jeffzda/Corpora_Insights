- record_id: ARENA-DLV-70062
  source_title: MVR Retrofit and Commercialisation Report
  publish_date: 2022-11
  project_name: Mechanical Vapour Recompression for Low Carbon Alumina Refining
  what_happened: Compressor noise was identified as a significant issue requiring
    active management. Most noise was found to emanate from ducting and pipework rather
    than the compressors themselves, as compressor noise travels through pipework
    and radiates to atmosphere. Duct silencing is not standard practice for MVR installations
    and required a bespoke solution combining inlet/exit silencers, thermal insulation,
    inter-compressor silencers, noise-attenuating hoods, low-noise motors, and noise
    offset through steam turbine curtailment.
  lesson_learnt: Noise abatement for MVR installations must be designed into the system
    from the outset — compressor inlet, transfer, and outlet duct silencers plus individual
    compressor enclosures are required, and offset projects may also be needed; treating
    noise as an afterthought risks failing regulatory boundary requirements and blocking
    large-scale rollout.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
