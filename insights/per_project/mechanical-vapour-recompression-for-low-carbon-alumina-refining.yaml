  project_name: MVR for Low Carbon Alumina Refining Project (Wagerup MVR Evaporation
    Project)
  what_happened: Key project roles were staffed with part-time resources who had competing
    demands on their time, primarily in the process and electrical disciplines. This
    led to delays in design deliverables, delayed scheduling of critical workshops
    (including HAZOPs), and delayed procurement activities.
  lesson_learnt: On high-value and critical projects — especially technology development
    projects — key roles should be assigned as full-time dedicated resources; part-time
    resource allocation causes compounding delays across design, procurement and contracting
    activities.
