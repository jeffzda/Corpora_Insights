- record_id: ARENA-DLV-9252
  source_title: MVR for Low Carbon Alumina Refining Project - Close Out Report
  publish_date: 2024-04
  project_name: MVR for Low Carbon Alumina Refining Project (Wagerup MVR Evaporation
    Project)
  what_happened: The project progressed through the FEL 3 gate with insufficient design
    maturity in several areas including electrical scope, process and controls design,
    and the condition of the existing falling film evaporator (FFE). The gate was
    not delayed to resolve these gaps, resulting in significant rework and cost growth
    in detailed design.
  lesson_learnt: Ensure that key existing equipment is fully inspected and refurbishment
    costs incorporated before finalising the FEL 3 estimate, and that the process
    and controls design is adequately matured — gate reviews should not proceed when
    critical deliverables are incomplete, and should involve sufficient personnel
    with adequate review time.
