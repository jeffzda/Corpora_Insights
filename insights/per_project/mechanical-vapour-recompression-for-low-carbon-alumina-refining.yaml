    Project)
  what_happened: 'Multiple safety and operability issues were identified during detailed
    design and HAZOP reviews that had not been identified at FEL 3, including: overpressure
    protection non-conformance with AS1210, hydrogen accumulation risk during acid
    washing, vapour carryover and condensate contamination risks, caustic washing
    overpressure scenarios, and inadequate instrumentation for critical flows. Each
    required design changes and re-HAZOP.'
  lesson_learnt: For a technology being applied in a new context (MVR in an alumina
    refinery), safety and operability risks that are well-understood in the source
    industry may not transfer directly — the HAZOP at FEL 3 must include people with
    specific knowledge of both the technology and the host process to surface these
    interactions before detailed design commences.
