  what_happened: The commercial study identified a significant industry knowledge
    gap regarding the benefits of MVR for alumina refining, and recommended an additional
    demonstration of a compressor train at 60:1 pressure ratio (requiring many compressors
    in series) before substantial implementation — beyond the 4 MW Wagerup Stage 2
    demonstration.
