  what_happened: The digestion blow-off MVR retrofit is assigned lower priority in
    the development pathway because its benefits are only significant after MVR evaporation
    is implemented — MVR evaporation includes condensate waste heat recovery that
    changes the digestion energy balance, creating additional blow-off steam. Implementing
    digestion blow-off MVR before evaporation MVR would yield materially lower benefit.
