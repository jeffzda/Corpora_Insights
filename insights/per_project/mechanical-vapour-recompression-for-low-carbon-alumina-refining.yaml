  intervention_note: Noise solution included train inlet/exit silencers, thermal insulation,
    inter-compressor ductwork silencers, noise-attenuating hoods, low-noise air-cooled
    motors, and curtailment of steam turbines as a noise offset; the Wagerup MVR+FFE
    demonstration will test all items except the noise offset.
  transferability: moderate
