  source_title: MVR Retrofit and Commercialisation Report
  publish_date: 2022-11
  project_name: Mechanical Vapour Recompression for Low Carbon Alumina Refining
  what_happened: The calcination waste heat recovery concept — directing stack gases
    to a scrubber and flashing the resulting warm water to generate vapour for MVR
    compression — has multiple unproven aspects. A previous study required continuous
    stack gas reheating to maintain stack gas buoyancy, which significantly negated
    energy benefits. Stack gas boundary emissions and dispersion modelling outcomes
    remained unconfirmed at the time of the study.
  lesson_learnt: Novel heat recovery concepts attached to existing regulated emission
    sources (such as calciner stacks) require early engagement with emissions boundary
    conditions and dispersion modelling — retrofitting heat recovery without confirming
    these constraints can require reheating that negates the energy benefit and fundamentally
    changes the project economics.
