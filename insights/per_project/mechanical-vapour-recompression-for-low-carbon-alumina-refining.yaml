  what_happened: The feasibility study identified equipment and construction delivery
    delays — including long-lead items such as compressors, silencers, and variable
    speed drives — as a top project risk, with COVID-19 supply chain disruption accepted
    as an unmitigable risk with no specific schedule allowance made.
  lesson_learnt: For industrial decarbonisation projects with long-lead imported equipment,
    issue formal tenders for compressors, silencers, and VSDs as early as possible
    and engage construction contractors for site walks during front-end loading to
    reduce procurement and construction schedule risk; COVID-19 and equivalent uncontrollable
    supply disruptions should be acknowledged in project risk registers even if not
    fully mitigated.
