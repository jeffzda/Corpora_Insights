    the application, a multi-stage demonstration program (not a single demonstration
    project) is needed to bridge the knowledge gap before sector-wide adoption — each
    demonstration stage should target a specific performance uncertainty (e.g. high
    compression ratios in series) that blocks investor confidence for the next scale-up.
