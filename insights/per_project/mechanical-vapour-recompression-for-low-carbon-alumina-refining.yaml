    equipment, commission a thorough physical inspection including weld inspection,
    thickness testing, and leak testing of the heat exchanger tubes early in the front-end
    loading phase, and engage a third-party engineering specialist to confirm retrofit
    feasibility — unknown existing conditions are a leading source of scope growth
    in industrial retrofit projects.
