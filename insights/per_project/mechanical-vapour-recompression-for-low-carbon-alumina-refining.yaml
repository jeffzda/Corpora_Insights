    accuracy to make an investment decision, explicitly quantify the compounded uncertainty
    of the comparison — subtracting two uncertain numbers can produce a result with
    very wide error bounds that invalidates the comparison, and the analysis should
    clearly communicate this to decision-makers rather than presenting a point estimate.
