  what_happened: CFD modelling and TEMA vibration assessment revealed that the original
    vapour feed configuration would produce vapour entry velocities exceeding 50 m/s
    through the first tubes of the FFE tube bundle, creating a risk of flow-induced
    tube vibration that could damage the heat exchanger.
  lesson_learnt: For MVR retrofits to existing falling film evaporators, conduct flow-induced
    vibration assessments (using TEMA software and CFD modelling) before finalising
    vapour inlet design — high vapour entry velocities at the tube bundle inlet may
    require an inlet chamber to redistribute flow and prevent tube vibration.
