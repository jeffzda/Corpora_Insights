  what_happened: The capital cost of retrofitting MVR to existing fossil-fuelled alumina
    refineries is more challenging economically than for greenfield or brownfield
    growth scenarios, because MVR investment must be added on top of existing (sunk)
    process heat infrastructure that becomes largely redundant. Retrofit economics
    are not commercially viable in the short term without carbon pricing.
  lesson_learnt: Retrofit economics for industrial decarbonisation are structurally
    more challenging than greenfield or brownfield growth cases; financial modelling
    should separate these scenarios and not use greenfield economics to justify retrofit
    investment decisions. Carbon pricing assumptions must be explicit and stress-tested.
