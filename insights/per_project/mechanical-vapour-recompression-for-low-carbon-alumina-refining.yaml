- record_id: ARENA-DLV-70055
  source_title: MVR Retrofit and Commercialisation Report
  publish_date: 2022-11
  project_name: Mechanical Vapour Recompression for Low Carbon Alumina Refining
  what_happened: The MVR system for a full Wagerup retrofit requires 46 compressors
    in five trains. Having many compressors in series creates a cumulative reliability
    risk — if any one compressor fails, it can cause the whole train to fail. Unplanned
    compressor outage data was not available at study completion, and the design criterion
    allowing continued operation with one compressor out of circuit added approximately
    3 per cent to power consumption and 5 per cent to capital cost.
  lesson_learnt: When designing multi-stage compression systems at the frontier of
    available equipment, explicitly quantify and challenge reliability assumptions
    before finalising the design — the criterion enabling single-compressor fault
    tolerance added 5% capital and 3% operating cost, and its necessity should be
    validated by a full-train demonstration before it is locked into a commercial
    design.
  issue_severity: moderate
  project_type: industrial decarbonisation
