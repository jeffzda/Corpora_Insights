  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: MVR evaporation train designed to be stopped and started readily
    to avoid peak capacity charge periods; the Wagerup MVR+FFE demonstration project
    includes an objective to demonstrate that the MVR evaporator can be readily stopped
    and started as required.
  transferability: moderate
