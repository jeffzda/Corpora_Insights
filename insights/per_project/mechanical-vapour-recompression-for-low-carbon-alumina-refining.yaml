- record_id: ARENA-DLV-9253
  source_title: MVR for Low Carbon Alumina Refining Project - Close Out Report
  publish_date: 2024-04
  project_name: MVR for Low Carbon Alumina Refining Project (Wagerup MVR Evaporation
    Project)
  what_happened: A detailed condition assessment of the existing FFE, which was planned
    for completion early in the execution phase, revealed the heat exchanger required
    a full re-tube. The cost of the re-tube with annular ring modifications was approximately
    equal to the cost of a new heat exchanger — an outcome not anticipated in the
    FEL 3 estimate, which was based only on a visual weld inspection and thickness
    testing.
  lesson_learnt: When an existing asset is a key project component intended for refurbishment,
    a detailed condition inspection must be completed and costs incorporated before
    finalising the FEL 3 estimate — the FEL 3 gate should be delayed if necessary
    to achieve this.
