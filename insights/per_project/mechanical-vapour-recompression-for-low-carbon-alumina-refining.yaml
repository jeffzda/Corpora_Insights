  source_title: MVR Retrofit and Commercialisation Report
  publish_date: 2022-11
  project_name: Mechanical Vapour Recompression for Low Carbon Alumina Refining
  what_happened: The reserve capacity charge structure in the SWIS creates an implied
    power cost of over $20,000/MWh for the six hours per year during which metering
    intervals set annual capacity charges. Continuous MVR operation during these periods
    would be economically catastrophic; Alcoa's design assumes a 90% avoidance success
    rate by stopping MVR evaporation during these periods.
  lesson_learnt: Large industrial electricity consumers transitioning to electrified
    processes must model the full cost structure of their electricity tariff — not
    just the wholesale price — because capacity charge mechanisms can create extreme
    effective power costs during a small number of hours that dominate the economics
    and must be actively managed through demand flexibility.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: industrial operator
