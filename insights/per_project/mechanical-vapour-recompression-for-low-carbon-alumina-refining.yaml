  source_title: MVR Retrofit and Commercialisation Report
  publish_date: 2022-11
  project_name: Mechanical Vapour Recompression for Low Carbon Alumina Refining
  what_happened: The refinery's existing boiler infrastructure — representing a significant
    prior capital investment — becomes largely redundant once MVR is installed, creating
    a sunk cost problem that materially worsens retrofit economics compared to greenfield
    or brownfield growth scenarios. Three existing boilers are placed into long-term
    hibernation to preserve integrity for backup use, partially offsetting the stranded
    asset issue.
  lesson_learnt: When designing industrial decarbonisation retrofits, explicitly account
    for the stranded asset value of existing process infrastructure in the financial
    model — the sunk cost of redundant plant does not affect future cash flows but
    its book value affects balance sheet and depreciation, and its physical retention
    as backup can partially recover economic value.
