  project_name: Alcoa Mechanical Vapour Recompression (MVR) for Low Carbon Alumina
    Refining
  what_happened: The feasibility study found that high-temperature alumina refining
    (Queensland/Northern Territory bauxite requiring ~250°C digestion) presents greater
    decarbonisation complexity than low-temperature WA refining (~140–170°C), with
    MVR retrofit estimated to cost approximately 18% more per tonne of alumina production,
    and potentially requiring different low-emissions technologies altogether.
  lesson_learnt: Industrial decarbonisation feasibility studies must disaggregate
    findings by process temperature regime — conclusions drawn from low-temperature
    refinery studies (as at Wagerup) cannot be directly transferred to high-temperature
    facilities, and separate technology development pathways may be required for each
    regime.
