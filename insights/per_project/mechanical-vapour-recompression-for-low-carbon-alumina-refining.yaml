  what_happened: The FFE vapour separator was designed for approximately 50 per cent
    of the flash tank vapour loading required for the MVR demonstration, creating
    a risk of liquid carry-over that could contaminate the compressors and compromise
    reliability.
  lesson_learnt: When repurposing existing evaporator equipment for MVR duty at higher
    vapour loading than the original design, explicitly assess mist elimination capacity
    and upgrade accordingly — continuous condensate spraying of mist eliminators and
    desuperheating sprays on compressor impellers are practical mitigations for carry-over
    risk.
