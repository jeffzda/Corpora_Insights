  source_title: MVR Retrofit and Commercialisation Report
  publish_date: 2022-11
  project_name: Mechanical Vapour Recompression for Low Carbon Alumina Refining
  what_happened: The cogeneration configuration of a refinery (whether it self-generates
    power from steam turbines) is the single most significant sensitivity in the cost-of-carbon-abatement
    calculation. Low-temperature refineries with cogeneration must import significantly
    more power when MVR replaces the boilers — to replace both the steam and the power
    previously generated — making their carbon abatement cost higher than high-temperature
    refineries that already import power.
  lesson_learnt: Carbon abatement cost calculations for industrial electrification
    must account for the loss of on-site cogeneration capability, which can be the
    dominant economic variable — projects that appear to have a low cost of abatement
    based on fuel cost alone may have materially worse economics once the replacement
    power cost is included.
