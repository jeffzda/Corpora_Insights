  project_name: Mechanical Vapour Recompression for Low Carbon Alumina Refining
  what_happened: MVR economics are highly sensitive to the power price, with the cost
    of carbon abatement ranging from $40 to $100 per tonne of CO2-e depending on power
    price assumptions. Power prices above AU$200/MWh — as experienced in Europe and
    seen in the NEM in mid-2022 — would render MVR uneconomic, representing approximately
    three times the power cost used in the economic analysis.
  lesson_learnt: For industrial electrification projects where energy cost drives
    the business case, stress-test the economics against power price scenarios well
    above forecast — the difference between forecast and stressed power prices can
    make the difference between a viable and unviable project, and this risk should
    be explicitly disclosed to funders.
