  project_name: Mechanical Vapour Recompression for Low Carbon Alumina Refining
  what_happened: The low-pressure, first-stage compressor duty in the MVR design requires
    the largest centrifugal compressors available on the market, operating at the
    limits of current volumetric capacity. Some low-pressure duties push known centrifugal
    compressor capacity to its limits — compressors are either in late development
    or very new to market, and in several instances the second stage normal operating
    duty sits beyond the compressor's optimal design point, resulting in relatively
    low efficiency.
  lesson_learnt: When a technology deployment depends on equipment operating at or
    beyond the current frontier of supplier capability, treat equipment availability
    and performance as a critical project risk requiring early supplier engagement
    and parallel technology testing — do not assume catalogue specifications will
    translate to on-site performance.
