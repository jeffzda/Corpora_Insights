  source_title: MVR Evaporation Feasibility Study
  publish_date: 2022-11
  project_name: Mechanical Vapour Recompression (MVR) for Low Carbon Alumina Refining
    – Wagerup MVR Evaporation Project
  what_happened: The feasibility study identified that a staged decarbonisation pathway
    is required — the two-compressor evaporation demonstration must succeed before
    attempting a 13–17 compressor train for full process heat replacement, which in
    turn must succeed before large-scale refinery-wide rollout across 40–100 compressors;
    skipping stages would not provide adequate de-risking for the required capital
    investment.
  lesson_learnt: Large-scale industrial decarbonisation programmes requiring novel
    technology at high compression ratios (60x versus 2x in the demonstration) must
    be structured as explicitly staged programmes with gate decisions at each scale-up
    step — committing capital to large-scale deployment without intermediate-scale
    validation creates unacceptable technology and financial risk.
