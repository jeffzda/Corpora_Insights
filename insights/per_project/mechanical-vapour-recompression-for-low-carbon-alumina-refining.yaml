- record_id: ARENA-DLV-9251
  source_title: MVR for Low Carbon Alumina Refining Project - Close Out Report
  publish_date: 2024-04
  project_name: MVR for Low Carbon Alumina Refining Project (Wagerup MVR Evaporation
    Project)
  what_happened: The project was closed after being found financially unviable. The
    FEL 3 estimate of AUD $35.5M grew to approximately AUD $79–82M (a cost increase
    of more than 100%) due to extensive design iterations, underdeveloped scope, equipment
    price increases, schedule extension, and unaccounted commissioning costs. The
    project did not proceed to EPC contract award.
  lesson_learnt: Technology development projects implementing a technology for the
    first time carry substantially higher cost and schedule uncertainty than conventional
    projects — they should be assigned a higher AACE contingency class and undergo
    full probabilistic (P10/P50/P90) cost analysis at FEL 3, not just a risk register
    without probabilistic quantification.
  issue_severity: critical
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: internal governance/resourcing
  failure_mode: poor scoping
  outcome_class: discontinued/not progressed
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: An internal health review commenced in March 2023 and three independent
    estimate updates were commissioned; regret costs were halted before EPC contract
    award, limiting final spend to A$8.3M against a sanctioned TIC of $35.5M.
  transferability: broad
  delay_magnitude: 1-3 years
  technology_domain: industrial renewables
