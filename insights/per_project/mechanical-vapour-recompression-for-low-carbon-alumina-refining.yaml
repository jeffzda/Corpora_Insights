- record_id: ARENA-DLV-9256
  source_title: MVR for Low Carbon Alumina Refining Project - Close Out Report
  publish_date: 2024-04
  project_name: MVR for Low Carbon Alumina Refining Project (Wagerup MVR Evaporation
    Project)
  what_happened: Requests for quotation were issued to multiple vendors before design
    was sufficiently progressed, in an attempt to gain schedule advantage. This resulted
    in an extended tender and negotiation period and, given the volume of subsequent
    design changes, posed an unacceptable risk of placing orders for equipment that
    may not ultimately be required. No schedule advantage was achieved.
  lesson_learnt: Issuing vendor enquiry packages before design is sufficiently complete
    does not improve schedule — it extends the tender and negotiation period and creates
    regret cost risk if design changes render early orders redundant; sufficient design
    maturity is a prerequisite for effective procurement.
