  what_happened: MVR load flexibility — the ability to rapidly reduce power consumption
    during peak grid demand events — was identified as a potential source of revenue
    through grid Essential System Services (ESS) and demand side management, as well
    as a means of substantially avoiding reserve capacity charges. The variable-speed
    drives on compressors 1–4 were designed to participate in the ESS market and compensate
    for voltage droop during start-up of large direct-online motors.
  lesson_learnt: Large industrial loads with inherent process flexibility should assess
    and design for grid services participation from early project development — the
    ability to offer demand response and ancillary services can materially improve
    project economics and strengthen the case for grid investment in renewable power
    supply.
