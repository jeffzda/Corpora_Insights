- record_id: ARENA-DLV-9260
  source_title: MVR for Low Carbon Alumina Refining Project - Close Out Report
  publish_date: 2024-04
  project_name: MVR for Low Carbon Alumina Refining Project (Wagerup MVR Evaporation
    Project)
  what_happened: The FEL 3 estimate applied an AACE Class 3 contingency approach,
    which did not correctly account for the immature design in several areas or reflect
    the project's nature as a first-of-a-kind technology development project. The
    estimate was also prepared on a 2021 nominal cost basis; with project delays extending
    to 2023, escalation alone added significant cost before any scope growth was counted.
  lesson_learnt: Technology development and first-of-a-kind projects should be assigned
    a higher AACE contingency class than conventional projects, with the estimate
    prepared in out-turn dollar terms and escalation applied to the full project duration;
    using an inappropriate contingency class systematically understates cost exposure
    for novel technology projects.
