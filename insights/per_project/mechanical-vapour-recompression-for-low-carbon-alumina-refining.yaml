  what_happened: 'Alternative decarbonisation technologies for alumina refining —
    including direct electric heating (electric boilers), green hydrogen, solar thermal,
    geothermal, energy from waste, and biomass — were systematically evaluated and
    found to be inferior to MVR on one or more of: power consumption, capital cost,
