  what_happened: The MVR system adds 3.2 MW load to the refinery power system, which
    can only deliver the required load 95 per cent of the time, requiring the evaporator
    to be shut down during power-constrained periods; the project identified a wide
    operating range (0.4–3.2 MW) enabling load flex to manage grid reserve capacity
    charges and participate in Essential System Services.
  lesson_learnt: Industrial electrification projects should be designed for active
    load management from the outset — variable speed drives enabling wide load modulation
    allow the asset to avoid peak grid capacity charges, participate in demand side
    management and essential system services markets, and operate within existing
    site power constraints, materially improving project economics.
