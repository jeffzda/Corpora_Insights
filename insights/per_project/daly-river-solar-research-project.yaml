- record_id: ARENA-DLV-63522
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: PWC Remote Mini-Grid Program
  what_happened: PWC's financial modelling for solar/diesel hybrid systems identified
    that any decision to upgrade or replace an existing diesel generator to accommodate
    higher solar penetration must have all associated costs included upfront in the
    investment analysis, as these can materially alter the economic case for the hybrid
    system.
  lesson_learnt: Include all integration costs — control system upgrades, switchboard
    expansions, and any generator replacement required to accommodate higher solar
    penetration — in the upfront financial analysis for solar/diesel hybrid systems;
    omitting these 'enabling' costs can produce an overstated investment case.
