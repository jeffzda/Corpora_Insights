- record_id: ARENA-DLV-63506
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: TKLN Solar Project
  what_happened: The Power Reducer system took approximately 20 seconds to convey
    a new setpoint to all string inverters. The GSS responded to every setpoint fluctuation,
    including minor 5kW load switching events, causing frequent and unnecessary power
    reducer step changes that reduced solar output without enhancing system performance.
  lesson_learnt: Design control logic to distinguish between disruptive events requiring
    immediate response (e.g. feeder trips) and minor load fluctuations — responding
    to all setpoint changes indiscriminately caused excessive solar curtailment due
    to the 20-second inverter response latency.
