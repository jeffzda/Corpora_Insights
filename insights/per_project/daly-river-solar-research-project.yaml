- record_id: ARENA-DLV-63519
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: PWC Remote Mini-Grid Program
  what_happened: PWC's experience with solar inverter VAr sharing revealed that many
    solar inverter vendors do not provide the ability to share reactive power proportionally
    with diesel generators. Fixing inverter power factor to a nominal lagging value
    risks forcing the diesel generator into a leading power factor condition at higher
    solar penetrations, which alternator voltage regulators cannot handle.
  lesson_learnt: Do not fix solar inverter power factor to a nominal lagging value
    without careful analysis — at high penetration levels this can force the diesel
    generator into a leading power factor, risking AVR instability. Specify dynamic
    VAr sharing capability in inverter procurement or default to unity power factor
    unless the risk can be technically negated.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id019
  - 59
  evidence_excerpt: It may be tempting to fix the inverter power factor to a nominal
    value such as 0.9 lagging. This should be done with care. If the load power factor
    approached unity, then a fixed inverter power factor could force the generator
    power factor to lead and risk stability. The greater the solar penetration, the
    greater the risk that a fixed lagging inverter power factor will cause stability
    issues.
