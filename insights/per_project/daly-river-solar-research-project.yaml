- record_id: ARENA-DLV-63504
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: TKLN Solar Project
  what_happened: There was a lack of site-specific solar resource data during the
    design stage of the TKLN systems. The only publicly available one-second solar
    output dataset was from a test site in Hawaii, which indicated a worst-case output
    variation of 40% within one minute. The TKLN smoothing system was designed to
    this benchmark. After commissioning, site data showed clouds could reduce solar
    output by up to 80% in six seconds — far exceeding the design basis — resulting
    in station black starts during peak summer conditions at Kalkarindji.
  lesson_learnt: Obtain or generate site-specific high-resolution (sub-second) solar
    variability data before designing high-penetration solar/diesel hybrid systems
    — relying on data from geographically and technically dissimilar reference sites
    led to a smoothing system undersized by a factor of two, causing black start events
    and requiring post-commissioning output curtailment.
  issue_severity: major
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The Kalkarindji system maximum solar output was partially limited
    as a risk mitigation strategy; this was expected to result in less than 0.5 per
    cent yield loss.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id004
  - 42
  - 43
  evidence_excerpt: There was a lack of site specific solar resource reference data
    to use during the design stage of the TKLN solar systems... Since the commissioning
    of the TKLN sites, solar output variability data has become available and is showing
    that clouds can reduce solar output by up to 80 per cent in six seconds. Both
    the magnitude and the rate of solar output reduction experienced at the TKLN sites
    are much greater than those experienced at the Hawaii test site... Experience
    at Kalkarindji has shown that in peak summer conditions when solar output is at
    its maximum, large highly opaque clouds can reduce the solar output beyond the
    capacity of the 'smoothing' system. During the TKLN testing and commissioning
    phase, cloud events such as this resulted in a station black start.
