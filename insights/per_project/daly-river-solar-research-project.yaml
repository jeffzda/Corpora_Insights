- record_id: ARENA-DLV-63512
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: PWC Remote Mini-Grid Program
  what_happened: Diesel minimum load constraints (typically 40–60% of nameplate rating)
    in existing remote mini-grid power stations impose a hard ceiling on achievable
    solar power penetration. An oversized diesel generator relative to community load
    can reduce instantaneous solar penetration to near zero without any solar limitation
    being applied.
  lesson_learnt: When designing solar/diesel hybrid systems, assess diesel generator
    minimum load constraints early and either size the solar array to respect existing
    generator limits, or replace generators with smaller units suited to the hybrid
    load profile — failing to address this constraint can make high solar penetration
    technically impossible with the existing fleet.
