  what_happened: PWC developed the ASIM modelling tool (with ARENA support) to address
    a gap in available hybrid mini-grid simulation tools. Existing tools did not provide
    one-second time-step modelling with open-source control algorithms capable of
    detecting transient stability events such as station blackouts.
  lesson_learnt: Use one-second time-step simulation tools (such as ASIM) rather than
    one-hour or one-minute tools when designing high-penetration solar/diesel hybrid
    systems — sub-minute system instability events including station blackouts are
    invisible to coarser simulation tools and can lead to an underestimate of control
    system and energy storage requirements.
