- record_id: ARENA-DLV-63505
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: TKLN Solar Project
  what_happened: The SMA Power Reducer device used to regulate solar inverter output
    operated in 16 discrete steps (each ~25kW at Kalkarindji). The GSS was designed
    to always select the nearest step below the setpoint, meaning up to half a step
    (~12kW on average) of potential solar output was permanently forgone to avoid
    a 1kW diesel underloading margin.
  lesson_learnt: When specifying solar output regulation devices for high-penetration
    systems, use components capable of continuous linear (not stepped) control — a
    16-step control device caused systematic solar curtailment averaging ~12kW relative
    to setpoint, representing significant lost yield over the project life.
  issue_severity: moderate
  project_type: generation
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The setpoint calculation was modified to round to the best-fit
    power reducer step value and stabilise the setpoint for one minute unless a disruptive
    event occurred, reducing unnecessary step changes.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id005
  - 39
  - 40
  evidence_excerpt: On average this approach would under deliver at a rate of approximately
    12kW (half a power reducer step size) relative to the setpoint. It was recognised
