  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: PWC Remote Mini-Grid Program
  what_happened: PWC identified that high-resolution sub-second solar irradiance data
    is required to appropriately design a solar/diesel hybrid system, because cloud
    events can change the solar resource significantly within a one-minute interval.
    One-minute or one-hour data is insufficient to capture the variability that determines
    energy storage and control system sizing.
  lesson_learnt: Obtain sub-second (≤1 second) solar irradiance data from or near
    the project site before finalising design of any high-penetration solar/diesel
    hybrid system — one-minute data is adequate only for high-level feasibility and
    economics, not for control system or energy storage sizing where transient cloud
    behaviour is critical.
