- record_id: ARENA-DLV-63513
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: PWC Remote Mini-Grid Program
  what_happened: Rapid solar output reduction during cloud events (the intermittency
    constraint) places a hard limit on solar penetration in systems without energy
    storage, because diesel generators cannot start and synchronise fast enough to
    cover the load previously served by solar during a cloud event.
  lesson_learnt: In medium-to-high penetration solar/diesel systems, provide either
    energy storage (for smoothing) or active load control to bridge the gap between
    solar output collapse and diesel generator response — without one of these mechanisms,
    system stability constrains achievable solar penetration to the static spinning
    reserve margin.
