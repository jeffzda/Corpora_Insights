- record_id: ARENA-DLV-63515
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: PWC Remote Mini-Grid Program
  what_happened: The sheer remoteness of NT mini-grid sites creates significant additional
    O&M costs for solar systems, as there is limited local technical support and staff
    or contractors must be mobilised to conduct maintenance work. Different solar
    technologies have materially different O&M requirements, affecting overall system
    economics.
  lesson_learnt: Factor in full remote mobilisation costs when comparing solar technology
    options for remote mini-grids — technologies with higher O&M complexity (e.g.
    tracking arrays, CPV) may be rendered uneconomic by the cost of mobilising specialist
    technicians to remote locations, even if they offer higher energy yield.
