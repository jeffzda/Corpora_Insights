  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Control logic was updated so the setpoint remained stable for
    one minute unless a disruptive event occurred; for feeder sheds the system reverted
    to a simple difference calculation for dynamic response. Changes were modelled
    and validated using real system data before implementation.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
