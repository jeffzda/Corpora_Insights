- record_id: ARENA-DLV-63530
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: PWC Remote Mini-Grid Program
  what_happened: Distributed rooftop solar (customer-owned systems) in small remote
    communities does not benefit from geographic diversity to smooth intermittent
    output — community footprints are too small for spatial averaging to reduce variability.
    These systems also consume spinning reserve margins without any communications
    link to the power station, constraining the headroom available for centralised
    solar/diesel hybrid design.
  lesson_learnt: Account for the spinning reserve margin already consumed by existing
    distributed generation (customer-owned rooftop solar) before sizing a centralised
    solar/diesel hybrid system — in small remote communities, distributed solar acts
    as uncontrolled negative load and its intermittency cannot be smoothed by geographic
    diversity, reducing the headroom available for additional centralised solar.
  issue_severity: moderate
