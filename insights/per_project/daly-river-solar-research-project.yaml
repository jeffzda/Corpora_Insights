- record_id: ARENA-DLV-63503
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: TKLN Solar Project
  what_happened: The PPA was structured around one-minute intervals for rate-of-change
    and penalty calculations, which meant the Grid Stability System (GSS) control
    loops were not optimised for fast sub-minute responses. Early field experience
    showed latency between solar output reduction and GSS response, causing generator
    overload risk before GSS support was received.
  lesson_learnt: Structure PPA performance calculations and penalty schemes at the
    timescale of the actual solar variability events (sub-second to seconds), not
    at one-minute intervals — one-minute PPA intervals resulted in control loops that
    were too slow to prevent generator overload during rapid cloud events.
