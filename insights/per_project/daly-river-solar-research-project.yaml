  project_name: TKLN Solar Project
  what_happened: Solar output performance monitoring under the PPA required accurate
    irradiance measurement, but the relationship between solar output and irradiance
    alone was found to be very difficult to model accurately. The PPA monitoring solution
    was not sufficiently specified with acceptable error tolerance at the outset.
  lesson_learnt: In a PPA context, tightly specify the solar output monitoring solution
    including acceptable error tolerance from the outset — irradiance alone is insufficient
    to accurately model solar output, and an under-specified monitoring arrangement
    creates commercial and contractual risk.
