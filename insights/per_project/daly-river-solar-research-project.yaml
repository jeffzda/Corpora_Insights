- record_id: ARENA-DLV-63520
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: PWC Remote Mini-Grid Program
  what_happened: PWC found that tracking solar arrays — while offering higher yield
    — create additional risk of solar output intermittency in the Top End of the NT,
    because tracking arrays produce highest output in the mid-to-late afternoon when
    cloud events are most common. Fixed arrays produce peak output at midday, providing
    a partial hedge against afternoon intermittency.
  lesson_learnt: In regions prone to afternoon cloud events (such as the NT Top End),
    prefer fixed-tilt arrays over tracking arrays for solar/diesel hybrid systems
    — fixed arrays provide a natural hedge against peak intermittency risk and avoid
    the additional O&M cost of tracking mechanisms in remote locations.
