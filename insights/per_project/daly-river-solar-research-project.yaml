- record_id: ARENA-DLV-63521
  source_title: Solar Diesel Mini Grid Handbook 1st Edition
  publish_date: null
  project_name: PWC Remote Mini-Grid Program
  what_happened: PWC found that for remote solar/diesel hybrid systems, using a large
    number of small inverters (rather than a small number of large inverters) was
    preferable from an O&M perspective. Large single-inverter failures in a remote
    context cause major output loss and long wait times before qualified technicians
    can mobilise to site.
  lesson_learnt: For remote mini-grid solar systems, prefer a distributed inverter
    configuration with smaller, interchangeable units over large centralised inverters
    — the ability to swap failed units with on-site spares minimises downtime and
    output loss, offsetting the slight efficiency penalty of smaller units.
