  what_happened: The concept study identified that pumped hydro development in Tasmania
    is subject to at least twelve separate State and Commonwealth Acts covering environmental,
    heritage, water, land, and planning approvals, creating a complex multi-agency
    regulatory pathway that must be navigated from concept stage.
  lesson_learnt: Pumped hydro developers in Tasmania should map the full multi-Act
    approvals pathway (at minimum twelve Acts including EPBC, Land Use Planning, Water
    Management, Threatened Species, and Aboriginal Heritage) at concept stage and
    engage regulatory stakeholders early to identify critical path approvals and avoid
    late-stage surprises.
