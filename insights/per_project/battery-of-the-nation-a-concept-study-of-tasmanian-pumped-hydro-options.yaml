  what_happened: The concept study applied a four-stage GIS-based screening methodology
    that reduced an initial list of over 2,000 potential pumped hydro sites to 14
    selected options for pre-feasibility assessment within the project's scope and
    timeline, demonstrating the efficiency of structured staged screening for large-scale
    storage site selection.
  lesson_learnt: A structured staged screening methodology — combining GIS-based filtering
    with progressive application of technical, environmental, economic, and multi-criteria
    constraints — is an effective and time-efficient approach for reducing large pumped
    hydro site universes to a manageable pre-feasibility shortlist; this approach
    is replicable for other regions with large numbers of topographic candidates.
