- record_id: ARENA-DLV-25457
  source_title: Battery of the Nation – Tasmanian Pumped Hydro in Australia's Future
    Electricity Market. Concept Study Knowledge Sharing Report
  publish_date: 2018-04
  project_name: Battery of the Nation – Tasmanian Pumped Hydro Concept Study
  what_happened: The world's only seawater pumped hydro project (Yanbaru, Japan) ceased
    operation in 2016 due to unfavourable market conditions, having been built primarily
    because of a lack of inland sites — a constraint that does not apply in Tasmania.
  lesson_learnt: Seawater pumped hydro carries significant additional technology,
    corrosion, and market risk; where ample freshwater inland sites exist, seawater
    options should be excluded from concept screening to avoid diverting development
    resources to higher-risk configurations.
