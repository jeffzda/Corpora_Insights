  source_title: Battery of the Nation – Tasmanian Pumped Hydro in Australia's Future
    Electricity Market. Concept Study Knowledge Sharing Report
  publish_date: 2018-04
  project_name: Battery of the Nation – Tasmanian Pumped Hydro Concept Study
  what_happened: Previous pumped hydro studies for Tasmania were conducted without
    a future market context, resulting in a different and incomplete set of potential
    project sites being identified each time. This concept study, by contrast, incorporated
    future NEM market scenarios into the screening framework from the outset.
  lesson_learnt: Concept studies for large-scale storage should be grounded in a future
    market context from the start — studies conducted without this context produce
    site lists that do not reflect viable investment opportunities and must be substantially
    redone.
