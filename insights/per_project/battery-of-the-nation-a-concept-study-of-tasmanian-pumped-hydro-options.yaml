- record_id: ARENA-DLV-25474
  source_title: Battery of the Nation – Tasmanian Pumped Hydro in Australia's Future
    Electricity Market. Concept Study Knowledge Sharing Report
  publish_date: 2018-04
  project_name: Battery of the Nation – Tasmanian Pumped Hydro Concept Study
  what_happened: The concept study found that fixed-speed reversible pump turbines,
    while the most common and economical choice for large-scale pumped hydro, cannot
    vary their pumping load — a significant operational limitation when providing
    grid frequency regulation services while in pumping mode.
  lesson_learnt: Project developers targeting ancillary service revenue streams from
    pumped hydro (particularly regulation FCAS in pumping mode) must specify variable-speed
    units at design stage — fixed-speed machines cannot provide this service and retrofitting
    after construction is impractical; the 30%+ cost premium must be assessed against
    the expected FCAS revenue.
