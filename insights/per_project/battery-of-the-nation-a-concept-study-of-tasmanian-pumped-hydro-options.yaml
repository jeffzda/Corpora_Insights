- record_id: ARENA-DLV-25456
  source_title: Battery of the Nation – Tasmanian Pumped Hydro in Australia's Future
    Electricity Market. Concept Study Knowledge Sharing Report
  publish_date: 2018-04
  project_name: Battery of the Nation – Tasmanian Pumped Hydro Concept Study
  what_happened: The ROAM Consulting 2012 study, commissioned for AEMO, applied a
    fixed 500 MW installed capacity assumption to all potential sites and used a cost
    assumption of $4.9M/MW, which was significantly higher than international benchmarks
    and resulted in pumped hydro appearing less competitive than other technologies
    in AEMO's 100% Renewable Study.
  lesson_learnt: Cost assumptions in pumped hydro studies must be calibrated against
    international benchmarks and site-specific parameters — generic high-level assumptions
    that do not account for use of existing infrastructure can systematically bias
    results against pumped hydro and mislead policy and investment decisions.
  issue_severity: moderate
  project_type: storage
  project_scale_band: concept/feasibility
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The current concept study developed site-specific cost estimates
    based on Entura's engineering experience and international benchmarking, producing
    a cost range of $1.1–$2.3m/MW — substantially lower than the ROAM assumption.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id006
  - 15
  - 16
  evidence_excerpt: It seems the cost estimation was undertaken with significant conservatism
    and resulted in favour of other technologies considered in AEMO's 100% Renewable
    Study. AEMO's report assumes $4.9M/MW for new pumped storage plants.
