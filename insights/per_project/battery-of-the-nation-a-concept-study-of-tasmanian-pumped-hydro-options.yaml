  evidence_excerpt: The main issue facing developers trying to prove the viability
    of a new pumped hydro project is that a sufficient price differential is required
    to pay for the pumping and to account for the efficiency losses in transmission,
    pumping and generation... This is particularly true where proposed developments
    are 'stand-alone' and cannot be optimised as part of a generation portfolio.
