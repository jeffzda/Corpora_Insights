- record_id: ARENA-DLV-25475
  source_title: Battery of the Nation – Tasmanian Pumped Hydro in Australia's Future
    Electricity Market. Concept Study Knowledge Sharing Report
  publish_date: 2018-04
  project_name: Battery of the Nation – Tasmanian Pumped Hydro Concept Study
  what_happened: The concept study found that pumped hydro requires a sufficient price
    differential between peak generation periods and off-peak pumping periods to cover
    both variable pumping costs and a margin to repay heavy capital investment, which
    is particularly challenging for standalone projects not optimised within a broader
    generation portfolio.
  lesson_learnt: Standalone pumped hydro projects face a structurally harder revenue
    challenge than those integrated within a diversified generation portfolio — project
    developers should assess whether portfolio integration or co-location with complementary
    generation assets (e.g. existing hydro) can improve revenue stack before committing
    to standalone development.
