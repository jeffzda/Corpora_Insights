  publish_date: 2018-04
  project_name: Battery of the Nation – Tasmanian Pumped Hydro Concept Study
  what_happened: Projects with estimated unit costs above $2.5m/MW were excluded from
    the shortlist during Stage 3 screening on the grounds of likely financial infeasibility,
    and projects with less than six hours energy storage were excluded because minimum
    firming requirements driven by mainland rooftop solar suppression periods demand
    at least six hours of storage.
  lesson_learnt: Concept-stage screening criteria for pumped hydro should include
    both a unit cost ceiling (around $2.5m/MW in the Australian context) and a minimum
    storage duration threshold (six hours) tied to the firming requirements of the
    target market — these filters efficiently eliminate unviable options without detailed
    engineering.
