  what_happened: Capital cost estimation for pumped hydro prior to completion of site-specific
    concept studies is unreliable because geological conditions of dam foundations,
    reservoir rims, water conveyances, and underground powerhouses cannot be characterised
    at GIS screening level, creating potentially misleading cost estimates.
