  what_happened: The current NEM market design does not adequately value the full
    suite of services pumped hydro can provide, making it difficult to finance new
    pumped hydro investment based on energy arbitrage revenues alone.
  lesson_learnt: Pumped hydro project business cases must account for market design
    risk — the current NEM revenue framework does not remunerate all ancillary and
    system services that pumped hydro can provide, and this gap should be explicitly
    modelled as a commercial risk in any feasibility study.
