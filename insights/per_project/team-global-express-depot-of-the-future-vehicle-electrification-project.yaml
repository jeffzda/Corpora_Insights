- record_id: ARENA-DLV-68262
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: Team Global Express Depot of the Future Vehicle Electrification Project
  what_happened: The Depot of the Future project required ARENA funding of $20.1 million
    out of a total $42 million project cost (leverage ratio approximately 1:1), which
    is significantly below the expected commercialisation leverage ratio band of 1:2–1:3.
    The proponent confirmed the project would not have been possible without ARENA's
    funding.
  lesson_learnt: Commercial-scale BEV heavy vehicle fleet deployments remain economically
    marginal without substantial grant support, attracting leverage ratios well below
    what is typical for EV commercialisation projects — ARENA's funding criteria for
    large fleet projects should account for the higher capital intensity and lower
    private co-funding capacity of the heavy freight sector relative to light vehicle
    or charging infrastructure projects.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: industrial operator
  delay_category: financing/commercial close
  failure_mode: commercial & market
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: ARENA provided $20.1 million in funding, making the project viable
    despite the below-benchmark leverage ratio.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id003
  - 64
  evidence_excerpt: The leverage ratio for the project was almost 1:1. The total cost
    of the project was $42 mil with 48% of funding sourced from ARENA ($20 mil)...
    Applicant confirmed that they would not have been able to do the project without
    the ARENA funding.
