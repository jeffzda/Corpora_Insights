- record_id: ARENA-DLV-68261
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: Team Global Express Depot of the Future Vehicle Electrification Project
  what_happened: The 60 BEV trucks allocated to the Depot of the Future project were
    found to be currently underutilised. Despite representing approximately 60% of
    low-emission truck sales in Australia in 2022, the project identified that further
    work is needed to understand how to better utilise the existing technology.
  lesson_learnt: Procuring BEV heavy vehicles does not automatically deliver utilisation
    outcomes — fleet electrification projects should build operational integration
    plans, route optimisation analysis, and driver acceptance programmes into project
    scope to ensure deployed vehicles are actually utilised at target rates.
