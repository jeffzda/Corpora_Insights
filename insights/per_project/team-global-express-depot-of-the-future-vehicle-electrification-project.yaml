- record_id: ARENA-DLV-68260
  source_title: Evaluation of ARENA's transport strategic priority
  publish_date: 2024-11
  project_name: Team Global Express Depot of the Future Vehicle Electrification Project
  what_happened: The Depot of the Future project integrated 60 BEV trucks into Team
    Global Express's logistics fleet — the largest single trial of commercial EVs
    in Australia's logistics sector. The project required changes to Australian Design
    Rules (ADR), specifically a Volvo eFL width increase and steer axle mass increase,
    demonstrating that regulatory standards were not aligned with the physical specifications
    of available BEV heavy vehicles at project commencement.
  lesson_learnt: Large-scale BEV heavy vehicle fleet deployments are likely to encounter
    misalignment between existing Australian Design Rules and the specifications of
    available electric vehicles — proponents should conduct ADR compliance reviews
    before vehicle procurement and engage the relevant authority early to initiate
    rule amendments, as this process can affect vehicle availability and project timelines.
  issue_severity: moderate
