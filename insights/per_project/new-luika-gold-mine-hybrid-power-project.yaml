- record_id: ARENA-DLV-71086
  source_title: Hybrid Power Generation for Australian Off-Grid Mines
  publish_date: 2018-06
  project_name: New Luika Gold Mine Hybrid Power Project
  what_happened: New Luika gold mine in Tanzania progressively increased its renewable power fraction over five years, transitioning from a leased 5.4 MW system in 2012 to a leased 4.9 MW system in 2014
    and ultimately to an owner-operated 7.7 MW system in 2017 financed by a $10M bank loan, demonstrating a staged adoption pathway.
  lesson_learnt: A staged approach to hybrid power adoption — starting with a leased low-penetration system before transitioning to owner-operated higher-capacity infrastructure — reduces technology and
    financial risk while building operator capability and bankability evidence for subsequent scale-up.
