- record_id: ARENA-DLV-50011
  source_title: Ocean Energy Report by Seanergy and Ernst and Young
  publish_date: 2016-06
  project_name: Carnegie Wave Energy — International Market Entry (Mauritius)
  what_happened: Carnegie Wave Energy identified that a key challenge for international
    ocean energy projects, such as its Mauritius project, was not only the technical
    engineering design but also securing an offtake agreement with local authorities,
    particularly where the local policy framework did not allow independent energy
    providers to enter the local market.
  lesson_learnt: Before investing in detailed engineering for international ocean
    energy deployments, developers must confirm that the host country's regulatory
    framework permits independent power producers to operate and sell electricity;
    policy barriers to IPP participation can be a project-blocking constraint that
    no amount of technical preparation can resolve.
