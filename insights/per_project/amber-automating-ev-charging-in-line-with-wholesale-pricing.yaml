  what_happened: GPS coordinates retrieved from the Tesla API for determining whether
    a vehicle was at the customer's home were found to be unreliable — an initial
    100m radius was insufficient for edge cases including large properties, incorrect
    stored coordinates, and stale GPS data.
  lesson_learnt: When using vehicle API GPS data to determine home presence, use a
    radius of at least 300m to account for large properties, database coordinate inaccuracies,
    and stale GPS readings — and provide a user override in the app to handle cases
    the algorithm cannot resolve.
