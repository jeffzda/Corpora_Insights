    programme addressing the specific knowledge gaps that drive consumer hesitation
    — availability, vehicle compatibility, cost, home requirements, and battery warranty
    — as unaddressed uncertainty leads customers to defer EV purchases and reduces
    the addressable participant pool for trials.
