- record_id: ARENA-DLV-64707
  source_title: 'Amber - Automatic EV Charging in line with Wholesale Pricing, Lessons
    Learnt Report #1'
  publish_date: 2024-10
  project_name: Amber EV Automation Trial
  what_happened: Standard EVSE hardware communicating via OCPP does not share state
    of charge (SOC) data with the controlling software, preventing the development
    of SOC-guarantee features such as 'ensure the car is charged to X% by Y time'.
  lesson_learnt: Do not design EV smart charging product features that depend on SOC
    data when using OCPP-connected chargers — OCPP does not expose SOC, so either
    use vehicle API integration or design features that deliver value through price-based
    and solar-based charging logic that does not require SOC knowledge.
