  what_happened: The absence of a universal communication standard between EVs and
    V2G chargers means interoperability is currently limited to closed ecosystems
    — specific car brands only work with specific chargers — and each DNSP has its
    own compliance standards, preventing any-charger-any-car-any-network operation.
  lesson_learnt: V2G trial design must account for the lack of interoperability between
    vehicles, chargers, and networks — until ISO 15118/20 is universally adopted,
    trials must be scoped to compatible vehicle–charger pairs within networks that
    have agreed compliance pathways, rather than assuming open interoperability.
