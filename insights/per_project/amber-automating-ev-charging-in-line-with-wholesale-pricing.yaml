- record_id: ARENA-DLV-16954
  source_title: Amber - Automating EV Charging in line with Wholesale Pricing - Lessons
    Learnt Report 2
  publish_date: 2025-04
  project_name: Automating EV Charging in line with Wholesale Pricing
  what_happened: Tesla announced in December 2024 that its previously free Command
    and Fleet APIs would move to a paid model. Amber had built its entire EV automation
    product (A4EV) using the Command API via polling; the first bill under this approach
    would have been 40 times more expensive than using the Fleet API for telemetry
    instead.
  lesson_learnt: When building an automation product dependent on a third-party API,
    assess the long-term cost structure of each available API endpoint before committing
    to an architecture — building on a free API that later shifts to paid can force
    a costly and disruptive platform rewrite; using the purpose-built telemetry endpoint
    (Fleet API) rather than the control endpoint (Command API) for data collection
    reduced costs to approximately 2.5% of the worst-case scenario.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: internal governance/resourcing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Amber migrated from polling via the Command API to receiving
    telemetry via the Fleet API; the first paid bill under the new architecture was
    approximately 2.5% of the cost under the original approach.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id004
  - 16
  - 17
  evidence_excerpt: Using Command API, (not fleet API) our first bill would have been
    40 times more expensive... Using Fleet API (for telemetry) and Command API (for
    charge/discharge/wake), our first paid bill was around 2.5% of the potential cost
    i.e. most expensive case scenario.
  confidence_note: delay_category assigned as internal governance/resourcing because
