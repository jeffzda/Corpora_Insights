  what_happened: New CSIP-Aus flexible export requirements mean V2G chargers will
    need to dynamically adjust export levels based on grid conditions, and this requires
    on-site coordination with home solar systems, adding a further layer of technical
    complexity to V2G deployment beyond basic charger certification.
  lesson_learnt: V2G project design must incorporate CSIP-Aus compliance from the
    outset — flexible export requirements will mandate that V2G chargers communicate
    with and respond to DNSP signals, which requires on-site HEMS coordination with
    solar; projects that do not plan for this integration will face rework when DNSPs
    enforce CSIP-Aus compliance conditions.
