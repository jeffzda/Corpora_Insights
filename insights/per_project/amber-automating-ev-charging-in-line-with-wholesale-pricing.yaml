  what_happened: The Price Paid metric, while intuitive for customers, uses a complex
    calculation (incorporating solar at 0 c/kWh via a 'last on the stack' rule) that
    does not align with line items on the customer's monthly electricity bill, creating
    a risk of customer confusion.
  lesson_learnt: When designing customer-facing outcome metrics for complex DER optimisation
    products, validate that the metric's calculation aligns with bill line items or
    proactively explain the discrepancy — a metric that doesn't match the bill can
    erode customer trust even when the outcome is genuinely favourable.
