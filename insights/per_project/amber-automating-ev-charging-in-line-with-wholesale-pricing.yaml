  what_happened: As home battery sizes increase, the battery-dominant coordination
    logic risks leaving customers with little or no EV solar charging opportunity
    — the battery absorbs all available solar, then dispatches at peak, blocking the
    EV from charging at all during those windows.
  lesson_learnt: Battery-EV coordination algorithms should include a customer-configurable
    or adaptive priority mechanism so that as batteries scale up, EV solar charging
    is not entirely locked out — consider minimum EV charging allocations or time-based
    splits to balance both assets.
