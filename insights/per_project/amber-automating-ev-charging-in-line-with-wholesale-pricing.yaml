    Learnt Report 2
  publish_date: 2025-04
  project_name: Automating EV Charging in line with Wholesale Pricing
  what_happened: Amber selected OCPP as its primary communication protocol for smart
    charger integration rather than charger-specific APIs, on the basis that OCPP
    compatibility is near-universal across charger brands, making future integrations
    with additional charger models significantly easier.
  lesson_learnt: For smart charging platforms targeting multiple charger brands, prioritise
    OCPP as the integration layer over proprietary APIs — a single OCPP integration
    creates a reusable foundation, while charger-specific APIs require individual
    development effort for each new charger and may be added later once the OCPP integration
    is mature.
