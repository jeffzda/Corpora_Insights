    still require network exemptions to connect, as they have not yet completed certification
    against AS/NZS 4777.2 and Clean Energy Council listing requirements; this is constraining
    Amber's ability to commence Phase 2 of the project and is likely to restrict the
    trial to one or two charger brands and select EV models.
