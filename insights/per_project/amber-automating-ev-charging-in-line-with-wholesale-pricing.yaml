- record_id: ARENA-DLV-64706
  source_title: 'Amber - Automatic EV Charging in line with Wholesale Pricing, Lessons
    Learnt Report #1'
  publish_date: 2024-10
  project_name: Amber EV Automation Trial
  what_happened: Running separate software systems for EV charging and home battery
    optimisation created a risk of 'duelling control' where both systems competed
    over the same energy resources, including scenarios where the EV drew from the
    home battery unintentionally and solar energy was curtailed instead of being used
    for EV charging.
  lesson_learnt: When deploying smart charging software alongside an existing home
    battery management system, build the systems in parallel with inter-system communication
    rather than stacking them — each system should maintain control of its own domain
    and be able to request preferred behaviour from the other system, avoiding complex
    unresolved edge cases from integrated control.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Built EV charging software as a parallel system to the existing
    battery optimisation software, with each system able to request preferred behaviour
    from the other for a specified period, avoiding direct competition for shared
    resources.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id035
  - 13
  evidence_excerpt: When two devices in the home are being controlled by competing
    software solutions, there is a potential for dueling control. Although we currently
    optimise compatible batteries through Amber for Batteries, we have intentionally
    built our EV charging software in parallel, rather than on top. This has allowed
    us to avoid complex edge cases until we can determine the best product solution
    for customers with batteries.
