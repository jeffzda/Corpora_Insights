  evidence_excerpt: Customers told us that splitting control between Amber (price)
    and Zappi (solar) felt clunky and error‑prone (e.g., user sets ECO+ in Zappi but
    Amber triggers price‑based charging)... Amber removed this 'two‑brain' control
    by letting Amber set Zappi modes directly.
