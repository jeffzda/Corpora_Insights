- record_id: ARENA-DLV-16956
  source_title: Amber - Automating EV Charging in line with Wholesale Pricing - Lessons
    Learnt Report 2
  publish_date: 2025-04
  project_name: Automating EV Charging in line with Wholesale Pricing
  what_happened: When automating excess solar consumption for Connected Solar customers,
    Amber discovered that telemetry from different hardware vendors (solar inverter,
    consumption meter, EV) arrives at different rates and with different delays, causing
    the automation system to issue incorrect charging commands based on stale or inconsistent
    data — resulting in grid draw instead of genuine solar self-consumption.
  lesson_learnt: Multi-source home energy automation systems must implement a data
    consistency check before issuing control commands — when telemetry from the inverter,
    consumption meter, and EV is not temporally aligned, the system will calculate
    incorrect available solar surplus and command the wrong charge rate; gate each
    new command on confirmed receipt of fresh data from all sources.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Amber introduced a 'consistent data' check using timestamps from
    each telemetry source; after issuing a charging command, the system waits until
    fresh data has been received from each source (solar inverter, consumption meter,
    EV) before issuing the next command.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages: &id006
  - 17
  - 18
  evidence_excerpt: Different hardware vendors collect telemetry data at different
    rates. Some vendors collect data in near real time, others only collect data once
    every few minutes... When this data is inconsistent, we will direct vehicles to
    make charging decisions that are incorrect... In order to avoid the scenario above
    (with inconsistent data), we introduced the concept of consistent data. This uses
    the timestamp received from each piece of telemetry.
  confidence_note: lifecycle_phase set to commissioning/integration because the issue
    was discovered during early operational optimisation of newly installed systems,
    before the product was stable; could also be read as operations.
