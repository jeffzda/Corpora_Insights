  project_name: Amber Electric - Automating EV Charging in line with Wholesale Pricing
  what_happened: Price Paid (c/kWh) analysis across the trial cohort showed that customers
    with solar achieved a mean price of 6.7 c/kWh versus 10.4 c/kWh for non-solar
    customers, with the best 10% of solar customers paying 0 c/kWh, demonstrating
    that equipment configuration materially drives financial outcomes.
  lesson_learnt: Use a simple, single 'Price Paid' metric (c/kWh) to give customers
    direct feedback on smart charging performance; segment defaults and nudges by
    equipment type (solar vs. no solar) and state, as geography and on-site generation
    have a larger impact on charging cost than time-of-use scheduling alone.
