  what_happened: EV manufacturer warranties excluding V2G use remained the primary
    barrier to broad V2G adoption in the trial; most automakers have not yet formalised
    V2G warranty positions in Australia, partly because Australia is a small market
    that is deprioritised for new product rollouts requiring additional hardware (ISO
    15118-20).
  lesson_learnt: Proactively negotiate V2G warranty exemptions with vehicle manufacturers
    before recruiting customer participants — the absence of warranty cover is the
    primary adoption barrier, and trial-specific exemption agreements (as achieved
    with BYD) are achievable but require early relationship-building with OEM teams.
