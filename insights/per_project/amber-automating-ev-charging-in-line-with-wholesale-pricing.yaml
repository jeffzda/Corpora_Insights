  what_happened: During EVSE commissioning, Amber established a process where chargers
    were onboarded into its OCPP environment either by the on-site installer or remotely
    by the charger manufacturer immediately after installation, ensuring the charger
    was fully commissioned shortly after physical installation and delivering a positive
    customer experience.
  lesson_learnt: Design the commissioning handoff so that OCPP onboarding occurs on
    the day of physical installation — either by training installers to complete onboarding
    on-site or by coordinating with the charger manufacturer to do it remotely — to
    avoid a gap between hardware installation and functional availability that degrades
    customer experience.
