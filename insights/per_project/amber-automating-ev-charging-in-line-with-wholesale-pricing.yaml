  secondary_failure_mode: poor scoping
  intervention_note: Amber adopted the Fleet API for telemetry reception and retained
    the Command API only for charge/discharge/wake commands, reducing per-user API
    costs significantly.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
