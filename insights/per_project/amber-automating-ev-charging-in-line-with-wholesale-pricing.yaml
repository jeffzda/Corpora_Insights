- record_id: ARENA-DLV-37151
  source_title: 'Amber Electric - Automating EV Charging in line with Wholesale Pricing
    - Lessons Learnt Report #3'
  publish_date: 2025-10
  project_name: Amber Electric - Automating EV Charging in line with Wholesale Pricing
  what_happened: Customers using both Amber (price-based charging) and Zappi (solar-only
    ECO/ECO+) had to manage two separate apps, creating control conflicts — for example,
    Zappi's solar mode was unaware of negative export prices, causing unintended grid
    spill, while Amber's price-based commands overrode Zappi's solar logic unexpectedly.
  lesson_learnt: When integrating cloud-based price optimisation with hardware-native
    solar charging, designate a single control brain. Have the cloud platform set
    the hardware mode (e.g. ECO+ vs FAST) rather than both systems issuing independent
    commands — this eliminates mode conflicts and support tickets while preserving
    hardware advantages such as millisecond-level solar following.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated integration
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Amber redesigned the integration so the Amber algorithm issues
    mode directives (Charge from solar, Charge at max rate, Stop) that are translated
    into native Zappi modes, making Amber the single control brain while Zappi handles
    local power matching.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id014
  - 10
