- record_id: ARENA-DLV-16955
  source_title: Amber - Automating EV Charging in line with Wholesale Pricing - Lessons
    Learnt Report 2
  publish_date: 2025-04
  project_name: Automating EV Charging in line with Wholesale Pricing
  what_happened: Amber's transition from Tesla's Command API (polling) to the Fleet
    API (push telemetry) required reconfiguring each enrolled Tesla vehicle to send
    its telemetry to Amber's servers — a significant technical change involving both
    platform re-architecture and per-vehicle configuration, representing substantial
    engineering rework mid-project.
  lesson_learnt: When designing a vehicle API integration, prefer push-based telemetry
    (Fleet API) over polling (Command API) from the outset — a forced mid-project
    migration from polling to push required re-architecture of the platform and per-vehicle
    reconfiguration of all enrolled vehicles, adding complexity and engineering cost
    that could have been avoided with upfront architecture decisions.
