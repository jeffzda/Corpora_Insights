    interest and 88 proactively stated they were deferring an EV purchase until a
    V2G-capable vehicle became available, demonstrating strong latent consumer demand
    but also significant customer knowledge gaps — the most common questions concerned
    availability timing, compatible vehicles, costs, home upgrade requirements, and
    battery warranty impacts.
