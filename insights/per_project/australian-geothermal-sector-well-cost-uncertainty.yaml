- record_id: ARENA-DLV-72008
  source_title: Australian Energy Resource Assessment — Second Edition, 2014
  publish_date: '2014'
  project_name: Australian Geothermal Sector — Well Cost Uncertainty
  what_happened: Well completion costs for deep geothermal wells in Australia have
    ranged from A$8–51 million per well (4–5 km depth), representing a more than six-fold
    variance that makes project economics highly uncertain and difficult to model
    for investment decisions.
  lesson_learnt: Deep geothermal project cost models carry extreme uncertainty in
    well cost assumptions — the six-fold range in actual completed well costs (A$8–51
    million) means that project feasibility assessments should apply conservative
    well cost assumptions and explicit sensitivity analysis, as well cost overruns
    are the primary driver of project unviability.
