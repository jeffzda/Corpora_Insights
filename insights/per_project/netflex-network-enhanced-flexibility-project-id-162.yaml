- record_id: ARENA-DLV-72271
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects - First Edition Results'
  publish_date: '2015'
  project_name: NETFLEX – Network-enhanced flexibility (Project ID 162)
  what_happened: Elia System Operator deployed Dynamic Line Rating (DLR) forecasting and a Smart Controller coordinating phase-shifting transformers and HVDC links on Belgian transmission infrastructure,
    achieving an average 10–15% higher transmission capacity and enabling greater wind penetration without new physical infrastructure.
  lesson_learnt: Dynamic line rating combined with smart power flow controllers can unlock 10–15% additional transmission capacity for wind integration at a fraction of the cost of new lines or cables —
    project developers and network operators facing wind connection constraints should evaluate DLR and power flow control devices before committing to costly infrastructure upgrades.
