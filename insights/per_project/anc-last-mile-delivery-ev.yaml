- record_id: ARENA-DLV-6901
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: EV real-world range fell significantly short of pre-deployment projections
    — LDV vehicles achieved approximately 200km versus the 250km+ projection (a 20%+
    reduction), and JAC trucks achieved approximately 150km versus 200km+ (a 25%+
    reduction). The shortfall was driven by tail-lift energy draw, stop-start urban
    traffic cycles, and climate control loads.
  lesson_learnt: Do not rely on manufacturer range specifications for route planning
    in last-mile logistics — real-world operational conditions including tail-lift
    use, air conditioning, and urban driving patterns can reduce range by 20–25%;
    build this buffer into route design and charging schedules from the outset.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: ANC introduced route-matching tools to align specific vehicles
    with specific delivery runs based on derated range and payload, and confirmed
    daily mid-shift top-up charging as operationally necessary.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages:
