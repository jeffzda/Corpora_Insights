- record_id: ARENA-DLV-6903
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Vehicles frequently returned from daily operations with only approximately
    10% state of charge (SOC) against the pre-deployment assumption of 20% return
    SOC, requiring immediate recharging and creating scheduling pressure on depot
    charging infrastructure.
  lesson_learnt: Plan depot charging capacity assuming vehicles will return with lower
    state of charge than anticipated — a 10% buffer rather than 20% means faster turnaround
    charging is needed, which requires higher-capacity depot chargers and potentially
    affects overnight charging schedules.
