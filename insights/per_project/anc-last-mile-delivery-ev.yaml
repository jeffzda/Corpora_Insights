  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: An ANC client independently installed 54 chargers across their national
    sites by May 2025 and absorbed 24 of the 34 EVs delivered under M3. This led Principal
    Contractors (PCs) to become reluctant to invest in their own charging infrastructure,
    relying instead on client installations. PCs also refused to fund home-based charger
    installations for individual delivery professionals, citing driver turnover risk
    and asset depreciation concerns.
  lesson_learnt: Clarify charging infrastructure ownership and funding responsibilities
    across all parties — client, principal contractor, and delivery professional —
    before vehicle deployment begins. Where a major client self-funds infrastructure,
    formalise how this is counted toward project targets and ensure it does not inadvertently
    crowd out investment by principal contractors in their own independent charging
    capacity.
