  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Subcontractor delivery professionals reported measurable cost savings
    from EV operation compared to diesel — approximately $20–$30 per day in energy
    costs versus approximately $60 per day for diesel on equivalent delivery runs.
    One delivery professional reported business growth attributable to EV adoption,
    scaling from sole trader to operating five to six vehicles.
  lesson_learnt: The operational cost advantage of EVs over diesel is real and demonstrable
    to subcontractors when experienced first-hand. Peer-based evidence sharing — including
    documented running cost comparisons — is an effective tool for overcoming initial
    resistance to EV adoption among owner-operators who are primarily motivated by
    income certainty.
