- record_id: ARENA-DLV-6911
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: The market price of green certificates (e.g. LGCs and carbon offsets)
    rose significantly during the KS2 reporting period, driven by increased demand
    and carbon pricing policy. ANC had incorporated green certificate procurement
    as part of its zero-emissions delivery claims strategy, but escalating prices
    introduced material financial uncertainty and undermined the predictability of
    long-term cost models for low-emissions logistics operations.
  lesson_learnt: Do not anchor fleet decarbonisation strategies primarily on green
    certificate markets. Rising certificate prices driven by policy and demand growth
    create cost volatility that is incompatible with long-term commercial predictability.
    Shift to direct renewable energy procurement through fixed-price PPAs or on-site
    generation as the primary emissions integrity mechanism.
