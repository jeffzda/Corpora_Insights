- record_id: ARENA-DLV-6902
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: DC fast charging underperformed against the assumed 100kW baseline
    — LDV vehicles were capped at approximately 97kW and JAC trucks at approximately
    90kW in real-world operation. AC overnight charging was capped at 11kW/hour and
    was insufficient to deliver a full overnight charge for large-format vehicles
    operating routes exceeding 150km.
  lesson_learnt: Do not size depot charging infrastructure on nominal charger or vehicle
    OEM specifications. Validate actual charging rates under field conditions for
    the specific vehicle models and duty cycles involved before finalising infrastructure
    investment and operational scheduling.
