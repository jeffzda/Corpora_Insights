- record_id: ARENA-DLV-6905
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Route designs inherited from ICE vehicle operations proved inefficient
    for EVs. EV-specific constraints — including range derating, weight capping, and
    the need for mid-shift charging — were not reflected in existing route structures,
    reducing operational efficiency and increasing energy consumption.
  lesson_learnt: Do not transfer ICE route designs directly to EV fleets. Redesign
    routes from first principles using EV-specific parameters including derated range,
    payload weight limits, and access to charging locations. Route-matching tools
    that align individual vehicle specifications with parcel profiles and delivery
    geography are essential before scaling.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: ANC introduced route-matching tools and parcel density analysis
    to redesign routes based on EV range and payload capacity, and confirmed these
    as core operational tools for subsequent milestones.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id001
  - 22
