- record_id: ARENA-DLV-6918
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Owner-operator delivery professionals expressed unwillingness to
    invest in home renewable energy systems (solar, battery storage) due to the additional
    capital cost and, for renters, the physical impossibility of installing such systems.
    This prevented home-based green charging from being a viable emissions reduction
    pathway for a significant portion of the subcontractor fleet.
  lesson_learnt: Fleet electrification programs should not assume that owner-operator
    delivery professionals have the means or authority to invest in home renewable
    energy. Where a large portion of drivers are renters or otherwise unable to modify
    their premises, centralised green energy infrastructure — depot solar, battery
    storage, or green PPAs — must be the primary pathway for verified low-emissions
    charging.
