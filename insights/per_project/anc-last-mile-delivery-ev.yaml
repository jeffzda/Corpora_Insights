  source_title: ANC Last Mile Delivery EV - Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Project Spark
  what_happened: The high Total Cost of Ownership (TCO) of EVs, including upfront
    purchase price, maintenance, and depreciation costs, created significant economic
    strain and challenged the short-term financial viability of the fleet electrification
    programme.
  lesson_learnt: Account for the full TCO gap between EVs and ICE vehicles at project
    planning stage and build in mitigation strategies such as bulk purchasing agreements
    and bundled green premiums — failure to do so creates ongoing financial strain
    that can threaten programme viability.
