  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: ANC initiated evaluation of depot-level solar and battery storage
    investments and fixed-price green PPAs as the primary mechanism for verified green
    charging across the fleet.
  transferability: broad
