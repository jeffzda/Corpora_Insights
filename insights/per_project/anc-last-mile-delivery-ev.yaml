  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Depot charging infrastructure deployment was significantly delayed
    by grid upgrade requirements, the need for landlord approvals, and the absence
    of a uniform funding mechanism for depot electrification. These delays caused
    misalignment between charger installation milestones and vehicle deployment targets,
    ultimately requiring 77 charger installations to be deferred from Milestone 3
    to Milestone 4.
  lesson_learnt: Initiate grid upgrade assessments and landlord approval processes
    for depot charging well ahead of vehicle delivery schedules. Milestone targets
    for charging infrastructure should include realistic lead times for grid works
    and approvals — treating charger installation as a fast-follow to vehicle procurement
    will consistently create operational bottlenecks.
