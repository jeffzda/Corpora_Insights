- record_id: ARENA-DLV-6919
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: A phased, incremental approach to EV rollout across Project Spark
    enabled ANC to capture real-world operational data and apply it to refine route
    design, vehicle configuration, charging strategy, and commercial models before
    scaling. Assumptions that diverged significantly from field reality — including
    range, charging rates, payload, and SOC — were identified and corrected within
    the project lifecycle rather than at full scale.
  lesson_learnt: Structure large fleet electrification programs as phased incremental
    rollouts with formal assumption-versus-reality review points built into milestones.
    This approach creates controlled learning cycles that allow vehicle specifications,
    route designs, and infrastructure plans to be recalibrated on real data before
    commitments are locked in for the full fleet.
