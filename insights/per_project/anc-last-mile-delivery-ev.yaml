  what_happened: Uncertainty around EV battery resale and residual values complicated
    long-term asset management and financial planning, with no established market
    benchmarks available to inform TCO modelling.
  lesson_learnt: Before committing to large-scale EV fleet acquisition, commission
    research into EV battery resale values and develop lifecycle cost models specific
    to the operational context — the absence of these models creates material uncertainty
    in TCO calculations and asset management decisions.
