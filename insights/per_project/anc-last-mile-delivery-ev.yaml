  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Carbon accounting for the fleet remained fragmented during the KS2
    period. Vehicle telematics, energy usage data, and ESG reporting frameworks were
    not yet fully integrated, preventing ANC from claiming and reporting GHG reductions
    with confidence or precision. This limitation became more significant as clients
    began moving toward mandatory climate disclosure under ASRS and ISSB frameworks.
  lesson_learnt: Establish integrated carbon accounting infrastructure — linking vehicle
    telematics to energy source verification and ESG reporting systems — before making
    GHG reduction claims to clients. The growing regulatory requirement for mandatory
    climate disclosure means fragmented data systems will increasingly become a commercial
    and reputational liability.
