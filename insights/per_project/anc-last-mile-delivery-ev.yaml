- record_id: ARENA-DLV-24101
  source_title: ANC Last Mile Delivery EV - Lessons Learnt Report 1
  publish_date: 2024-11
  project_name: Project Spark
  what_happened: Subcontractors faced difficulty accessing competitive financing for
    EV acquisition due to limited credit access, while insurance providers applied
    varied risk assessments that resulted in higher-than-expected premiums, creating
    financial barriers to EV adoption.
  lesson_learnt: Develop tailored financial products and EV-specific insurance policies
    before scaling fleet electrification to subcontractors — generic financing and
    insurance products create adoption barriers that can stall deployment, particularly
    for operators with limited credit access.
