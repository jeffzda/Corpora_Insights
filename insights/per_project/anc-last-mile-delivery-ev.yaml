  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Many delivery professionals (owner-operators) were unable to install
    home chargers due to rental tenancy status, strata title restrictions preventing
    property modifications, or the absence of secure off-street parking. This created
    significant variability in overnight charging availability across the subcontractor
    fleet and increased reliance on public infrastructure that was often unsuitable
    for large-format vehicles.
  lesson_learnt: Before assigning EVs to subcontractor delivery professionals, assess
    their home charging feasibility — tenancy status, property type, and off-street
    parking availability are binary barriers. Where home charging is not viable for
    a material proportion of drivers, depot or hub-based overnight charging capacity
    must be resourced accordingly.
