- record_id: ARENA-DLV-6906
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Public EV charging infrastructure proved physically inaccessible
    for large-format commercial vehicles including JAC trucks, LDV cab chassis, and
    heavy vans. Physical constraints including insufficient bay clearance, narrow
    turning circles, and height restrictions prevented these vehicles from using the
    majority of public fast chargers, which are designed for passenger vehicles. This
    gap underpinned a renegotiation of charging milestones.
  lesson_learnt: Do not include public fast-charging networks in operational contingency
    planning for large-format commercial EV fleets. Charging infrastructure strategies
    for trucks, cab chassis, and large vans must be anchored entirely in depot and
    client-site DC solutions. Advocate for commercial vehicle access standards to
    be embedded in future public charging site design.
  issue_severity: major
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: ANC began documenting commercial vehicle access constraints at
    public charging sites and commenced engagement with industry bodies and infrastructure
    planners to improve future design standards. Depot and client-site DC charging
    was prioritised as the primary infrastructure investment.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id002
  - 16
  - 24
  - 25
  evidence_excerpt: Larger format vehicles often face physical access limitations,
    including insufficient clearance, narrow bays, or restricted turning circles.
    These constraints diminish the viability of public charging for a key segment
    of ANC's operational fleet. This gap has been a material lesson learnt and underpinned
    the renegotiation of charging milestones.
  confidence_note: null
