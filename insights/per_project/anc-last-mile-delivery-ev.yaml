- record_id: ARENA-DLV-6910
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: The high upfront capital cost of EVs and supporting charging infrastructure
    continued to limit adoption among subcontractors operating under ANC's owner-driver
    model, even with ARENA co-funding. Insurance products remained poorly differentiated
    from ICE vehicles, and access to tailored EV financing for small operators was
    limited. Charging downtime introduced a new income certainty risk for owner-operators
    not present in the ICE model.
  lesson_learnt: Fleet electrification programs relying on subcontractor or owner-operator
    models must address financial product gaps as a first-order barrier — not a secondary
    one. Tailored EV leasing, residual value guarantees, group insurance rates, and
    income-protection structures for charging downtime are prerequisites for subcontractor
    uptake, not optional enhancements.
