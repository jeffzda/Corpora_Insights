- record_id: ARENA-DLV-6917
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Charger installation targets set for Milestone 3 became misaligned
    with actual deployment timelines and partner capacity. The misalignment encompassed
    the number of chargers required, the entities responsible for installation, and
    the timing of installations, necessitating a formal renegotiation of project milestones
    and the deferral of 77 charger installations.
  lesson_learnt: Charging infrastructure milestones in fleet electrification projects
    must explicitly name responsible installation parties, include realistic lead-time
    buffers for grid works and approvals, and be stress-tested against partner capacity
    constraints before being committed to as grant deliverables. Milestone targets
    that assume installation parties will act independently without formal commitment
    mechanisms are high-risk.
