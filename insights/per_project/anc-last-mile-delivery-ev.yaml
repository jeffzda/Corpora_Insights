- record_id: ARENA-DLV-6904
  source_title: ANC - Last Mile Delivery Vehicle Electrification - Lessons Learnt
    Report 2
  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: Payload weight limits were frequently reached before volumetric cargo
    space was fully utilised — LDV vehicles reached approximately 1,500kg with up
    to 17.86 CBM used, and JAC trucks were weight-capped at approximately 4,100kg
    while cubic space remained underutilised. Pre-deployment assumptions had assumed
    both weight and volume limits would be reached simultaneously.
  lesson_learnt: Conduct parcel density and weight profiling for specific delivery
    runs before procuring or configuring commercial EVs. Where freight is weight-heavy
    rather than volume-heavy, payload-optimised vehicle configurations should be selected
    and routes should be designed around weight capping rather than volumetric capacity.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: ANC reconfigured JAC vehicles into 8-pallet (4,424kg) and 10-pallet
    (4,025kg) models to better match actual freight profiles, and introduced parcel
    density analysis to inform route matching.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages:
  - 22
  - 23
  - 24
  - 29
  - 30
  evidence_excerpt: Vehicles often reach their maximum payload weight before utilising
    their full cubic capacity, resulting in underutilisation of space (up to 50%+
    of cubic capacity remains unused). This affects delivery optimisation, with fewer
    stops per run due to weight constraints, rather than space limitations.
