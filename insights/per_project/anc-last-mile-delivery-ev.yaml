  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: ANC redesigned route schedules and charging plans to incorporate
    mandatory mid-shift top-ups, reducing the probability of vehicles returning critically
    low.
  transferability: broad
  delay_magnitude: null
  technology_domain: EV
