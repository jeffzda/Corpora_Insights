  publish_date: 2025-05
  project_name: Project Spark - ANC Last Mile Delivery Vehicle Electrification
  what_happened: The absence of verified renewable energy at many charging locations
    significantly weakened the actual emissions reduction benefit of EV deployment.
    Charging through fossil-based grid energy cannot be counted as zero-emissions,
    yet many depot and public charging sites did not have access to verified green
    electricity during the KS2 period.
  lesson_learnt: The emissions reduction benefit of EV fleet deployment is only as
    strong as the energy source verification at charging locations. Ensure verified
    renewable energy supply — through on-site generation, green energy tariffs with
    certificate backing, or PPAs — is established at all primary charging sites before
    claiming zero-emissions fleet status.
