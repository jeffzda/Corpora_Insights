  project_type: transport electrification
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: fleet/logistics operator
  delay_category: null
  failure_mode: commercial & market
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: ANC began evaluating fixed-price renewable energy PPAs and on-site
    solar and battery storage investments at depots to reduce exposure to volatile
    green certificate markets.
  transferability: broad
