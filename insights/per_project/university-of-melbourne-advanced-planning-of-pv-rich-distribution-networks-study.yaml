  project_name: 'University of Melbourne: Advanced Planning of PV-Rich Distribution Networks Study'
  what_happened: The University of Melbourne developed and validated an analytical technique that can estimate solar PV hosting capacity from readily available HV network and smart meter data without requiring
    complex full network models, providing a faster and simpler alternative to conventional detailed network studies.
  lesson_learnt: DNSPs can assess PV hosting capacity without building detailed full network models — the University of Melbourne technique using HV network data and smart meter data provides adequate estimates,
    significantly reducing the analytical burden for network planners managing high-penetration solar PV scenarios.
