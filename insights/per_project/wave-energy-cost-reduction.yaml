- record_id: ARENA-DLV-53905
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: A multi-objective optimisation of the 20-WEC array configuration
    at location L4 simultaneously maximised power production (q-factor) and minimised
    transmission cable length, yielding an optimal layout with inter-WEC spacing of
    107.8 m (versus the base case fixed spacing of 150 m), row spacing of 55 m, and
    an orientation of 320°. This increased mean power output from 9.7 MW (Phase I)
    to 10.2 MW while reducing within-array cable length from approximately 2,838 m
    (base case at L3) to 1,830 m.
  lesson_learnt: Fixing inter-WEC spacing at a minimum collision-avoidance distance
    (150 m) without optimisation for both power and cable cost forgoes significant
    gains; applying multi-objective optimisation to array geometry can simultaneously
    increase power output and reduce cabling costs, and also enables coastal impact
    screening at no additional computational cost.
