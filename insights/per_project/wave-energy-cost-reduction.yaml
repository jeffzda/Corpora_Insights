- record_id: ARENA-DLV-53903
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: In the base case, foundation piles for all sixty anchors across the
    twenty-WEC array were designed using a single cone penetration test (CPT) located
    at the centre of the site, with a conservative 5% quantile design line as recommended
    by Eurocode 7. This produced a required pile length of 18.2 m and a total foundation
    cost of $52.325M.
  lesson_learnt: Designing all foundations in a large WEC array from a single central
    CPT using a 5% quantile design line is excessively conservative; optimising the
    number and location of CPTs and calibrating the design quantile to the actual
    soil variability can reduce pile lengths by 20–30% and total foundation costs
    by up to $9.8M for a 20-device array.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Developed a site investigation optimisation technique that calculates
    pile foundation reliability as a function of soil variability and CPT proximity,
    enabling selection of the optimal number and layout of CPTs; using 20 CPTs reduced
    pile length to 13.4 m and total foundation cost to $42.476M — a $9.8M saving versus
    base case.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id003
  - 43
  - 44
  - 57
  - 58
  evidence_excerpt: Best practice might consider performing a borehole and CPT at
    the location of each of the sixty foundations, but this approach could be cost
    prohibitive in the sense that the savings generated on the foundation may be offset
    by the cost of the soil characterisation. For a given site and given conditions,
    there is an optimal number and location of CPTs that would lead to a minimum total
    cost of site characterisation and foundation engineering.
