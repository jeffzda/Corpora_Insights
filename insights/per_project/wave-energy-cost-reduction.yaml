- record_id: ARENA-DLV-53907
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: The optimal number of CPTs for minimising total cost (site investigation
    plus foundation) was found to be twenty (one per WEC), not one (minimum effort)
    and not sixty or sixty-five (one per pile). Increasing from 1 to 20 CPTs reduced
    pile length from 14.6 m to 13.4 m and total foundation cost from $43.869M to $42.476M,
    while the site investigation cost increased from $0.575M to $2M. Adding further
    CPTs (60 or 65) reduced pile length marginally further but increased SI cost enough
    to raise total cost above the 20-CPT optimum.
  lesson_learnt: 'There is a quantifiable optimal level of geotechnical site investigation
    for WEC (and offshore renewable) array foundations: too few CPTs forces overly
    conservative pile design; too many CPTs incur investigation costs that exceed
    foundation savings. For a 20-device array in conditions similar to Torbay, one
    CPT per WEC (20 total) was optimal — developers should conduct a cost-benefit
    analysis of site investigation intensity rather than defaulting to minimum effort.'
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Developed a site investigation optimisation technique using random
    field theory and reliability analysis (subset simulation) to identify the number
    and location of CPTs that minimises total cost of site investigation plus foundation
    installation for a given site.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
