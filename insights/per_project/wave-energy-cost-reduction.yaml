- record_id: ARENA-DLV-53909
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: The project found that a single CPT can accurately estimate vertical
    soil variability parameters (COV(qc), Dr, θ_v) with relative errors of 6.9–13.3%,
    but cannot estimate the horizontal scale of fluctuation (θ_h) because no horizontal
    data pairs are available from a single vertical measurement. Without θ_h, the
    design must adopt the most conservative possible sample quantile, limiting the
    foundation cost savings achievable with minimal site investigation.
  lesson_learnt: A single CPT is sufficient to characterise vertical soil variability
    for WEC foundation design, but additional CPTs with horizontal separation are
    required to estimate the horizontal scale of fluctuation (θ_h); without θ_h, designers
    must use a conservative design quantile that limits cost savings — adding even
    a small number of strategically placed CPTs to enable θ_h estimation can unlock
    further pile length and cost reductions.
  issue_severity: minor
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Added five supplementary CPTs (65-CPT strategy) to the 60-CPT
    layout specifically to reduce minimum CPT spacing below the estimated θ_h, enabling
    reliable θ_h estimation and achieving SQ = 37.2% versus SQ = 32.0% for the 60-CPT
    case, further reducing mean pile length to 12.7 m.
