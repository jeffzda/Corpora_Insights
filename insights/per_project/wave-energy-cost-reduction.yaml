- record_id: ARENA-DLV-53901
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: The base case wave farm location (L3) was selected purely on the
    basis of expected maximum power output, without considering infrastructure costs
    such as foundation engineering and cabling. This approach — inherited from industry
    practice — produced a normalised cost of $6.314M/MW for cabling and foundation
    infrastructure relative to mean power output.
  lesson_learnt: Wave energy farm site selection based solely on wave power resource
    maximisation systematically underperforms on whole-of-project cost; simultaneously
    optimising for infrastructure costs (cabling distance, foundation requirements)
    alongside power output can reduce the normalised infrastructure-to-power cost
    by ~7% through location selection alone, before any configuration optimisation
    is applied.
