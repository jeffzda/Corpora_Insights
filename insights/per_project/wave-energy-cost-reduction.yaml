- record_id: ARENA-DLV-53902
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: Foundation design for the wave energy converter array was based directly
    on offshore oil and gas industry standards (ISO 19902), which are designed for
    manned facilities where foundations represent ~2% of total installed cost. For
    wave energy devices, foundations and moorings can represent up to 30% of total
    development cost, making the inherited conservatism economically inappropriate
    and unnecessarily costly.
  lesson_learnt: Applying oil and gas foundation design codes to wave energy converters
    imports excessive conservatism that is economically unjustified; wave energy developers
    should use design methods calibrated to WEC-specific loading regimes and economic
    conditions rather than defaulting to oil and gas standards, as doing so can materially
    reduce foundation costs.
