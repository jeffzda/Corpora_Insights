- record_id: ARENA-DLV-53910
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: The wave energy sector has no design guidelines specifically addressing
    hydrodynamic loadings on mooring lines and foundations for point-absorber WECs;
    current design codes do not adequately account for the specific loading characteristics
    of WECs. This regulatory and standards gap forces practitioners to default to
    oil and gas codes that are mismatched to WEC economics and load conditions, increasing
    costs.
  lesson_learnt: The absence of WEC-specific foundation and mooring design standards
    is a structural barrier to cost reduction in wave energy; the sector requires
    purpose-built design guidelines that account for point-absorber loading regimes
    — developers and industry bodies should invest in developing and publishing such
    standards to enable rational, cost-efficient foundation design across commercial
    deployments.
  issue_severity: major
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Research team developed and published new design methodologies
    for WEC pile foundations including load characterisation, calibrated design quantile
    selection, and inclined load coupling effects, providing a basis for future standards
    development.
  transferability: moderate
  delay_magnitude: null
