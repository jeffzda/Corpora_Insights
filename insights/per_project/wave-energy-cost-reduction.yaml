- record_id: ARENA-DLV-53911
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: The optimisation approach developed in this project considered cabling,
    foundation engineering, power output, and coastal impacts simultaneously, but
    excluded several potentially material parameters — including the location of the
    grid connection point, specific cost item variability, and alternative foundation
    types — due to data limitations or complexity constraints. The authors note these
    omissions would affect the magnitude of savings achieved but not the validity
    of the optimisation approach.
  lesson_learnt: Wave energy farm optimisation frameworks that exclude the grid connection
    point location, foundation type alternatives, or detailed cost model sensitivity
    risk overstating or mislocating cost savings; future deployments should integrate
    grid connection location as a variable and explore alternative foundation solutions
    (e.g., suction caissons) better suited to WEC loading regimes.
