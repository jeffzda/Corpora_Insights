  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed new pile design methodology specific to point-absorber
    WEC loading regimes and a calibrated sample quantile approach to reduce conservatism
    while maintaining target failure probabilities, reducing pile lengths by up to
    30% compared to the base case.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
