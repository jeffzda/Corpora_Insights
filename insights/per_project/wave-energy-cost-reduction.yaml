- record_id: ARENA-DLV-53908
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: Comparing nine candidate locations along the 30 m depth contour and
    at increasing offshore water depths (35–50 m), the project found that mean power
    output increased with water depth (L9 at ~50 m produced 10.76 MW vs 9.13 MW at
    L3 at 30 m), but deeper locations also required longer piles due to lower sand
    relative density, increasing foundation costs. The highest-power location (L9)
    was not the lowest normalised cost location.
  lesson_learnt: Higher wave power output at deeper offshore locations for point-absorber
    WECs does not automatically translate to lower cost of energy — deeper water reduces
    sand density, increasing pile lengths and foundation costs; a full cost-to-power
    ratio assessment across multiple candidate locations is necessary to identify
    the economically optimal deployment depth.
