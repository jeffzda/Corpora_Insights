- record_id: ARENA-DLV-53904
  source_title: Wave Energy Cost Reduction Resource Assessment Report
  publish_date: 2021-10
  project_name: Wave Energy Cost Reduction through Location and Configuration Optimisation
    (ARENA 2015 RND086)
  what_happened: Standard industry practice applied an inclined load reduction factor
    (γ_inc = 0.8) to account for the 40° tether inclination angle in WEC pile foundations,
    assuming a detrimental coupling between vertical and horizontal load components.
    Centrifuge testing (Huang et al. 2019) demonstrated that for 40° inclination,
    the coupling is in fact beneficial, increasing pile capacity — meaning standard
    practice was unnecessarily conservative by approximately 12%.
  lesson_learnt: Current offshore design codes assume detrimental coupling for inclined
    pile loading at angles relevant to WEC tethers (40°), but experimental evidence
    shows the coupling is beneficial at this inclination; WEC developers should use
    the improved load inclination factor (γ_inc = 0.95 or higher with further validation)
    to avoid over-designing pile foundations, which adds unnecessary cost.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Adopted a revised inclined load factor of γ_inc = 0.95 (up from
    0.8) based on centrifuge test results demonstrating beneficial coupling at 40°
    load inclination, reducing the factored design load from 8.03 MN to 7.11 MN and
    contributing to pile length reductions.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id004
  - 46
  evidence_excerpt: centrifuge tests on piles in sand under loads of inclination varying
    from 0° to 90° from the vertical... indicated that for load inclination of 40°,
    as relevant to the case investigated here, the coupling was beneficial and resulted
    in an increased capacity of the pile... we decided here to still take a conservative,
    yet less punitive, approach and adopted a γ_inc of 0.95, leading to a factored
    design load γ_L S_design/γ_inc = 7.11 MN.
