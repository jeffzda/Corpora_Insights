  project_name: Silicon to Solar (S2S) Study
  what_happened: Cell manufacturing at the minimum viable scale of 1 GW requires semiconductor-grade
    chemicals (5N–6N purity) and specialised silver pastes with IP-protected formulations,
    for which Australian local suppliers currently lack the necessary scale and purity
    — meaning that virtually all key materials must be imported at significant cost
    premium.
  lesson_learnt: Cell manufacturing business cases in Australia should assume full
    importation of high-purity chemicals and silver paste for at least the first production
    cycle — the absence of a domestic semiconductor chemicals industry means no supply
    chain substitution is available at commissioning, and procurement from China adds
    both cost and supply chain risk.
