  what_happened: Module assembly material costs (aluminium frames and glass) dominate
    at over 70% of production cost in Australia, and bill-of-materials payment terms
    require pre-payment before shipping to Australia — with shipping times of up to
    3 months creating significant working capital and cash flow challenges for module
    assemblers.
  lesson_learnt: Module manufacturing financial models must include working capital
    for up to 3 months of pre-paid inventory in transit — this cash flow gap is frequently
    underestimated and can be a material barrier to viability, particularly for new
    entrants without access to the credit facilities of large Chinese module manufacturers.
