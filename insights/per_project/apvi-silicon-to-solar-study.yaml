  what_happened: Concessional loans, even at 0% interest rate, were found through
    quantitative modelling to be insufficient to close the manufacturing cost gap
    at any step of the Australian solar PV value chain over a 10-year production period,
    though they do address access-to-capital and investment certainty barriers.
  lesson_learnt: Do not design solar manufacturing support packages around concessional
    finance as the primary instrument — even 0% loans cannot close the ongoing operational
    cost gap; they should only be used in combination with production credits which
    address the recurring cost disadvantage.
