- record_id: ARENA-DLV-8608
  source_title: APVI - Silicon to Solar - Detailed and Overview Reports
  publish_date: 2023-12
  project_name: Silicon to Solar (S2S) Study
  what_happened: Silver paste, the dominant material cost for TOPCon solar cell manufacturing,
    carries a 17% subsidy for Chinese manufacturers that is lost when the paste is
    exported — adding approximately USD 2c/W (~30% of Australian conversion cost)
    to the cost for an Australian cell manufacturer.
  lesson_learnt: When costing solar cell manufacturing outside China, account for
    the loss of Chinese domestic silver paste subsidies in the materials cost model
