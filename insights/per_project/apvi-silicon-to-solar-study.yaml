  project_name: Silicon to Solar (S2S) Study
  what_happened: Poly-Si production is extremely electricity-intensive (~50 MWh/tonne),
    requiring ~1.5 TWh/year for a minimum viable 25 kt/year facility (~170 MW average
    load), with Australian delivered electricity costs estimated at 5–8 USD c/kWh
    — higher than current Chinese rates of ~6 USD c/kWh — making electricity the largest
    single production cost driver.
  lesson_learnt: Electricity price and supply security should be resolved before poly-Si
    investment decision — without a contracted, low-cost firmed renewable energy supply
    at or below 5 USD c/kWh (USD 50/MWh), an Australian poly-Si plant will not be
    cost competitive regardless of other policy support.
