- record_id: ARENA-DLV-8605
  source_title: APVI - Silicon to Solar - Detailed and Overview Reports
  publish_date: 2023-12
  project_name: Silicon to Solar (S2S) Study
  what_happened: A 55% import tariff (Interim Dumping Duty and Interim Countervailing
    Duty) on metallurgical silicon (mg-Si) imported from China adds approximately
    9% to the total cost of poly-Si production in Australia, representing a significant
    and unanticipated barrier for any Australian poly-Si manufacturer relying on Chinese
    feedstock.
  lesson_learnt: Before finalising feedstock strategy for an Australian poly-Si plant,
    assess the full landed cost of mg-Si including existing anti-dumping tariffs —
    the 55% tariff on Chinese mg-Si alone adds ~9% to poly-Si production cost, making
    domestic or non-Chinese mg-Si sourcing (at ~USD 4/kg vs USD 2/kg in China) a critical
    project economics decision.
