  what_happened: Quantitative modelling showed that production credits are the only
    policy lever capable of fully closing the cost gap between Australian and Chinese
    manufacturing at each step of the solar value chain over a 10-year production
    period; capital grants and electricity price guarantees in isolation each fail
    to close the gap.
  lesson_learnt: When designing government support for capital- and energy-intensive
    manufacturing industries, production credits (payment-on-results) combined with
    concessional finance are more effective than upfront capital grants or electricity
    subsidies alone — the latter two fail to close ongoing operational cost gaps and
    expose government to greater project failure risk.
