  what_happened: Stakeholder consultation identified that environmental and regulatory
    approvals for a poly-Si facility in Australia are expected to take over three
    years, compared to less than 1.5 years for brownfield and around 2 years for greenfield
    sites in China — at least double the Chinese timeline.
  lesson_learnt: Project developers planning poly-Si or other large-scale chemical
    manufacturing in Australia should assume approval timelines of 3–5 years and engage
    regulators at the earliest concept stage; failure to allow for this in project
    schedules will delay speed-to-market and allow competing jurisdictions to capture
    supply chain market share first.
