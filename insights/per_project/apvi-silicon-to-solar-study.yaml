- record_id: ARENA-DLV-8640
  source_title: APVI - Silicon to Solar - Detailed and Overview Reports
  publish_date: 2023-12
  project_name: Silicon to Solar (S2S) Study
  what_happened: Australia's average grid emissions intensity of 622 g CO2e/kWh means
    that a poly-Si facility using grid electricity would produce approximately 34.8
    t CO2e per tonne of poly-Si — more than 10 times the emissions achievable with
    decarbonised electricity — undermining the product's competitiveness in EU and
    US markets with carbon tariff mechanisms.
  lesson_learnt: Australian solar PV manufacturers targeting export markets with carbon
    border adjustment mechanisms (EU CBAM, potential US BCAs) must secure dedicated,
    additional renewable energy supply from commissioning — using grid electricity
    at current emissions intensity would disqualify products from price-premium markets
    and undermine the sustainability rationale for Australian manufacturing.
