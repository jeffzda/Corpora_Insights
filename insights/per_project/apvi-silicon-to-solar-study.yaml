  what_happened: Poly-Si production requires ~1.5 TWh/year baseload electricity for
    the minimum viable scale facility (~170 MW average demand), which is not compatible
    with demand response mechanisms used for aluminium smelters and requires very
    large scale firmed renewable energy — yet existing grid infrastructure upgrades
    can add significant upfront cost particularly for greenfield industrial sites.
  lesson_learnt: Poly-Si site selection must prioritise proximity to existing high-voltage
    grid infrastructure with spare capacity (such as sites near retiring coal plants)
    — grid connection and upgrade costs for a 170 MW average baseload facility at
    a greenfield location could materially erode project economics before production
    commences.
