  project_name: Silicon to Solar (S2S) Study
  what_happened: Several high-quality quartz crucibles used in ingot pulling are sourced
    predominantly from the US and are subject to significant price volatility and
    supply constraints, with a limited number of suppliers globally, creating a supply
    chain risk for any ingot/wafer manufacturing facility regardless of location.
  lesson_learnt: Ingot/wafer project developers should assess crucible supply security
    explicitly — the limited number of high-purity quartz crucible suppliers and associated
    price volatility represent a procurement risk that is not well understood outside
    the industry and should be addressed through multi-supplier contracts or investigation
    of Australian quartz deposit suitability.
