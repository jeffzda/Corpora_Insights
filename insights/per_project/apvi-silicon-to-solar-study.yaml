  what_happened: Australia currently has no solar-grade glass manufacturing capability,
    despite having large silica sand deposits. The minimum viable glass production
    for solar modules would require approximately 2 GW of cover glass per year, and
    re-establishing this capability requires significant investment — the last Australian
    low-iron glass facility is no longer operating.
  lesson_learnt: Module assembly business cases in Australia should not assume domestic
    glass supply is available in the near term — glass is 67–70% of module weight
    and a major shipping cost component, so developing a domestic glass supply chain
