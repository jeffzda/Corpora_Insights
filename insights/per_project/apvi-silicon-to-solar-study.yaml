    domestic solar manufacturing, policy should not treat it as a strategic substitute
    for upstream investment — module assembly alone does not reduce supply chain vulnerability
    and Australian-made modules would predominantly serve domestic markets at a premium,
    limiting the industry's long-term growth trajectory.
