  what_happened: Labour costs at the ingot/wafer manufacturing stage in Australia
    are approximately four times higher per employee than in China, and Australian
    facilities require ~20% more headcount due to shorter working hours and lower
    manufacturing experience, making labour the dominant driver of the conversion
    cost gap at this step.
