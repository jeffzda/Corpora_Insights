  what_happened: The Clean Energy Finance Corporation (CEFC) aims to deliver a positive
    return for taxpayers and sparingly applies concessionality, meaning it does not
    automatically provide the deeply concessional finance (e.g., 0% interest, high-risk
    tolerance) that would be required to catalyse first-of-kind solar manufacturing
    investment in Australia.
