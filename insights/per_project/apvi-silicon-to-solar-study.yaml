  what_happened: The study found that module production represents the lowest-cost
    and easiest entry point for Australian solar manufacturing (lowest CAPEX, fewest
    hazardous materials, simplest approvals), but also the least strategically differentiated
    step — it is unlikely to serve export markets and does not address the most concentrated
    supply chain vulnerabilities.
