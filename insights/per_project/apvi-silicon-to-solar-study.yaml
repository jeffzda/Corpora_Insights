  what_happened: Simcoa's mg-Si production in Western Australia (52,000 t/year capacity)
    exceeds Australia's solar demand requirements, but all current output is under
    existing offtake agreements, and there is an import tariff on Chinese mg-Si that
    raises feedstock costs for any new Australian poly-Si entrant — demonstrating
