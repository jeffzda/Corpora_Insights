  project_name: Silicon to Solar (S2S) Study
  what_happened: The US IRA's domestic content bonus tax credit for solar PV developers
    begins at the cell step of the value chain, meaning upstream domestically produced
    poly-Si and ingot/wafer would not qualify — a design gap that has dampened investment
    in these most-concentrated supply chain steps despite the availability of upstream-focused
    production credits.
  lesson_learnt: When designing domestic content incentives for solar deployment,
    explicitly include upstream supply chain steps (poly-Si, ingot/wafer) in the domestic
    content definition — excluding these steps reduces the demand pull for the most
    strategically vulnerable parts of the value chain.
