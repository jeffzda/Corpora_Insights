- record_id: ARENA-DLV-8602
  source_title: APVI - Silicon to Solar - Detailed and Overview Reports
  publish_date: 2023-12
  project_name: Silicon to Solar (S2S) Study
  what_happened: A techno-economic analysis found that manufacturing costs for every
    step of the solar PV value chain in Australia are 20–100% higher than equivalent
    Chinese production, even when Australian facilities source all input materials
    from China at large-volume prices.
  lesson_learnt: Any prospective Australian solar manufacturer should quantify the
    full cost gap to the global benchmark (currently China) before reaching final
    investment decision — the gap ranges from ~20% at the module stage to ~100% at
    the poly-Si stage and cannot be closed through operational efficiencies alone
    without government policy support.
