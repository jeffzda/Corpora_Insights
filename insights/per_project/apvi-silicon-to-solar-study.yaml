  project_name: Silicon to Solar (S2S) Study
  what_happened: Charcoal from timber plantations is considered emissions-neutral
    for mg-Si production (replacing coal reductants), but Australia has an insufficient
    supply of charcoal to meet existing mg-Si production, particularly as the WA Government
    is banning native forest harvesting by 2024, and new plantation cycles take 10–12
    years to mature.
  lesson_learnt: Sustainability roadmaps for silicon-based manufacturing in Australia
    must account for charcoal supply constraints — developers targeting low-carbon
    mg-Si production should initiate plantation development partnerships immediately,
    as lead times of 10–12 years mean emissions-neutral production cannot be achieved
    without multi-decade forward planning.
