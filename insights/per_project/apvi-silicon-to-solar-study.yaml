  what_happened: CAPEX for building a poly-Si factory in Australia is estimated at
    approximately three times the cost of an equivalent Chinese facility, even assuming
    use of imported Chinese equipment, due to higher construction costs, equipment
    shipping, installation staff travel, and more stringent safety and environmental
    standards.
  lesson_learnt: When preparing capital estimates for first-of-kind chemical manufacturing
    in Australia, apply a minimum 3× multiplier to Chinese benchmark CAPEX for poly-Si,
    and ~2× for downstream steps such as ingot/wafer and cells — underestimating CAPEX
    is a primary risk for reaching viable investment decisions in Australian solar
    manufacturing.
