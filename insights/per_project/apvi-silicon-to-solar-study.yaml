- record_id: ARENA-DLV-8601
  source_title: APVI - Silicon to Solar - Detailed and Overview Reports
  publish_date: 2023-12
  project_name: Silicon to Solar (S2S) Study
  what_happened: Australia's solar PV manufacturing value chain from polysilicon to
    modules is almost entirely absent domestically. In 2022, less than 30 MW (<1%)
    of the 3.9 GW installed was manufactured in Australia, with the sole manufacturer
    (Tindo Solar) using imported cells and operating well below its 160 MW capacity
    at ~30 MW actual production.
  lesson_learnt: Assess domestic manufacturing capability gaps early when planning
    renewable energy deployment at scale — Australia's near-total reliance on a single
    foreign supplier for solar modules creates a structural supply chain vulnerability
    that cannot be quickly remedied without multi-year policy and investment lead
    times.
