- record_id: ARENA-DLV-15831
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA — application process resource intensity
  what_happened: ARENA client managers devoted significant resources to supporting
    applicants at early stages of the grant process. The ARP evaluation questioned
    whether this high level of pre-application support was justified given the cost
    incurred in person hours. A ThinkPlace study recommended introducing higher barriers
    to entry with more self-assessment resources to shift the support burden.
  lesson_learnt: Publish detailed self-assessment tools and eligibility guidance before
    applicants engage with client managers — concentrating staff support at the pre-EOI
    stage is inefficient; resources should be redirected to more advanced applications
    where engagement adds the greatest value.
