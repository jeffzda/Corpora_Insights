- record_id: ARENA-DLV-0104
  source_title: Cost-Effective GaAsP Top Solar Cell Grown On A High Performance, Low
    Cost Silicon Solar Cell
  publish_date: 2017-03
  project_name: Cost-Effective GaAsP Top Solar Cell Grown On A High Performance, Low
    Cost Silicon Solar Cell
  what_happened: The SiGe bottom cell structure was not optimised at the outset, resulting
    in the bottom cell limiting current output of the entire dual-junction tandem
    due to insufficient current density and the current-matching requirement for a
    two-terminal tandem. Optical constants for the required SiGe alloy composition
    had also never been reported, creating an additional material characterisation
    gap.
  lesson_learnt: Prioritise maximising bottom cell current from the start of tandem
    cell design, and include a back-surface reflector (BSR) — a SiO₂ dielectric layer
    between the Si substrate and the Al back contact — in the fabrication process
    early to increase both short-circuit current and open-circuit voltage of the SiGe
    bottom cell, thereby improving overall tandem performance.
  issue_severity: moderate
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Re-designed the SiGe alloy with higher Ge composition, reduced
    layer thickness and doping, applied light trapping techniques, added anti-reflection
    coating, and incorporated a BSR — achieving a best current density of 20.3 mA/cm²
    (close to the 21 mA/cm² target) with a 19 mV Voc improvement attributable to the
    BSR alone.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id004
  - 19
  - 20
  evidence_excerpt: The current of this dual junction tandem solar cell is limited
    by the SiGe bottom cell as the structure and composition of the bottom cell are
    not yet optimised. This also constrains the performance of the tandem solar cell
    due to the requirement of current matching for a 2T double junction tandem solar
    cell.
  confidence_note: null
