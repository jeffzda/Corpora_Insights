  publish_date: 2017-03
  project_name: Cost-Effective GaAsP Top Solar Cell Grown On A High Performance, Low
    Cost Silicon Solar Cell
  what_happened: During development of the GaAsP/SiGe tandem solar cell, key optical
    constants and electrical parameters for the III-V and SiGe material alloys had
    never been published, creating a knowledge gap that required the team to design
    specific test structures to extract the missing material parameters before accurate
    device modelling could proceed.
  lesson_learnt: Integrate test structures into the tandem solar cell mask set from
    the outset so that optical constants and electrical parameters for each layer
    can be extracted simultaneously with cell fabrication — this enables accurate
    device modelling and performance prediction without separate experimental campaigns.
