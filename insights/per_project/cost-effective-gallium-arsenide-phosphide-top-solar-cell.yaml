- record_id: ARENA-DLV-0103
  source_title: Cost-Effective GaAsP Top Solar Cell Grown On A High Performance, Low
    Cost Silicon Solar Cell
  publish_date: 2017-03
  project_name: Cost-Effective GaAsP Top Solar Cell Grown On A High Performance, Low
    Cost Silicon Solar Cell
  what_happened: III/V active layer growth without in-situ stress monitoring produced
    high threading dislocation density (TDD) of 7.8×10⁷ cm⁻², degrading device open-circuit
    voltage and overall tandem performance. Lattice-matching conditions were being
    set at room temperature rather than at growth temperature, causing undetected
    wafer bowing and elevated defect density.
  lesson_learnt: Equip the MOCVD reactor with an in-situ optical stress sensor to
    monitor wafer bowing during III/V material growth and adjust lattice-matching
    conditions at growth temperature — this is essential to achieving TDD below 10⁶
    cm⁻² and attaining the highest device voltages.
  issue_severity: major
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Introduced an in-situ optical stress sensor during III/V growth
    and adjusted lattice-matching at growth temperature, reducing TDD from 7.8×10⁷
    cm⁻² to 2.8×10⁶ cm⁻² and achieving a Woc of 0.48V — the lowest reported for ternary
    III-V solar cells grown on Si substrates.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
  - 17
  - 18
  evidence_excerpt: Using an in-situ optical stress sensor during the III/V material
    growth and adjusting the lattice-matching conditions at the growth temperature
    instead of at room temperature, the TDD of the III/V active layer was decreased
    from 7.8×10⁷ cm⁻² to 2.8×10⁶ cm⁻².
