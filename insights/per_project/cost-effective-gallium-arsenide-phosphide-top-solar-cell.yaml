- record_id: ARENA-DLV-0102
  source_title: Cost-Effective GaAsP Top Solar Cell Grown On A High Performance, Low
    Cost Silicon Solar Cell
  publish_date: 2017-03
  project_name: Cost-Effective GaAsP Top Solar Cell Grown On A High Performance, Low
    Cost Silicon Solar Cell
  what_happened: Without a method to independently characterise individual sub-cells
    within the tandem structure, the project team could not identify current-limiting
    or current-matching conditions, hindering targeted device improvement. A three-terminal
    (3T) measurement approach was conceived and validated to separately analyse the
    top and bottom cells simultaneously.
  lesson_learnt: Apply a three-terminal (3T) measurement approach to tandem solar
    cell analysis before committing to two-terminal (2T) design and fabrication —
    this reduces unknowns, identifies which sub-cell limits performance, and enables
    targeted improvements at an early design stage. The technique is transferable
    to other tandem solar cell projects.
  issue_severity: moderate
  project_type: generation
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Designed a 3T device with front, middle, and rear metal contacts;
    used circuit simulation and an adjustable light source to characterise current-limiting
    cases and achieve current-matching, increasing tandem efficiency from 18.9% to
    20.6% at one sun and 23.8% at 7.2 suns.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id002
  - 15
  - 16
  evidence_excerpt: Three-terminal (3T) measurements allow separate analysis of top
    cell and bottom cell in a tandem structure. It can not only provide current-voltage
    characteristics for both sub cells simultaneously, but also facilitates the detailed
    analysis of current-limiting and current-matching cases, and the extraction of
    the cell parameters. This is a leveraging technique for this project and can also
    be applied to other tandem solar cell projects.
  confidence_note: null
