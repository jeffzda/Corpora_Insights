- record_id: ARENA-DLV-0105
  source_title: Cost-Effective GaAsP Top Solar Cell Grown On A High Performance, Low
    Cost Silicon Solar Cell
  publish_date: 2017-03
  project_name: Cost-Effective GaAsP Top Solar Cell Grown On A High Performance, Low
    Cost Silicon Solar Cell
  what_happened: The project achieved a record GaAsP/SiGe tandem solar cell efficiency
    of 23.8% under 7.2× concentrated light on a silicon substrate, surpassing the
    previous best III-V on Si solar cell efficiency of 21.2%, demonstrating pathways
    to efficiencies above 33% under higher concentration and identifying a commercial
    cost pathway to $1.08/W system cost using 4× concentration with single-axis tracking.
  lesson_learnt: Combining iterative design cycles (modelling → fabrication → analysis)
    with parallel test-structure characterisation, 3T sub-cell analysis, in-situ stress
    monitoring, and bottom-cell light trapping can progressively push tandem III-V/Si
    cell performance to commercially relevant levels — future projects should build
    all four practices into the initial project plan rather than discovering them
    reactively.
