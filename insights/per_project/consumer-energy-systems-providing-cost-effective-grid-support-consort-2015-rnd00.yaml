- record_id: ARENA-DLV-40352
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: Consumer Energy Systems Providing Cost-Effective Grid Support (CONSORT)
    (2015/RND006)
  what_happened: During the CONSORT battery trial on Bruny Island, some participants
    lacked sufficient understanding of how the Reposit Power optimisation system worked,
    leading them to modify their electricity consumption patterns based on battery
    behaviour. Because the Reposit system optimises battery behaviour using previous
    consumption patterns as an input, these participant behaviour changes caused sub-optimal
    economic outcomes.
  lesson_learnt: Battery control system trials involving residential participants
    require a clear and accessible participant education program explaining how optimisation
    software uses consumption data — uninformed behaviour changes by participants
    can undermine the economic performance of the control algorithm and invalidate
    trial results.
