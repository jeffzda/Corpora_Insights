- record_id: ARENA-DLV-40353
  source_title: 'In The Spotlight: Australian Solar Energy R&D Outcomes and Achievements
    in a Global Context'
  publish_date: 2018-07
  project_name: Consumer Energy Systems Providing Cost-Effective Grid Support (CONSORT)
    (2015/RND006)
  what_happened: In the CONSORT Bruny Island battery trial, use of batteries as backup
    power was identified as a critical feature for many participants, but backup power
    functionality was not taken into account by Reposit Power's optimising controllers
    at the time of the trial.
  lesson_learnt: When deploying battery control systems in residential trials, the
    backup power requirement of participants must be explicitly incorporated into
    the controller design from the outset — omitting this creates a misalignment between
    what participants value most and what the system optimises for, undermining participant
    satisfaction and trial validity.
