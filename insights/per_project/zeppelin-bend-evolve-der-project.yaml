- record_id: ARENA-DLV-45013
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'Zeppelin Bend: evolve DER Project'
  what_happened: Before deploying the Azure-hosted evolve data platform, Zepben was
    required to conduct penetration testing for cyber security assurance, which had
    not yet been completed at the time of the year one report, creating a gating dependency
    on cyber security sign-off before the platform could go live.
  lesson_learnt: Cyber security penetration testing is a non-trivial gating milestone
    for cloud-hosted platforms that handle network asset data — project schedules
    for DER integration platforms should explicitly allocate time for penetration
    testing and any remediation before deployment, rather than treating security assurance
    as a parallel activity.
