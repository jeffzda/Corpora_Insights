- record_id: ARENA-DLV-45012
  source_title: Network Hosting Capacity Projects Progress Report (Year One)
  publish_date: 2020-03
  project_name: 'Zeppelin Bend: evolve DER Project'
  what_happened: Integration agents developed to connect Zepben's platform with DNSP
    partner systems were completed but were pending deployment within the DNSP's IT
    infrastructure at the end of year one, indicating that deployment within regulated
    network business IT environments creates a bottleneck independent of software
    readiness.
  lesson_learnt: When developing software platforms that must integrate with DNSP
    IT infrastructure, treat DNSP IT deployment as a critical-path activity with its
    own lead time, governance, and security approval requirements — software readiness
    does not translate directly to deployment readiness within a regulated network
    business environment.
