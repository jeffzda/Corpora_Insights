- record_id: ARENA-DLV-40611
  source_title: ARENA Electrical Infrastructure Roundtable
  publish_date: '2025-06-25'
  project_name: NSW Grid – Renewable Drought Planning (May 2024 Event)
  what_happened: During a renewable drought from 13 May to 6 June 2024 in NSW, the
    combined output of 4,076 MW of registered large solar capacity and 2,762 MW of
    wind capacity was severely depressed for an extended multi-week period, exposing
    the system's continued dependence on coal and the inadequacy of short-duration
    storage to cover prolonged low-renewable events.
  lesson_learnt: A documented multi-week renewable drought in NSW in 2024 demonstrates
    that large installed solar and wind capacity does not eliminate the need for long-duration
    storage and transmission diversity; project planners and policy makers should
    treat renewable drought scenarios as a credible reference-class planning event,
    not a tail risk, when designing storage and transmission infrastructure.
