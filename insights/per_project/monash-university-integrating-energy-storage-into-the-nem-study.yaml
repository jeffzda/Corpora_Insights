- record_id: ARENA-DLV-42451
  source_title: Monash - Storage integration in the NEM - Milestone report 3
  publish_date: 2023-11
  project_name: Storage integration in the NEM
  what_happened: The synthetic inertia workstream required high-resolution PMU frequency
    data (20ms increments) held by TNSPs and shared with AEMO, but the data was not
    routinely accessible to external researchers. AEMO retains only three months of
    PMU measurement at a time, and even that constitutes multiple terabytes, requiring
    a custom data query that had not yet been completed at the time of this report.
  lesson_learnt: Research projects requiring high-resolution operational data from
    TNSPs or AEMO should negotiate data access and custom query requirements early
    in the project — ownership by TNSPs, AEMO retention limits (three months), and
    data volume constraints can delay or block a workstream if not addressed at the
    outset.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: coordination & stakeholders
  intervention_note: The team pivoted to complementing the 4-second AEMO data with
    bidding data to model storage behaviour in ancillary services such as Fast-Frequency
    Response, advancing the workstream while the PMU data access issue remained unresolved.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id001
  - 24
  evidence_excerpt: That information is owned by the TNSPs and shared with AEMO, so
    making it available to us is not immediate... AEMO only keeps three months of
    PMU measurement, and even this makes for a very large dataset (multiple Tb). Because
    this information is not routinely made available, a data query has to be custom-made.
    We are working with AEMO to tailor our request to what is feasible.
  confidence_note: lifecycle_phase classified as operations because the data access
    issue arose during an ongoing research workstream, not during initial project
    design.
