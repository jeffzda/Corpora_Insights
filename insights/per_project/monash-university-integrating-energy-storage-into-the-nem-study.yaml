- record_id: ARENA-DLV-42454
  source_title: Monash - Storage integration in the NEM - Milestone report 3
  publish_date: 2023-11
  project_name: Storage integration in the NEM
  what_happened: The market competition workstream found that a general characterisation
    of equilibria in the storage game remained elusive even in a simplified setting,
    requiring the research approach to be narrowed from deriving general solutions
    to constructing select equilibria supported by simple threats.
  lesson_learnt: Storage market design research should anticipate that the intertemporal
    dynamics of storage (buying and selling across periods) make even simplified game-theoretic
    models analytically harder than conventional generation models — allocating contingency
    time for approach pivots and partial solutions is advisable when scoping research
    milestones.
  issue_severity: minor
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The team adopted a construction approach — identifying select
    equilibria rather than a general solution — which is described as a standard approach
    for this class of problems and allowed the workstream to produce publishable results.
  transferability: narrow
  delay_magnitude: null
  technology_domain: battery storage
  source_pages: &id004
  - 9
  evidence_excerpt: Because a general characterisation of equilibria remains elusive,
    even in this simplified setting, we resort to constructing equilibria; that is
    to say, rather than a general solution, we can only provide some select solution(s).
    This is a standard approach for this class of problems.
  confidence_note: issue_severity minor — the pivot to constructing equilibria is
    described as standard and did not appear to materially affect project delivery
    timelines.
