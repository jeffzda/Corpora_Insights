- record_id: ARENA-DLV-42455
  source_title: Monash - Storage integration in the NEM - Milestone report 3
  publish_date: 2023-11
  project_name: Storage integration in the NEM
  what_happened: The block bidding paper had not been completed by the time of the
    Milestone 3 report (November 2023), with the team noting confidence it would be
    finished by end of 2023. The paper completion was flagged as pending alongside
    a list of further validation activities including lab testing, day-ahead market
    reconciliation, and numerical scaling for the NEM.
  lesson_learnt: Research projects with multiple interdependent publications should
    build explicit buffer into milestone schedules for papers that are technically
    complex — the block bidding paper required resolution of both a non-convexity
    problem and a PDE system before it could be completed, making it difficult to
    schedule completion accurately.
