- record_id: ARENA-DLV-42452
  source_title: Monash - Storage integration in the NEM - Milestone report 3
  publish_date: 2023-11
  project_name: Storage integration in the NEM
  what_happened: The 4-second AEMO frequency data originally used for the synthetic
    inertia workstream proved too coarse to recover inertial response curves (which
    are near-instantaneous) or the full frequency recovery path following generation
    outage events, blocking the primary analytical approach for estimating inertia
    demand.
  lesson_learnt: Before committing a workstream to a specific data source, verify
    that the temporal resolution of available data is sufficient for the intended
    measurement — inertial response to frequency deviations requires sub-second data,
    and 4-second intervals cannot capture these dynamics.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The research team pivoted to combining 4-second data with bidding
    data to model how storage could bid in ways that contribute to both energy balance
    and FCAS services, generating useful outputs while pursuing higher-resolution
    PMU data access in parallel.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: grid/system stability
  source_pages: &id002
  - 24
  evidence_excerpt: The 4-second data does not provide the ideal level of detail to
    fully recover the curve of frequency recovery. In addition, it is still too coarse
    to really pickup the inertial response of any event, which is almost instantaneous.
  confidence_note: null
