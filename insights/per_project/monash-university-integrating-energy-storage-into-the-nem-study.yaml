- record_id: ARENA-DLV-42453
  source_title: Monash - Storage integration in the NEM - Milestone report 3
  publish_date: 2023-11
  project_name: Storage integration in the NEM
  what_happened: The block bidding workstream encountered serious technical difficulties
    when the decision to bid across multiple block-duration markets gave rise to a
    system of coupled Partial Differential Equations that is generally not solvable,
    requiring the team to weaken the solution concept from ex post optimal in all
    markets to ex post optimal only in the active market.
  lesson_learnt: When designing combinatorial or multi-market bidding models, anticipate
    that coupling decisions across markets can produce systems of PDEs that are analytically
    intractable — building in a fallback solution concept (e.g. restricting optimality
    to the active market) at the design stage avoids a more disruptive mid-project
    pivot.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: The team weakened the solution concept to ex post optimality
    in the active market only, converting N+1 coupled PDEs into N+1 independent Ordinary
    Differential Equations that could be solved, allowing the workstream to proceed.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id003
  - 23
  evidence_excerpt: In working on this problem we encountered some serious technical
    difficulties. In a strict sense, because the decision to bid in any one block
    is connected to the decisions to bid in the other markets, this problem gives
    rise to a system of coupled Partial Differential Equations. This system is generally
    not solvable.
  confidence_note: transferability rated narrow — the specific mathematical challenge
    is highly specific to combinatorial market design research; the general lesson
    about solution concept fallbacks has broader applicability but the mechanism is
    narrow.
