  source_title: Monitoring for Better Energy Outcomes Final Report
  publish_date: 2021-06
  project_name: Monitoring for Better Energy Outcomes
  what_happened: Network operators had little visibility of distributed rooftop solar
    performance and grid operating conditions despite rooftop solar supplying over
    75% of South Australia's electricity on 11 October 2020; Solar Analytics provided
    near real-time data including power factor, frequency, load profiles and system
    responses to grid disturbance events to address this gap.
  lesson_learnt: As rooftop solar penetration grows, distribution network operators
    require granular, near-real-time monitoring data (voltage, frequency, power factor,
    load profiles) to manage the grid safely; future projects should establish common
    network visibility standards and pathways to aggregate disparate monitoring data
    sources for NSP use.
