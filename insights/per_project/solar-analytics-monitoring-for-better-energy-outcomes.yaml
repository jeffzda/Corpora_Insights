  source_title: 'Solar Analytics: Monitoring for Better Energy Outcomes – Final Lessons
    Learnt Report'
  publish_date: 2021-03
  project_name: Monitoring for Better Energy Outcomes (ARP010)
  what_happened: Analysis of monitored solar fleet data showed that switching to a
    TOU electricity tariff could save a typical solar household $205 per annum, rising
    to $240 for west-facing systems and falling to $143 for east-facing systems, demonstrating
    that solar panel orientation is a critical variable in tariff selection.
  lesson_learnt: Future projects should incorporate solar system orientation data
    when advising customers on tariff selection — the financial benefit of TOU tariffs
    varies significantly by orientation (from $143 to $240 pa), and this analysis
    can only be delivered reliably through real-time monitoring data.
