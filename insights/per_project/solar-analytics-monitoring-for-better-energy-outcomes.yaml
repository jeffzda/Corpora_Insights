  project_name: Monitoring for Better Energy Outcomes
  what_happened: Early fault identification in the first 6 months of system operation
    increased solar production by 4.8% for small systems and 7.6% for large systems;
    detection of zero-generation faults added a further 3% and 11.9% respectively.
  lesson_learnt: The first 6 months of operation are the highest-risk period for undetected
    faults in residential solar systems — monitoring programs should prioritise early
    activation and alert customers promptly to yield the greatest generation gains.
