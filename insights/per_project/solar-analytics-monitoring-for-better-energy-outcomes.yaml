  - 7
  - 8
  - 10
  evidence_excerpt: With all of this new information and uncertainty for a solar buyer,
    it is still difficult for them to be confident in their solar buying decision...
    the value of this service and the financial rewards are not as apparat to the
    solar buyer, to whom rooftop solar is typically a first-time purchase and rife
    with conflicting statements from solar retailers.
  confidence_note: issue_severity set to moderate as the commercial uptake challenge
