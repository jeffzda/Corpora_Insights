  project_name: Monitoring for Better Energy Outcomes
  what_happened: While smart meters and third-party monitoring services increased
    the volume and quality of data available to network operators, sourcing sufficient
    real-time network data in aggregated, standardised form remained a key unresolved
    challenge at project close.
  lesson_learnt: Aggregating disparate real-time data sources into a form usable by
    network operators is a persistent technical and governance challenge — future
    programs should design for a common network visibility standard from the outset
    rather than attempting post-hoc aggregation of incompatible data streams.
