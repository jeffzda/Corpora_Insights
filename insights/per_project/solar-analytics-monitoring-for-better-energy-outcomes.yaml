- record_id: ARENA-DLV-14256
  source_title: Monitoring for Better Energy Outcomes Final Report
  publish_date: 2021-06
  project_name: Monitoring for Better Energy Outcomes
  what_happened: Grid voltage analysis conducted through the project found that many
    parts of the electricity network were operating in the upper operating zone, a
    condition that went undetected without distributed monitoring data.
  lesson_learnt: Distributed solar monitoring can reveal systemic network voltage
    issues that conventional network instrumentation misses — network operators should
    integrate third-party monitoring data into voltage management practices, particularly
    in high-DER penetration areas.
