  project_name: Monitoring for Better Energy Outcomes
  what_happened: Residential solar customers who used monitoring to shift major load
    appliances (hot water, air-conditioning, pool pumps, EVs) to periods of high solar
    generation saved up to $350 per annum, though savings were highly variable based
    on customer inclination and ability to shift loads.
  lesson_learnt: Combined solar-generation and consumption monitoring can unlock significant
    load-shifting savings, but future projects must account for high variability across
    customer segments — targeted engagement and readily actionable insights are needed
    to realise the benefit at scale.
