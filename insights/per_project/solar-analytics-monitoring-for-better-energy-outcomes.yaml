- record_id: ARENA-DLV-42104
  source_title: 'Solar Analytics: Monitoring for Better Energy Outcomes – Final Lessons
    Learnt Report'
  publish_date: 2021-03
  project_name: Monitoring for Better Energy Outcomes (ARP010)
  what_happened: Consumer surveys conducted during the project found that solar buyers
    remained highly confused at the point of sale — facing uncertainty about equipment
    quality, pricing (which varied by over 60% for similar systems), retailer trustworthiness,
    and the value of monitoring — making it difficult to present the benefits of solar
    monitoring as an add-on at the time of purchase.
  lesson_learnt: Presenting solar monitoring at the point of sale is ineffective because
    buyers face information overload from the solar purchase itself; future projects
    should explore embedding monitoring value within other products or services, or
    improving pre-sale consumer education, rather than relying on point-of-sale upsell.
  issue_severity: moderate
  project_type: DER/customer-side
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: commercial & market
  outcome_class: partial success
  secondary_failure_mode: coordination & stakeholders
  intervention_note: null
  transferability: broad
