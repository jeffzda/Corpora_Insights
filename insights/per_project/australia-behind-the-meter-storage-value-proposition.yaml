- record_id: ARENA-DLV-16277
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australia — Behind-the-Meter Storage Value Proposition
  what_happened: Analysis of Australian market segments found the end-user behind-the-meter market segment offered the highest and most predictable revenue for energy storage, with self-consumption value
    of exported solar electricity of $0.21/kWh (vs export tariffs of ~$0.08/kWh), and up to $0.47/kWh during peak TOU periods. This was substantially higher than wholesale market or T&D revenues.
  lesson_learnt: Behind-the-meter solar PV pairing is the strongest near-term business case for energy storage in Australia; demonstration projects and investment priorities should focus on this segment
    first to generate replicable commercial evidence, before moving to segments with weaker or more variable revenue streams.
