  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: Unitywater identified that semi-continuous anaerobic digestion testing
    had not been conducted during the project, leaving optimum organic loading rates
    for FOG co-digestion and process stability under continuous operation uncharacterised,
    requiring further study before implementation.
  lesson_learnt: Commission semi-continuous anaerobic digestion studies (not just
    batch tests) during feasibility — batch bio-methane potential tests are insufficient
    to characterise process inhibition, stability and optimum organic loading rates
    for FOG co-digestion at operational scale.
  issue_severity: moderate
