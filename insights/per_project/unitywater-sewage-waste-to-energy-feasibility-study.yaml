- record_id: ARENA-DLV-69412
  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: Unitywater acknowledged that a major learning from the project was
    the need for effective project management throughout the duration, and identified
    post-project that it lacked a dedicated individual with appropriate skills to
    lead its growing renewable energy and energy neutrality programme.
  lesson_learnt: Appoint a dedicated programme manager with relevant technical and
    commercial skills before commencing a multi-milestone feasibility programme —
    absence of this capability mid-project contributed to inability to deliver the
    final milestone when corporate strategy shifted, and is a prerequisite for scaling
    up a portfolio of similar projects.
  issue_severity: moderate
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: close-out/post-project review
  proponent_type: government/public-sector body
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Unitywater commenced active recruitment for a dedicated programme
    leader with the skills to lead future renewable energy projects across its STP
    portfolio.
  transferability: broad
