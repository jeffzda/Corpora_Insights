- record_id: ARENA-DLV-69413
  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: Sampling of STP influent and effluent was conducted without explicit
    controls to avoid high-rainfall periods, and the project identified retrospectively
    that inflow and infiltration during wet weather produces unrepresentative samples
    that could lead to flawed design assumptions.
  lesson_learnt: Schedule STP influent and effluent sampling campaigns outside of
    high-rainfall periods — inflow and infiltration during wet weather materially
    distorts sample characteristics, producing an unrepresentative picture of base-flow
    sewage that could lead to under- or over-sizing of anaerobic digestion capacity.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: government/public-sector body
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
  source_pages: &id013
  - 12
  evidence_excerpt: Decisions on the sampling period should be made to avoid sampling
    during high rainfall periods, reducing the impact of inflow and infiltration on
    samples. By avoiding sampling in times where infiltration and inflow is higher
    a more representative picture of the base flow sewage characteristics is achieved.
  confidence_note: null
