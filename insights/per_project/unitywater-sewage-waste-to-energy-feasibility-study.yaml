- record_id: ARENA-DLV-69406
  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: Stratification testing revealed that variance in physio-chemical
    properties of FOG feedstocks necessitates a preliminary receival tank with vertical
    mixing to homogenise incoming feed and prevent stratification, reducing shock
    to the anaerobic digestion process.
  lesson_learnt: Include a dedicated FOG receival tank with external recirculation
    mixing equipment in the plant design — homogenisation of incoming feedstocks is
    essential to protect anaerobic digester stability, and locating recirculation
    equipment outside the tank improves ease of operation and maintenance.
