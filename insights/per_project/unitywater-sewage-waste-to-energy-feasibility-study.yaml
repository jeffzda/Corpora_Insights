- record_id: ARENA-DLV-69405
  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: The feasibility study found that FOGs represent the best feedstock
    opportunity for anaerobic co-digestion at sewage treatment plants due to high
    biomethane potential, high availability, and low sulphur, nitrogen and phosphorous
    content, despite inconsistent quality.
  lesson_learnt: Prioritise FOGs as the co-digestion feedstock of choice for sewage
    treatment plant waste-to-energy projects — their high biomethane potential and
    low risk of process upset or equipment corrosion outweigh quality variability
    concerns, which can be managed through receival tank homogenisation.
