- record_id: ARENA-DLV-69410
  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: Unitywater's chemical characterisation of all 17 of its STPs found
    that influent, effluent and waste activated sludge characteristics varied significantly
    from plant to plant, confirming that site-specific sampling is essential before
    designing energy neutrality solutions for individual plants.
  lesson_learnt: Do not transfer technology sizing or process design assumptions between
    sewage treatment plants without site-specific influent/effluent characterisation
    — the high variability between plants means that a solution viable at one STP
    may not be technically or economically viable at another without independent assessment.
