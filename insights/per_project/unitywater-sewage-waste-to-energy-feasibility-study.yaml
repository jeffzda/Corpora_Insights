- record_id: ARENA-DLV-69407
  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: The life cycle assessment and mass and energy balances found that
    the environmental benefits of co-digestion diminish as the digester approaches
    design capacity, and that electricity production is also constrained by co-generation
    engine size.
  lesson_learnt: Size the co-generation engine and digester capacity together when
    designing a waste-to-energy co-digestion facility — both components impose binding
    production ceilings, and under-sizing either will limit energy and GHG reduction
    benefits before the facility reaches commercial-scale feedstock throughput.
