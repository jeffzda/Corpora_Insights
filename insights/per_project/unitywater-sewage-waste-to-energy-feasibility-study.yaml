  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: The feasibility study found that gate fees received for waste disposal
    are a critical determinant of financial viability for a waste-to-energy co-digestion
    facility, and that the attractiveness of the facility to feedstock suppliers depends
    heavily on logistical efficiency, access, and unloading speed.
  lesson_learnt: Design FOG receival facilities with logistics as a primary constraint
    — weighbridges, fast unloading, broad operating hours, and wash-down facilities
    are key to attracting and retaining waste suppliers willing to pay a gate fee,
    which directly drives commercial viability.
