  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Unitywater and ARENA agreed to mutual termination of the funding
    agreement, preserving the knowledge outputs from Milestones 1–3 and releasing
    a public failure report.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: bioenergy
