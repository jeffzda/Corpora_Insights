  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: Waste disposal companies declined to enter into Memoranda of Understanding
    or advance procurement agreements for FOG feedstock supply at the completion of
    Milestone 2, citing uncertainty around Queensland's End of Waste Code legislation.
  lesson_learnt: Secure binding feedstock supply agreements before committing capital
    to a waste-to-energy co-digestion facility — regulatory uncertainty around waste
    classification legislation (such as End of Waste Codes) materially reduces waste
    suppliers' willingness to contract, which can undermine commercial viability regardless
    of technical feasibility.
