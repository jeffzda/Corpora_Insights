- record_id: ARENA-DLV-69411
  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: Unitywater's feasibility study confirmed a net-positive Energy Returned
    on Energy Invested (EROEI) ratio for the co-digestion and co-generation configuration
    at Kawana STP, with a reduction in fossil fuel usage and a reduction of more than
    30% in total electricity requirements.
  lesson_learnt: Anaerobic co-digestion of FOGs using latent digester capacity at
    existing sewage treatment plants can deliver a net-positive EROEI and material
    electricity cost reductions — the Kawana case study provides a transferable checklist
    of technical, commercial and regulatory considerations for similar small-to-medium
    scale facilities in Australia.
