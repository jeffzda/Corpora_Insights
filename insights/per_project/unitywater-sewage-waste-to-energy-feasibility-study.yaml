- record_id: ARENA-DLV-69401
  source_title: Unitywater Final and Project Failure Report
  publish_date: '2019-08-30'
  project_name: Unitywater Sewage Waste to Energy Feasibility Study (G00866)
  what_happened: In February 2019, Unitywater applied for a time variation on Milestone
    4 (energy neutrality business cases for nine STPs) due to an internal strategic
    direction change that adopted a goal for a fleet of self-sustaining STPs by 2027.
    Unitywater and ARENA subsequently agreed to mutual termination of the funding
    agreement on 4 July 2019, with Milestone 4 undelivered.
  lesson_learnt: Align ARENA-funded project milestones explicitly to the proponent's
    current corporate strategy before committing to scope — a mid-project shift in
    internal strategic priorities can render remaining milestones undeliverable within
    the agreed timeframe, forcing mutual termination rather than completion.
  issue_severity: major
