  project_name: Street Light Pole EV Charger with Grid Integration Project
  what_happened: During the project mobilisation phase, equipment supplier Schneider
    Electric released an updated EV charger model (EVlink Pro AC) that integrates
    a revenue-grade meter and communications functionality in a single unit, replacing
    the multi-component setup originally specified. This reduced the number of external
    physical installations required.
