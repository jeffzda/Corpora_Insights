- record_id: ARENA-DLV-18402
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 3
  publish_date: '2024-06-28'
  project_name: Street Light Pole EV Charger Project
  what_happened: A high proportion of initially selected sites were rejected at various
    stages of the 10–15 step sequential approval process. Site rejections exceeded
    estimated numbers with most council partners, forcing repeated approval cycles
    and causing considerable time delays and resource wastage.
  lesson_learnt: Select 2–4 times as many candidate sites as you plan to install.
    Site rejections will exceed initial estimates across multiple approval stages,
    and repeating the sequential process consumes weeks to months per rejection cycle
    — a buffer of candidate sites is essential to maintain progress.
