- record_id: ARENA-DLV-18406
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 3
  publish_date: '2024-06-28'
  project_name: Street Light Pole EV Charger Project
  what_happened: DNSP Facilities Access Agreements (FAAs) were required to use DNSP
    infrastructure, but the terms — adapted from telecommunications tower agreements
    — transferred significant risk and liability to the installer with little ability
    to negotiate. Several leading international and local trade players declined to
    participate in the project due to unfavourable FAA terms.
  lesson_learnt: Engage the DNSP early to align contractually, commercially and technically.
    FAA terms for EV charging are onerous and non-negotiable in their current form;
    proponents should assess commercial viability of the FAA and SNA fee structures
    (application and annual pole rental) before committing to a site pipeline, as
    only high-utilisation sites will be viable.
