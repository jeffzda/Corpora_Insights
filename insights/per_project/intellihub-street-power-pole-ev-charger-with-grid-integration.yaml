- record_id: ARENA-DLV-18405
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 3
  publish_date: '2024-06-28'
  project_name: Street Light Pole EV Charger Project
  what_happened: On several occasions, Intellihub lost previously approved sites to
    competing market participants who signed DNSP Site Nomination Agreements (SNAs)
    without obtaining or notifying councils. This occurred despite Intellihub already
    holding DNSP pre-approval (load and structural) and full council approval for
    those sites.
  lesson_learnt: Secure DNSP Site Nomination Agreements as early as possible — other
    parties (including construction-related parties with greater pole access rights)
    can sign SNAs without council approval, displacing a CPO that has already completed
    full council and DNSP pre-approval. The gap between council and DNSP approval
    processes is a material site-loss risk.
