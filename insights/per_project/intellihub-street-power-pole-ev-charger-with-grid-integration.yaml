  publish_date: 2022-12
  project_name: Street Light Pole EV Charger Project 2021/ARP002
  what_happened: Public EV charger metering for pole-mounted infrastructure required
    both on-market NMI-based electricity metering (compliant with the NER and AEMO)
    and separate E-mobility service provider metering for consumer billing; no existing
    integration between National Metering Providers and EVCS E-mobility Service Providers
    existed, forcing a dual-meter design and identifying a structural gap in market
    infrastructure.
  lesson_learnt: Public pole-mounted EV charger projects must design for both on-market
    NMI metering and EVCS consumer billing metering as separate systems — there is
    currently no integration between National Metering Providers and EVCS E-mobility
    Service Providers in Australia, adding complexity and cost that should be budgeted
    for in the design phase.
