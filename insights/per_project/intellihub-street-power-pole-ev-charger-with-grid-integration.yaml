  project_name: Street Light Pole EV Charger Project 2021/ARP002
  what_happened: Physical design for the pole-mounted EV charger had to account for
    compliance with DNSP climbing risk regulations, disabled access requirements (paraplegic
    access height), public head-bump hazard clearance, and anti-vandalism protection
    — each requiring specific design consideration and collectively adding significant
    design complexity.
  lesson_learnt: Physical design of pole-mounted EV chargers must concurrently address
    DNSP climbing risk clearances, disabled access mounting heights, public safety
    (head clearance), and anti-vandalism protection; treating these as sequential
    rather than integrated design constraints will generate costly rework — they should
    be incorporated into the design brief from the outset.
