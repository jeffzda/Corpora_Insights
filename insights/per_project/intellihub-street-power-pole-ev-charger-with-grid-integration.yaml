- record_id: ARENA-DLV-18407
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 3
  publish_date: '2024-06-28'
  project_name: Street Light Pole EV Charger Project
  what_happened: There was no existing Australian-standard integrated AC charger unit
    combining metering, communications, and protection in a single device. A custom
    two-unit solution (EV charger plus separate main switchboard) with a custom mounting
    bracket had to be developed and built locally to meet the project's technical
    and space requirements.
  lesson_learnt: For pole-mounted EV charger installations using commercially available
    charger models, a suitable pole attachment frame should not be assumed to be available
    off-the-shelf — proponents should confirm mounting hardware availability early
    in design or budget for custom fabrication, and at scale a combined custom attachment
    and protection enclosure would reduce both cost and installation time.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: procurement/supply chain
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Selected an off-the-shelf EV charger with added mechanical protection
    and paired it with a locally sourced switchboard; developed a custom mounting
    bracket and had the solution inspected and pre-approved by the DNSP at a mock
    installation facility.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 4
  - 15
  - 17
  evidence_excerpt: Due to the configuration of the selected Schneider Electric charger
    model, a custom attachment frame was required for mounting onto the pole. This
    was not available across our project partner network, and so was developed in-house
    by Intellihub engineers and validated through external design engineers.
