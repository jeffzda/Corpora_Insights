  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 3
  publish_date: '2024-06-28'
  project_name: Street Light Pole EV Charger Project
  what_happened: Intellihub approached 12 councils to join the project but only 8
    agreed, with others declining due to misaligned EV strategies, commercial concerns,
    competing priorities, or incompatible timelines. Trepidation among councils about
    impacts on parking spaces was a recurring barrier.
  lesson_learnt: Approach significantly more councils than required and engage early
    — only 8 of 12 approached agreed to participate. Factor in council-level variability
    in EV strategy maturity, commercial appetite, and competing priorities when building
    a council pipeline.
