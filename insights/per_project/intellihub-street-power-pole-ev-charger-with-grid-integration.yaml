- record_id: ARENA-DLV-63301
  source_title: Intellihub - Street Light Pole EV Charger with Grid Integration -
    Lessons Learnt Report 1
  publish_date: 2022-07
  project_name: Street Light Pole EV Charger with Grid Integration Project
  what_happened: The project initially planned to attach EV chargers to street lighting
    poles, but the DNSP (Ausgrid) recommended using power poles instead, because Australian
    street lighting infrastructure still uses higher-draw older lighting technology
    and underground cabling common in European cities is absent here. The design scope
    shifted to power poles early in the planning phase with minimal project impact.
  lesson_learnt: Do not assume street lighting poles are viable mounting points for
    EV chargers in Australian urban settings — engage the local DNSP early to confirm
    appropriate pole type, as infrastructure differences from overseas deployments
    (underground cabling, LED lighting penetration) make direct replication of European
    models unsuitable.
