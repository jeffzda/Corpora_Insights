  what_happened: Managing multiple components arriving from different suppliers required
    strong stock control. Site-specific barcodes and identifiers were also needed
    to enrol each charger onto the EV owner app, which complicated the field service
    provider's responsibilities and required new processes and solutions to be developed
    mid-project.
  lesson_learnt: Plan for site-specific asset tracking and enrolment requirements
    before procurement. When components arrive from multiple suppliers and each unit
    must be individually enrolled onto a customer-facing platform, stock control and
    barcode/identifier management must be designed into the logistics workflow from
    the outset — retrofitting these processes mid-project adds cost and complexity.
