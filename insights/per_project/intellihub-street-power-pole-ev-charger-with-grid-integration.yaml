- record_id: ARENA-DLV-23101
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 2
  publish_date: 2022-12
  project_name: Street Light Pole EV Charger Project 2021/ARP002
  what_happened: During pole selection with councils, Intellihub discovered that a
    large proportion of nominated poles were unsuitable for EV charger attachment
    due to structural, electrical, and safety characteristics — many of which were
    undocumented, not obvious, and only identifiable in consultation with the DNSP.
    Unsuitable categories included steel/concrete poles, poles with UGOH attachments,
    HV air-break switches, pole-top transformers, stayed/stay poles, condemned poles,
    nailed poles, and termite-tagged poles.
  lesson_learnt: Not all street poles are suitable for EV charger attachment — proponents
    must develop a detailed, DNSP-validated pole eligibility checklist before commencing
    site nomination with councils, as many disqualifying characteristics are undocumented
    or non-obvious. Building eligibility criteria into a digital smart form used in
    the field significantly reduces ineligible nominations and saves time for all
    parties.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: approvals/regulatory
