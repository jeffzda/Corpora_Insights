  what_happened: Flooding risk emerged as a new lens applied by councils across most
    new developments, causing discussion and delays at a number of sites. Occasionally,
    council requests for installation design alterations to address flood risk could
    not be met due to conflicting DNSP height requirements, resulting in site rejections.
  lesson_learnt: Assess flood risk early for each candidate site and confirm that
    the proposed installation design satisfies both council flood risk requirements
    and DNSP height/installation specifications before committing the site to the
    approval pipeline. Conflicts between council and DNSP design requirements can
    result in site loss even after community and traffic committee approval.
