- record_id: ARENA-DLV-23111
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 2
  publish_date: 2022-12
  project_name: Street Light Pole EV Charger Project 2021/ARP002
  what_happened: The DNSP found the public EV charging stations unsuitable to be classified
    as Special Small Services (Permanently Unmetered Supplies) because EV charging
    does not have a consistent and known energy consumption pattern, blocking this
    potential regulatory pathway and requiring investigation of alternative connection
    categories.
  lesson_learnt: Proponents should not assume that pole-mounted public EV chargers
    can be classified as Special Small Services or Permanently Unmetered Supplies
    under NSW rules — the variable load profile of EV charging disqualifies this classification,
    and on-market metering will be required, adding connection complexity and cost.
