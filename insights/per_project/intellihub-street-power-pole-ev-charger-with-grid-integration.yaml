- record_id: ARENA-DLV-63304
  source_title: Intellihub - Street Light Pole EV Charger with Grid Integration -
    Lessons Learnt Report 1
  publish_date: 2022-07
  project_name: Street Light Pole EV Charger with Grid Integration Project
  what_happened: During site nomination in collaboration with councils, parking orientation
    emerged as a significant design consideration. AC chargers with longer cables
    offer more flexibility across perpendicular, angled, and parallel parking configurations,
    but each orientation presents different requirements for equipment protection,
    cord management, and pedestrian safety.
  lesson_learnt: Incorporate parking orientation analysis into site design for pole-mounted
    EV chargers — perpendicular and angled parking are preferable to parallel due
    to flexibility for varied EV charging port locations, but require wheel stops
    or bollards for infrastructure protection; cable management and pedestrian safety
    must be assessed for each configuration.
