- record_id: ARENA-DLV-23113
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 2
  publish_date: 2022-12
  project_name: Street Light Pole EV Charger Project 2021/ARP002
  what_happened: SafeWork NSW and the NSW Department of Environment advised that safety
    obligations for EV charging cables in public spaces belong to the cable owner
    (the customer), not the charger operator, creating an unresolved ambiguity in
    operator liability and pointing to a need for further consultation with NSW Fair
    Trading on electrical consumer laws.
  lesson_learnt: Public pole-mounted EV charging operators in NSW should proactively
    clarify the regulatory liability boundary for charging cables with NSW Fair Trading
    and local councils before go-live — SafeWork NSW has confirmed that trip hazard
    obligations rest with the cable owner (customer), but the interaction with electrical
    consumer laws and council-specific requirements requires separate resolution.
  issue_severity: minor
  project_type: transport electrification
  project_scale_band: pilot
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Intellihub noted the need to consult with NSW Fair Trading regarding
    electrical consumer laws and local councils on matters outside SafeWork NSW jurisdiction.
  transferability: moderate
  delay_magnitude: null
  technology_domain: EV
  source_pages: &id022
  - 30
  evidence_excerpt: SafeWork NSW and the NSW Department of Environment has advised
