- record_id: ARENA-DLV-63302
  source_title: Intellihub - Street Light Pole EV Charger with Grid Integration -
    Lessons Learnt Report 1
  publish_date: 2022-07
  project_name: Street Light Pole EV Charger with Grid Integration Project
  what_happened: The installation partner determined that mounting EV chargers on
    wooden poles is cheaper and easier than on metal poles, with a cost difference
    of approximately $250 per site, due to differences in affixing hardware required
    for the charger unit, protection circuitry, power cabling, physical shielding,
    and grounding.
  lesson_learnt: When planning pole-mounted EV charger rollouts, prioritise sites
    with wooden poles where feasible — the cost saving of approximately $250 per site
    compared to metal poles is material at scale and should be factored into site
    selection and budget modelling.
