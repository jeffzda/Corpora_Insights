  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 3
  publish_date: '2024-06-28'
  project_name: Street Light Pole EV Charger Project
  what_happened: The high number of sequential approvals required across multiple
    large stakeholders meant that multiple site revisits were necessary to fully install
    and bring EV chargers online, creating significant time and cost inefficiencies.
    This was identified as a challenge requiring resolution before larger rollouts.
  lesson_learnt: Design the installation workflow to minimise site revisits caused
    by sequential approval dependencies. For larger rollouts, batch approval and installation
    scheduling should be coordinated across councils, DNSPs, and energy retailers
    to reduce the number of return visits per site.
