  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Intellihub developed a web-based Site Nomination Guidance smart
    form accessible via mobile phone that steps field workers through pole eligibility
    criteria, reducing ineligible nominations and streamlining the workflow for councils
    and the network company.
