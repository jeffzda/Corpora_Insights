- record_id: ARENA-DLV-23104
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 2
  publish_date: 2022-12
  project_name: Street Light Pole EV Charger Project 2021/ARP002
  what_happened: The electrical design process identified that NSW Service & Installation
    Rules contained no provisions specifically covering the installation of metered
    services on distribution poles of the type required for pole-mounted public EV
    chargers; existing categories (Special Small Service, Overhead Service, Underground
    Service) did not cleanly fit the use case, requiring Intellihub to seek a regulatory
    interpretation and adapt UGOH service rules to a non-UGOH application.
  lesson_learnt: Before commencing detailed electrical design for pole-mounted EV
    chargers in NSW, engage NSW Fair Trading and the DNSP early to establish which
    Service & Installation Rules category will be applied — existing rules do not
    contemplate this installation type and an agreed regulatory interpretation must
    be secured before design can be finalised.
  issue_severity: moderate
  project_type: transport electrification
  project_scale_band: pilot
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Intellihub adopted UGOH Service requirements (section 2.10 of
    NSW Service & Installation Rules) as the closest applicable clause and engaged
    NSW Fair Trading to negotiate exemptions to metering location and mounting height
    requirements.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: EV
  source_pages:
  - 13
  evidence_excerpt: The Service & Installation Rules Annexure – Metering, placed a
    restriction on the location of the metering equipment. Clause 2.3 states that
    the mounting of metering equipment on the electricity distributors asset is considered
    unsuitable. In consultation with NSW Fair Trading, an exemption to this clause
    and the height of the on-market metering equipment was granted.
  confidence_note: Transferability rated moderate rather than narrow because the regulatory
    gap finding is likely to affect any proponent attempting pole-mounted public EV
    charging in NSW and potentially other jurisdictions with similarly outdated Service
    & Installation Rules. Canonical record merged from 2 source records across 1 document(s).
