  publish_date: 2022-12
  project_name: Street Light Pole EV Charger Project 2021/ARP002
  what_happened: New EV charger hardware options became available mid-project that
    incorporated metering directly into the charger unit, reducing the required meter
    count from three to one per charger. However, the integrated modem on the new
    Schneider unit was unavailable due to global supply constraints associated with
    the new product launch in Australia, requiring a separate modem to be sourced
    and added.
  lesson_learnt: When selecting EV charging hardware for a pilot, verify actual in-market
    availability of specified components — particularly integrated modems — before
    finalising design, as global supply constraints on newly launched products can
    force late-stage redesign and added cost even when the hardware specification
    is correct.
