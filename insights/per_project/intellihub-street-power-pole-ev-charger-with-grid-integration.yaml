- record_id: ARENA-DLV-23112
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 2
  publish_date: 2022-12
  project_name: Street Light Pole EV Charger Project 2021/ARP002
  what_happened: At scale, having separate components for pole attachment, EV charging
    hardware, electrical protection, metering equipment, communications equipment,
    and mechanical protection enclosure increases cost, installation time, and the
    number of standards exemptions required. The project identified that a single
    combined integrated unit would address all of these issues but no such product
    exists in the market.
  lesson_learnt: At deployment scale, a custom combined pole attachment and integrated
    EVCS enclosure incorporating charging hardware, electrical protection, metering,
    communications, and mechanical protection would materially reduce cost and installation
    time and could be designed to comply with existing standards without exemptions
    — this is a product development opportunity that the market has not yet addressed.
