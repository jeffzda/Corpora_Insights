- record_id: ARENA-DLV-18403
  source_title: Intellihub - Street Power Pole EV Charger with Grid Integration -
    Lessons Learnt Report 3
  publish_date: '2024-06-28'
  project_name: Street Light Pole EV Charger Project
  what_happened: Council community engagement and traffic committee approval processes
    introduced structured, multi-week delays at each site. Community consultation
    required 2–3 weeks to prepare, 4 weeks minimum publication time, and 1–3 weeks
    post-consultation analysis; traffic committees met only bi-monthly, creating a
    potential 4-month delay per site if a submission missed a meeting cycle.
  lesson_learnt: Engage councils early and factor 3–5 months into project plans for
    council support processes. Traffic committees in NSW meet bi-monthly and missing
    one meeting adds up to 4 months of delay — plan site submission timing to align
    with committee schedules.
