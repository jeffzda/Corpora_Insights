  publish_date: '2024-06-28'
  project_name: Street Light Pole EV Charger Project
  what_happened: Temporary adhesive sticker signage used for on-road EV parking designations
    (in lieu of permanent painted markings) proved insufficiently robust to survive
    outdoor conditions and failed in service. Many councils declined to invest in
    permanent painted signage given the 12-month trial nature of the project.
  lesson_learnt: Temporary sticker-based on-road signage is not durable enough for
    outdoor use in EV charging deployments. When permanent painted markings are not
    feasible due to trial durations, an alternative durable interim signage solution
    must be identified before installation — sticker signage cannot be relied upon.
