  project_name: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  what_happened: The project significantly underestimated the effort required to install
    100 data loggers in residential homes, leading to delays and diversion of personal
    resources away from technical and scientific work.
  lesson_learnt: Future projects requiring data logger deployment in residential homes
    should partner with a larger installation company from the outset — the project
    underestimated legal approvals, electrician requirements, volunteer selection,
    and site inspection workloads, which consumed resources intended for core research.
