  source_title: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  publish_date: 2016-07
  project_name: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  what_happened: The project found that standard RMSE performance measures used by
    market operators (ActewAGL, AEMO) and academics do not reflect the underlying
    utility of forecasts for different market participants, with two forecasts showing
    a two-fold RMSE difference but the lower-RMSE forecast being operationally inferior
    for ramp detection.
  lesson_learnt: PV forecast evaluation should use participant-specific performance
    measures beyond RMSE — for grid operators, use balanced error from ramp detection;
    for generators bidding in the market, use simulated dollar income; naïve RMSE
    optimisation can select forecasts that are operationally worse for the intended
    use case.
