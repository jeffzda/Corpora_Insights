  what_happened: The project found that imputing missing distributed PV data by simply
    averaging available sites at the same time step performed as well as mathematically
    sophisticated probabilistic methods (Bayes nets, Markov random fields, joint Gaussian),
    while being far more computationally efficient.
  lesson_hernt: For handling missing data in distributed PV monitoring networks, mean
    imputation across available sites at the same time step is sufficient and computationally
    efficient — sophisticated probabilistic imputation methods provided no accuracy
    advantage in this study and should not be prioritised over simpler approaches.
