  what_happened: The project initially developed camera software on Microsoft Windows,
    but found that Linux provided better support for secure data transmission tools
    and was the standard OS for target mini-computer systems (e.g. Raspberry Pi),
    requiring a platform switch during the project.
  lesson_learnt: For IoT sensor or edge-computing deployments targeting low-cost embedded
    hardware, select the target operating system (Linux) as the development platform
    from day one to avoid costly mid-project software port and rework.
