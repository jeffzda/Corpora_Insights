  source_title: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  publish_date: 2016-07
  project_name: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  what_happened: The project found that 30-minute interval substation data was insufficient
    to observe meaningful correlations with distributed PV power output, with correlation
    coefficients near zero or inconsistent in sign; 5-minute interval data was required
    to detect reliable negative correlations.
  lesson_learnt: Distribution network operators analysing the impact of distributed
    PV on grid loads should use 5-minute (not 30-minute) interval substation data
    — 30-minute averaging masks the rapid ramp events driven by cloud cover changes,
    producing weak or spurious correlations that are uninformative for operational
    planning.
