  source_title: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  publish_date: 2016-07
  project_name: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  what_happened: Even with 5-minute interval data, correlations between monitored
    PV output from 100 sites and zone substation loads were inconsistent across ramp
    event dates until a regional PV simulation system (RPSS) was used to model all
    12,000+ PV systems on ActewAGL's network, at which point strong negative correlations
    were observed.
  lesson_learnt: Substation-level PV impact analysis using a sample of monitored sites
    will produce unreliable results — a regional PV simulation model that infers total
    fleet output from the monitored sample is essential to achieve robust correlations
    with network load data.
