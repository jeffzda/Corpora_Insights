  what_happened: The project found that increasing the amount of training data or
    using more complex models (neural networks) did not necessarily improve prediction
    accuracy on unseen data when real data contained noise and incompleteness, contrary
    to a common assumption.
  lesson_learnt: For ML-based solar forecasting on real-world noisy and incomplete
    data, regularisation and judicious feature/model selection outperform simply adding
    more training data or model complexity — using a larger neighbourhood than ~30
    nearest sites actually degraded 10-minute forecasts, and training on more than
    3–4 quarters of historical data offered no benefit.
