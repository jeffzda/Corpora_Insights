  what_happened: Training on more than 3–4 quarters of historical data provided no
    accuracy benefit and could slightly harm performance for the 10-minute horizon,
    because older data included periods when fewer sites were reporting, introducing
    more imputed (mean-filled) values.
  lesson_learnt: Limit historical training windows for distributed PV forecasting
    to approximately 3–4 quarters of recent data; using older data when the sensor
    network was sparser introduces systematic imputation errors that degrade model
    performance.
