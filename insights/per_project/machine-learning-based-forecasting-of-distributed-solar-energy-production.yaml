  - 107
  evidence_excerpt: Technical challenges arise from the fact that those locations
    on the ACT boundary are often far away from a wireless connection point. In many
    cases, multiple visits to the location were necessary in order to optimise the
    antenna position for the wireless transmission based on data recorded over the
    previous days.
