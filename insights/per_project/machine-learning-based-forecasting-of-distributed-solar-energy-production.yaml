  what_happened: Sky image radiance features, when combined with PV time series data,
    reduced forecast RMSE by 16.7% over persistence for the 30-minute horizon compared
    to 8.4% for time series alone, but optical flow features consistently degraded
    forecast accuracy.
  lesson_learnt: Sky image radiance features around the projected sun position provide
    measurable forecast accuracy gains when fused with PV time series, particularly
    at longer horizons (30 min+); optical flow features should not be included without
    empirical validation as they consistently increased error in this study.
