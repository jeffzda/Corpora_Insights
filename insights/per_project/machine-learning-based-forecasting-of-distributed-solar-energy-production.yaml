  source_title: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  publish_date: 2016-07
  project_name: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  what_happened: The VGG net deep convolutional neural network (134 million parameters)
    could not be successfully trained on sky image data from random initialisation
    due to insufficient data, and fine-tuning from an ImageNet-pretrained model produced
    only constant predictions because ImageNet images have fundamentally different
    properties from sky images.
  lesson_learnt: Large deep learning architectures (e.g. VGG net) trained on natural
    image datasets cannot be reliably fine-tuned for sky image forecasting tasks due
    to domain mismatch; use smaller, purpose-tailored networks (e.g. AlexNet adapted)
    that can be trained from random initialisation on domain-specific data.
