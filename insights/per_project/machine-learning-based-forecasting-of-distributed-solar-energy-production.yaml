  what_happened: PV system tilt and azimuth metadata was not always provided by system
    owners and in some cases was incorrect, undermining the accuracy of clear-sky
    modelling that underpinned the quality control algorithm.
  lesson_learnt: Do not rely on self-reported PV system orientation metadata; build
    an automated algorithm to infer tilt and azimuth from observed power output time
    series (by minimising RMSE against simulated clear-sky output) as a standard data
    curation step.
