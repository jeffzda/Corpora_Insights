  source_title: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  publish_date: 2016-07
  project_name: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  what_happened: Data logger sites on the ACT boundary experienced wireless connectivity
    challenges because they were far from wireless connection points, requiring multiple
    site visits to optimise antenna positioning.
  lesson_learnt: When deploying IoT monitoring hardware at geographically distributed
    or peripheral locations, pre-assess wireless connectivity before finalising site
    selection, and budget for multiple visits to optimise antenna placement at low-signal
    locations.
