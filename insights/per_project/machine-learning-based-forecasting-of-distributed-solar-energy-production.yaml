  what_happened: One sky camera's network connection could not use the campus wired
    network due to facility lightning-protection regulations, and campus wireless
    bandwidth was insufficient for the required data rates, requiring a custom dedicated
    wireless link to be built.
  lesson_learnt: Before deploying high-data-rate sensor hardware on institutional
    campuses, confirm both the permitted physical network connection type and available
    wireless bandwidth — facility regulations (e.g. lightning protection) may prohibit
    wired connections while campus wireless may be inadequate, requiring bespoke network
    infrastructure.
