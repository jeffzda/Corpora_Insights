  source_title: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  publish_date: 2016-07
  project_name: Machine-Learning-Based Forecasting of Distributed Solar Energy Production
  what_happened: Machine learning forecasting with a joint (distributed network) predictor
    outperformed a single-site local predictor by up to 31.1% RMSE reduction over
    the persistence baseline at the 60-minute horizon, demonstrating the value of
    aggregating data from neighbouring PV sites.
  lesson_learnt: Distributed PV forecasting systems should aggregate data from neighbouring
    sites rather than relying on single-site local predictors — the improvement over
    a persistence baseline is modest at 10 minutes (9%) but substantial at 60 minutes
    (31%), making network-level data sharing most valuable for longer forecast horizons.
