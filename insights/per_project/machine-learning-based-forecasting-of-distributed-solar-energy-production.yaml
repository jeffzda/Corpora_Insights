    which has an unusually high proportion of clear-sky or uniformly overcast days,
    making it difficult to improve on persistence forecasts and limiting the generalisability
    of results.
  lesson_learnt: When designing ML-based solar forecasting research projects, select
    data collection sites with high cloud variability (mixed cloud cover days); Canberra's
    predominantly clear or fully overcast conditions made the forecasting problem
    easier for persistence models and likely understated the improvement achievable
    by ML methods in more cloud-variable locations.
