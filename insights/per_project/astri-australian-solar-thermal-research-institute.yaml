  what_happened: ASTRI found that pursuing lower capital costs for heliostats can
    come at the expense of product life, performance, or increased operating and maintenance
    costs, meaning CAPEX-focused optimisation alone is an unreliable design objective.
  lesson_learnt: Heliostat design optimisation must use technoeconomic tools that
    link component parameters through to whole-of-life LCOE rather than minimising
    CAPEX alone — cost reductions that increase OPEX or reduce performance can produce
    worse overall outcomes.
