  project_name: ASTRI Project 4.2 — Beam-Down Particle Technology for Mining
  what_happened: Thermal ore pre-treatment using direct solar irradiation was found
    to be effective only when using high flux/fast heating rates; slow convective
    heating was found to be inefficient for short exposure times or energetically
    inefficient for longer exposure, meaning that thermal storage cannot substitute
    for direct irradiation in this application.
  lesson_learnt: For solar thermal mineral processing applications requiring fast
    heating rates, direct irradiation is necessary and thermal storage cannot provide
    a viable substitute — project designs that assume stored thermal energy can replicate
    direct radiation flux for such processes will fail to achieve the required process
    outcome.
