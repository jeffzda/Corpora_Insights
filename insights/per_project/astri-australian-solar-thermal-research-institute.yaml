  project_name: Australian Solar Thermal Research Institute (ASTRI)
  what_happened: The O&M project identified that the costs of operations and maintenance
    for solar thermal systems — including heliostat cleaning, staffing optimisation,
    and equipment failure risk management — are not well documented or understood,
    creating significant uncertainty for investment decisions and project finance
    approvals.
  lesson_learnt: Solar thermal project proponents should commission dedicated O&M
    cost studies before seeking project finance — O&M costs for CSP/CST are poorly
    documented, project finance is typically contingent on performance reliability,
    and unquantified O&M risk is a material barrier to bankability, particularly in
    Australia's unique grid environment, remote locations, and high labour cost context.
