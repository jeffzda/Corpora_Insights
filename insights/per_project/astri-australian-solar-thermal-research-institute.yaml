  what_happened: The O&M project identified an unmet market need for an integrated
    'solar station' instrument that can be deployed at potential solar thermal sites
    to provide local data on DNI, dust particle size and number for soiling models,
    and moisture levels. Current investment decisions for CSP/CST lack site-specific
    input data needed to accurately forecast O&M costs.
  lesson_learnt: Investors and developers assessing Australian CSP/CST sites should
    account for the current absence of standardised site characterisation instrumentation
    — the lack of locally measured DNI, dust and moisture data means soiling models
    and O&M cost estimates carry high uncertainty, and commissioning a dedicated site
    measurement campaign before investment decisions will improve economic forecast
    accuracy.
