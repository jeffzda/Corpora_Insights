  publish_date: 2019-06
  project_name: Australian Solar Thermal Research Institute (ASTRI)
  what_happened: ASTRI's materials program identified that the cost impact of using
    superalloys in high-temperature CSP systems — which are required for sodium containment,
    sCO2 compatibility, and PCM compatibility — could be substantially mitigated by
    using less material to achieve the same strength outcome, reducing the cost penalty
    of premium materials.
  lesson_learnt: In high-temperature energy systems where premium containment materials
    are required, conduct material cost-versus-strength analysis early — optimising
    material geometry and thickness to exploit strength properties can substantially
    offset the unit cost premium of superalloys and should be included in any LCOE
    or cost-reduction modelling.
