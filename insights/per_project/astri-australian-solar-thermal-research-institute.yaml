  project_name: ASTRI Project 4.6 — Solar Reforming of Carbonaceous Feedstocks
  what_happened: Detailed assessment of hybrid solar-biomass methanol production found
    that high biomass concentrations are not common in high solar availability regions
    due to limited water supply, and that seasonal variability in both resources makes
    continuous stable plant operation difficult to achieve with single biomass feedstocks.
  lesson_learnt: Site selection for hybrid solar-biomass process plants must assess
    the co-location of high-quality solar resource and sufficient biomass supply concurrently
    — these two resources are frequently anti-correlated geographically, and seasonal
    variability in both can prevent stable continuous operation unless multiple feedstocks
    are available.
