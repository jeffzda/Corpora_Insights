- record_id: ARENA-DLV-68751
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: The System Advisor Model (SAM) software, nominated as the primary
    tool for assessing progress against Technical KPIs, was found to be insufficiently
    flexible to accurately model novel custom components (sodium receiver, PCM storage,
    sCO2 power block) within the ASTRI plant configurations, requiring the parallel
    development of a new Modelica-based modelling platform.
  lesson_learnt: When selecting modelling tools for a multi-technology R&D program,
    validate early whether the chosen platform can represent novel components — a
    tool appropriate for conventional plant configurations may be inadequate for custom
    technology combinations, requiring costly parallel development of replacement
    tools mid-program.
