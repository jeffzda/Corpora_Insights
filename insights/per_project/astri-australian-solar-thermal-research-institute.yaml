- record_id: ARENA-DLV-68780
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Camera-based reflectivity monitoring developed and tested at the
    CSIRO Energy Centre demonstrated that automated remote sensing of mirror reflectivity
    using already-installed calibration cameras is technically feasible, with a maximum
    absolute reflectivity measurement error of 1% — comparable to the variability
    of dedicated reflectometer measurements, making it a cost-effective alternative
    to manual reflectometer surveys.
  lesson_learnt: CSP plant operators can use already-installed calibration cameras
    (e.g. CCD cameras already present in the heliostat field) to automate reflectivity
    monitoring at negligible marginal cost — this eliminates the need for expensive
    manual reflectometer surveys and enables real-time updates to cleaning schedules;
    this capability should be designed into plant monitoring systems from commissioning
    rather than retrofitted.
