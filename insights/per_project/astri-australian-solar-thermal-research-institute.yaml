- record_id: ARENA-DLV-68777
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: PCM cost analysis found that thermal conductivity of the PCM dominates
    the cost of tube-geometry storage systems, with a 20% increase in thermal conductivity
    leading to a 100% difference in system cost. This non-linear sensitivity means
    that material selection decisions for PCM storage have very large downstream cost
    implications that are not apparent from thermophysical performance data alone.
  lesson_learnt: For tube-geometry PCM thermal storage systems, thermal conductivity
    of the PCM is the dominant cost driver and should be prioritised in material selection
    — a 20% improvement in conductivity can halve system cost, making this the most
    cost-effective lever available to designers; cost modelling using optimisation
    tools should be applied alongside thermophysical screening during material down-selection.
