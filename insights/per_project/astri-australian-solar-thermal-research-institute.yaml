- record_id: ARENA-DLV-27454
  source_title: ASTRI Australian Solar Thermal Research Institute Public Dissemination
    Report
  publish_date: 2019-06
  project_name: Australian Solar Thermal Research Institute (ASTRI)
  what_happened: ASTRI's Phase 2 program set a cost target of less than 7c/kWh with
    at least 4 hours of storage — down from the original ASTRI goal of 12c/kWh — requiring
    disruptive improvements simultaneously across all system components (heliostat,
    receiver, storage, power block), with no component able to be traded off against
    another.
  lesson_learnt: When a program cost target requires simultaneous disruptive improvement
    across multiple interdependent components, each component's sub-target must be
    treated as hard — partial success in one area cannot compensate for shortfalls
    in another. Program managers should structure parallel workstreams with explicit
    integration milestones rather than sequential component development.
