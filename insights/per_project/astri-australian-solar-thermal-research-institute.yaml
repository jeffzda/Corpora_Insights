- record_id: ARENA-DLV-3957
  source_title: CSIRO - ASTRI Australian Solar Thermal Research Institute - Public
    Dissemination Report
  publish_date: 2023-03
  project_name: Australian Solar Thermal Research Institute (ASTRI) - Thermal Energy
    Storage (TES)
  what_happened: The TES integration project identified that the potential cost of
    commercial high-temperature TES options compatible with sodium above 700°C significantly
    exceeds the target cost of less than $20/kWhth, while alternative low-cost solutions
    remain at early TRL stages. This cost gap represents a barrier to commercial uptake
    of next-generation CSP systems.
