- record_id: ARENA-DLV-68769
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Modelling and preliminary design work for sCO2 heat exchangers found
    that the behaviour of supercritical CO2 in air-cooled heat exchangers is fundamentally
    different from conventional cooling water behaviour. Specifically, the top and
    bottom surface temperatures of a steel tube cooling sCO2 can differ by 10°C —
    a phenomenon outside conventional air-cooled condenser (ACC) design experience.
    This means standard ACC design tools and experience cannot be applied to sCO2
    cooling systems.
  lesson_learnt: Air-cooled heat exchangers for supercritical CO2 power cycles cannot
    be designed using conventional ACC methods — real-gas property variations near
    the critical point produce tube surface temperature differentials of ~10°C that
    have no equivalent in water cooling, and bespoke design tools validated against
    sCO2 data are required.
