  what_happened: The ANU sodium test laboratory, intended to support laboratory-scale
    prototype testing and materials compatibility testing for the sodium receiver,
    had not been commissioned at the time of the Milestone 12 report (June 2017).
    Laboratory equipment was under procurement, with the laboratory expected to be
    fully operational by early 2018 — indicating a delay relative to the testing schedule
    for the sodium receiver development stream.
  lesson_learnt: Specialist laboratory facilities for novel high-temperature fluid
    systems (such as liquid sodium) require long procurement and commissioning lead
    times; testing program schedules that depend on such facilities should build in
    procurement lead time from the outset and identify interim testing alternatives
    to avoid blocking prototype testing activities.
