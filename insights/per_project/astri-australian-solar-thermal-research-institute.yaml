  source_title: CSIRO - ASTRI Australian Solar Thermal Research Institute - Public
    Dissemination Report
  publish_date: 2023-03
  project_name: Australian Solar Thermal Research Institute (ASTRI) - Particle Receiver
  what_happened: Flow rate measurement for the falling particle receiver relied on
    feed bin weight measurement, which proved inherently slow and intermittent, limiting
    the ability to monitor and control particle flow in real time during on-sun testing.
  lesson_learnt: Particle receiver systems should incorporate in-line flow measurement
    devices rather than relying on feed bin weight measurement — bin weight measurement
    is inherently slow and intermittent and is insufficient for real-time monitoring
    and control of particle flow during operation.
