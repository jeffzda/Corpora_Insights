  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Economic modelling and analysis of CSP plant performance found that
    large plants with large thermal storage consistently achieve lower LCOE, but that
    individual-year performance is extremely susceptible to climate variability. The
    analysis showed that a single design year cannot reliably represent lifetime financial
    performance, creating significant financial risk exposure for plant developers
    and investors.
  lesson_learnt: CSP plant financial models and bankability assessments must account
    for multi-year solar variability using probabilistic approaches with synthetic
    weather datasets — reliance on a single design-year solar resource leads to optimistic
    LCOE estimates, and actual year-to-year variation can expose projects to significant
    revenue risk that undermines debt serviceability.
