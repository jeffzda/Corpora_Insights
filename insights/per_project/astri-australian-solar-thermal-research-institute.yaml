  source_title: CSIRO - ASTRI Australian Solar Thermal Research Institute - Public
    Dissemination Report
  publish_date: 2023-03
  project_name: Australian Solar Thermal Research Institute (ASTRI) - Advanced Materials
  what_happened: The advanced materials program identified that poor material selection
    in the energy industry has historically caused project delays, cost overruns,
    shortened asset life, and injury. The ASTRI materials program was established
    specifically to address this gap for solar thermal systems by providing engineering
    material degradation test data for corrosion, cycle fatigue, and material compatibility
    with sodium, sCO2, and thermal energy storage media.
  lesson_learnt: Material selection for high-temperature solar thermal systems should
    be informed by dedicated experimental degradation testing covering corrosion,
    cycle fatigue, and compatibility with the specific heat transfer and storage media
    — reliance on general engineering expectations is insufficient and has caused
    project delays, cost overruns and asset life shortfalls across the broader energy
    industry.
  issue_severity: major
