  what_happened: Technoeconomic modelling found that the minimum selling price of
    green diesel from the solar hybridised dual fluidised bed gasification of bagasse
    can be comparable to fossil-based diesel in the optimistic scenario, with the
    dominant cost driver being the selling price of activated carbon by-product, followed
    by discount rate and total direct plant cost.
  lesson_learnt: For solar-hybrid biofuel projects, the economics are heavily dependent
    on by-product revenues (particularly activated carbon) — project viability assessments
    must model by-product market scenarios explicitly, as optimistic and pessimistic
    by-product pricing can determine whether the project is commercially viable.
