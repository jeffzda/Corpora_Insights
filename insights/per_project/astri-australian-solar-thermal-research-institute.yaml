- record_id: ARENA-DLV-68773
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Dynamic modelling of a solar syngas plant based on redox thermochemical
    cycles found that the primary cost driver was the syngas storage system required
    to provide a constant flow to the Fischer-Tropsch (FT) unit. However, further
    modelling showed that continuous syngas production can be achieved by controlling
    the operating strategy without high-cost syngas storage, substantially reducing
    the projected cost of the process.
  lesson_learnt: In solar thermochemical fuel production systems, syngas buffer storage
    is often assumed necessary for continuous downstream FT synthesis — modelling
    the full system with dynamic control strategies can eliminate the need for costly
    storage by managing solar variability through operational scheduling, and this
    trade-off should be explicitly analysed before storage capacity is specified.
