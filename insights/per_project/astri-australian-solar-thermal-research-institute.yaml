  project_name: ASTRI Project 4.2 — Beam-Down Particle Technology for Mining
  what_happened: Technoeconomic analysis of direct solar irradiation for thermal ore
    pre-treatment in mining found that the non-solar (combustion) route is more cost-effective
    and easier to implement, with much lower CAPEX, than the CST route, primarily
    because scale constraints limit solar contribution to approximately 25% of continuous
    process heat requirements.
  lesson_learnt: Before investing in solar thermal integration studies for high-throughput
    industrial processes, assess whether the scale of available CST concentrators
    is compatible with the process throughput — if the solar contribution is capped
    at a low fraction of total heat demand due to concentrator scale limits, the solar
    route is unlikely to be cost-competitive.
