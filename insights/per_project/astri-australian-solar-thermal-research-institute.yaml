- record_id: ARENA-DLV-3954
  source_title: CSIRO - ASTRI Australian Solar Thermal Research Institute - Public
    Dissemination Report
  publish_date: 2023-03
  project_name: Australian Solar Thermal Research Institute (ASTRI) - Particle Receiver
  what_happened: During installation, commissioning, and testing of the first-of-kind
    multi-stage falling particle receiver, a series of engineering and operational
    challenges were encountered including particle clogging from water infiltration,
    particle leaks through unknown gaps, thermal damage to insulation, contamination
    of insulation surfaces, particle contamination from debris, and unexpected thermal
    expansion of the screw conveyor causing physical impacts on adjacent components.
  lesson_learnt: First-of-kind particle receiver systems require robust waterproofing,
    debris screening, heater or air injection ports at narrow valve areas prone to
    clogging, and careful accommodation of thermal expansion in installation — these
    issues were encountered at CSIRO Newcastle and each required specific engineering
    resolution before reliable operation could be achieved.
  issue_severity: moderate
  project_type: null
