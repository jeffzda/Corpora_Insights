    Maintenance
  what_happened: CSP receiver creep-fatigue assessment identified creep as the main
    failure mechanism for CSP receivers, with high uncertainty in creep lifetime predictions
    under CSP-relevant conditions. The uncertainty in predictions was found to be
    a critical gap for informing practical O&M plans, which must account for failure
    risk rather than just average lifetime.
  lesson_learnt: O&M planning for CSP receivers must be based on failure risk distributions
    rather than average creep lifetime predictions — uncertainty in creep rupture
    models for CSP-relevant conditions is high, and maintenance renewal schedules
    that do not account for prediction error will underestimate failure risk and may
    lead to premature receiver failure.
