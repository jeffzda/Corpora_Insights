- record_id: ARENA-DLV-68753
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: The rate of decrease in the cost of commercial CST was considerably
    faster than anticipated in the Australian Energy Technology Assessment (AETA)
    studies used to set ASTRI's Technical KPIs, meaning the KPIs were effectively
    set against a cost trajectory that was overtaken by market developments before
    the program concluded. The report notes that ASTRI KPIs should be reassessed to
    better target commercial adoption confidence rather than cost reduction alone.
  lesson_learnt: For emerging technologies with high capital costs, a learning-curve-only
    commercialisation strategy is unlikely to close the cost gap in the required timeframe
    — an active RD&D program targeting step-change component improvements must run
    in parallel with deployment, or market parity will be delayed by decades and require
    substantially more external subsidy support.
