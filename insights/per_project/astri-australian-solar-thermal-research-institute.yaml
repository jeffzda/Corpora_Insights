- record_id: ARENA-DLV-68767
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Cross-wind was identified through modelling and experimental testing
    as the main operational challenge for small natural draft dry cooling towers,
    negatively affecting cooling performance. Modelling demonstrated that a windbreak
    wall could reverse this negative effect and actually improve cooling tower performance,
    but experimental demonstration of the windbreak wall effectiveness remained outstanding
    at the time of reporting.
  lesson_learnt: Small natural draft dry cooling towers for CSP applications in exposed
    Australian sites should incorporate windbreak wall design from the outset — crosswind
    is the primary operational performance risk for short towers, and windbreak walls
    are a confirmed mitigation strategy that should be sized and positioned as part
    of the initial tower design rather than retrofitted.
