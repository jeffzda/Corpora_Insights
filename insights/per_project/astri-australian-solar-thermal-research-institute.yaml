  project_name: Australian Solar Thermal Research Institute (ASTRI)
  what_happened: Despite Australia having some of the best solar radiation in the
    world, solar thermal technology remains in the early stages of domestic deployment
    as of 2022. Deployment has not occurred primarily due to Australia's historical
    reliance on low-cost coal and gas, a lack of market signals for long-duration
    intra-day energy storage, and the absence of an international carbon pricing mechanism.
  lesson_learnt: Solar thermal project developers in Australia should explicitly plan
    for a market development phase before commercial deployment — the absence of domestic
    reference plants, long-duration storage market signals, and carbon pricing has
    delayed Australian CSP deployment despite world-class solar resources, meaning
    projects require policy support mechanisms and early engagement with market design
    processes to establish the commercial case.
