  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: An apparatus for measuring the thermophysical properties of high-temperature
    PCMs based on the T-history method was designed, constructed and commissioned.
    Initial test results showed a significant difference from existing literature
    data, traced to high heat loss between the samples and ambient air, invalidating
    the initial measurements and requiring modifications to the apparatus before reliable
    data could be obtained.
  lesson_learnt: Custom-built thermophysical measurement apparatus for high-temperature
    materials should include explicit thermal loss characterisation and validation
    against reference materials before use for primary data collection — unquantified
    heat losses can produce systematic errors that invalidate results and require
    time-consuming apparatus modifications.
