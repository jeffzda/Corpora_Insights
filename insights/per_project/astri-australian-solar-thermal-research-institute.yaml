- record_id: ARENA-DLV-68766
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Testing of the UQ Gatton natural draft dry cooling tower — the first
    demonstration of its type and the largest research facility in the world dedicated
    to testing short cooling towers — revealed that cooling towers do not scale in
    either cost or performance. This means that knowledge and cost curves developed
    for conventional tall cooling towers cannot be applied to design or cost short
    cooling towers for small-scale CSP plants.
  lesson_learnt: Cost and performance data from large natural draft cooling towers
    should not be extrapolated to small-scale (short) tower designs for small CSP
    installations — the scaling laws break down entirely, and designers must develop
    site-specific models and empirical data from purpose-built small-tower test facilities
    rather than adapting industry references for large plants.
