  source_title: CSIRO - ASTRI Australian Solar Thermal Research Institute - Public
    Dissemination Report
  publish_date: 2023-03
  project_name: Australian Solar Thermal Research Institute (ASTRI) - Particle Receiver
  what_happened: On-sun testing of the particle receiver revealed that advective heat
    loss is higher than convective heat loss from typical cavity receivers, consistent
    with findings from US research groups. This represents a design challenge for
    achieving target receiver efficiency.
  lesson_learnt: Particle receiver cavity designs should prioritise minimisation of
    advective heat loss, which is the dominant loss mechanism and higher than in conventional
    cavity receivers — further design modifications to address advective losses are
    warranted and should be incorporated into next-generation particle receiver designs.
