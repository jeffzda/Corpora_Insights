  project_name: ASTRI Project 4.3 — Photocatalytic Hydrogen Production
  what_happened: Testing established that photocatalytic H2/O2 production responds
    linearly up to 150 suns of UV flux, but beyond that threshold production no longer
    increases linearly, placing an upper limit on the concentrating solar field design
    compatible with this technology.
  lesson_learnt: Concentrating solar field design for photocatalytic applications
    must be constrained by the non-linear response threshold of the photocatalyst
    (150 suns for the tested system) — specifying a higher concentration ratio will
    not produce proportionally more hydrogen and will waste capital investment in
    optical components.
