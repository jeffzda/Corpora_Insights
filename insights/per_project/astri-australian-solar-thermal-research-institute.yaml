  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Fischer-Tropsch (FT) synthesis research identified that the variable
    operation inherent in solar-only processes (involving start-up, shut-down and
    turn-down cycles) presents challenges to FT liquid yield and quality. An experimental
    campaign measured the sensitivity of FT synthesis to changes in syngas flow rate
    and changes in purging gas composition during shut-down, providing new data on
    the impacts of solar-driven variability.
  lesson_learnt: Fischer-Tropsch synthesis units integrated with solar thermochemical
    processes must be designed for frequent start-up, shut-down and turn-down cycles
    — yield and product quality are sensitive to flow rate changes and purging conditions,
    and standard FT unit specifications developed for continuous fossil-fuel operation
    are likely to be inadequate for solar-coupled applications.
