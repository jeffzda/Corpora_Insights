  what_happened: Soiling field studies at Mount Isa revealed that nano-roughened hydrophilic
    coatings, while causing rain droplets to sheet off, also allowed droplets to remain
    and dry, leaving dust and mineral deposits that were not present on conventional
    uncoated mirrors. This constituted an unexpected soiling mechanism not captured
    in the existing soiling model.
  lesson_learnt: Anti-soiling coatings for CSP heliostats should be validated under
    real-world rain conditions in Australian outback environments before deployment
    — field testing at Mount Isa revealed that nano-roughened coatings produced a
    previously unidentified soiling mechanism from drying rain droplets, which the
    existing soiling model did not predict and which may offset the benefit of the
    coating in certain environments.
