  lifecycle_phase: commissioning/integration
  proponent_type: research organisation/university
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: 'Each issue was individually resolved: particle clogging resolved;
    particle leaks resolved; thermal expansion of screw conveyor resolved after identifying
    installation error; insulation contamination addressed through regular replacement;
    particle contamination addressed through screening and removal.'
  transferability: narrow
