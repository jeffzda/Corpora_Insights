  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Economic analysis of CSP plant configurations to optimise revenue
    from time-of-day electricity price variation found that approximately 16 hours
    of thermal storage maximised financial performance for a conventional Rankine
    cycle CST plant at Mildura. However, based on 2003 electricity prices, no CST
    plant configuration was competitive in the market, highlighting the sensitivity
    of CST economics to electricity market conditions.
  lesson_learnt: CSP storage sizing for electricity market optimisation depends critically
    on current and projected electricity market structures — storage size optimisation
    conducted against historical or current price profiles may not remain valid as
    market conditions evolve, and developers should stress-test storage sizing decisions
    against multiple plausible market scenarios rather than a single price forecast.
