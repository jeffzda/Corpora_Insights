- record_id: ARENA-DLV-68776
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: High-temperature chloride salt mixtures investigated by ASTRI as
    a next-generation thermal storage medium were found to require an inert gas environment
    maintained in a closed system to achieve good thermal stability above 700°C. This
    represents a significant operational constraint not present in conventional nitrate
    salt systems, requiring additional engineering for inert gas management in any
    system design.
  lesson_learnt: Projects developing CSP plants using high-temperature chloride salt
    storage must design closed-loop inert gas management systems from the outset —
    thermal stability of chloride salts above 700°C is conditional on maintaining
    an inert gas environment, and this requirement substantially increases system
    complexity compared to conventional open-system nitrate salt storage.
