- record_id: ARENA-DLV-68757
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Heliostat field costs were found to comprise approximately 35–40%
    of total capital cost for a CSP central receiver power plant, making the solar
    field the single largest CapEx component. A detailed scoping study early in ASTRI
    concluded that the key to achieving LCOE targets was not a single breakthrough
    development but rather an integrated package of incremental improvements across
    optical, structural, aerodynamic, and control domains.
  lesson_learnt: In CSP project development, heliostat field cost reduction should
    be treated as a systems-integration challenge spanning concurrent engineering
    disciplines — optical, structural, wind load, manufacturing, and control — rather
    than a single technology breakthrough; concurrent engineering processes from the
    earliest design stages are essential to achieve meaningful cost reductions.
