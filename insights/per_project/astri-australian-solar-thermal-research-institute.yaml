  what_happened: Modelling of supercritical CO2 power block dispatch control revealed
    that controlling net power output cannot be achieved by modulating turbine inlet
    flow rate or pressure alone, and that appropriate control strategies require independent
    control of turbine inlet temperature, compressor inlet temperature, and flow split
    ratio.
  lesson_learnt: sCO2 power block dispatch control is significantly more complex than
    conventional steam turbine control — project plans for CSP systems using sCO2
    power cycles must budget for development of bespoke multi-parameter control strategies
    and cannot assume operability from analogy with steam plant experience.
