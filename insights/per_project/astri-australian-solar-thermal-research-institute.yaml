  what_happened: Early sodium compatibility testing of TES filler materials was impeded
    by issues with sodium loss and gasket damage in the experimental setup, requiring
    redesign of the test arrangement before stable long-duration testing could proceed.
  lesson_learnt: Sodium compatibility test rigs must be designed to prevent sodium
    loss and seal degradation from the outset — these failure modes are predictable
    and, if not addressed in rig design, will invalidate long-exposure test results
    and require costly rework.
