  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Foil bearing research for the sCO2 turbine revealed that heat load
    distribution in sCO2 environments is fundamentally different from air bearing
    configurations, requiring a new approach to cooling. Simulation tools were developed
    to model this, but the finding identified a design dependency that had not been
    anticipated from conventional turbomachinery experience.
  lesson_learnt: When adapting turbomachinery designs to supercritical CO2 from air
    or conventional working fluids, bearing and sealing thermal management must be
    re-engineered from first principles — real-gas effects near the critical point
    significantly alter heat load distributions compared to air or steam environments,
    and conventional cooling design approaches are not directly transferable.
