  project_name: Australian Solar Thermal Research Institute (ASTRI)
  what_happened: ASTRI's techno-economic analysis of thermal energy storage options
    showed that phase-change material (PCM)-based storage systems could deliver the
    lowest LCOE and meet the US SunShot target of USD $0.06/kWh, while also demonstrating
    stability after 200 cycles, minimal corrosion with stainless steel 316, and benign
    reaction with supercritical CO2.
  lesson_learnt: PCM-based thermal storage warrants prioritisation in next-generation
    CSP programs over conventional two-tank molten salt — the combination of lower
    projected LCOE, material stability evidence, and compatibility with sCO2 power
    blocks reduces technical risk sufficiently to justify accelerated prototype development
    and procurement engagement.
