  what_happened: ASTRI's research on sCO2 power blocks identified that at the target
    plant size range (0.3–5 MWe), no commercial supercritical CO2 turbine existed
    in the market. International projects developing sCO2 turbines were targeting
    utility-scale plants, not the ASTRI size range, leaving a critical technology
    gap that required ASTRI to develop its own turbine design tools and prototype.
  lesson_learnt: Project developers targeting small-scale CSP (sub-5 MWe) with sCO2
    power cycles should not assume commercial turbine availability — the sCO2 turbine
    supply chain is focused on utility-scale applications, and bespoke turbine development
    represents a significant additional scope, cost, and schedule risk that must be
    explicitly planned for.
