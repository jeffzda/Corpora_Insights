  what_happened: During photocatalytic reactor testing at pressures above 2 bar, gas
    bubbles accumulated between the glass window and the photocatalyst surface, retarding
    gas removal and collection despite linear increases in H2/O2 production with temperature
    and light intensity.
  lesson_lear­nt: Reactor designs for pressurised photocatalytic water-splitting must
    specifically address gas egress pathways — bubble accumulation at the photocatalyst
    surface is a predictable mass-transfer limitation at elevated pressure that will
    cap apparent production rates and must be resolved through reactor geometry before
    scale-up.
