  evidence_excerpt: While SAM is used as the central modelling tool for the overall
    plant analysis, it is beyond the capability of the software to accurately model
    some of the custom components and it is therefore necessary to make modifications
    that ensure that the component performance matches that of specialised models
    from the other ASTRI projects. This has resulted in the development of an additional
    modelling tool based on the Modelica language that is more flexible in capability
