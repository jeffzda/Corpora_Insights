- record_id: ARENA-DLV-68779
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: The Condition-Based Cleaning (CBC) methodology developed within ASTRI's
    O&M research stream demonstrated potential cost savings of 5–25% of total mirror
    cleaning costs compared to a fixed-time traditional cleaning strategy, depending
    on cleaning operation costs. In the Australian context, savings were expected
    to be in the upper range due to high labour and water costs.
  lesson_learnt: CSP project operators should implement condition-based (reflectivity-monitoring-driven)
    mirror cleaning schedules rather than fixed-interval schedules — the CBC approach
    can achieve 5–25% total cleaning cost savings by optimising timing against real-time
    DNI, electricity prices, and weather-driven natural cleaning events, with greater
    savings in high-labour-cost environments such as Australia.
