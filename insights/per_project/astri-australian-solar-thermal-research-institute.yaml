  publish_date: 2023-03
  project_name: Australian Solar Thermal Research Institute (ASTRI)
  what_happened: ASTRI's program focus shifted significantly after a 2017 Mid-Term
    Review recommended greater involvement in commercial deployment. The program pivoted
    from researcher-driven fundamental research to applied research and direct industry
    support, with over 80% of effort directed to advocacy, stakeholder engagement,
    and industry support by 2022.
  lesson_learnt: Research programs targeting emerging energy technologies should build
    in early mid-term reviews to assess commercial relevance — a formal mid-term review
    in 2017 triggered a reorientation toward applied research and commercial uptake
    that took several years to fully execute, suggesting earlier commercial alignment
    would have accelerated impact.
