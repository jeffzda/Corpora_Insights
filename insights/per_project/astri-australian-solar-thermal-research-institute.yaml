    reforming process should be selected, highlighting hydrogen cost as a critical
    and sensitive input to solar fuels techno-economic assessments.
  lesson_hernt: Techno-economic assessments of solar fuels pathways that include a
    hydrogen input must conduct sensitivity analysis specifically on hydrogen cost
    — the optimal process configuration changes depending on hydrogen pricing, and
    project developers must define their hydrogen cost assumption and its basis before
    locking in process design.
