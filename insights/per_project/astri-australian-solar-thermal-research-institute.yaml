- record_id: ARENA-DLV-68765
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Australian CST plants using wet cooling (2.7–3.6 m³ per MWh generated)
    cannot adopt the conventional global CST cooling practice due to water scarcity.
    Conventional dry cooling using fans imposes a 5% power generation penalty, and
    existing natural draft cooling tower technology for large plants is not applicable
    at the ASTRI target plant size of 0.3–5 MWe, requiring development of new small-scale
    natural draft designs.
  lesson_learnt: CSP projects in arid Australian locations must treat cooling system
    selection as a primary design constraint from the outset — wet cooling is not
    viable, conventional dry cooling with fans incurs a material efficiency penalty,
    and natural draft cooling at small scale requires bespoke design not available
    from standard industry references; this should be scoped as an explicit technology
    development activity rather than treated as off-the-shelf.
