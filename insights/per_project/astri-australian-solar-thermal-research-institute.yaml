  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Testing of PCM encapsulated in a geopolymer shell identified a leaching
    problem whereby the PCM leaked into the geopolymer material after cycling. Despite
    the capsules maintaining structural strength and durability, investigation of
    suitable coating materials to prevent leaching had not identified a solution at
    the time of the report.
  lesson_learnt: When developing encapsulated PCM systems for high-temperature thermal
    storage, material compatibility between the PCM and the encapsulant must be validated
    under thermal cycling conditions before committing to a containment strategy —
    leaching of PCM into porous encapsulant materials can occur even when structural
    integrity is maintained, and remediation by coating may not be straightforward.
