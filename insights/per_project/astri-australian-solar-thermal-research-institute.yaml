- record_id: ARENA-DLV-65839
  source_title: ASTRI Australian Solar Thermal Research Institute Public Dissemination
    Report 2021
  publish_date: '2022'
  project_name: ASTRI Project 7.1 — Integration Testing (Sodium Test Loop)
  what_happened: Designing the high-temperature sodium test loop required integrating
    two independent systems — the sodium loop and a fire management/safety system
    — that must operate in parallel, significantly increasing cost and design complexity
    because the system was designed on the premise that a sodium leak and resulting
    fire is a likely event requiring automatic detection, management, and shutdown.
  lesson_learnt: Solar thermal demonstration projects involving high-temperature systems
    and specialised construction should build significant contingency for post-COVID
    construction cost escalation — detailed engineering completion revealed higher
    costs than anticipated, and market conditions drove further materials and labour
    inflation requiring budget and schedule revision.
