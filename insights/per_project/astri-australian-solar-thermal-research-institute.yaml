  publish_date: '2022'
  project_name: ASTRI Project 1.2 — Sodium Receiver Design & Testing
  what_happened: Comparison of sodium and chloride salt solar receivers in the US
    Gen3 CSP program revealed that while sodium produced a smaller, lower-cost receiver
    with excellent performance, using sodium in the receiver and chloride salt in
    storage created a two-fluid circuit whose complexity was flagged as a concern
    by the US Department of Energy.
  lesson_learnt: System-level integration complexity must be assessed alongside component-level
    performance — a superior receiver technology can be undermined by the system complexity
    it introduces (e.g. dual fluid circuits), which affects bankability and commercial
    acceptance.
