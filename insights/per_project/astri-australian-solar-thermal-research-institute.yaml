  what_happened: Accurate estimation of various heat losses in the particle receiver
    remained challenging due to extremely limited prior experience and published studies
    in particle technology, requiring on-sun operation to generate the needed data.
  lesson_learnt: When designing novel receiver systems, plan for an extended data-generation
    phase during initial on-sun operation to characterise heat losses — existing literature
    from analogous technologies is insufficient to predict performance of first-of-kind
    particle systems, and empirical data cannot be substituted.
