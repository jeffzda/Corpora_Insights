  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Cost analysis of high-temperature thermal storage systems found that
    the encapsulated PCM system delivered the lowest capital cost ($11.2/kWht) and
    the lowest embodied energy (47.8 TJ/MWht) among the options studied, with a payback
    period of 1.2 months, compared to a sodium two-tank system at $43.4/kWht with
    a payback period of 38.8 months. The two-tank molten salt system was found to
    be significantly more expensive than thermocline alternatives for temperature
    differences above 200°C.
  lesson_learnt: CSP project developers evaluating thermal storage options should
    assess encapsulated PCM and thermocline configurations against conventional two-tank
    molten salt systems on a full cost basis — for temperature differences above 200°C,
    thermocline systems with geopolymer filler can achieve cost savings of up to 60%
    relative to two-tank molten salt, with encapsulated PCM offering the lowest embodied
    energy and shortest payback period among the options studied.
