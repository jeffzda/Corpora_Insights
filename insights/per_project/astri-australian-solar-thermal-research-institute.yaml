    impact on plant economics.
  lesson_learnt: CSP plant revenue projections should not be based on perfect forecast
    assumptions for DNI or electricity prices — forecast uncertainty alone can reduce
    actual profits by approximately 20% relative to perfect-forecast projections;
    model predictive control with frequent policy updates can partially mitigate this.
