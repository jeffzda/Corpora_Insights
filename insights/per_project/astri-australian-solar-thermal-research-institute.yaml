- record_id: ARENA-DLV-68778
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: ASTRI's Overarching Economic Model project found that supplying industrial
    process heat from CST is more complex than electricity generation due to the need
    to integrate at appropriate temperatures into existing industrial processes and
    the more stringent capacity factor requirements compared to electricity applications.
    This complexity is a barrier to commercial deployment of CST for industrial heat
    that is not present in electricity-focused configurations.
  lesson_learnt: CST industrial heat supply projects should treat process integration
    design — including temperature matching, capacity factor requirements, and interface
    with existing plant operations — as a primary engineering scope item distinct
    from and more demanding than equivalent electrical generation projects; early
    engagement with the industrial host's operational requirements is essential to
    establish viable integration parameters.
