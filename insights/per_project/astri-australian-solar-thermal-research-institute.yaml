  what_happened: Supercritical water gasification (SCWG) research within the ASTRI
    solar fuels program found that operational conditions are significantly more challenging
    from materials and structural perspectives than had been addressed by prior researchers
    in the field. The initial ASTRI process used algae as feedstock, but the high
    cost of algae necessitated a pivot to alternative feedstocks, representing a scope
    change in the research direction.
  lesson_learnt: Solar fuels programs pursuing SCWG pathways should plan for materials
    compatibility and structural integrity as primary technical risks from the outset
    — these challenges require more detailed modelling and experimental validation
    than existing literature provides; additionally, feedstock cost assumptions should
    be stress-tested early, as high-cost feedstocks (e.g. algae) can render the process
    economics unviable and require research redirection.
