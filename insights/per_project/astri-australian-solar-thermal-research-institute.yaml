  what_happened: As operating temperature of thermal storage systems increased, material
    compatibility issues were found to escalate in cost non-linearly, with higher
    temperatures requiring new materials and processes at exponentially higher cost.
  lesson_learnt: For high-temperature TES development, explicitly map material compatibility
    cost as a function of operating temperature before committing to a temperature
    target — operating at lower temperatures may deliver a faster and more commercially
    viable solution even if thermodynamic efficiency is reduced.
