  intervention_note: Developed an additional modelling tool based on the Modelica
    language, which is more flexible in capability than SAM and is expected to become
    the primary modelling tool for ongoing ASTRI plant design.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
