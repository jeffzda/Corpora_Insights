- record_id: ARENA-DLV-68754
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: CST deployment in Australia was identified as being in early stages
    primarily due to the absence of market signals for storage, meaning the technology
    had not benefited from the cost-reduction learning curve available to variable
    renewables such as PV and wind, which had earlier market adoption. The program
    noted that Australia's strong solar resource and existing skills base made it
    well positioned to develop CST commercially, but market structure was constraining
    deployment.
  lesson_learnt: Technology readiness is insufficient for market deployment without
    appropriate market signals — for dispatchable renewable technologies like CSP,
    investment in policy and regulatory mechanisms that value long-duration storage
    and firm capacity is a prerequisite for commercial deployment, and R&D programs
    should be coupled with policy advocacy to create these conditions.
