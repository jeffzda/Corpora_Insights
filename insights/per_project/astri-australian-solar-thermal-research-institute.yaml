- record_id: ARENA-DLV-68758
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: Wind tunnel testing conducted as part of ASTRI's heliostat research
    showed that a highly variable wind load is developed across the heliostat field
    and that this variability is a critical driver of worsening heliostat design parameters.
    The research identified that perimeter wind fences and related wind-reduction
    strategies around the heliostat field could enable lighter and lower-cost heliostat
    designs by reducing wind loads.
  lesson_learnt: CSP plant designers should incorporate heliostat-field perimeter
    wind fences and other wind-load mitigation strategies from the earliest design
    stages — reducing variable wind loads on heliostats allows lighter structural
    designs and lower CapEx, and this cannot be effectively retrofitted after field
    layout is frozen.
