- record_id: ARENA-DLV-68752
  source_title: ASTRI Milestone 12 Report
  publish_date: 2017-06
  project_name: Australian Solar Thermal Research Initiative (ASTRI)
  what_happened: The initial ASTRI baseline plant design used parabolic trough technology
    with molten salt storage, which was the most common commercial CST technology
    at the program's inception in 2012. Within the relatively short program timeframe,
    commercial technology shifted markedly toward central receiver tower systems with
    heliostat fields, making the original baseline design an inappropriate reference
    for comparison with ASTRI research outputs, and requiring design and modelling
    of a new reference plant.
  lesson_learnt: In long-duration R&D programs targeting emerging energy technologies,
    build explicit review triggers for baseline assumptions — technology reference
    points can shift materially within a single program cycle, and an outdated baseline
    undermines the validity of KPI assessments.
