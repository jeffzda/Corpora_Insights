  publish_date: 2023-03
  project_name: Australian Solar Thermal Research Institute (ASTRI) - Sodium Test
    Loop
  what_happened: The sodium test loop required two independent safety systems — a
    sodium leak detection and containment system, and a fire management system — to
    operate in parallel. Designing and integrating these dual systems increased complexity
    and cost beyond initial expectations, creating engineering and budget management
    challenges.
  lesson_learnt: High-temperature sodium systems require safety architecture planning
    to account for dual independent safety systems from the outset — the need for
    simultaneous sodium containment and fire management systems significantly increased
    cost and complexity and should be anticipated in initial project budgets and designs.
