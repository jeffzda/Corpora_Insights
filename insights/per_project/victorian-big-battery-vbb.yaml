- record_id: ARENA-DLV-21604
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Victorian Big Battery (VBB)
  what_happened: During the GFL-to-GFM transition under the NER clause 5.3.9 Connection
    Alteration process, VBB required installation of additional protection equipment,
    revision of existing protection settings to manage arc flash risk due to changed
    fault contribution, development of bespoke firmware for legacy equipment, and
    installation of new meters — hardware works that were not anticipated when the
    strategy of connecting in GFL mode first was adopted.
  lesson_learnt: Avoid the strategy of connecting in GFL mode and transitioning to
    GFM via the NER cl 5.3.9 process for new projects; connecting in GFM mode from
    the outset avoids unanticipated hardware upgrades (protection equipment, firmware,
    meters) and associated costs and outages during transition, and the connection
    timeline gap between GFM and GFL has now substantially closed.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: commissioning/integration
  proponent_type: project developer
  delay_category: commissioning/integration
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Neoen completed the required hardware upgrades (protection equipment,
    firmware, meters) to enable GFM operation and subsequently recommended future
    projects connect in GFM mode from the outset.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id001
  - 17
  - 18
  evidence_excerpt: At VBB, installation of additional protection equipment and revision
    of the existing protection settings was required to manage arc flash risk due
    to the change in fault contribution and fault ride through capability after switching
    to GFM mode. The VBB retrofit also required bespoke firmware to be developed to
    accommodate GFM operation on legacy equipment, and the installation of new meters
    to enable a new control philosophy for GFM operation.
