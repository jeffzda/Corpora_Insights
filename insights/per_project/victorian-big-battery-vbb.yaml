- record_id: ARENA-DLV-21605
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Victorian Big Battery (VBB)
  what_happened: The NER cl 5.3.9 Connection Alteration process required VBB to comply
    with the latest version of the NER rather than the NER at the time of original
    commissioning, meaning plant characteristics that were compliant when built potentially
    required redesign or retrofitting to maintain GPS compliance.
  lesson_learnt: Legacy BESS facilities seeking to upgrade to GFM capability via the
    NER cl 5.3.9 process should assess compliance against the current NER — not the
    NER at time of original build — as retroactive compliance obligations can require
    costly redesign or retrofits that were not budgeted.
