- record_id: ARENA-DLV-21612
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Victorian Big Battery (VBB)
  what_happened: VBB encountered challenges meeting the reactive current rise time
    GPS measurement requirement at the Point of Connection (PoC) due to impedance
    between the inverter terminals and the PoC, requiring expensive bespoke control
    system updates.
  lesson_learnt: For GFM BESS — which typically operate at lower inverter terminal
    voltages than synchronous machines — engage AEMO and the NSP early to agree whether
    reactive current compliance can be measured at inverter terminals rather than
    the PoC, avoiding costly control system bespoke engineering; the May 2025 NER
    rule change now permits this where agreed by AEMO and the NSP.
  issue_severity: major
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: regulatory & approvals
  outcome_class: delayed but recoverable
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: VBB undertook expensive bespoke control system updates to meet
    the PoC measurement requirement; the AEMC's May 2025 NER rule change now allows
    measurement at inverter terminals where agreed by AEMO and NSP.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id003
  - 20
  - 28
  evidence_excerpt: Allowing GFM BESS units to measure compliance with reactive current
    injection at the inverter terminals could avoid the need for expensive bespoke
    control system updates to meet GPS as that project encountered.
