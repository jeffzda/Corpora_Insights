- record_id: ARENA-DLV-21619
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Victorian Big Battery (VBB)
  what_happened: At VBB, the ability to derive optimal GFM parameters was compromised
    by limitations of the models available to the proponent and a lack of location-specific
    inertia data from the NEM; tuning was performed using a PSCAD single machine infinite
    bus (SMIB) study rather than a wide area analysis, reducing confidence in the
    optimality of settings.
  lesson_learnt: Request AEMO or the NSP to conduct wide area PSCAD analysis and identify
    inertia shortfalls at critical network nodes before finalising GFM parameter tuning;
    proponent-side SMIB studies cannot substitute for wide area analysis in determining
    optimal location-specific GFM settings.
  issue_severity: minor
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: null
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id004
  - 25
  evidence_excerpt: The ability to derive optimal GFM parameters for a given location
    is somewhat compromised by limitations of models available to the proponent, and
    the availability of inertia data in the NEM... localised optimal inertia settings
    should ideally be from a wide area analysis, rather than the PSCAD SMIB (single
    machine infinite bus) study done by the proponent.
