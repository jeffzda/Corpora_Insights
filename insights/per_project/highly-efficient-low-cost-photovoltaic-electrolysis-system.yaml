  project_name: UNSW Photovoltaic Electrolysis towards Green Hydrogen Generation (2018/RND014)
  what_happened: Techno-economic modelling showed that operating the PVE system at
    solar-limited capacity (24% capacity factor) yields an LCOH of A$6.66/kg at 100
    MW scale with high-temperature electrolysis, but that renewable intermittency
    prevents the steady-state operation required for downstream hydrogen derivative
    processes (ammonia, methanol), creating a commercial viability gap for the technology
    at this TRL.
  lesson_learnt: Project developers pursuing hydrogen-to-derivatives pathways (ammonia,
    methanol) must account for the steady-state supply requirement of conversion facilities
    at the techno-economic modelling stage — a solar-only 24% capacity factor is insufficient
    and firming storage or backup power costs must be included in the LCOH calculation
    to obtain a realistic commercial case.
