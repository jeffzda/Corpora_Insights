  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed a novel hydrothermal manufacturing process that deposits
    active species with high uniformity and strong adhesion, enabling electrodes from
    1 cm² to 25 cm² with similar catalytic performance across all sizes.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id001
  - 5
  evidence_excerpt: Although there are many high-performance oxygen electrodes reported
    in literature, they are only effective with a small surface area (< 1cm2), which
    has hindered their application in practical water electrolysers, and calls for
    innovative preparation methods.
