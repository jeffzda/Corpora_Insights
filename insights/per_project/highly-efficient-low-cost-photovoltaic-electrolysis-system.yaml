- record_id: ARENA-DLV-51701
  source_title: Highly Efficient & Low Cost Photovoltaic-Electrolysis System Midterm
    Activity Sept 2020
  publish_date: '2020-09-25'
  project_name: Highly efficient and low cost photovoltaic-electrolysis (PVE) system
    to generate hydrogen by harvesting the full spectrum of sunlight
  what_happened: Laboratory-scale oxygen electrodes fabricated using conventional
    methods were limited to ~1 cm² surface area, which prevented their application
    in practical water electrolysers and blocked scale-up to industrial size.
  lesson_learnt: Adopt a hydrothermal manufacturing process for oxygen electrode fabrication
    — this approach enables uniform deposition of active species (nickel and iron)
    on nickel foam current collectors and successfully scales electrode area from
    1 cm² to 25 cm² while maintaining catalytic performance, overcoming the key barrier
    to industrial alkaline electrolyser deployment.
