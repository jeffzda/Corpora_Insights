  what_happened: CFD modelling of electrolyser flow channels revealed that conventional
    single-serpentine designs achieve good bubble removal but create high pressure
    drops, while parallel and pin designs reduce pressure drop but deliver uneven
    electrolyte distribution — neither design optimally balanced efficiency and durability
    for scale-up.
