  what_happened: Electrically integrating the CPV module with the alkaline water electrolyser
    was technically challenging because the CPV module's voltage output was lower
    than the AWE operating voltage requirement (>1.5 V), while the CPV current at
    specific potentials exceeded the electrolysis current requirement — a fundamental
    impedance mismatch that was particularly acute in the higher-power 1 kW system.
  lesson_learnt: CPV-electrolyser integration requires a purpose-designed DC-DC converter
    to bridge the voltage-current mismatch between the two devices; for systems above
    ~20 W, add an MPPT tracker and supercapacitor buffer to handle variable solar
    input and ensure stable electrolyser operation.
