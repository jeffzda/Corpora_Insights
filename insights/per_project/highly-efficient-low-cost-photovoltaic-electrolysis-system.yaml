  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Procured newly released ultrathin Zirconium-based Zirfon separators
    (~50 µm) with high mechanical strength, achieving cell resistance below 1 Ω without
    membrane penetration or distortion.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id006
  - 32
  evidence_excerpt: thin membranes normally make the alignment of each cell component
    difficult, as it may not be able to withstand the mechanical compression between
    anode and cathode that generally sandwiches the gas separator. Thus, the adoption
    of ultrathin membranes with a robust mechanical strength is highly desired in
    assembling a high-performance water electrolyser cell.
