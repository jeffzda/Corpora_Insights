- record_id: ARENA-DLV-51702
  source_title: Highly Efficient & Low Cost Photovoltaic-Electrolysis System Midterm
    Activity Sept 2020
  publish_date: '2020-09-25'
  project_name: Highly efficient and low cost photovoltaic-electrolysis (PVE) system
    to generate hydrogen by harvesting the full spectrum of sunlight
  what_happened: Conventional hydrogen evolution reaction (HER) catalysts either required
    high loadings of precious metals (e.g. 20 wt% Pt in Pt/C benchmark) or, when precious-metal-free,
    could not match the intrinsic activity of Pt/C, creating a cost-versus-performance
    impasse for commercial water electrolysers.
  lesson_learnt: Exploit atomic-level control of metal cluster structure and transition-metal
    doping to reduce precious metal loading to ≤0.5 wt% Pt or Ru while achieving a
    40× improvement in turnover frequency over the Pt/C benchmark — this approach
    can substantially lower catalyst material costs in commercial alkaline electrolysers
    without sacrificing activity.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Developed novel catalysts with precise atomic-level structural
    control and transition-metal doping, achieving 0.5 wt% precious metal loading
    with 40× higher TOF than the Pt/C benchmark.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id002
  - 6
  evidence_excerpt: Precious metal free catalysts for hydrogen evolution has been
    the focus of research for the past few years, while few of them can compete with
    the Pt/C in terms of intrinsic activity... The optimised catalyst only has precious
    metal (Pt or Ru) loading of 0.5 wt%, and when subjected to identical measuring
    conditions, they exhibit a 40-time increase in terms of turnover frequency (TOF)
    over the Pt/C benchmark catalyst.
