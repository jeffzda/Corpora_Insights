  what_happened: RTD temperature sensors used to monitor electrolysis conditions produced
    inaccurate readings because the gas/electrolyte bubble mixture at the sensor surface
    caused frequent alternating contact with phases of different heat capacity, corrupting
    temperature data and undermining process control.
  lesson_learnt: In alkaline water electrolysers, RTD sensors placed directly in the
    electrolyte outlet stream will give unreliable readings due to bubble interference
    — modify RTD mounting with a custom T-connection shell at the inlet pipe to exclude
    gas accumulation at the sensor surface, and cross-validate against a second RTD
    on the metallic current collector.
