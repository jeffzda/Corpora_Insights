  project_name: UNSW Photovoltaic Electrolysis towards Green Hydrogen Generation (2018/RND014)
  what_happened: Electrical lead resistance (I²R losses) between the CPV cell, DC-DC
    converter and electrolyser cell in the 20 W PVE system caused measurable efficiency
    losses, with STH efficiency dropping from 30.3% excluding lead losses to 29.1%
    including them, meaning physical component proximity is a non-trivial system design
    constraint.
  lesson_learnt: Minimise lead lengths between CPV, DC-DC converter and electrolyser
    in integrated PVE systems — I²R losses from leads are measurable at the 20 W scale
    and will become proportionally more significant at larger scales; co-locate components
    physically during system layout design.
