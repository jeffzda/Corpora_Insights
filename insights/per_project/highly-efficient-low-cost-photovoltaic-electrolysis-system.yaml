- record_id: ARENA-DLV-65901
  source_title: UNSW Renewable Hydrogen for Export R&D Project End of Activity Report
  publish_date: 2023-01
  project_name: UNSW Photovoltaic Electrolysis towards Green Hydrogen Generation (2018/RND014)
  what_happened: The zero-gap alkaline water electrolyser required ultrathin separator
    membranes to minimise ion-exchange resistance, but thin membranes could not reliably
    withstand the mechanical compression between anode and cathode during cell assembly,
    making component alignment difficult and risking membrane distortion or short-circuit.
  lesson_learnt: When assembling zero-gap alkaline electrolysers, specify separator
    membranes that combine ultrathin geometry with high mechanical strength (e.g.
    Zirfon ~50 µm) — standard thin membranes fail under compression and cause alignment
    and short-circuit risks that degrade cell performance.
  issue_severity: moderate
  project_type: enabling infrastructure
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
