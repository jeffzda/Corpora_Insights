- record_id: ARENA-DLV-51704
  source_title: Highly Efficient & Low Cost Photovoltaic-Electrolysis System Midterm
    Activity Sept 2020
  publish_date: '2020-09-25'
  project_name: Highly efficient and low cost photovoltaic-electrolysis (PVE) system
    to generate hydrogen by harvesting the full spectrum of sunlight
  what_happened: At lab scale, the CPV solar cell-heat exchanger system exhibited
    relatively large parasitic losses compared to commercial-scale systems, and the
    first-iteration design required detailed characterisation with high-accuracy sensors
    before a higher-performance second iteration could be designed. The lab-scale
    system achieved 38% CPV system efficiency using a 1 cm² triple-junction cell.
  lesson_learnt: Expect parasitic losses to be proportionally larger at lab scale
    than at commercial scale for CPV heat transfer systems — do not use lab-scale
    parasitic loss data to disqualify the technology pathway. RayGen's commercial-scale
    operational experience confirms parasitic losses can be substantially reduced
    at scale, so design iterations should focus on demonstrating heat transfer efficiency
    and scalability rather than minimising parasitics in the lab prototype.
  issue_severity: minor
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Initiated detailed characterisation using high-accuracy temperature,
    flow and pressure sensors to inform a next-iteration lab-scale heat transfer system
    design with higher performance and lower parasitic losses.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id004
  - 9
  evidence_excerpt: Compared to commercial scale, parasitic losses are relatively
    large for a lab scale system... RayGen's experience designing, building and operating
    commercial scale CPV systems has shown that parasitic losses can be substantially
    reduced, so are not as big an issue as suggested by lab scale systems.
  confidence_note: issue_severity minor — parasitic losses are a design iteration
    challenge rather than a project-threatening failure; the project achieved 38%
    CPV efficiency at this stage.
