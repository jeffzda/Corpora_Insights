- record_id: ARENA-DLV-51705
  source_title: Highly Efficient & Low Cost Photovoltaic-Electrolysis System Midterm
    Activity Sept 2020
  publish_date: '2020-09-25'
  project_name: Highly efficient and low cost photovoltaic-electrolysis (PVE) system
    to generate hydrogen by harvesting the full spectrum of sunlight
  what_happened: The CFD model developed for the alkaline electrolyser successfully
    described internal flow, species transfer and membrane hydroxide transport at
    the 2D transient lab scale, but the interaction between numerical simulation and
    experimental validation remained limited — simulations were used primarily for
    process understanding rather than being fully exploited for process optimisation.
  lesson_learnt: Build an explicit feedback loop between CFD simulation outputs and
    experimental design from the start of electrolyser R&D — at mid-project, the UNSW
    team identified that simulations had been used for understanding rather than optimisation,
    representing an underutilisation of the modelling investment. Future projects
    should define optimisation test cases for CFD before committing to experimental
    campaigns.
  issue_severity: minor
