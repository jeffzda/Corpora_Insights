- record_id: ARENA-DLV-51703
  source_title: Highly Efficient & Low Cost Photovoltaic-Electrolysis System Midterm
    Activity Sept 2020
  publish_date: '2020-09-25'
  project_name: Highly efficient and low cost photovoltaic-electrolysis (PVE) system
    to generate hydrogen by harvesting the full spectrum of sunlight
  what_happened: Existing CFD and electrochemical modelling literature for alkaline
    water electrolysis addressed flow only and did not incorporate electrochemical
    reaction kinetics, heat transfer, or species transfer through the membrane, leaving
    no validated model available to support electrolyser design optimisation. Additionally,
    the fully coupled model proved computationally expensive and required modification
    to run on national supercomputing infrastructure (NCI).
  lesson_learnt: When developing integrated electrolyser models, plan from the outset
    for high-performance computing access — the coupled CFD-electrochemical model
    requires supercomputer-scale resources and code adaptation for NCI; early engagement
    with NCI avoids bottlenecks during the numerical simulation phase. Also ensure
    CFD outputs are explicitly connected to process optimisation tasks, not just process
    understanding.
  issue_severity: moderate
  project_type: null
  project_scale_band: lab/bench
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: execution & logistics
  intervention_note: Modified the CFD code to enable large-scale computing on the
    National Computation Infrastructure (NCI) supercomputer to manage the computational
    expense of the coupled electrochemical-CFD model.
  transferability: narrow
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id003
  - 7
  evidence_excerpt: The numerical studies of electrolysis in the open literature only
    focus on flow. A new advanced model is required to be developed and validated
    when the electrochemical reactions are considered... The electrolyser model is
    computationally expensive. In order to address this issue, the code requires to
    be modified to allow the large-scale computing on supercomputers – National Computation
    Infrastructure (NCI).
  confidence_note: secondary_failure_mode of resource/capability shortfall used to
    capture the computational resource constraint; delay_category set to data/validation/testing
