  evidence_excerpt: 'The lack of coordination in planning and deploying DER increases
    the cost of infrastructure upgrades for all customers and does not provide the
    full value of DER to power system operation. Rapid deployments have led to several
    technical challenges: 1. Local over-voltage or loading issues on distribution
    feeders... 2. Risk of mass disconnection of anticipated PV generation in the event
    of a frequency variation... 3. Resource variability and uncertainty have disrupted
    normal system planning, causing a notable increase in generation re-dispatch events
    in 2011 and 2012.'
  confidence_note: Germany case study used as primary evidence base by EPRI — transferability
