- record_id: ARENA-DLV-72307
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2014'
  project_name: The Integrated Grid Project
  what_happened: EPRI's analysis of Germany's rapid DER deployment found that the
    absence of coordinated planning and strategic development led to local over-voltage
    and loading issues on distribution feeders, risk of mass PV disconnection during
    frequency events, increased generation re-dispatch, and loss of system inertia.
  lesson_learnt: Rapid DER deployment without coordinated interconnection rules, planning
    frameworks, and grid management strategies creates compounding technical and cost
    risks — interconnection standards, communications infrastructure, and distribution
    planning processes must be updated before, not after, high DER penetration is
    reached.
