- record_id: ARENA-DLV-16260
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: AusNet Services Grid Energy Storage System (GESS) Trial
  what_happened: AusNet Services conducted a 2-year trial of Australia's first grid-integrated network battery — a 1 MW / 1 MWh Li-ion system designed and constructed by ABB and Samsung. The trial was conducted
    at a non-critical network location with the intent to move it to a more critical location after learning was gathered.
  lesson_learnt: Staging grid-integrated battery trials at non-critical locations first allows NSPs to develop operational understanding and confidence in the technology before exposing critical network
    assets, but trial design should include a clear pathway to critical deployment to maximise the commercial and technical learning value.
