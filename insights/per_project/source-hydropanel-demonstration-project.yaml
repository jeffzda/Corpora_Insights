  project_name: SOURCE Hydropanel Demonstration Project (2018/ARP006)
  what_happened: The upfront capital cost of SOURCE hydropanels was identified as
    a significant barrier to market adoption, particularly for residential and smaller
    commercial customers who could not justify the lump-sum CapEx outlay.
  lesson_learnt: When demonstrating capital-intensive novel technology to price-sensitive
    market segments, develop and test alternative financing or service models (e.g.
    pay-per-use or Water Purchase Agreements) in parallel with the technology demonstration
    — waiting until market resistance is encountered delays commercialisation.
