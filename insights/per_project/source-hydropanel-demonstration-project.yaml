  what_happened: Ground-mounted installations were found to be safer, faster, and
    cheaper to install than roof-mounted configurations, and eliminated the need for
    building permits or development applications.
  lesson_learnt: Where site conditions permit, specify ground-mounted installations
    for novel distributed technology deployments — they reduce installer risk, shorten
    installation time, lower cost, and avoid the permit burden associated with roof
    work, all of which are critical friction points when scaling a nascent installer
    network.
