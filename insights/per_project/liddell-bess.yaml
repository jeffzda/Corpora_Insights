- record_id: ARENA-DLV-21614
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Liddell BESS
  what_happened: At Liddell BESS, the coupled nature of active and reactive current
    control loops in GFM inverters — unlike the decoupled loops in GFL inverters —
    created challenges during GPS compliance assessment and required development of
    an intimate understanding of inverter control schemes and extensive tuning exercises.
  lesson_learnt: GFM project teams must develop a detailed understanding of their
    specific inverter's control scheme architecture — particularly the coupling between
    active and reactive current control — before commencing GPS compliance tuning;
    engage the OEM for comprehensive control scheme documentation and plan for additional
    technical resource effort relative to GFL BESS.
  issue_severity: moderate
  project_type: storage
  project_scale_band: utility/large-scale
  lifecycle_phase: approvals/contracting
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: AGL developed an intimate understanding of the inverter control
    schemes and conducted extensive tuning exercises to resolve NER cl S5.2.5.5 compliance
    requirements.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: battery storage
  source_pages: &id002
  - 22
  - 23
  evidence_excerpt: For GFM operation, 'the swing equation would only dictate the
    angle of the virtual voltage source and the outer voltage control loop would control
    the magnitude of the voltage', with both control loops affecting both active and
    reactive current outputs. To address this required 'development of an intimate
    understanding of the inverter control schemes and extensive tuning exercises'.
  confidence_note: 'proponent_type reconciled to ''project developer'' from: project
