- record_id: ARENA-DLV-21607
  source_title: 'Ekistica - ARENA Grid-Forming Battery Portfolio Series: Update Report'
  publish_date: 2025-10
  project_name: Liddell BESS
  what_happened: AGL identified that Liddell BESS required oversizing of inverters
    and limiting operation to 86% of maximum capacity in order to reserve overcurrent
    headroom for inertial responses to active and reactive current disturbances, adding
    unexpected capital cost.
  lesson_learnt: Account for inverter oversizing requirements (potentially up to 10–14%
    of rated capacity) when evaluating OEM tenders for GFM BESS; reserve overcurrent
    capability for GFM inertial responses needs to be factored into the CAPEX model
    at the design stage, not identified post-procurement.
