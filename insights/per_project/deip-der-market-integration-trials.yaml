- record_id: ARENA-DLV-35117
  source_title: DEIP Market Integration Trials Summary Report 2.0
  publish_date: 2023-12
  project_name: DEIP DER Market Integration Trials
  what_happened: Analysis of DLT (distributed ledger technology) as an architecture
    option for CER data hubs concluded that in a regulated energy system with existing
    centrally trusted entities (AEMO, DNSPs), DLT provides negligible trust benefits
    over conventional architectures. This mirrors conclusions from IBM's study for
    Ofgem and Accenture's review of the failed ASX CHESS DLT replacement, which resulted
    in a $245–255 million pre-tax write-off for ASX.
  lesson_learnt: Do not use DLT architecture for energy data exchanges where centralised
    trusted entities already exist and are adequately regulated — DLT's trust benefits
    are redundant in this context, as demonstrated by the costly failure of the ASX
    CHESS DLT replacement, and conventional architectures will be simpler and more
    cost-effective.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: development/design
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: ASX paused DLT development, commissioned an independent review,
    and moved to more conventional software procurement processes; the project is
    now overseen by ASIC and RBA.
  transferability: moderate
  delay_magnitude: null
  technology_domain: other
  source_pages: &id007
  - 31
  - 32
  evidence_excerpt: In summary, DLT is a good solution for providing data visibility
    and transactional integrity in the absence of a central trusted entity. Given
    the SFE platform's central role, DLT has been discounted." – IBM. This change
    of direction at such a late stage in the project caused a $245-255 million pre-tax
    write-off for ASX and large losses for participants who were involved in the project.
  confidence_note: The ASX CHESS case is a referenced analogy, not an ARENA-funded
