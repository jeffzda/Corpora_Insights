- record_id: ARENA-DLV-35118
  source_title: DEIP Market Integration Trials Summary Report 2.0
  publish_date: 2023-12
  project_name: DEIP DER Market Integration Trials
  what_happened: The four market integration trials found that more sophisticated
    tools for managing CER flows on the network (more accurate DOEs, targeted network
    pricing, optimised allocation algorithms) only become materially more valuable
    than simpler approaches at higher levels of CER penetration and network constraint.
    Current simpler methods are sufficient in the near term.
  lesson_learnt: Network operators and program designers should adopt a deliberate
    sequencing strategy — deploy simpler flexible export and DOE mechanisms now, while
    investing in parallel development and trialling of more sophisticated methods
    so they are ready when CER penetration reaches levels at which simpler tools become
    inadequate.
