  project_name: DEIP DER Market Integration Trials
  what_happened: The National Energy Customer Framework (NECF), which governs the
    sale and supply of electricity, was found to potentially not apply to many new
    energy products such as VPP programs, creating a current or future regulatory
    gap in consumer protections for these services.
  lesson_learnt: Project developers deploying VPP and other new energy services should
    engage early with regulators on consumer protection obligations — the existing
    regulatory framework may not apply to novel service structures, leaving both consumers
    and providers in an ambiguous position that creates delivery and commercial risk.
