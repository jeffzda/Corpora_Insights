- record_id: ARENA-DLV-35116
  source_title: DEIP Market Integration Trials Summary Report 2.0
  publish_date: 2023-12
  project_name: DEIP DER Market Integration Trials
  what_happened: Analysis of data hub technology options for CER integration found
    that governance structures are largely independent of technology architecture
    choices. Whether point-to-point, centralised, or decentralised hub, a wide range
    of governance can be applied to any architecture, and cost-benefit analyses that
    link specific cost structures (e.g. licensing fees) to particular technology choices
    risk producing misleading conclusions.
  lesson_learnt: When designing CER data exchange systems, separate governance design
    from technology architecture selection — the two are independent, and conflating
    them in cost-benefit analyses leads to flawed conclusions and may prematurely
    close off viable options.
