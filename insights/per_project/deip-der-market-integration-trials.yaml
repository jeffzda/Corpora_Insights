  source_title: DEIP Market Integration Trials Summary Report 2.0
  publish_date: 2023-12
  project_name: DEIP DER Market Integration Trials
  what_happened: ANU BSGIP research found that energy system decision-making processes,
    including AEMC rule changes and DNSP regulatory resets, currently involve consumers
    too late — typically after solutions to industry-defined problems have already
    been developed rather than consulting consumers first about what is important
    to them.
  lesson_learnt: Energy system reform and trial programs should engage consumers at
    the earliest stage using neutral, non-prescriptive consultation methods before
    solution options are defined — late consumer engagement after industry has framed
    the problem constrains the solution space and reduces the legitimacy and acceptability
    of outcomes.
