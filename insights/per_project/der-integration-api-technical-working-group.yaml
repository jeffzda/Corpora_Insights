  source_title: State of DER Technology Integration Report
  publish_date: 2021-02
  project_name: DER Integration API Technical Working Group
  what_happened: 'The DER Integration API Technical Working Group experienced delays
    to its two key deliverables: the initial draft of the Australian IEEE 2030.5 implementation
    guide (originally due December 2019) was delayed to September 2020, and the final
    draft (originally due March 2020) was delayed to December 2020.'
  lesson_farnt: Industry working groups developing voluntary standards should plan
    for longer delivery timelines than standards based on individual project deliverables
    — reaching consensus across multiple organisations on data use cases and API specifications
    takes significantly longer than technically drafting the standard itself.
  lesson_learnt: Industry working groups developing voluntary standards should plan
    for significantly longer delivery timelines than anticipated — achieving multi-organisation
    consensus on data use cases and API specifications is more time-consuming than
    technical drafting, and initial schedules should include substantial contingency.
