  source_title: Wave Swell Energy Lessons Learnt 2
  publish_date: '2021-05-12'
  project_name: Wave Swell Energy – UniWave200 King Island Project
  what_happened: Offshore material handling was managed without a davit or knuckle
    boom crane with winch, which would have significantly improved operational capability;
    the highly corrosive marine environment also caused damage to small pumps and
    generators.
  lesson_learnt: Future offshore wave energy deployments should include a davit or
    knuckle boom crane with winch as standard equipment — the absence of this capability
    created material handling constraints; for larger operations, an anchor handling
    utility vessel should be planned from the outset.
