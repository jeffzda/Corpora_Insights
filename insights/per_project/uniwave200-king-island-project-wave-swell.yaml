  publish_date: 2021-11
  project_name: UniWave200 King Island Project
  what_happened: COVID-19 pandemic restrictions limited access to King Island for
    key personnel, causing delays in getting personnel and supplies to the site, increases
    in project expenditure, and forcing commissioning and operations activities to
    be conducted remotely.
  lesson_learnt: Remote island and offshore energy projects should develop robust
    remote operations capabilities and contingency logistics plans, as access restrictions
    — whether from pandemics or other causes — can significantly delay personnel deployment
    and increase costs.
