- record_id: ARENA-DLV-9007
  source_title: 'Wave Swell Energy Ltd: UniWave200 King Island Project - Lessons Learnt
    Report 3'
  publish_date: 2021-11
  project_name: UniWave200 King Island Project
  what_happened: Much of the electrical infrastructure on the UniWave200 was located
    on the WEC itself, making access difficult and costly; for nearshore installations,
    relocating electrical systems onshore would provide easier access in a controlled
    environment.
  lesson_learnt: For nearshore wave energy converters, design electrical systems so
    that as much infrastructure as possible is located onshore — this reduces access
    difficulty, maintenance costs, and operational risk compared to placing electrical
    systems on the marine structure.
