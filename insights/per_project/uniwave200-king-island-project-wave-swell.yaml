- record_id: ARENA-DLV-19601
  source_title: Wave Swell Energy Lessons Learnt 1
  publish_date: 2019-12
  project_name: Wave Swell Energy – UniWave200 King Island Project
  what_happened: Prior to commencing the King Island project, Wave Swell Energy conducted
    a comprehensive survey of the international wave energy community — covering industry,
    academia, and government — to identify common pitfalls that had caused past wave
    energy projects to fail. The project proceeded without major issues, suggesting
    the survey was effective.
  lesson_learnt: Before committing to a wave energy (or novel marine energy) project,
    systematically survey past international project experience to identify common
    failure modes — particularly the tendency to pursue academically interesting but
    commercially unviable concepts — and structure the project to build on proven
    OWC concepts and proven mechanical/electrical plant rather than entirely new technologies.
  issue_severity: none
