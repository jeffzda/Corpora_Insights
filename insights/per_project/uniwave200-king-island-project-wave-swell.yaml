  source_title: Wave Swell Energy Lessons Learnt 1
  publish_date: 2019-12
  project_name: Wave Swell Energy – UniWave200 King Island Project
  what_happened: When modelling the turbine's interaction with the electrical system
    and applying constraints imposed by Hydro Tasmania, Wave Swell Energy discovered
    that insufficient coordination between electrical and turbine engineering disciplines
    had occurred during design. In hindsight, a higher-inertia turbine would have
    required less electrical control complexity and reduced costs.
  lesson_learnt: Actively coordinate interdisciplinary relationships between turbine
    and electrical engineering teams from the outset of design — poor integration
    between these disciplines can lock in suboptimal design choices (e.g. lower-inertia
    turbines requiring more complex and costly electrical control systems) that are
    expensive to correct later.
