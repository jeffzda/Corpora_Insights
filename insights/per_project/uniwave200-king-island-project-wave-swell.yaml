- record_id: ARENA-DLV-9004
  source_title: 'Wave Swell Energy Ltd: UniWave200 King Island Project - Lessons Learnt
    Report 3'
  publish_date: 2021-11
  project_name: UniWave200 King Island Project
  what_happened: In larger sea states, water was observed being expelled through the
    rubber flap valves on the UniWave200 structure, reducing energy output due to
    energy losses through this pathway.
  lesson_learnt: For wave energy converters using flap valve systems, flap valves
    should be positioned at a higher elevation or the structure height increased proportionally
    to prevent water expulsion in larger sea states and maintain energy capture efficiency.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: WSE identified that relocating flap valves to a higher elevation
    or increasing structure height proportionally would resolve the water expulsion
    problem in future device iterations.
  transferability: narrow
  delay_magnitude: null
  technology_domain: other
  source_pages: &id004
  - 3
  evidence_excerpt: 'In larger seas water is being expelled through the rubber flap
    valves. This results in a reduction in the energy produced. Implications for future
    projects: The location of the flap valves will be put at a higher elevation or
    alternatively the structure height will be increased proportionally.'
  confidence_note: issue_severity set to moderate as energy reduction in large seas
    is a meaningful performance shortfall requiring design change, though not a critical
    failure.
