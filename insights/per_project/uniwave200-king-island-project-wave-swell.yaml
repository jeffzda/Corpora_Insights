  source_title: Wave Swell Energy Lessons Learnt 2
  publish_date: '2021-05-12'
  project_name: Wave Swell Energy – UniWave200 King Island Project
  what_happened: Dyneema mooring lines on the leading mooring lines failed due to
    degradation in the dynamic near-device zone, requiring modification to chains
    for the first 7–10 metres from the device.
  lesson_learnt: Use chain rather than synthetic rope (Dyneema) for the first 7–10
    metres of leading mooring lines on wave energy converters — the dynamic loading
    and abrasion environment in the near-device zone causes Dyneema to break down;
    this modification should be incorporated into initial design rather than retrofitted.
