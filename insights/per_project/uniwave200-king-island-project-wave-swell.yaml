- record_id: ARENA-DLV-22451
  source_title: Wave Swell Energy Lessons Learnt 2
  publish_date: '2021-05-12'
  project_name: Wave Swell Energy – UniWave200 King Island Project
  what_happened: The unit was towed to King Island before 100% of electrical works
    were completed in order to take advantage of a suitable weather window, creating
    risk and uncertainty about whether another timely weather window would have been
    available had the team waited.
  lesson_learnt: Offshore tow scheduling must balance the opportunity cost of a suitable
    weather window against the risk of deploying with incomplete works — teams should
    assess whether remaining works can be safely completed offshore or whether waiting
    for full completion ashore is lower-risk overall.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: project developer
  delay_category: construction/installation
  failure_mode: execution & logistics
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: The team proceeded with the tow and completed remaining electrical
    works offshore during the available weather window, which ultimately succeeded.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: other
  source_pages: &id013
  - 2
  evidence_excerpt: The opportunity was taken when a suitable weather window presented
    itself to tow the unit to King Island without having completed 100% of the electrical
    works. In hindsight we may have been better to stay in Tasmania until all works
    were completed.
  confidence_note: issue_severity set to moderate given incomplete electrical works
