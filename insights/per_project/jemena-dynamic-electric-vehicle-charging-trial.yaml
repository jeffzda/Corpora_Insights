- record_id: ARENA-DLV-51463
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Jemena – Dynamic Electric Vehicle Charging Trial
  what_happened: In the Jemena EV trial, 20% of participants did not participate in
    demand response or solar soak events due to chargers being switched off when not
    in use, Wi-Fi connectivity issues, or inconvenient timing — representing a structural
    non-participation floor unrelated to incentive design.
  lesson_learnt: Plan for a structural non-participation floor of at least 20% in
    residential EV demand response programs due to connectivity dropouts and charger
    availability; technology specifications should require always-on connectivity
    and auto-reconnect features, and event scheduling should consider participant
    routines.
  issue_severity: minor
