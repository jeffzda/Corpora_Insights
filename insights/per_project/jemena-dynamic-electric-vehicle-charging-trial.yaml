- record_id: ARENA-DLV-51462
  source_title: UTS - Flexible Demand State of Play in Australia - Report
  publish_date: 2024-05
  project_name: Jemena – Dynamic Electric Vehicle Charging Trial
  what_happened: Demand response events in the Jemena EV charging trial produced unintended
    secondary demand peaks just outside the event window as participants resumed charging
    immediately after restrictions lifted.
  lesson_learnt: Demand response event design must account for the 'rebound peak'
    immediately following event windows — future EV charging incentive schemes should
    use staggered event end times, randomised release windows, or post-event price
    signals to dampen the secondary peak.
