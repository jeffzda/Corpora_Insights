- record_id: ARENA-DLV-11018
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Gelliondale Nursery Biomass Boiler
  what_happened: Prior to installing the biomass boiler, Gelliondale Nursery identified
    project development barriers including lack of familiarity with the technology
    internally, perceived difficulty in finding information on the technology, and
    perceived difficulty in finding applicable grants.
  lesson_learnt: Information barriers and lack of internal familiarity are primary
    obstacles to biomass adoption in smaller industrial operations — proponents should
    engage the equipment supplier as consultant early, visit comparable operating
    sites, and leverage internal organisational experience with related combustion
    technologies.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: industrial operator
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: successful demonstration
  secondary_failure_mode: poor scoping
  intervention_note: Engaged supplier as consultant; visited two horticulture and
    one timber biomass boiler site; leveraged internal experience with pelleting operations
    involving similar biomass combustion and feed systems.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
