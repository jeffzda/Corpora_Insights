- record_id: ARENA-DLV-11017
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Gelliondale Nursery Biomass Boiler
  what_happened: Gelliondale Nursery in Alberton, VIC, a greenfield site outside the
    gas distribution network, chose a 1.5 MWth biomass boiler over LPG for greenhouse
    heating. Despite the biomass option having six times higher capital cost ($550,000
    vs $80,000 for LPG), ongoing fuel costs were $140,000 per year lower ($30,000
    vs $170,000 for LPG), yielding a 3–4 year payback. The major technical challenge
    during commissioning was managing varying moisture content of biomass feedstock.
  lesson_learnt: Sites outside the gas network where LPG is the alternative should
    conduct full lifecycle cost analysis against biomass — higher capex of biomass
    is typically recovered in 3–4 years through dramatically lower fuel costs, and
    on-site moisture content management must be addressed during commissioning.
  issue_severity: minor
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: industrial operator
  delay_category: commissioning/integration
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Engaged the eventual supplier as a consultant; senior staff visited
    existing biomass boiler sites before committing; commissioning focussed on optimising
    air flow moderation to handle varying moisture content.
  transferability: moderate
  delay_magnitude: null
  technology_domain: bioenergy
