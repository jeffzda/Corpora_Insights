- record_id: ARENA-DLV-13053
  source_title: OMPS New England PHES Benefits Study - Knowledge Sharing Interim Report
  publish_date: 2022-04
  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: During preparation of the NEM power system stability model, Amplitude
    found that many synchronous machines in the AEMO Standard Snapshot package lacked
    governor models. When a trip of Kogan Creek Power Station (~750 MW) was simulated,
    system frequency dropped below 49 Hz and cascading protection relay trips caused
    cascading failure — an outcome inconsistent with the snapshot representing a secure
    operating state.
  lesson_learnt: When using AEMO Standard Snapshot models for dynamic stability studies,
    verify that governor models are present for all synchronous machines before running
    contingency simulations — missing governor models can produce unrealistic cascading
    failure results that invalidate study outcomes. Request supplementary generic
    governor models from AEMO at study commencement.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: data/validation/testing
  failure_mode: data & measurement
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: AEMO provided generic governor models for all plant; Amplitude
    incorporated these into the NEM models and the spurious 49 Hz frequency deviation
    following the Kogan Creek trip was no longer observed.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: pumped hydro
  source_pages:
  - 35
  - 36
  evidence_excerpt: When preparing the initial study scenarios Amplitude noticed that
    for a trip of Kogan Creek Power Station from around 750 MW the NEM system frequency
    would drop rapidly, falling below 49 Hz. This caused protection relays on other
    generators to disconnect plant leading to cascading failure … Investigations revealed
    that many of the synchronous machines did not have governor models, which was
    identified to be the root cause of the significant frequency deviation.
  confidence_note: 'lifecycle_phase assigned as development/design as this occurred
