  what_happened: The system strength and inertia study found that projected retirements
    of Eraring (by 2025) and Vales Point (by 2029) would make it impossible to maintain
    the minimum of seven large synchronous units in NSW as required under existing
    NEM rules, requiring Amplitude to assume the generators did not retire solely
    to preserve the minimum profile for modelling purposes.
  lesson_learnt: System strength and inertia assessments for post-2030 REZ scenarios
    must grapple with the structural gap created by coal retirements rendering minimum
    synchronous generation requirements impossible to meet without replacement; PHES
    and synchronous condensers should be evaluated as structural system strength solutions
    — not just supplements — in scenarios where the existing minimum generation framework
    becomes unachievable.
