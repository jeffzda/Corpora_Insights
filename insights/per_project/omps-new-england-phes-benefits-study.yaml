  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: Amplitude justified the approach by noting that the impact of
    a large synchronous machine injecting at Armidale would represent a general trend
    likely to persist regardless of future network changes.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
