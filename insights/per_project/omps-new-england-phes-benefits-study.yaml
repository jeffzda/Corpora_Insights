- record_id: ARENA-DLV-13054
  source_title: OMPS New England PHES Benefits Study - Knowledge Sharing Interim Report
  publish_date: 2022-04
  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: Network stability modelling found that when OMPS generates under
    lower demand (midday/shoulder) conditions, the worst-case contingency setting
    the QNI southerly stability limit shifts from north of Armidale to transmission
    lines south of Armidale (Armidale–Tamworth and Liddell–Muswellbrook 330 kV), causing
    a reduction of up to 180 MW in the southerly QNI limit — a constraint that could
    affect OMPS's own connection approval and dispatch headroom.
  lesson_learnt: Large synchronous generators injecting into a radial 330 kV node
    can shift the binding stability contingency to downstream circuits; PHES proponents
    and network planners should model the full contingency set both north and south
    of the connection point, not just the existing worst-case contingencies, to avoid
    underestimating adverse stability impacts on parallel transmission corridors.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: grid connection/system studies
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The study noted that the committed QNI Minor augmentation (SVCs
    at Tamworth and Dumaresq, additional capacitor banks) would improve the southerly
    QNI limit by up to 240 MW, substantially mitigating the reduction caused by OMPS
    generation, and the New England REZ Transmission Link (actionable ISP project)
    is expected to increase corridor capacity by over 3,000 MW by 2027.
  transferability: moderate
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages:
