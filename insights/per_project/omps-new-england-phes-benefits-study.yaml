  what_happened: 'The ARENA-funded study structured delivery into three milestones:
    (1) inputs baselining and technology finalisation, (2) REZ/network/VRE impact
    modelling with interim knowledge sharing, and (3) final reporting including market
    modelling. At the time of this interim report, Milestone 1 was complete and Milestone
    2 network stability work was underway, with market considerations deferred to
    Q3 2022.'
