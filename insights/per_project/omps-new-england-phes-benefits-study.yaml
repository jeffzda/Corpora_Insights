  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: Amplitude's Available Fault Level study found that PHES generator
    transformer impedance was higher than expected in the power system model, resulting
    in a lower-than-anticipated system strength contribution — specifically, the 900
    MW configuration improved AFL at Armidale 330 kV by 2,350 MVA rather than the
    ~2,700+ MVA initially expected.
  lesson_learnt: PHES system strength modelling should use verified OEM transformer
    impedance values from the outset; higher-than-assumed transformer impedance can
    materially reduce the fault level contribution at the connection bus and should
    be checked against preliminary transformer specifications before publishing benefit
    assessments.
