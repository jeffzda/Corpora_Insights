- record_id: ARENA-DLV-13056
  source_title: OMPS New England PHES Benefits Study - Knowledge Sharing Interim Report
  publish_date: 2022-04
  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: Comparative modelling of a 900 MW PHES against a notional 900 MW
    BESS discharging at the same Armidale 330 kV location found that the BESS reduced
    the QNI southerly transfer limit for a Liddell–Muswellbrook contingency by 60
    MW more than PHES, and the BESS model became voltage-unstable at 860 MW QNI transfer
    while OMPS maintained continuous operation. PHES injected approximately 100 MVAr
    more capacitive reactive power during the fault.
  lesson_learnt: For system strength and voltage stability at large REZ connection
    points, PHES provides materially superior fault-ride-through and reactive current
    injection compared with an equivalently rated BESS — project proponents and network
    planners should not assume PHES and BESS are interchangeable when assessing stability-limiting
    constraints on major interconnectors.
  issue_severity: major
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: Amplitude noted that with further tuning the BESS model could
    provide more aggressive capacitive current injection during faults, potentially
    improving voltage support, but considered it unlikely to prevent the post-fault
    voltage collapse observed in the modelled case.
  transferability: broad
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages:
  - 48
  - 49
  - 50
  evidence_excerpt: The study found that the 900 MW BESS also reduced the QNI southerly
    transfer limit for a Liddell – Muswellbrook contingency but by 60 MW more than
    OMPS… the short circuit current contribution from PHES machines like OMPS is far
    higher than that of a typical inverter-based facility (circa 3-6 times higher)
    and this additional short circuit current can assist with maintaining system voltages
    and preventing voltage collapse following disturbances.
  confidence_note: Canonical record merged from 2 source records across 2 document(s).
