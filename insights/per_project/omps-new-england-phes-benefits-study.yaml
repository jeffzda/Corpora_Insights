  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: EY's modelling of a scenario where the New England REZ transmission
    link was delayed beyond 2030-31 found that this single transmission bottleneck
    would increase average NSW wholesale prices by approximately $21-23/MWh (approximately
    20%) compared to the base case with the link in service, despite the same volume
    of REZ renewable generation being installed in both scenarios.
  lesson_learnt: Transmission augmentation is a prerequisite for REZ renewable generation
    to deliver wholesale price benefits; commissioning delays to key REZ transmission
    links can negate the price suppression effect of installed renewable capacity
    and substantially increase consumer costs — project and policy timelines for REZ
    storage and generation should be explicitly conditioned on transmission delivery.
