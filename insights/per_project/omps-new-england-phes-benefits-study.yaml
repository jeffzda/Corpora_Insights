  what_happened: EY's market modelling found that in the base case without PHES (Case
    1) there was already 21% economic spill of New England solar generation and 13.5%
    total curtailment of wind generation in 2030-31, driven by the large volume of
    zero-bidding renewable generation creating frequent near-zero price periods —
    even with the NE REZ link in service.
  lesson_learnt: Solar and wind generators entering the New England REZ post-2030
    should model high base-case curtailment rates (20%+ for solar) in their revenue
    projections even with transmission augmentation in service; co-located storage
    or demand flexibility is essential to capture curtailed generation and maintain
    project economics in high-VRE scenarios.
