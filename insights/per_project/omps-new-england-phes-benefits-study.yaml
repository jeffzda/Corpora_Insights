  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: The NSW Electricity Infrastructure Roadmap explicitly identified
    that pumped hydro projects face bespoke design requirements, long lead times,
    and high capital intensity, creating significant barriers to development. The
    Oven Mountain project, declared CSSI in 2020, was still in the EIS and planning
    approval phase as of April 2022 with an anticipated operational date around 2028.
  lesson_learnt: PHES developers should plan for a development timeline of at least
    7–10 years from project inception to operation, driven by bespoke geotechnical
    and civil design, complex environmental approvals (EIS), and transmission connection
    studies — early engagement with planning authorities, network service providers,
    and AEMO is essential to avoid compounding delays across these sequential workstreams.
