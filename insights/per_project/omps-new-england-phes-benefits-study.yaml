- record_id: ARENA-DLV-26864
  source_title: 'Pumped Hydro Energy Storage: Renewable Energy Zone and Network Benefits
    Assessment'
  publish_date: 2023-03
  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: EY's market modelling excluded voltage and transient stability constraint
    equations from the dispatch model for the 2030-31 scenario on the grounds that
    existing stability constraints would not be representative of future network conditions,
    and constructing new stability constraint equations was out of scope — meaning
    the market benefit results for PHES are conservative and likely understate the
    true market value.
  lesson_learnt: Market benefit assessments for PHES in REZ environments that exclude
    stability constraint equations will systematically underestimate the value of
    PHES; future benefit studies should budget for development of future-year stability
    constraint equations or apply a conservative uplift factor, and clearly disclose
    the conservative bias in results to avoid undervaluing PHES in investment tests.
  issue_severity: moderate
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: development/design
  proponent_type: project developer
  delay_category: data/validation/testing
