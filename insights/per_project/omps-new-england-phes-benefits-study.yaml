  what_happened: The 900 MW PHES configuration was found to deliver greater market
    benefits than the 600 MW configuration across all metrics assessed — including
    NSW retail bill reductions ($583M vs $481M), fuel cost savings ($70M vs $48M),
    emissions reductions (1.1% vs 0.9%), solar MLF improvement (0.008 vs 0.006), and
    renewable curtailment reduction — primarily because the larger configuration is
    dispatched more frequently given the same reservoir size.
  lesson_learnt: For PHES projects with a fixed reservoir volume, upsizing the turbine
    capacity increases dispatch flexibility and market benefits without proportionally
    increasing storage costs; cost-benefit assessments for PHES should explicitly
    compare turbine capacity options against a shared reservoir, as the larger turbine
    may dominate on both market and network benefit metrics.
