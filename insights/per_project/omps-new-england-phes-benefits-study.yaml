  what_happened: The stability study required OEM-supplied PSS®E dynamic models to
    represent OMPS in the NEM model. The document notes that the final connection
    arrangement for OMPS (600 MW at 132 kV or 900 MW at 330 kV) had not been determined
    and would depend on the scope of New England REZ transmission development, requiring
    the study to model a simplified direct connection to the Armidale busbar as a
    proxy.
  lesson_learnt: PHES projects in pre-FEED stages should obtain OEM dynamic models
    early for network studies, and accept that connection modelling will require simplifying
    assumptions until the REZ transmission framework is finalised — studies should
    be designed to test sensitivity to connection voltage and capacity rather than
    a single assumed configuration.
