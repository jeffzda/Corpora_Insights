- record_id: ARENA-DLV-26857
  source_title: 'Pumped Hydro Energy Storage: Renewable Energy Zone and Network Benefits
    Assessment'
  publish_date: 2023-03
  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: Studies demonstrated that when PHES operates in pumping mode it acts
    as a large load at Armidale, reducing southerly power flows and enabling equivalent
    volumes of new renewable generation to inject at the same node without increasing
    net transmission loading — effectively increasing network hosting capacity by
    the pumping demand volume.
  lesson_learnt: PHES pumping demand can be used as a 'renewable hosting multiplier'
    within a REZ — because pumping load and co-located renewable generation cancel
    on the transmission network, a single PHES facility can unlock new renewable capacity
    significantly exceeding its own nameplate pumping rating; REZ planning should
    model PHES pumping mode as a hosting capacity instrument, not just a storage charging
    mechanism.
