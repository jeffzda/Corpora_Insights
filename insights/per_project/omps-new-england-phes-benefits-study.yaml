- record_id: ARENA-DLV-13055
  source_title: OMPS New England PHES Benefits Study - Knowledge Sharing Interim Report
  publish_date: 2022-04
  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: Stability modelling demonstrated that a 900 MW PHES operating in
    synchronous condenser mode — providing system strength, voltage support and inertia
    without generating active power — improved QNI stability limits by more than 200
    MW bidirectionally across all contingencies, without being subject to economic
    dispatch constraints.
  lesson_learnt: PHES synchronous condenser capability should be explicitly recognised
    in connection agreements and system strength frameworks as a dispatchable non-network
    service; because it operates independently of energy market dispatch, it can provide
    a persistent 'pillar of strength' for surrounding IBR generators that a BESS or
    OCGT cannot replicate outside scheduled dispatch.
  issue_severity: none
  project_type: storage
  project_scale_band: first commercial/FOAK
  lifecycle_phase: concept/feasibility
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages:
  - 47
  - 48
  - 75
  evidence_excerpt: The synchronous condenser mode of operation is a particular benefit
    of OMPS. The units can provide substantial system strength, voltage control and
    inertial support in this mode in a similar manner to generation and pumping modes,
    but without being reliant on economic security constrained dispatch outcomes.
    This makes the synchronous condensers a very flexible option to support increased
    renewable generator connections as they can provide a power system 'pillar of
    strength' for the surrounding network irrespective or wholesale market pricing
    signals.
  confidence_note: outcome_class 'knowledge generated despite setback' used as closest
