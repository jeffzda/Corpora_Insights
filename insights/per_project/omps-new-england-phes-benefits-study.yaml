  what_happened: EY's market modelling found that over 40% of half-hour periods in
    NSW in 2030-31 are forecast to have prices at or near zero, while approximately
    8% of periods exceed $300/MWh — a bimodal price distribution driven by the large
    volume of zero-bidding renewable generation replacing baseload coal, creating
    significant arbitrage opportunities for storage.
  lesson_learnt: Storage project revenue modelling for post-2030 NEM scenarios should
    use bimodal price distributions reflecting high penetrations of zero-marginal-cost
    renewables rather than historical price assumptions; the arbitrage spread between
    near-zero daytime prices and high evening prices is the primary revenue driver
    and should be stress-tested against alternative coal retirement trajectories.
