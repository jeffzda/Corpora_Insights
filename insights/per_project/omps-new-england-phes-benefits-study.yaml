  what_happened: EY's modelling found that in the base scenario (with the NE REZ transmission
    link in service), PHES pumping occurs predominantly during daylight hours when
    solar generation peaks, resulting in a measurable improvement in solar generator
    MLFs of 0.006–0.008 while wind MLFs remained neutral — because wind generation
    is not concentrated in the pumping window.
