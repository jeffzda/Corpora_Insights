  what_happened: EY's modelling found that the additional gas capacity required to
    maintain reliability in the 2030-31 scenario (1.75 GW beyond the ISP Step Change
    outcomes) was driven by differences in modelling approach — particularly the use
    of full N-1 network constraint equations and non-perfect-foresight storage dispatch
    rather than the ISP's simplified approach — highlighting that real-world dispatch
    conditions may require more firming capacity than ISP projections suggest.
  lesson_learnt: REZ storage benefit assessments based on ISP scenarios should note
    that ISP modelling uses simplified network constraints and perfect-foresight storage
    dispatch; when more realistic dispatch and network constraint modelling is applied,
    the residual firming requirement from gas or other dispatchable generation tends
    to be higher, which affects the relative market value of storage.
