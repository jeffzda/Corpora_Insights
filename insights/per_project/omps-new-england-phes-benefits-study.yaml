  project_name: Oven Mountain Pumped Hydro Energy Storage Project
  what_happened: The project was declared Critical State Significant Infrastructure
    (CSSI) under the NSW Environmental Planning and Assessment Act 1979, which placed
    it on the ministerial determination pathway — but as of Q1 2023 was still awaiting
    EIS exhibition, ministerial determination, and construction approval, with commercial
    operations not targeted until 2028-29.
