    technical metrics be underpinned by sufficient due diligence on deployment conditions
    and scalability, because many emerging OEMs could offer only limited commercial
    performance data.
  lesson_learnt: Before approving a trial, ensure technoeconomic and technical metrics
    are supported by adequate due diligence on how the innovation will perform under
    actual deployment conditions (e.g. remote Pilbara environment) and whether it
    can scale if the trial succeeds — limited OEM data should be a qualification risk
    flag, not a disqualifier, but must be explicitly acknowledged.
