- record_id: ARENA-DLV-33903
  source_title: Fortescue Solar Innovation Hub - Milestone 1 report
  publish_date: '2026-01-30'
  project_name: Fortescue Solar Innovation Hub (Pilbara Solar Innovation Hub)
  what_happened: Trialling emerging robotic and autonomous technologies in the Pilbara
    required accepting a higher short-term risk profile and potential budgetary impacts;
    commercial goals were not always achievable within the trial itself but were understood
    as stepping stones to longer-term savings at scale.
  lesson_learnt: When running an innovation hub targeting emerging technologies, explicitly
    frame and communicate to leadership that commercial goals may not be achieved
    within individual trials — a clear risk-vs-reward value proposition, scoped trials
    with defined downside limits, and board-level acceptance of short-term budget
    variance are prerequisites for sustained innovation delivery.
