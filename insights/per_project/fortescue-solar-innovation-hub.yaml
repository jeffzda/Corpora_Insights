    solar build program as an innovation allocation, creating a test-bed arrangement
    that enables a portfolio of concurrent trials and commercial-scale demonstrations
    without requiring separate dedicated project infrastructure.
  lesson_learnt: Integrating an innovation allocation (reserved capacity) within a
    large-scale active build program is an effective model for enabling commercial-scale
    technology trials — it removes the need for standalone test infrastructure, reduces
    trial cost, and generates performance data under real operating conditions that
    is credible to investors and the broader industry.
