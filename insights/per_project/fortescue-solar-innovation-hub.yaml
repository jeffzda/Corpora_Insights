- record_id: ARENA-DLV-33907
  source_title: Fortescue Solar Innovation Hub - Milestone 1 report
  publish_date: '2026-01-30'
  project_name: Fortescue Solar Innovation Hub (Pilbara Solar Innovation Hub)
  what_happened: The Built Robotics autonomous piling system used a materially different
    work methodology from conventional impact piling — piles were loaded into baskets
    rather than pre-laid along the workface — shifting logistics toward centralised
    material handling and basket management, which required integration with existing
    foundation workflows including pre-drilling and CSF backfilling.
  lesson_learnt: Before deploying autonomous construction machinery on a live site
    with multiple contractors, develop and validate fit-for-purpose site safety procedures
    that integrate automation object-detection thresholds with existing site operating
    procedures — misalignment between detection sensitivity and actual worker positioning
    caused unplanned stoppages that eroded productivity.
