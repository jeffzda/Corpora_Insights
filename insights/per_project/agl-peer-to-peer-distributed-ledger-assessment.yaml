- record_id: ARENA-DLV-52051
  source_title: ARENA Distributed Energy Resources Projects
  publish_date: 2019-03
  project_name: AGL Peer to Peer Distributed Ledger Assessment
  what_happened: A virtual trial of peer-to-peer energy trading using distributed
    ledger technology found that, under existing rules and based on pure economic
    drivers, the P2P market requires participants to reduce the cost of servicing
    P2P customers, and that most value is delivered under a model with multiple retailers
    and location/time-based network pricing.
  lesson_learnt: Distributed ledger technology can technically support a P2P energy
    trading market, but market rules and cost structures must be reformed — particularly
    around retailer servicing costs and network pricing — before P2P trading is commercially
    viable at scale.
