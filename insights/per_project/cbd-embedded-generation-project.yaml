  publish_date: null
  project_name: CBD Embedded Generation Project
  what_happened: The triplex electricity network in the Sydney CBD presented unique
    technical challenges (fault level and feeder imbalance issues) for connecting
    embedded generation, for which no standard acceptable technical solution existed
    at the outset of the project. Ausgrid initiated a phased development project (Phase
    1 AUD 40,000; Phase 2 AUD 420,000) to develop a cost-effective connection solution.
  lesson_learnt: Unique legacy network architectures (such as triplex CBD networks)
    may have no standard embedded generation connection solution — identify these
    network-specific technical barriers early in development and factor in dedicated
    engineering development time and cost before committing to connection timelines.
