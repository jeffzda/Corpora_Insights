- record_id: ARENA-DLV-53889
  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: ARENA Demand Flexibility Portfolio — EV Metering (ActewAGL REVS)
  what_happened: FCAS participation requires metering capable of recording frequency
    response at 50 millisecond intervals; across the EV trials, only one commercially
    available 3-phase power meter was found capable of this response speed, with most
    commercial meters only supporting 1-second interval data. This prevented FCAS
    participation from EV chargers.
  lesson_learnt: Projects targeting EV-based FCAS must verify that available metering
    equipment can meet the 50ms MASS specification before designing FCAS into the
    business case; the current metering market does not provide fit-for-purpose products
    for this application at commercial scale, and this constraint should be escalated
    to standards bodies.
