- record_id: ARENA-DLV-51351
  source_title: Hysata High-Efficiency 'Capillary-fed' Electrolyser Pilot Project
    - Lessons Learnt Report 1
  publish_date: 2024-07
  project_name: High Efficiency 'Capillary-fed' Electrolyser Pilot (HyGATE) Project
  what_happened: When transporting prototype electrolyser equipment from Australia
    to German research institutions, the German partners required CE marking compliance.
    CE marking is impractical for R&D or prototype parts that are subject to ongoing
    design changes and not intended for commercial use, creating a regulatory barrier
    to the planned international collaboration.
  lesson_learnt: 'Before finalising an international R&D collaboration plan involving
    equipment transfer between Australia and Germany, partners should agree upfront
    on one of three viable approaches: (1) CE mark the prototype (costly and slow),
    (2) send designs to Germany for local construction, or (3) invite German partners
    to Australia for on-site testing — the latter two avoid CE marking obligations
    for prototype parts entirely.'
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: regulatory & approvals
  outcome_class: re-scoped/adapted
  secondary_failure_mode: coordination & stakeholders
  intervention_note: Hysata and the German partners resolved the issue by sending
    designs to Germany and having the system built locally, allowing German institutions
    to assume safety responsibility and ensure compliance without CE marking the Australian
    prototype.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: hydrogen
  source_pages: &id005
  - 6
  evidence_excerpt: The primary issue was German research institution's requirement
    for lab-scale and prototype equipment to be CE marked. Although CE marking is
    a well-understood standard, the process is complex and labour-intensive. While
    feasible for commercial equipment, it is impractical for R&D or prototype parts,
    which are likely to undergo significant design changes and are not be intended
    for commercial use.
  confidence_note: Issue severity assessed as moderate — the document does not quantify
    delay but describes it as a project-level challenge requiring a redesign of the
    collaboration logistics. Project type classified as manufacturing/supply chain
    as the dominant delivery challenge was equipment fabrication and cross-border
    transfer rather than operational hydrogen generation.
