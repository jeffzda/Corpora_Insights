  publish_date: 2025-09
  project_name: High Efficiency 'Capillary-fed' Electrolyser Pilot (HyGATE)
  what_happened: 'Hysata found that different workstreams within the electrolyser
    deployment required different project management methodologies: agile practices
    were effective for stack testing and quality control where priorities evolved
    continuously, while a waterfall approach suited linear engineering tasks such
    as system installation.'
  lesson_learnt: Define and standardise the project management methodology best suited
    to each workstream type (e.g. agile for iterative testing, waterfall for linear
    installation), and train teams on when to apply each — this enables consistent,
    predictable delivery that commercial customers expect.
  issue_severity: minor
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: construction/installation
  proponent_type: technology vendor
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Standardised agile and waterfall methodologies across relevant
    workstreams and educated the team on how and when to apply them.
  transferability: moderate
  delay_magnitude: null
  technology_domain: hydrogen
  source_pages: &id010
  - 6
  evidence_excerpt: Agile practices proved highly effective for stack testing and
    quality control, where priorities evolved continuously, while a waterfall approach
    worked best for linear engineering tasks such as system installation. By standardising
    these approaches and educating the team on how and when to apply them, Hysata
    can ensure consistent execution across future projects.
  confidence_note: null
