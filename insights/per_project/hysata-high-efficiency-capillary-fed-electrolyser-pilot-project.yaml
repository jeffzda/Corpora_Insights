  what_happened: Hysata developed a multi-factor framework for evaluating global manufacturing
    locations, incorporating government incentives, customer proximity, ease of doing
    business, and supply chain strength (including skilled labour availability and
    cost). Australia's advantages — renewable resources, geopolitical safety, trade
    partnerships, and research ecosystem — were weighed against other jurisdictions'
    manufacturing competitiveness.
  lesson_learnt: Electrolyser and deep-tech clean energy manufacturers planning to
    scale should conduct structured, multi-factor jurisdictional analyses — government
    incentives alone are insufficient; customer proximity, supply chain access, labour
    costs, and regulatory environment each materially affect long-term manufacturing
    competitiveness and must be evaluated together.
