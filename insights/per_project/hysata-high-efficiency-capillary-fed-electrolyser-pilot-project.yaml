  what_happened: Hysata found that grant reporting and documentation requirements
    had not been fully integrated into the project delivery framework at the outset,
    and used the HyGATE project to develop a practice of including grant documentation
    within the formal list of engineering deliverables established at project start.
  lesson_learnt: Include grant documentation within the engineering deliverables list
    established at project kick-off — large commercial hydrogen projects are commonly
    subsidised and subject to extensive reporting requirements, and treating compliance
    as an afterthought causes rework and diverts resources from technical priorities.
