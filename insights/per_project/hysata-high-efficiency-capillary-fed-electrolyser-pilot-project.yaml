  what_happened: Hysata invested early in building relationships with both Australian
    and international governments, proactively engaging with policymakers and positioning
    itself as a leading clean energy investment. This approach attracted significant
    domestic funding (ARENA, NSW Government) and international investor interest including
    the Oman Investment Authority as part of a AU$172 million Series B round, as well
    as engagement from UAE, European, and US government entities.
