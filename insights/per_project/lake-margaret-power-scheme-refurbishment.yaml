- record_id: ARENA-DLV-72013
  source_title: Australian Energy Resource Assessment - Second edition, 2014
  publish_date: '2014'
  project_name: Lake Margaret Power Scheme Refurbishment
  what_happened: Refurbishment of the Lake Margaret hydroelectricity facility (commissioned 1914) was completed in late 2009 at a cost of A$14.7 million, gaining 8.4 MW of capacity at a capital spend rate
    of A$1.75 million per MW — considerably less than the cost of a new plant.
  lesson_learnt: Refurbishing existing hydro infrastructure on ageing assets can deliver capacity and efficiency gains at materially lower unit capital cost than new-build — project teams evaluating capacity
    expansion should assess refurbishment pathways before committing to greenfield development.
