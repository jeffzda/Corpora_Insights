- record_id: ARENA-DLV-15804
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA Advancing Renewables Program (ARP) — contract negotiation
  what_happened: The contract negotiation process was consistently identified as the
    most common source of frustration across ARENA's grant programs. For some recipients
    the difficulties in negotiating contracts caused them to reconsider whether the
    process was worth pursuing. Negotiations with the CEFC and commercial banks on
    project financing were challenging and protracted, and the LSS tripartite deed
    was the most contested aspect.
  lesson_learnt: Engage commercial banks and co-funders (such as the CEFC) during
    contract document design rather than after documents are released to participants
    — upfront market engagement would streamline tripartite negotiations and reduce
    time-to-contract-award.
