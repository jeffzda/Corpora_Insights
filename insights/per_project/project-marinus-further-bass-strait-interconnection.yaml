  project_name: Project Marinus (Marinus Link)
  what_happened: Post-modelling review identified that an incorrect assumption had
    been made about the Tamar Valley Power Station (TVPS) — it was assumed not to
    operate, when in reality it can operate when economically viable — adding approximately
    $40M in NEM benefits that had been omitted from initial sensitivity results and
    required retrospective correction across multiple scenarios.
  lesson_learnt: Feasibility-stage economic models for interconnectors should be subject
    to a structured assumption audit before results are published — operational status
    of existing dispatchable plant at connection points is a common omission that
    can materially affect model outputs and requires explicit validation against current
    plant operational status.
