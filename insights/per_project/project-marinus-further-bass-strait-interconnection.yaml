  what_happened: The Basslink long-term agreement structure — combining a government-backed
    Operations Agreement for availability/performance standards and a Hydro Tasmania
    Service Agreement providing a fixed facility fee plus performance-related payments
    — demonstrated a workable commercial model for a merchant interconnector that
    converted volatile market revenues into a predictable revenue stream for investors.
