  source_title: Project Marinus Business Case Assessment Report
  publish_date: 2019-12
  project_name: Project Marinus (Marinus Link and Supporting Transmission)
  what_happened: The project identified that, under the 1500 MW design, the nominal
    capacity rating will be operationally constrained to a lower level to meet system
    frequency requirements, and that import capacity would be influenced by the timing
    of wind and pumped hydro developments in Tasmania — constraints that were incorporated
    into the market model.
  lesson_learnt: For HVDC interconnectors, power transfer constraints arising from
    system frequency requirements and the development pipeline of connected generation
    must be modelled explicitly in economic analysis — nameplate capacity and effective
    dispatchable capacity can differ materially, and overstating available transfer
    capacity will inflate projected benefits.
