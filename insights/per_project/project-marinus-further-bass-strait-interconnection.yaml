- record_id: ARENA-DLV-19168
  source_title: Tasmanian and Victorian Second Bass Strait Interconnector Reports
    (Project Marinus)
  publish_date: 2019-02
  project_name: Project Marinus (Marinus Link)
  what_happened: Economic modelling used only one year of historical wind, solar and
    hydro inflow data (consistent with AEMO's ISP approach), whereas TasNetworks'
    own modelling used seven years of repeated historical data — revealing that the
    choice of inflow trace duration materially affects multi-seasonal benefit estimates
    for hydro-dependent interconnectors.
  lesson_learnt: Economic feasibility models for hydro-connected interconnectors should
    use multi-year historical inflow traces (at least five to seven years) rather
    than single-year data, as single-year traces systematically underrepresent multi-seasonal
    hydrological variability and can produce misleading estimates of storage spill
    avoidance and dispatchability benefits.
  issue_severity: minor
  project_type: network/grid
  project_scale_band: utility/large-scale
  lifecycle_phase: concept/feasibility
  proponent_type: network business
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: TasNetworks adopted seven years of repeating historical data
    in its modelling, providing more realistic representation of multi-seasonal impacts
    and diversity of generation sources.
  transferability: moderate
  delay_magnitude: null
  technology_domain: grid/system stability
