  publish_date: 2019-02
  project_name: Project Marinus (Marinus Link)
  what_happened: The Tasmanian energy crisis of 2015–2016 (coinciding with the Basslink
    failure) resulted in Hydro Tasmania being directed to maintain conservative water
    storage reserves — effectively locking up stored energy as an insurance buffer
    — which reduced operational dispatch flexibility and represented an ongoing foregone
    revenue opportunity quantified at approximately $50M in preliminary estimates.
  lesson_learnt: Single-interconnector dependency imposes hidden ongoing costs on
    hydro systems through forced conservative reservoir management; quantifying these
    opportunity costs (foregone dispatch flexibility, conservative storage targets)
    and including them as a benefit of redundant interconnection strengthens the business
    case and should be a standard component of interconnector feasibility studies
    in hydro-dependent systems.
