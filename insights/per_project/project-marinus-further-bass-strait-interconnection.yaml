- record_id: ARENA-DLV-19156
  source_title: Tasmanian and Victorian Second Bass Strait Interconnector Reports
    (Project Marinus)
  publish_date: 2019-02
  project_name: Project Marinus (Marinus Link)
  what_happened: Analysis identified that potential interconnector land corridors
    in Tasmania and Victoria were becoming progressively constrained by urban, rural
    residential and rural living developments, increasing the risk that corridors
    would become inaccessible or more costly to acquire if land access rights were
    not secured early in project development.
  lesson_learnt: For large linear infrastructure projects, corridor protection should
    be treated as a critical early action — delaying land access and easement acquisition
    increases both cost and the risk of losing viable routes entirely; proponents
    should secure corridor rights as soon as feasible routes are identified, well
    before final investment decisions.
