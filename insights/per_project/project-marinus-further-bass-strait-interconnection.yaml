  what_happened: The 2015–2016 Basslink outage (December 2015 to June 2016) demonstrated
    the cost of single-interconnector dependency between Tasmania and the mainland
    NEM, with the extended failure estimated to have cost between $140M and $180M
    and requiring Hydro Tasmania to maintain more conservative water storage targets
    as a risk buffer thereafter.
  lesson_learnt: Single interconnector dependency creates a material energy security
    and financial risk for island or weakly connected grid systems; the cost of a
    prolonged outage ($140–180M in Basslink's case) should be quantified and included
    as a resilience benefit in the business case for redundant interconnection, as
    it provides a compelling financial argument that is often underweighted in standard
    cost-benefit frameworks.
