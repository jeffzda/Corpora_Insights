  what_happened: The multi-jurisdictional environment, planning, and cultural heritage
    approvals process for Marinus Link — spanning Tasmanian, Victorian, and Australian
    Government jurisdictions — was identified as the critical path item to reaching
    Final Investment Decision, with approvals timeframes driving the overall project
    schedule.
  lesson_learnt: Multi-jurisdictional infrastructure projects should engage all relevant
