- record_id: ARENA-DLV-19155
  source_title: Tasmanian and Victorian Second Bass Strait Interconnector Reports
    (Project Marinus)
  publish_date: 2019-02
  project_name: Project Marinus (Marinus Link)
  what_happened: The global HVDC interconnector market was experiencing heightened
    activity at the time of the study, with a small number of specialised converter
    station and cable manufacturers all based overseas — creating supply constraints
    on cable manufacturing slots and cable-laying vessels that introduced cost and
    schedule risk for Australian projects competing for capacity.
  lesson_learnt: Australian HVDC interconnector projects face procurement risk from
    a highly concentrated global supplier base; developers should engage manufacturers
    early, secure manufacturing slots well in advance, and build foreign exchange
    and commodity price contingency into cost estimates given exposure to international
    market conditions.
  issue_severity: moderate
  project_type: network/grid
