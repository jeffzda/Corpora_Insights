  publish_date: 2019-02
  project_name: Project Marinus (Marinus Link)
  what_happened: For a 1,200 MW interconnector, design analysis determined that a
    contingency loss of more than 600 MW would be technically unmanageable within
    NEM ancillary service frameworks, constraining the viable topology options to
    bi-pole or two symmetrical monopoles — meaning the full capacity could not be
    delivered as a single asymmetrical monopole and required a staged delivery approach.
  lesson_learnt: Power system credible contingency size limits (typically 600 MW in
    the NEM) are a hard design constraint that must be incorporated at the outset
    of interconnector capacity selection — failing to do so will force costly topology
    changes or staging requirements that affect both capital cost and construction
    schedule.
