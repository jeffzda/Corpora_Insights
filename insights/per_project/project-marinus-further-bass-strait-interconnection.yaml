- record_id: ARENA-DLV-60156
  source_title: Project Marinus Business Case Assessment Report
  publish_date: 2019-12
  project_name: Project Marinus (Marinus Link and Supporting Transmission)
  what_happened: Long manufacturing and construction lead times for HVDC undersea
    cable projects meant that achieving a 2027 in-service date required the project
    to enter the Design and Approvals phase immediately, even though the RIT-T optimal
    timing was assessed as 2028 for the first stage — deferring the start of the approvals
    phase to await regulatory certainty would have made the 2027 target date unachievable.
  lesson_learnt: For major HVDC interconnector projects, the manufacturing and construction
    schedule is so long (comparable projects taking close to 4 years for construction
    alone) that the Design and Approvals phase must start before regulatory approval
    is finalised — waiting for a passed RIT-T before beginning approvals will add
    years to the in-service date.
