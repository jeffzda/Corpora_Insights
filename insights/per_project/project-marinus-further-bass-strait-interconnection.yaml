- record_id: ARENA-DLV-19151
  source_title: Tasmanian and Victorian Second Bass Strait Interconnector Reports
    (Project Marinus)
  publish_date: 2019-02
  project_name: Project Marinus (Marinus Link)
  what_happened: The economic feasibility of Marinus Link under the neutral scenario
    (mid-2025 commissioning) was negative — costs of $1,385M exceeded total benefits
    of $1,115M for the 600 MW option, yielding an economic worth of -$270M — because
    the bulk of benefits only materialise after 2035 when coal-fired generation retires,
    making a mid-2020s commissioning date premature under neutral assumptions.
  lesson_learnt: For large transmission interconnectors whose value is driven by future
    generation retirement, commissioning timing is a critical economic variable —
    aligning construction with the anticipated retirement timeline (rather than building
    speculatively ahead of it) materially improves the cost-benefit case; sensitivity
    analysis on commissioning date should be a mandatory input to any investment decision.
