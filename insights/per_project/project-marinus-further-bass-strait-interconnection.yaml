    counterparties to achieve financeable revenue certainty; a two-agreement structure
    separating operational performance obligations from commercial arbitrage incentives
    (as used for Basslink) is a proven model that Australian HVDC interconnector developers
    should examine when structuring merchant or hybrid service models.
