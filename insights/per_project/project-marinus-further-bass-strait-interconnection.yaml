  what_happened: Sensitivity analysis showed that deferring the 600 MW Marinus Link
    commissioning from 2025 to 2032 (while holding all other neutral scenario parameters
    constant) improved economic worth from -$270M to +$4M, and that a 2035 commissioning
    would produce a clearly positive outcome — with the improvement driven by both
    capital cost deferral and better alignment with coal retirement timing.
  lesson_learnt: For infrastructure whose value is driven by a future system transition
    event, optimising commissioning timing — rather than building as early as technically
    possible — can shift a project from negative to positive economic worth; developers
    should use timing sensitivity analysis as a primary design variable, not merely
    a check on a pre-determined schedule.
