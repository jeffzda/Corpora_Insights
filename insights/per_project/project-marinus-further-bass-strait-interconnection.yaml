    (2016 dollars) for a 600 MW link; by 2018 the revised estimate had increased to
    $1.3–$1.7 billion following inclusion of network upgrades in Victoria and Tasmania
    and reconsideration of base HVDC cable costs, representing a cost increase of
    approximately 20–55% over two years of feasibility work.
