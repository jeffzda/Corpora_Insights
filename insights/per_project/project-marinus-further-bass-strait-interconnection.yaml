  what_happened: Three categories of NEM benefits — power system security, competition
    benefits, and option value — were not quantified in the Initial Feasibility Report
    because their value was initially expected to be smaller than other categories,
    yet the report acknowledged these omissions likely understate Marinus Link's total
    economic worth.
