  outcome_class: knowledge generated despite setback
  secondary_failure_mode: null
  intervention_note: The project developed a procurement strategy targeting completion
    in 2020, with analysis suggesting two separate EPC contracts (cable equipment/installation
    and converter equipment/installation) consistent with the predominant approach
    on HVDC projects worldwide.
