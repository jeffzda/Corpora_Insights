- record_id: ARENA-DLV-19152
  source_title: Tasmanian and Victorian Second Bass Strait Interconnector Reports
    (Project Marinus)
  publish_date: 2019-02
  project_name: Project Marinus (Marinus Link)
  what_happened: Under a high emissions reduction target sensitivity, early coal-fired
    generation retirement (~7,000 MW by 2028–2029) made Marinus Link economically
    positive — economic worth of $490M (600 MW) and $482M (1,200 MW) — because earlier
    retirement brought forward the period in which the interconnector's dispatchable
    renewable substitution value was realised.
  lesson_learnt: The trajectory of coal-fired generation retirement is the single
    largest determinant of interconnector economic feasibility; project developers
    should model a range of emissions policy and retirement scenarios and structure
    investment staging to preserve optionality rather than committing to a fixed commissioning
    date before retirement timing is clearer.
