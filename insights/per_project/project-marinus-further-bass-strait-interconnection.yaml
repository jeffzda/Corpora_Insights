  project_name: Project Marinus (Marinus Link)
  what_happened: Analysis confirmed that HVDC VSC technology (preferred for Marinus
    Link) combined with XLPE cable insulation presents a maturity risk — XLPE cables
    for HVDC are only available up to 320 kV in operation as of 2018, with 400 kV
    in 2019 and 525 kV tested only — meaning that technology availability at required
    voltage ratings was uncertain for higher-capacity configurations at the time of
    the feasibility study.
  lesson_learnt: HVDC cable technology selection for large interconnectors should
    account for the rated voltage ceiling of commercially available XLPE cables at
    the time of procurement — specifying system parameters that require voltage ratings
    beyond demonstrated commercial availability introduces technology risk that must
    be managed through contract terms, timing allowances, or fallback to MIND cable.
