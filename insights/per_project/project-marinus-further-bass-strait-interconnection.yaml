    with other large-scale storage and transmission investments in the NEM pipeline
    — Snowy 2.0-type projects can materially reduce projected interconnector benefits,
    and proponents who ignore these competing investments risk overestimating economic
    worth and making prematurely optimistic investment recommendations.
