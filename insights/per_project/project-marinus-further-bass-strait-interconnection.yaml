  project_name: Project Marinus (Marinus Link)
  what_happened: Analysis showed the current NEM regulated transmission pricing framework
    would cause Tasmanian customers' transmission charges to increase disproportionately
    relative to the benefits they receive from Marinus Link, as most energy market
    benefits flow to mainland NEM customers while cost recovery is regionalised —
    creating an inequitable pricing outcome that would likely prevent the project
    proceeding as a regulated service without modification.
  lesson_learnt: Large transmission infrastructure that generates NEM-wide benefits
    but is subject to regionalised cost recovery mechanisms can face a structural
    commercial barrier; proponents should identify and engage with regulators and
    governments early to achieve pricing framework reform or government grant support
    before committing to a regulated service model.
