  what_happened: The Definition and Approvals phase for Marinus Link was estimated
    to cost $110–140M and take up to two years, with a Final Investment Decision contingent
    on completing five concurrent workstreams (approvals, technical design, land access,
    revenue certainty, and financing) — creating a complex interdependency risk where
    delay in any single workstream could prevent progression to delivery.
  lesson_learnt: For large transmission infrastructure, the Definition and Approvals
    phase involves multiple interdependent critical-path workstreams that must all
    complete before a Final Investment Decision can be made; proponents should map
    these interdependencies explicitly at phase entry, identify the longest critical
    path, and resource accordingly to prevent a single-workstream bottleneck from
    delaying the overall investment decision.
