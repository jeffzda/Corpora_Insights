- record_id: ARENA-DLV-60157
  source_title: Project Marinus Business Case Assessment Report
  publish_date: 2019-12
  project_name: Project Marinus (Marinus Link and Supporting Transmission)
  what_happened: The project identified that ownership decisions for Marinus Link
    (HVDC component) and the supporting AC transmission in Tasmania are interdependent,
    and that different owners of the two components would require a strong commercial
    framework to ensure both elements reach FID simultaneously — without this, one
    component could be ready while the other is not, undermining the overall business
    case.
  lesson_learnt: Where a transmission project comprises two interdependent components
    (e.g. HVDC link and supporting AC network) that may have different owners, establish
    a binding commercial framework governing interdependency and joint FID readiness
    before entering procurement — misaligned FID readiness between components can
    strand investment in either.
