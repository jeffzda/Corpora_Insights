- record_id: ARENA-DLV-60155
  source_title: Project Marinus Business Case Assessment Report
  publish_date: 2019-12
  project_name: Project Marinus (Marinus Link and Supporting Transmission)
  what_happened: The modelling assumptions used by Ernst & Young were updated in February
    2019 to align with AEMO's published inputs; however, AEMO revised its assumptions
    again in August and September 2019, and a full update to the latest dataset was
    not possible without causing substantial delays to the RIT-T analysis.
  lesson_learnt: Where market modelling for a regulatory process depends on frequently
    updated third-party assumptions (such as AEMO's ISP inputs), establish a fixed
    assumption lock-in date early and use sensitivity analysis to test material changes
    rather than attempting to track rolling updates — otherwise the modelling process
    risks never completing.
