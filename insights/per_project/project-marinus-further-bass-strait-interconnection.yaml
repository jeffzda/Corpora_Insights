  what_happened: The Tasmanian transmission network was found to require upgrades
    (including the Sheffield to Burnie line) to support either a 600 MW or 1,200 MW
    Marinus Link, creating a dependency between the interconnector investment decision
    and pre-existing network augmentation needs that required separate treatment in
    cost estimates and regulatory processes.
  lesson_learnt: Interconnector business cases should identify and explicitly scope
    supporting network augmentations at both termination points before cost estimates
    are finalised — failure to do so understates true project cost and creates regulatory
    ambiguity about whether supporting network costs are contingent on, or independent
    of, the interconnector investment decision.
