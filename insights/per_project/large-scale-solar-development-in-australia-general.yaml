- record_id: ARENA-DLV-72025
  source_title: Australian Energy Resource Assessment – Second edition, 2014
  publish_date: '2014'
  project_name: Large-Scale Solar Development in Australia (General)
  what_happened: Australia's best solar resources are concentrated in remote inland
    and desert regions far from the NEM and major population centres on the eastern
    seaboard. This geographic mismatch between resource quality and grid access has
    constrained large-scale solar development, with near-term projects redirected
    to isolated grid systems or existing grid nodes to minimise infrastructure costs
    rather than maximising solar yield.
  lesson_learnt: Site selection for utility-scale solar must explicitly balance solar
    resource quality against transmission access cost — projects optimising solely
    on irradiance risk uneconomic grid connection costs; pre-feasibility screening
    should map grid proximity alongside solar resource and prioritise near-grid sites
    for early commercial projects.
