  evidence_excerpt: In Australia, the best solar resources are commonly distant from
    the NEM, especially the major urban centres on the eastern seaboard. This poses
    a challenge for developing new solar power plants, as there needs to be a balance
    between maximising the solar radiation and minimising the costs of connecting
    to the electricity grid.
