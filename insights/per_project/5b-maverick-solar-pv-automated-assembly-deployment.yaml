  what_happened: 5B found that existing design standards for telehandler attachments
    (Rough Terrain Variable Reach Trucks) were vague and not fit-for-purpose for the
    novel 5B Matador Carriage attachment. Interpretation of the standards varied significantly
    across clients and third-party reviewers, creating compliance uncertainty that
    consumed significant time in testing, iteration, and consultant engagement.
  lesson_learnt: When deploying novel equipment attachments, engage the OEM directly
    for design approval rather than relying on standards interpretation — standards
    for non-standard attachment types are vague and reviewer-dependent, making OEM
    endorsement the only reliable path to compliance. Also engage with the relevant
    industry association early, as standards updates may be in progress.
