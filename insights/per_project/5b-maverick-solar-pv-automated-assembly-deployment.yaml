  publish_date: 2022-03
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: Equipment lead times for roll forming machines extended significantly
    beyond initial estimates due to global supply chain disruptions — increased demand
    for roll-formed steel in residential construction lengthened supplier queues,
    forcing the team to source functionally equivalent interim beams and delaying
    downstream equipment testing.
  lesson_learnt: When planning equipment purchase and installation for a manufacturing
    or automation project, build in timing contingency or identify alternative supply
    sources for key components early — global forces can rapidly extend lead times
    even for normally short lead-time items. Place orders as soon as design is ~90%
    complete rather than waiting for full design freeze, so minor design changes can
    be absorbed during manufacturer lead time.
