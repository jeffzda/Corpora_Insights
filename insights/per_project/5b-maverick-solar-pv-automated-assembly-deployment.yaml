  publish_date: 2025-01
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment (ARP017)
  what_happened: The container unloading system (RUP) was designed to operate both
    on a Drop Deck trailer and standalone, which introduced compromises including
    a significantly heavier platform, increased build cost, and approximately 2 hours
    of additional mobilisation time per end for intersite transport due to leg removal
    requirements.
  lesson_learnt: When designing equipment for dual-mode operation, explicitly evaluate
    whether the added complexity and cost of accommodating both use cases is justified;
    if not, design for the primary use case and treat the secondary as a future iteration
    — doing so can reduce weight, cost, mobilisation time, and mechanical complexity.
