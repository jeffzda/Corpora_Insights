    identified a 0.14% rejection rate (20 modules) due to glass/frame breakages or
    junction box problems. Electroluminescent (EL) testing on a sample of 822 modules
    found a 0.4% reject rate for major or critical performance loss defects, and 3%
    of modules showing Class C minor ongoing performance loss features.
