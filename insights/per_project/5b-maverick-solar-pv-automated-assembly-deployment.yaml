- record_id: ARENA-DLV-42510
  source_title: 5B Maverick Solar PV Automated Assembly & Deployment - Module Quality
    Report
  publish_date: 2020-11
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: 5B's current EL inspection programme covers 822 modules, which is
    low volume relative to total assembly throughput. At low sampling volumes, the
    Reject Detection Cost (RDC) remains high, meaning the cost per detected reject
    is not yet at the level where 100% EL inspection is straightforwardly cost-justified.
    Automation of EL inspection is required to lower per-module costs to the point
    where high sampling rates are economically viable.
  lesson_learnt: EL inspection regimes must achieve sufficient throughput and automation
    to bring per-module inspection costs down before 100% sampling rates become economically
    justified. Projects planning inspection regimes should model their RDC against
    expected fault rates and avoided field-replacement costs before committing to
    a sampling strategy — low-volume proof-of-concept inspection should not be treated
    as a scalable quality assurance mechanism.
