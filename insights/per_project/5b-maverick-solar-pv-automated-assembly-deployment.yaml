  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: Sourcing prototype extruded aluminium parts with minor design variations
    for the automated assembly process incurred significant cost and time penalties
    due to the need for new tooling at each iteration, limited domestic extrusion
    facilities in Australia, and long supplier queues, blocking progress on automated
    assembly design.
  lesson_learnt: For prototype parts requiring custom extrusion tooling, machine the
    first batch from the closest standard extrusion profile to receive parts quickly,
    then iterate to minimise the number of new tooling runs required. Negotiate queue
    positions with local vendors ahead of completing part design to avoid delays when
    prototype parts are urgently needed.
