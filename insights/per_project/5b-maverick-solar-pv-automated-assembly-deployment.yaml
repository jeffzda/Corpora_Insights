  outcome_class: knowledge generated despite setback
  secondary_failure_mode: data & measurement
  intervention_note: 5B developed an evidence-based Reject Detection Cost (RDC) framework
    to assess whether the cost of a given inspection intervention is justified by
    the avoided cost of field failure.
  transferability: broad
