  what_happened: Wind tunnel data showed that interior Mavericks (not on the solar
    farm perimeter) are subject to materially lower wind loads than perimeter-placed
    Mavericks, meaning the original uniform conservative design had over-specified
    anchoring and ballast requirements for the majority of units in a large farm.
  lesson_learnt: Differentiate structural design and anchoring specifications between
    perimeter ('exterior') and interior solar array positions — interior units in
    a large array experience substantially lower wind loads, and applying a uniform
    conservative perimeter-level specification across the whole farm significantly
    over-engineers the majority of units and inflates cost.
