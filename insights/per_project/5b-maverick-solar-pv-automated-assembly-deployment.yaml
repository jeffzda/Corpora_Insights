- record_id: ARENA-DLV-42503
  source_title: 5B Maverick Solar PV Automated Assembly & Deployment - Module Quality
    Report
  publish_date: 2020-11
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: Conventional in-field solar farm construction does not routinely
    support 100% module inspection because mobilising, operating, maintaining, and
    demobilising inspection equipment on-site is prohibitively expensive. This means
    defective modules — including those with rear glass damage, junction box faults,
    and EL-detectable cell faults — routinely enter operational solar farms undetected.
  lesson_learnt: Project developers using conventional in-field construction should
    account for higher as-delivered defect pass-through rates (approximately 0.5%
    vs 0.14% in factory settings) and consider pre-fabricated or factory-adjacent
    assembly approaches when the scale justifies the overhead, or engage third-party
    pre-shipment inspection to partially compensate.
