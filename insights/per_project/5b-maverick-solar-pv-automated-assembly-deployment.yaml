- record_id: ARENA-DLV-53255
  source_title: 5B Maverick Solar PV Automated Assembly & Deployment Lessons Learnt
    Report 1
  publish_date: 2022-03
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: The GPS Guided Deployment (GGD) system was initially planned around
    the existing 5B vehicle platform. A more thorough review of system requirements
    revealed that platform was poorly suited to GGD's operational and business requirements
    — particularly the need for rapid inter-site transport (including international
    air freight) — requiring early project plans and work priorities to be significantly
    modified.
  lesson_learnt: Full system requirements analysis for new technology development
    must explicitly include assessment of the optimal business model and operating
    use cases — not just technical constraints. Assumptions that new capabilities
    can be delivered on existing platforms may not hold, and discovering this late
    forces costly replanning.
