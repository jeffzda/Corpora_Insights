  publish_date: 2025-01
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment (ARP017)
  what_happened: Navigating ISO Telehandler (Variable Reach Truck) Standards independently
    proved difficult due to ambiguity in the standards. Working directly through the
    telehandler manufacturer and their OEM resolved this ambiguity, as the manufacturer
    and OEM had established expertise in interpreting and applying the standards and
    could provide compliant supporting documentation.
  lesson_learnt: Where industry standards are ambiguous or complex, partnering with
    the equipment manufacturer and their certified OEM provides a more reliable path
    to compliance than attempting independent interpretation — manufacturers carry
    existing relationships, documented expertise, and liability frameworks that simplify
    certification.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: approvals/contracting
  proponent_type: technology vendor
  delay_category: approvals/regulatory
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Engaged directly with the telehandler manufacturer who contracted
    their OEM (Kaup) to design the carriage; the manufacturer's existing compliance
    framework and trust with the OEM meant the process was described as 'easy and
    seamless'.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id007
