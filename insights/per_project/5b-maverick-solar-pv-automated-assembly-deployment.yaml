- record_id: ARENA-DLV-42505
  source_title: 5B Maverick Solar PV Automated Assembly & Deployment - Module Quality
    Report
  publish_date: 2020-11
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: Third-party quality auditing at module OEM factories, while broadly
    practised, operates on small sample sizes and lacks universally accepted evidence
    for the efficacy of specific visual and EL non-conformance criteria. Some published
    non-conformance criteria are not backed by studies of actual performance outcomes,
    creating risk that interventions may be poorly calibrated — either over-rejecting
    low-risk modules or under-rejecting genuinely problematic ones.
  lesson_learnt: Project developers and asset owners should require third-party inspection
    providers to justify intervention thresholds with evidence-based criteria rather
    than accepting standard AQL frameworks uncritically. Inspection regimes should
    be designed around a 'Reject Detection Cost' framework that weighs per-module
    inspection cost against the probability and cost of field failure, ensuring interventions
    are economically justified.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: commercial expansion
  lifecycle_phase: procurement
  proponent_type: manufacturer/OEM
  delay_category: null
