  publish_date: 2024-06
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment (ARP017)
  what_happened: When developing field positioning tools for the Maverick deployment
    system, 5B found that GPS — the default recommendation in technical circles for
    tight-tolerance object placement — was unreliable for repeatable, precise placement
    in field conditions. No existing off-the-shelf tool provided a full fit for the
    use case, requiring 5B to develop its own suite of tools built on top of a Surveyor's
    Robotic Total Station (RTS) platform.
  lesson_learnt: Do not rely on GPS for tight-tolerance, repeatable field placement
    of solar array components — GPS claims of accuracy are not borne out in practice
    for this use case. Instead, use localised coordinate systems locked to physical
    site markers, and invest in bespoke tooling if no off-the-shelf solution fits,
    particularly where tighter product tolerances are being introduced.
