- record_id: ARENA-DLV-53254
  source_title: 5B Maverick Solar PV Automated Assembly & Deployment Lessons Learnt
    Report 1
  publish_date: 2022-03
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: Early engagement with a Major Contractor (MCA) for GPS Guided Deployment
    (GGD) autonomous capabilities was initiated before technical prerequisites — including
    equipment specifications, site mapping, navigation specifications, and concept
    selection — were sufficiently developed. This made it difficult to negotiate scope
    and deliverables, and resulted in wasted time and resources.
  lesson_learnt: Delay broad engagement with major contractors until critical technical
    prerequisites and development milestones are largely complete — premature engagement
    when specifications remain undefined wastes time and resources on both sides and
    makes it impossible to negotiate meaningful scope.
  issue_severity: moderate
  project_type: manufacturing/supply chain
