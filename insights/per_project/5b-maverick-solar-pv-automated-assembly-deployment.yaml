  source_title: 5B Maverick Solar PV Automated Assembly & Deployment - Module Quality
    Report
  publish_date: 2020-11
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: Transport damage was the dominant cause of as-delivered module rejects
    during 5B's 2024 assembly inspections, accounting for 14 of 20 visual rejects
    (8 damaged frames, 6 smashed front glass sheets). These faults are attributable
    to transit rather than manufacturing, but in conventional field assembly the source
    of damage cannot be reliably attributed because field-handling damage obscures
    as-delivered condition.
  lesson_learnt: Module transport packaging and handling protocols are a meaningful
    contributor to as-delivered defect rates. Inspecting modules before field handling
    begins — whether in a factory or at port — is the only reliable way to establish
    whether damage is transit-origin, and to pursue supplier or logistics warranty
    claims. Projects relying solely on field inspection will under-report transport
    damage.
