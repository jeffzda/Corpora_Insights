  publish_date: 2024-06
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment (ARP017)
  what_happened: During development of the automated assembly process for the 5B Maverick,
    the team found that designs that appeared complete and prototype-validated failed
    to meet 'design for assembly' requirements when tested in an integrated production
    run. Specifically, automating the removal of cardboard packaging from PV modules
    revealed first-of-its-kind challenges such as removing cardboard corners, which
    prevented achievement of the planned 14-second-per-module throughput target.
  lesson_learnt: Do not commit to advanced manufacturing equipment specifications
    before proving the process through a pilot production run — designs that pass
    prototype stage frequently expose unforeseen assembly complexities only visible
    at production scale, and specifying equipment prematurely wastes time and money
    on redesigns.
