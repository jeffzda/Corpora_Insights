  what_happened: Module durability failures — particularly those associated with BOM
    consistency and incoming material quality — can manifest as large-scale batch
    failures in a power plant. Third-party testing and auditing provides some protection
    but does not eliminate this risk because batch sampling inherently allows defective
    product through.
  lesson_learnt: Asset owners and developers should explicitly assess the risk of
    large-scale batch module failures — not just individual module defects — when
    evaluating module supply chain quality. This requires going beyond standard AQL
    sampling to include supply chain audits of raw material consistency and BOM compliance,
    particularly for bifacial and glass-glass products where encapsulant and cell-level
    variation may not be visible.
