  publish_date: 2022-09
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: When designing the new generation 5B Maverick product for automated
    assembly, the design was optimised for machine assembly in ways that made manual
    assembly significantly more difficult — for example, fastener alignment and insertion
    in constrained spaces that suit machines but not human hands.
  lesson_learnt: Design products for automated assembly without precluding manual
    assembly — a proportion of units will always require manual handling for prototyping,
    rework, or small-scale variants, so automated-assembly optimisation must be tested
    against manual assembly ergonomics before design freeze.
