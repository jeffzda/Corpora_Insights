  what_happened: The Advanced Manufacturing Pilot Line (AMPL) was initially planned
    as a monolithic end-to-end system. Risk analysis prompted a redesign of the development
    approach, breaking the system into parallel sub-processes that could be developed
    independently, which brought forward timelines and allowed engineering effort
    to be focused where most needed.
