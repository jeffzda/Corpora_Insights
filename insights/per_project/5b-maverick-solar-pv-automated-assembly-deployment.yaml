  publish_date: 2025-01
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment (ARP017)
  what_happened: 5B initially sourced telehandler carriages from a cheaper local supplier
    rather than working directly with the telehandler manufacturer. The locally sourced
    carriages were not sanctioned by the manufacturer and became incompatible with
    modern telehandlers equipped with smart RFID chip recognition in attachments,
    rendering them unusable.
  lesson_learnt: When designing attachments or extensions to off-the-shelf equipment,
    engage directly with the original equipment manufacturer from the outset — locally
    sourced cheaper alternatives may not meet manufacturer standards or future compatibility
    requirements, negating their cost and speed advantage.
