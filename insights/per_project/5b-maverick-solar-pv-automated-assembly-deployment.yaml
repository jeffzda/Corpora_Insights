- record_id: ARENA-DLV-9856
  source_title: 5B - Maverick Solar PV Automated Assembly & Deployment - Lesson Learnt
    Report 5
  publish_date: 2025-01
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment (ARP017)
  what_happened: Wind tunnel certification for the 5B Maverick Gen 3 was delayed and
    made more expensive because independent wind tunnel consultants applied conservative
    standards designed for high-rise buildings. The instrumentation resolution was
    mismatched to the Maverick's intrinsically low structural loads, producing high
    signal-to-noise ratios and inflated load estimates. Consultants were also risk-averse
    due to liability concerns, further compounding the issue.
  lesson_learnt: When certifying novel low-load structures using testing infrastructure
    designed for high-load applications, conduct a 'round robin' across multiple specialist
    labs to identify suitable instrumentation resolution before committing to a certification
    pathway — mismatched instrumentation will produce inflated load inputs that cannot
    be certified against actual performance data.
