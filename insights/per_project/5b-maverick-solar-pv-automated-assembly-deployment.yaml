- record_id: ARENA-DLV-1403
  source_title: 5B Maverick Solar PV Automated Assembly & Deployment Lessons Learnt
    Report 2
  publish_date: 2022-09
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: RTK GPS, initially selected as the core localisation technology for
    the semi-automated Delta deployment machine, was found through in-field testing
    to have a positional variance of 20–37 mm in each direction — insufficient for
    the required ±20 mm placement tolerance — and short-term averaging over 10 seconds
    improved accuracy by only ~5%. Alternative technologies (rotary laser, robotic
    total station) had range limitations of ~300 m and ~1 km respectively, too short
    for large sites without repositioning.
  lesson_learnt: Do not rely on a single positioning technology for field vehicle
    localisation in large outdoor environments — determine required accuracy per step
    and implement multi-sensor fusion (e.g. laser-based systems for initial beam placement
    combined with RTK GPS for bearing and redundancy) to meet tight tolerances reliably.
  issue_severity: major
  project_type: manufacturing/supply chain
  project_scale_band: pilot
  lifecycle_phase: development/design
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: poor scoping
  intervention_note: Tested rotary laser and robotic total station as alternative
    technologies; final solution will combine laser-based systems for high-accuracy
    initial placement with RTK GPS for vehicle bearing and redundancy.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar PV
  source_pages: &id003
  - 5
  - 6
  evidence_excerpt: RTK GPS measured to have a variance of 20-37mm in each direction...
    Because of the requirement to provide positioning feedback to +/-20mm, the RTK
    GPS solution is not adequate for use in machine control when used alone... The
    final solution for the guided deployment system will likely encompass a number
    of positioning technologies, including laser based systems to achieve the high
    accuracy required for placing the first beam correctly as well as RTK GPS to determine
    the vehicle's bearing and provide redundancy.
  confidence_note: issue_severity set to major as the failure of the primary localisation
