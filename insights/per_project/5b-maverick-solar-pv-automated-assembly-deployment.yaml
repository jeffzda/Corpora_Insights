- record_id: ARENA-DLV-1402
  source_title: 5B Maverick Solar PV Automated Assembly & Deployment Lessons Learnt
    Report 2
  publish_date: 2022-09
  project_name: 5B Maverick Solar PV Automated Assembly & Deployment
  what_happened: When engaging large multinational suppliers for the Advanced Manufacturing
    Pilot Line under a Global Equipment Purchase Agreement (GEPA), 5B encountered
    protracted negotiations over intellectual property ownership — large suppliers
    insisted on retaining project IP, whereas smaller suppliers readily assigned all
    IP to the purchaser, creating a difficult trade-off between supplier capability
    and IP control.
  lesson_learnt: For start-ups and scale-ups for whom IP is the core commercial asset,
    expressly define the scope of background, shared, and project IP — and who owns
    what — before issuing requests for quotation, to avoid protracted negotiations
    that can delay procurement and erode commercial terms.
