  what_happened: Mid-process revisions to the NSW Energy from Waste Policy Statement
    (June 2021) and the release of the NSW Government's Energy from Waste Infrastructure
    Plan (September 2021) introduced new requirements and changed the regulatory context
    during an active planning approval process, adding complexity and uncertainty.
  lesson_learnt: Projects in emerging regulatory categories such as energy-from-waste
    should explicitly monitor and budget for mid-process policy change risk; proponents
    should engage with regulators proactively to anticipate upcoming policy revisions
    and assess their impact before they are enacted.
