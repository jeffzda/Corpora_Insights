  what_happened: The NSW landfill levy system was a critical positive driver of financial
    feasibility, as it created a gate fee incentive for the waste supplier to pay
    for RDF delivery and processing rather than paying the levy for landfill disposal;
    without this policy lever, the project economics would not have been viable even
    in principle.
  lesson_learnt: Energy-from-waste project feasibility in Australia is highly dependent
    on state landfill levy levels; proponents should treat levy stability as a material
    project risk and engage early with state government to understand the policy trajectory,
    as projects that rely on the levy as a primary revenue driver are exposed to policy
    reversal.
