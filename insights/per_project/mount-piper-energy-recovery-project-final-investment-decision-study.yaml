  project_name: Mt Piper Energy Recovery Project
  what_happened: There are only a limited number of EPC contractors in Australia with
    a proven track record of delivering energy-from-waste projects, leading those
    contractors to apply a risk premium to their bids and to become increasingly selective
    about which projects they would tender for, given the planning and regulatory
    risks involved.
  lesson_learnt: Proponents of EfW projects in Australia should assess EPC market
    depth early in development and consider strategies to attract qualified contractors
    — including early engagement, risk-sharing structures, and de-risking approvals
    before going to EPC market — as contractor scarcity materially inflates costs
    and reduces competitive tension.
