  source_title: Mount Piper Energy Recovery Final Public Report
  publish_date: 2021-12
  project_name: Mt Piper Energy Recovery Project
  what_happened: The NSW EfW Policy required proponents to select and formally partner
    with a specific technology provider before commencing the EPC contractor selection
    process, meaning technology lock-in occurred at the EIS stage rather than at EPC
    award.
  lesson_learnt: EfW projects in NSW must factor in the requirement to commit to a
    specific technology provider and obtain that provider's input for the EIS before
    going to EPC market — this creates an earlier-than-typical technology lock-in
    with cost and risk implications that should be reflected in the project development
    structure and contracts.
