  project_name: Mt Piper Energy Recovery Project
  what_happened: Transport modelling concluded that trucking was more cost-effective
    than rail for delivering 200,000 t/a of RDF from Western Sydney to Mt Piper (approximately
    100 km), as the best available rail option still required truck transfer from
    Bathurst, adding over 50 km. The required 29 trucks per day represented a small
    fraction of existing westbound traffic across the Blue Mountains.
  lesson_learnt: For RDF supply volumes up to approximately one million tonnes per
    year, trucking is likely to be more cost-effective than rail in the NSW context;
    transport feasibility studies should assess the full door-to-door chain including
    any rail-to-road transfer legs, not just the line-haul segment.
