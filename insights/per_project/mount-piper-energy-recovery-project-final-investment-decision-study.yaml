  what_happened: The accelerating transition of the NSW electricity market — including
    retirement of coal plants and growth in intermittent renewables — meant that baseload
    coal generation became increasingly unviable during the development phase, undermining
    EnergyAustralia's ability to guarantee long-term steam offtake from the proposed
    facility.
  lesson_learnt: Integrated energy recovery projects that depend on a coal or fossil-fuel
    host should stress-test their commercial structure against accelerated energy
    market transition scenarios; a long-term offtake guarantee from the host should
    be secured or at minimum stress-tested before material development expenditure
    is committed.
