    both partners — a structure aligned with standard renewable energy project financing
    in the Australian market.
  lesson_learnt: An SPV structure with non-recourse financing and long-term bilateral
    contracts (gate fee from waste supplier, offtake from host generator) is the appropriate
    commercial structure for integrated energy-from-waste projects and is familiar
    to infrastructure investors; however, the structure requires credible long-term
    counterparty commitments from both sides to be bankable.
