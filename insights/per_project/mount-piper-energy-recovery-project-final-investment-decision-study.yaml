  what_happened: Large geographic distances and the absence of district heating or
    specific government support for EfW (unlike Europe) were identified as structural
    barriers to EfW development in Australia, making it difficult to achieve the economies
    of scale required for financial viability.
  lesson_warnt: Future Australian EfW projects must address structural market barriers
    — geography, lack of low-grade heat markets, and low or absent landfill levies
    — in their feasibility framing; project configurations that overcome these barriers
    (e.g. integration with existing thermal hosts, proximity to large waste catchments)
    are more likely to achieve viability than standalone greenfield facilities.
