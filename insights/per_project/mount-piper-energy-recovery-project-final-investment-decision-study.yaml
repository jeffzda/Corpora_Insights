  source_title: Mount Piper Energy Recovery Final Public Report
  publish_date: 2021-12
  project_name: Mt Piper Energy Recovery Project
  what_happened: The project used a dedicated standalone RDF boiler rather than attempting
    to co-fire RDF directly in the existing coal boiler, which was assessed as providing
    superior outcomes in terms of combustion efficiency, operational isolation, environmental
    permitting, and boiler reliability.
  lesson_learnt: When integrating waste or biomass fuel at an existing coal plant,
    a dedicated side-stream boiler designed specifically for the alternative fuel
    is preferable to direct co-firing in the existing boiler — it avoids fuel handling
    modifications to critical plant, maintains operational independence, and enables
    separate environmental permitting.
