- record_id: ARENA-DLV-46654
  source_title: Mount Piper Energy Recovery Final Public Report
  publish_date: 2021-12
  project_name: Mt Piper Energy Recovery Project
  what_happened: The NSW planning approval process for the EIS took significantly
    longer than originally expected, with the process running from EIS submission
    in December 2019 through to at least September 2021 without a determination, while
    multiple rounds of responses to submissions, supplementary reports, and additional
    queries from the EPA and DPIE were required.
  lesson_learnt: Energy-from-waste projects in NSW should plan for a multi-year planning
    approval process; development budgets and schedules should incorporate substantial
    contingency for iterative regulatory engagement including multiple response-to-submission
    rounds, agency queries, and potential policy changes mid-process.
