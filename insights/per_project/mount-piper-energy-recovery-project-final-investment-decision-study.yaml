- record_id: ARENA-DLV-46651
  source_title: Mount Piper Energy Recovery Final Public Report
  publish_date: 2021-12
  project_name: Mt Piper Energy Recovery Project
  what_happened: The feasibility study concluded that the project is technically viable
    but not financially feasible under current market conditions, and the joint venture
    partners decided not to proceed. The primary driver was EnergyAustralia's inability
    to guarantee a long-term steam offtake due to accelerating transition away from
    coal-fired generation in NSW.
  lesson_learnt: When integrating an energy recovery facility with an existing fossil-fuel
    host, confirm that the host can guarantee a long-term energy offtake before committing
    to development expenditure — market transition can erode the host's ability to
    underwrite the revenue stream faster than the development timeline allows.
