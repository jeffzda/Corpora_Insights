  project_name: Mt Piper Energy Recovery Project
  what_happened: The energy-from-waste technology assessed (RDF boiler producing steam
    at close to 100% capacity) is not suited to the operational profile required in
    a grid with high penetration of solar — specifically the need to ramp down during
    daylight solar generation periods and ramp up rapidly for the evening peak.
  lesson_learnt: Future energy-from-waste or biomass thermal projects integrating
    with the grid should assess dispatchability requirements at the outset — continuous
    thermal generation that cannot rapidly cycle will be increasingly mismatched with
    NEM operational requirements as solar penetration grows.
