- record_id: ARENA-DLV-38754
  source_title: Vast Solar Public Dissemination Report
  publish_date: 2014-07
  project_name: Vast Solar 1U Validation and Performance Modelling for 1.2MWth Solar
    Array with High Temperature Receiver and Integrated Thermal Storage
  what_happened: Vast Solar progressed through a multi-stage technology development
    pathway — from a 50-heliostat prototype at Marulen, to a 200-heliostat module
    at Jemalong, to the full 700-heliostat 1.2MWth validation module, and then into
    a 6MWth pilot with turbine, thermal storage, and grid connection — with each stage
    building on data and design refinements from the previous stage.
  lesson_learnt: For novel CST technologies, a staged scale-up pathway with progressively
    larger demonstration modules — each explicitly designed to generate data informing
    the next stage — is an effective commercialisation strategy; the Vast Solar model
    suggests that at least two intermediate demonstration stages between lab prototype
    and pilot-scale with grid connection are warranted.
