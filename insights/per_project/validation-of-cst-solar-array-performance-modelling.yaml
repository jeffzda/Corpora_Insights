- record_id: ARENA-DLV-38753
  source_title: Vast Solar Public Dissemination Report
  publish_date: 2014-07
  project_name: Vast Solar 1U Validation and Performance Modelling for 1.2MWth Solar
    Array with High Temperature Receiver and Integrated Thermal Storage
  what_happened: The 1.2MWth module was operated over a 24-month period, generating
    empirical data that was used to refine plant controls, improve heliostat targeting
    and focal accuracy, enhance receiver design, and validate energy and economic
    models — with learnings directly informing the design of the next-stage 6MWth
    pilot project.
  lesson_learnt: A dedicated validation phase at intermediate scale — with explicit
    objectives to gather performance data for controls refinement, model validation,
    and receiver optimisation — substantially de-risks subsequent commercial-scale
    design; projects that skip this step risk embedding unvalidated design assumptions
    into larger and more costly deployments.
