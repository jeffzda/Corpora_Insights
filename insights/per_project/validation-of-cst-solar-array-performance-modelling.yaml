  source_title: Vast Solar Public Dissemination Report
  publish_date: 2014-07
  project_name: Vast Solar 1U Validation and Performance Modelling for 1.2MWth Solar
    Array with High Temperature Receiver and Integrated Thermal Storage
  what_happened: Vast Solar successfully expanded its existing 200-heliostat demonstration
    array to a full 700-heliostat module (1.2MWth) by constructing and deploying an
    additional 500 heliostats, completing the single-module system at the Jemalong
    site in Central Western NSW.
  lesson_learnt: A staged heliostat field build-out — constructing a partial array
    first, then expanding to full module scale — allows early integrated system testing
    and de-risking before committing to full capital deployment; this approach enabled
    Vast Solar to refine controls, targeting accuracy, and receiver design before
    scaling.
