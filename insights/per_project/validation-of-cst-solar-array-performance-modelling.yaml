  source_title: Vast Solar Public Dissemination Report
  publish_date: 2014-07
  project_name: Vast Solar 1U Validation and Performance Modelling for 1.2MWth Solar
    Array with High Temperature Receiver and Integrated Thermal Storage
  what_happened: During the project, Vast Solar developed a high-temperature receiver
    capable of operating at 565°C, with specific attention to managing thermal fatigue
    risks in materials selection without materially increasing receiver cost.
  lesson_learnt: Receiver material selection for high-temperature CST systems must
    explicitly address thermal fatigue risk as a design constraint; failure to resolve
    this before scale-up risks costly rework — Vast Solar incorporated thermal fatigue
    analysis into materials selection to achieve the 565°C operating target within
    cost parameters.
