- record_id: ARENA-DLV-16262
  source_title: Energy Storage Study
  publish_date: 2015-07
  project_name: Australian Energy Storage Market — Balance of Plant Cost Barrier
  what_happened: Industry analysis and stakeholder consultation found that balance-of-plant
    costs (inverters, transformers, housings, battery controllers, safety systems,
    SCADA, integration costs) constituted up to 60% of total energy storage system
    costs and were not expected to fall at the same rate as battery cell prices.
  lesson_learnt: Cost reduction strategies for energy storage must target balance-of-plant
    components — not just battery cell prices — as BoP can represent over half of
    total installed cost; sharing design and integration learnings across projects
    is the most accessible mechanism to reduce BoP conservatism and cost.
