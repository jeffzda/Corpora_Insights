- record_id: ARENA-DLV-37917
  source_title: Hydrogen Communities & H2City Tool
  publish_date: 2019-06
  project_name: Clean Energy Innovation Hub (ATCO)
  what_happened: ATCO's Clean Energy Innovation Hub at Jandakot used excess solar PV generation (approximately 150kW surplus from a 300kW system) to power an electrolyser and produce approximately four
    tonnes of hydrogen per annum, testing hydrogen production, storage and end-use in a microgrid demonstration.
  lesson_learnt: Co-locating an electrolyser with an onsite solar PV system and using excess renewable generation for hydrogen production is a practical configuration for small-scale demonstration projects
    — it avoids PPA complexity, tests the full production-to-use chain, and uses infrastructure already required for the host site's own energy needs.
