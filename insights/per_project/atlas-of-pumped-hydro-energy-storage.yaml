- record_id: ARENA-DLV-11401
  source_title: ANU STORES - An Atlas of Pumped Hydro Energy Storage
  publish_date: '2018-08-02'
  project_name: Short Term Off-River Energy Storage (STORES)
  what_happened: Prior to the STORES project, there was little appreciation among policymakers and the public of the potential for off-river pumped hydro energy storage to support high penetration of variable
    wind and solar energy. The project identified approximately 22,000 potential off-river pumped hydro sites across Australia — roughly 1,000 times more than required to support a 100% renewable electricity
    system.
  lesson_learnt: Pre-feasibility site identification at a national scale can dramatically lower perceived barriers to pumped hydro deployment — a relatively modest research investment ($609,000 over 2 years)
    can shift the policy and commercial landscape by resolving a fundamental information gap about resource availability.
