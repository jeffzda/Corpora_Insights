  evidence_excerpt: Prior to STORES-1 there was little appreciation of the great potential of off-river pumped hydro energy storage to support high penetration of variable wind and solar. Largely because
    of our work this is now common knowledge. Our initial site-survey of the Australian landmass found 22,000 good sites (>300m head, >1GWh of storage) which is about 1,000 times more than required to support
    a 100% renewable electricity system.
