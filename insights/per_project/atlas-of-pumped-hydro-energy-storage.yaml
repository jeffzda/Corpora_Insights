- record_id: ARENA-DLV-11402
  source_title: ANU STORES - An Atlas of Pumped Hydro Energy Storage
  publish_date: '2018-08-02'
  project_name: Short Term Off-River Energy Storage (STORES)
  what_happened: The STORES project modelled hour-by-hour balancing of a 100% renewable National Electricity Market and found the cost of storage and balancing infrastructure to be only $20–25/MWh above
    the cost of generation — a result that was not previously widely understood and that changed perceptions of affordability.
  lesson_learnt: Quantified grid-balancing cost modelling that integrates storage, interconnection, and spillage at a system level can resolve a critical knowledge gap for policymakers and investors — if
    the affordability of storage-supported 100% renewable grids is not demonstrated with credible numbers, deployment barriers persist even where physical resources are abundant.
  issue_severity: minor
  project_type: storage
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: concept/feasibility
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: no major failure stated
  outcome_class: policy/market influence only
  secondary_failure_mode: null
  intervention_note: null
  transferability: broad
  delay_magnitude: null
  technology_domain: pumped hydro
  source_pages: &id002
  - 2
  evidence_excerpt: We showed that the cost of hourly balancing of a 100% renewable NEM (storage, stronger interstate connection, spillage of PV and wind energy) is only $20-25/MWh over and above the cost
    of energy generation. It had not been widely understood that the moderate cost of pumped hydro means that the required storage is affordable, and that the overall balancing cost is modest.
