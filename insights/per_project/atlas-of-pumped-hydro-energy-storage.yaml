- record_id: ARENA-DLV-11403
  source_title: ANU STORES - An Atlas of Pumped Hydro Energy Storage
  publish_date: '2018-08-02'
  project_name: Short Term Off-River Energy Storage (STORES)
  what_happened: The STORES project translated research outputs into high public and policy impact, including 200 outreach activities, 35 conference presentations, 30 substantive government engagements,
    readership of 120,000 via The Conversation, and press releases reaching audiences of 5–7 million. The project was completed within 2 years on a $609,000 ARENA grant.
  lesson_learnt: Research projects targeting a clearly defined information gap — combined with a proactive, multi-channel dissemination strategy including media, government briefings, and open-access data
    — can achieve disproportionate policy impact relative to project cost; open publication of a national site atlas and associated modelling is a high-leverage mechanism for accelerating technology deployment.
