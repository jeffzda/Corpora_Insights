- record_id: ARENA-DLV-48108
  source_title: ARENA-Funded Cutting Edge Research in Photovoltaics
  publish_date: 2019-09
  project_name: Advanced high-efficiency Si solar cells employing innovative atomic scale engineered surface and contact passivation layers (2017/RND007)
  what_happened: The project demonstrated that bifacial ALD aluminium oxide in PERC solar cells achieves higher efficiency (>21.5%) than monofacial aluminium oxide at significantly lower production cost,
    because the bifacial deposition also improves front contact resistance after firing and increases ALD throughput — reducing process complexity rather than adding to it.
  lesson_learnt: Adding an aluminium oxide layer to the front of a PERC cell during ALD processing can improve both performance and throughput simultaneously — when designing passivation layer processes,
    evaluate whether front-and-rear deposition in a single step reduces unit cost compared to sequential monofacial steps, as the bifacial approach may be strictly dominant on cost and performance.
