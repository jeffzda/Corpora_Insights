- record_id: ARENA-DLV-44812
  source_title: Field Study at Gullen Range Wind Farm
  publish_date: '2020-09-03'
  project_name: Gullen Range Wind Farm IBFFR Field Study
  what_happened: IBFFR coordination across multiple turbines in two staggered groups
    showed better aggregate recovery phase performance than single-group simultaneous
    boosting — wind speed diversity across the array meant some turbines experienced
    favourable post-boost conditions while others did not, with the averaged aggregate
    curve showing less power loss and shorter recovery duration.
  lesson_learnt: Staggering IBFFR boosts across multiple groups of turbines can improve
    aggregate recovery performance by exploiting natural wind speed diversity across
    the array — this design approach should be considered when optimising multi-turbine
    IBFFR deployment to minimise the post-boost energy penalty.
  issue_severity: none
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
