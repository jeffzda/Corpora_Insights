- record_id: ARENA-DLV-44808
  source_title: Field Study at Gullen Range Wind Farm
  publish_date: '2020-09-03'
  project_name: Gullen Range Wind Farm IBFFR Field Study
  what_happened: Wind speed variability across the turbine array was identified as
    having a significant influence on IBFFR boost capacity, duration, and recovery
    phase characteristics, with small differences in wind speed producing material
    differences in performance. The two-group coordinated test in particular failed
    to achieve a seamless extended boost duration of 10–12 seconds due to wind speed
    differences between individual turbines.
  lesson_learnt: IBFFR performance predictions must account for real-time wind variability
    — boost capacity, duration, and recovery phase are sensitive to short-term wind
    speed changes across the array, placing practical limits on the reliable committed
    capacity that can be offered to the market and requiring further testing under
    varied conditions before contractual commitments are made.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: data/validation/testing
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: data & measurement
  intervention_note: Comprehensive testing was carried out across a range of wind
    conditions to characterise the variability; further optimisation of multi-group
    coordination was identified as a next step.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 26
  - 30
  evidence_excerpt: Goldwind originally considered testing a version of the staggered
    group test that consisted of 4 staggered groups of turbines. It was found that
    the wind speed (and fluctuation of wind speed) has a significate influence on
    IBFFR output profile, particularly the recovery period. During a staggered test,
    the impact of wind speed changes on WTs was much greater than other use cases.
    In the 24 second period, the output power can change by more than 10% of rated
    power. In this regard, meaningful conclusions on IBFFR performance were not reliable
    enough, because the test results were not primarily influenced by the IBFFR behaviour.
    The staggered group test was changed to 2-groups, and this provided more reliable
    results.
  confidence_note: Canonical record merged from 2 source records across 1 document(s).
