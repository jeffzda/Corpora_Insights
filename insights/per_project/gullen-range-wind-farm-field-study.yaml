  technology_domain: wind
  source_pages: &id010
  - 12
  - 29
  evidence_excerpt: Although FFR services are currently not incentivised in Australia,
    there are several international jurisdictions that have defined FFR markets, with
    specific requirements for WTGs... Although some FFR services may be procured through
    the six-second FCAS market, this may not adequately reflect the value of faster
    response provided and may undervalue their impact on ensuring frequency stability
    in the power system.
