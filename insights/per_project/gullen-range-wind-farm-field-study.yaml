- record_id: ARENA-DLV-44813
  source_title: Field Study at Gullen Range Wind Farm
  publish_date: '2020-09-03'
  project_name: Gullen Range Wind Farm IBFFR Field Study
  what_happened: The NEM's existing FCAS market structure does not specifically value
    sub-two-second frequency response, meaning that IBFFR-capable wind farms cannot
    capture the full market value of their faster response capability through existing
    market mechanisms.
  lesson_learnt: Proponents investing in IBFFR capability should engage early with
    market design processes — the current NEM FCAS market undervalues fast frequency
    response relative to its system security benefit, and the commercial case for
    IBFFR investment depends on either market rule changes or a new FFR market being
    established.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: technology vendor
