  evidence_excerpt: The ten turbine, two group tests had better recovery phase performance
    than other single and multi-turbine tests, in both power loss as well as recovery
    phase duration. The difference in wind speeds across the turbines worked in favour
    of the ten turbine, two group test. Some turbines experienced favourable post-boost
    wind conditions resulting in less power loss and shorter recovery times... When
    averaged out, the aggregate curve experienced less power loss and shorter recovery
