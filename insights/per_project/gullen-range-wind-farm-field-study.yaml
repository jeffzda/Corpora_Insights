  source_title: Field Study at Gullen Range Wind Farm
  publish_date: '2020-09-03'
  project_name: Gullen Range Wind Farm IBFFR Field Study
  what_happened: IBFFR testing was conducted using simulated frequency injection signals
    rather than relying on actual network frequency events. This design decision meant
    the field study was not dependent on external grid conditions to trigger test
    scenarios.
  lesson_learnt: For field studies of frequency response technologies, design the
    test methodology around simulated frequency injection rather than waiting for
    real contingency events — this eliminates dependence on unpredictable external
    grid conditions and enables controlled, repeatable test scenarios across the full
    range of target parameters.
