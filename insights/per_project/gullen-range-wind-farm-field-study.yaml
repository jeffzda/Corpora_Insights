- record_id: ARENA-DLV-44807
  source_title: Field Study at Gullen Range Wind Farm
  publish_date: '2020-09-03'
  project_name: Gullen Range Wind Farm IBFFR Field Study
  what_happened: Post-boost power loss per turbine ranged between 260–600 kW of pre-boost
    power output for up to 19 seconds, and in many instances the turbine did not return
    to pre-boost power output within the collected data window. This energy loss from
    engaging IBFFR represents an ongoing opportunity cost for wind farm operators.
  lesson_learnt: The recovery-phase energy penalty of IBFFR — up to 600 kW per turbine
    for up to 19 seconds post-boost — must be factored into the commercial modelling
    for IBFFR participation in FFR markets, as the opportunity cost of lost generation
    may offset revenue from ancillary services depending on market pricing.
