- record_id: ARENA-DLV-44809
  source_title: Field Study at Gullen Range Wind Farm
  publish_date: '2020-09-03'
  project_name: Gullen Range Wind Farm IBFFR Field Study
  what_happened: When the IBFFR field study commenced, no FFR market existed in the
    NEM and no specific market value was placed on sub-two-second frequency response
    from wind turbines. The AEMC subsequently published a rule change on 26 March
    2020 mandating Primary Frequency Response from all generators, creating a new
    compliance requirement that IBFFR could help satisfy.
  lesson_learnt: Technology field studies for emerging grid-services capabilities
    should be scoped with awareness that the regulatory and market framework may evolve
    significantly during the project — the absence of a market at project commencement
    does not mean one will not emerge, and early demonstrations can position proponents
    advantageously for subsequent compliance or commercial opportunities.
