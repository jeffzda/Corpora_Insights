- record_id: ARENA-DLV-44803
  source_title: Field Study at Gullen Range Wind Farm
  publish_date: '2020-09-03'
  project_name: Gullen Range Wind Farm IBFFR Field Study
  what_happened: Because the field study was an Australian first, there was no established
    precedent for conducting live IBFFR testing at an operating wind farm. The requirement
    to give TransGrid several days' notice before each test, combined with limitations
    in long-term wind forecasting, introduced ongoing scheduling uncertainty and delays
    throughout the testing phase.
  lesson_learnt: When conducting a first-of-kind live field study at an operating
    wind farm, establish a clear and practical notification protocol with the network
    operator early — the combination of mandatory advance notice and inherently unpredictable
    wind conditions creates structural scheduling uncertainty that must be explicitly
    managed through flexible scheduling arrangements.
  issue_severity: moderate
  project_type: generation
  project_scale_band: demonstration
  lifecycle_phase: commissioning/integration
  proponent_type: technology vendor
  delay_category: stakeholder/land/community
  failure_mode: coordination & stakeholders
  outcome_class: delayed but recoverable
  secondary_failure_mode: null
  intervention_note: Goldwind staff monitored wind forecasting every day during the
    testing period; daily forecasts over more than three months were used to maximise
    the chances of scheduling tests within the notification window.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: wind
  source_pages:
  - 30
  - 37
  evidence_excerpt: Coordination with TransGrid was key to carrying out the live testing.
    The field study was undertaken with the knowledge and cooperation of TransGrid
    and an arrangement was agreed in which Goldwind would give TransGrid several days'
    notice in advance of testing. Due to the limitations in long term wind forecasting,
    this was a source of scheduling uncertainty and delays for the completion of the
    field study testing.
