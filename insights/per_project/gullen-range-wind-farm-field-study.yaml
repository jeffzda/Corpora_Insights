- record_id: ARENA-DLV-44811
  source_title: Field Study at Gullen Range Wind Farm
  publish_date: '2020-09-03'
  project_name: Gullen Range Wind Farm IBFFR Field Study
  what_happened: The choice of analysis threshold for determining when a turbine is
    'boosting' produced materially different performance results. Using the average
    pre-event power output as the threshold (rather than a static threshold or the
    event signal) produced more conservative and representative estimates of IBFFR
    performance.
  lesson_learnt: For IBFFR data analysis, the threshold definition for determining
    the start and end of the boost phase materially affects calculated performance
    metrics — future studies should explicitly specify and justify the threshold methodology,
    and using the pre-event average power output provides the most conservative and
    operationally representative estimate.
