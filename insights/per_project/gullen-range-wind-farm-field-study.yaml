  evidence_excerpt: When this trial commenced, the energy markets did not put a value
    or specific requirement for this type of FFR; it was theoretically being provided
    by default by large synchronous generators. However, the AEMC has been investigating
    the declining frequency stability in the NEM... On 26 March 2020, the AEMC published
