  source_title: Field Study at Gullen Range Wind Farm
  publish_date: '2020-09-03'
  project_name: Gullen Range Wind Farm IBFFR Field Study
  what_happened: The IBFFR field study successfully demonstrated reliable boost performance
    of up to 10% of nameplate capacity for six-second duration across single and multi-turbine
    configurations, with ramp delay under one second and time to peak under two seconds,
    under both low and high wind speed conditions.
  lesson_learnt: IBFFR from existing wind turbines can provide repeatable and consistent
    fast frequency response meeting most international FFR market requirements without
    prior de-rating, making it a viable low-cost option for PFR compliance for wind
    farm operators — this has been demonstrated at operational scale and can inform
    future wind farm design and ancillary services contracting strategies.
