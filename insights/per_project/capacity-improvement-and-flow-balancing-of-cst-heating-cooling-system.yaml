  project_name: Rooftop Concentrated Solar Thermal for Hospital Heating/Cooling Demonstration
    Project (Stage 2)
  what_happened: The Stage 2 project did not design for heat integration between the
    two solar thermal fields (Greenland evacuated tube and Chromasun MCT), meaning
    that heat that could not be used by the Thermax chiller was wasted rather than
    transferred to the more reliable Broad Chiller circuit.
  lesson_learnt: When designing multi-field solar thermal systems, explicitly consider
    heat integration pathways between fields at the outset — failure to design this
    in Stage 2 required a separate Stage 3 project to install the integration loop,
    adding cost and delaying energy benefits.
