- record_id: ARENA-DLV-66916
  source_title: Rooftop CST for Hospital Heating and Cooling Case Study
  publish_date: 2021-08
  project_name: Rooftop Concentrated Solar Thermal for Hospital Heating/Cooling Demonstration
    Project (Stages 1–3)
  what_happened: Solar thermal project performance targets were set without probabilistic
    framing, leaving stakeholders without a realistic range of outcomes. The 380 MWh
    target in Agreement 2019/ARP028 was stated as a single point estimate and was
    found to be unachievable; no P10/P50/P90 range was defined to communicate uncertainty.
  lesson_learnt: For demonstration solar thermal projects with significant operational
    uncertainties, express energy delivery targets as probabilistic ranges (e.g. P10/P50/P90)
    rather than single-point estimates — this improves risk communication, supports
    better funding agreement design, and avoids setting targets that are unverifiable
    or unrealistic.
  issue_severity: moderate
  project_type: industrial decarbonisation
