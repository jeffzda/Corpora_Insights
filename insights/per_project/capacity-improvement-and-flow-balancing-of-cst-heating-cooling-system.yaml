  evidence_excerpt: An apparent 'voltage drop' problem on String C for SFC2 prevented
    9 MCTs from contributing fluid temperature. The problem was rectified by modifying
    software settings. In the software, an 'Alternate Mode' was activated to allow
    only 1 of 4 MCT motors to operate at once, thereby reducing current draw and voltage
    sag... Rectification of this problem led to each of the 9 MCTs tracking properly
    ('HOME' then 'SUN status) and a significant increase in the outlet temperature
