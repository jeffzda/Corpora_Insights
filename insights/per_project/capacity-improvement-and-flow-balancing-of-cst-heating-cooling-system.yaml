- record_id: ARENA-DLV-66904
  source_title: Rooftop CST for Hospital Heating and Cooling Case Study
  publish_date: 2021-08
  project_name: Rooftop Concentrated Solar Thermal for Hospital Heating/Cooling Demonstration
    Project (Stage 2 – Chromasun field)
  what_happened: Hydraulic imbalance in the pipework from the Chromasun MCT modules
    was not addressed in the Stage 2 design — value management removed scope that
    would have provided hydraulic balancing — resulting in significantly reduced thermal
    energy available for beneficial use.
  lesson_learnt: Do not remove hydraulic balancing scope from solar thermal piping
    design as a cost-saving measure — unbalanced flows directly reduce outlet temperatures
    and recoverable energy, and the cost of rectification in a later project stage
    will far exceed the original saving.
