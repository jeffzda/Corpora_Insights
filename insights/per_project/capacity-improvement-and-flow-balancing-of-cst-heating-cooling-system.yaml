  source_title: Rooftop CST for Hospital Heating and Cooling Case Study
  publish_date: 2021-08
  project_name: Rooftop Concentrated Solar Thermal for Hospital Heating/Cooling Demonstration
    Project (Stage 2 – Chromasun field)
  what_happened: Complex software in the Chromasun Solar Field Controllers caused
    cascading failures where a single tracking error in one string disabled all MCTs
    on a controller, and a voltage drop on one string prevented nine MCTs from contributing
    to fluid temperature — problems that required expert software intervention to
    diagnose and resolve.
  lesson_learnt: Software default settings for solar collector field controllers can
    silently reduce system output at scale — verify that error-handling logic does
    not cascade single-component faults to disable entire strings or controllers,
    and test software behaviour under common fault conditions before deployment.
