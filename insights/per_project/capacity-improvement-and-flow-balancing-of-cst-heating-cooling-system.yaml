  source_title: Rooftop CST for Hospital Heating and Cooling Case Study
  publish_date: 2021-08
  project_name: Rooftop Concentrated Solar Thermal for Hospital Heating/Cooling Demonstration
    Project (Stage 3)
  what_happened: The Stage 3 project adopted a 'lean design' approach to limit engineering
    and drafting hours, which contributed to a transfer pump being procured at the
    wrong size and late identification of additional equipment (thermal relief valve,
    3-way control valve), requiring rework of engineering and procurement activities.
  lesson_learnt: Do not cut design review and QA activities from small project scopes
    — a lean design approach on the Stage 3 project caused equipment mis-specification
    and late identification of required components, resulting in procurement rework
    that could have been avoided with a structured design review involving the owner,
    designer and vendor.
