  intervention_note: Various modifications to the Thermax package were made by service
    vendor Air Solutions over subsequent years; the third-stage project installed
    a heat integration loop as a workaround to redirect available Chromasun heat to
    the more tolerant Broad Chiller.
  transferability: moderate
  delay_magnitude: not quantified
  technology_domain: solar thermal
