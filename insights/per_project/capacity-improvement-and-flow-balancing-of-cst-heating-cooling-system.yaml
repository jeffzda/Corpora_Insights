- record_id: ARENA-DLV-66903
  source_title: Rooftop CST for Hospital Heating and Cooling Case Study
  publish_date: 2021-08
  project_name: Rooftop Concentrated Solar Thermal for Hospital Heating/Cooling Demonstration
    Project (Stage 2 – Chromasun/Thermax)
  what_happened: The Thermax double-effect absorption chiller coupled to the Chromasun
    field was effectively taken out of regular service following its commissioning
    in summer 2016–17. Lower-than-design outlet temperatures from the Chromasun field
    degraded Thermax chilling performance, leading to loss of operational confidence
    and the chiller being managed as a standby unit.
  lesson_learnt: Design solar thermal systems so that the absorption chiller can accept
    a range of inlet temperatures, or provide a supplementary heat source — if the
    collector field underperforms its design temperature, a tightly coupled chiller
    will also underperform, and confidence in the whole system can be lost.
