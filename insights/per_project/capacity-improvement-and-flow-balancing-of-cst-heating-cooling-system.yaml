- record_id: ARENA-DLV-66906
  source_title: Rooftop CST for Hospital Heating and Cooling Case Study
  publish_date: 2021-08
  project_name: Rooftop Concentrated Solar Thermal for Hospital Heating/Cooling Demonstration
    Project (Stage 3)
  what_happened: The Stage 3 project failed to achieve its ARENA Agreement target
    of 380 MWh (1.4 TJ/yr) incremental annual energy gain. Actual performance during
    the monitored period indicated only approximately 200 GJ/yr (0.2 TJ/yr) was being
    delivered, largely because the integration loop operated for only 40–50% of available
    solar hours.
  lesson_learnt: Establish a clear, documented and traceable calculation basis for
    quantitative energy targets before project execution — the 380 MWh target in Agreement
    2019/ARP028 could not be substantiated, appeared to conflate design data with
    actual performance, and was found to be unachievable during evaluation.
