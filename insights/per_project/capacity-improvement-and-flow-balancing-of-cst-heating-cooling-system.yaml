  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: ERH engineer activated 'Alternate Mode' in the SFC2 software
    to allow only one of four MCT motors to operate at once, eliminating voltage sag
    and restoring tracking on nine MCTs, raising outlet temperature to 135°C.
  transferability: narrow
  delay_magnitude: null
