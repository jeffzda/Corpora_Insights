  project_name: Rooftop Concentrated Solar Thermal for Hospital Heating/Cooling Demonstration
    Project (Stages 1–3)
  what_happened: ERH used contracted annual electricity and gas prices to calculate
    marginal cost of energy per source, enabling operational decisions to dispatch
    the lowest-cost energy source. Solar thermal was consistently the lowest marginal
    cost during daylight hours, while off-peak electricity was lowest cost for night-time
    cooling.
  lesson_learnt: Develop a hospital energy cost model that tracks the marginal cost
    of each energy source (solar thermal, electricity by time-of-use tariff, gas)
    and use it to actively direct dispatch decisions — this enables quantification
    of solar thermal value and optimisation of peak demand charges.
