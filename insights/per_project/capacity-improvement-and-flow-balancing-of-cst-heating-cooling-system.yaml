- record_id: ARENA-DLV-66901
  source_title: Rooftop CST for Hospital Heating and Cooling Case Study
  publish_date: 2021-08
  project_name: Rooftop Concentrated Solar Thermal for Hospital Heating/Cooling Demonstration
    Project (Stage 2 – Chromasun field)
  what_happened: The Chromasun single-axis tracking MCT solar field installed in 2015–16
    suffered persistent performance, operability and reliability problems for the
    first four years of operation. The field operated on only approximately 30% of
    all days in the two years from February 2017 to February 2019, and achievable
    outlet temperatures were limited to approximately 115°C against a design of 170°C.
  lesson_learnt: Select solar thermal collector technologies with high commercial
    readiness, limited moving parts and low software complexity — axis-tracking concentrator
    systems with thousands of motorised components and complex software controls introduce
    failure modes and operational complexity that dramatically reduce uptime, especially
    when vendor support is absent or withdrawn.
  issue_severity: major
  project_type: industrial decarbonisation
  project_scale_band: demonstration
  lifecycle_phase: operations
  proponent_type: government/public-sector body
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: partial success
  secondary_failure_mode: execution & logistics
  intervention_note: ERH personnel invested significant time troubleshooting hardware
    (failed circuit boards, bowed mirrors, erroneous RTD connections) and software
    settings; re-establishing multiple Chromasun strings improved outlet temperatures
    to 135°C, but no vendor support was available.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar thermal
  source_pages: &id001
  - 11
  - 19
  - 24
  evidence_excerpt: Data provided by CSIRO show that the Chromasun field was only
    operated in the hotter months from February 2017 to February 2019 and in only
    about 9 months out of 24 overall. Frequency of operation during the hotter months
    was less than 100% and it is estimated that the field operated on only about 30%
    of all days in this 2 year period.
