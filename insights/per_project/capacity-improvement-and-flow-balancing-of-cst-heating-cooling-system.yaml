  what_happened: ERH staff could not be expected to dedicate significant ongoing time
    to operating and troubleshooting the complex Chromasun field, creating a resource
    constraint that reduced system uptime and solar energy extraction relative to
    what skilled, dedicated personnel could achieve.
  lesson_learnt: When deploying solar thermal technology in a hospital or similar
    operational environment, explicitly plan for dedicated maintenance and operations
    resourcing — complex collector systems that require continuous skilled intervention
    cannot be adequately maintained alongside normal building operations duties.
