  source_title: Demand Flexibility Portfolio Retrospective Analysis Report
  publish_date: 2023-07
  project_name: Origin Energy EV Smart Charging Trial
  what_happened: Origin's EV smart charging trial found that offering a 10c/kWh reward for charging outside peak hours reduced peak-time consumption by 20%, and a combined 25c/day plus 10c/kWh incentive
    under controlled charging reduced peak consumption by 24%, with the behaviour habituating after the trial ended.
  lesson_learnt: Time-based financial incentives of modest scale (10–25c/kWh or equivalent daily payments) can effectively shift EV charging behaviour away from peak periods, with durable behavioural change
    beyond the trial period; this is the most demonstrated near-term demand flexibility value stream for EV projects.
