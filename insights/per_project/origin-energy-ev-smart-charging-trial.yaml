  evidence_excerpt: They found that when offered a 10c per kWh reward for charging outside peak hours (with the credit applied to their energy bill), charging consumption at peak times was reduced by 20
    per cent, while also habituating this charging behavior after the trial had ended. Another test found that, when a 25c per day reward plus 10c per kWh outside peak hours was offered to allow Origin
    to control the charger, consumption at peak times was reduced by 24 per cent through this more automated process.
