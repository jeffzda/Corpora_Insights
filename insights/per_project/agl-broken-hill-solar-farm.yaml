- record_id: ARENA-DLV-33662
  source_title: Large Scale Solar Portfolio Evaluation
  publish_date: '2019-12-20'
  project_name: AGL Broken Hill Solar Farm
  what_happened: AGL's Broken Hill Solar Farm experienced the largest MLF reductions
    of any renewable energy generator in the NEM in two consecutive years — decreases
    of 21.4% (FY19) and 22.7% (FY20) — driven by substantial increases in projected
    power flow from wind and solar generation toward the regional reference node in
    the electrically weak south-west NSW network.
  lesson_learnt: Solar farms in electrically weak, fringe-of-grid regions with high
    renewable resource correlation face severe ongoing MLF deterioration as the grid
    fills with similar projects — developers must model dynamic MLF trajectories over
    the project life and stress-test revenue forecasts against scenarios with material
    MLF decline.
