  evidence_excerpt: The AGL Broken Hill Solar Farm initially opened in January 2016
    with a nameplate capacity of 53 MW. In each of the past two years, data from AEMO
    reveals that the project has experienced the largest MLF reduction across renewable
    energy generators in the NEM with decreases of 21.4% and 22.7% for FY19 and FY20
    respectively.
