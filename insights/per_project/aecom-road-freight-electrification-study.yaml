- record_id: ARENA-DLV-2622
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: AECOM Road Freight Electrification Study
  what_happened: The AECOM study mapped charging solutions to three operational models
    — back-to-base (overnight depot charging), base-to-hub (depot and hub charging),
    and hub-to-hub (freight hub and on-route charging) — finding that current solutions
    adequately serve back-to-base operations but future technologies (megawatt charging,
    battery swapping) are needed for hub-to-hub operations.
  lesson_learnt: Match charging infrastructure strategy to operational model before
    design — back-to-base operations can be served with existing overnight depot charging,
    but hub-to-hub long-haul operations require future charging technologies not yet
    commercially available at scale, and project timelines should reflect this technology
    readiness gap.
  issue_severity: moderate
  project_type: transport electrification
