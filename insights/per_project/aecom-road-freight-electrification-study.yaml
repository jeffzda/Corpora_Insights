- record_id: ARENA-DLV-2617
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: AECOM Road Freight Electrification Study
  what_happened: An AECOM study of Australian road freight electrification found that
    98% of freight operators are SMEs, 70% operate only one truck, average fleet vehicle
    age is 14 years, and average profit margin is 2% — structural characteristics
    that severely limit the industry's capacity to self-finance EV transition.
  lesson_learnt: Road freight EV programs targeting the mainstream market must account
    for an industry dominated by asset-poor SMEs with 2% margins and 14-year-old fleets
    — financing support and low-risk transition pathways are prerequisites for adoption,
    not optional enhancements.
