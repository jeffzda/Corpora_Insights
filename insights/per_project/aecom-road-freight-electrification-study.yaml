- record_id: ARENA-DLV-2619
  source_title: ARENA Insights Forum November 2024 - Accelerating Zero-Emissions Heavy
    Transport
  publish_date: 2024-11
  project_name: AECOM Road Freight Electrification Study
  what_happened: The AECOM study found that interstate freight represents 84% of total
    energy demand across Australian road freight use cases, with charging expected
    to occur 57% on-road, 29% at destination/freight hubs, and only 14% at depots
    — the inverse of the charging pattern for urban and intrastate freight.
  lesson_learnt: Infrastructure investment strategies for interstate freight electrification
    must prioritise on-road and freight hub charging (86% of charging events) rather
    than depot-based solutions — applying urban freight charging assumptions to interstate
    routes will result in infrastructure misallocation.
