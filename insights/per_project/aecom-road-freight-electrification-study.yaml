  what_happened: 'The AECOM study identified the top barriers to electrifying road-based
    freight as: cost of vehicles and infrastructure, operational challenges (charging
    times and regulatory/access controls), range anxiety, fleet planning complexity,
    availability of public charging infrastructure, availability of vehicles, and
    grid capacity.'
