- record_id: ARENA-DLV-72249
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Greenough River Solar Farm
  what_happened: Greenough River Solar Farm (AUD 50M, ~10MW) was Australia's first
    utility-scale PV project connected to a network via a PPA, and encountered first-mover
    barriers including developing investor understanding, managing investor risk,
    and negotiating utility-scale network connection agreements with no established
    precedents.
  lesson_learnt: First utility-scale solar PV grid connection projects face significant
    first-mover barriers in investor confidence and network connection negotiation
    — subsequent projects benefit from the precedents established, so the full cost
    of pioneering connection processes should be factored into FOAK project business
    cases.
