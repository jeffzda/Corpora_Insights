- record_id: ARENA-DLV-72250
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: '2015'
  project_name: Greenough River Solar Farm
  what_happened: The Greenough River Solar Farm demonstrated that utility-scale PV
    plants can be configured to actively manage cloud-induced generation variability
    by using curtailed inverter capacity to compensate for cloud-impacted inverters,
    and by the fact that clouds only affect parts of a large plant at any one time.
  lesson_learnt: Utility-scale PV plants have inherent smoothing advantages over small-scale
    PV due to spatial diversity across the plant area and the ability to redeploy
    curtailed inverter capacity during cloud events — project designers should treat
    output smoothing as a design feature of large-scale plants rather than requiring
    separate storage to address intermittency.
  issue_severity: none
  project_type: generation
  project_scale_band: first commercial/FOAK
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: null
  failure_mode: no major failure stated
