  - 300
  evidence_excerpt: 'plants are designed to meet maximum capacity requirements, but
    curtailed daytime peaks can be used to smooth out cloud events due to: 1) clouds
    only affecting parts of the plant at a time 2) allowing curtailed inverters to
    export more energy to compensate for cloud-impacted inverters.'
