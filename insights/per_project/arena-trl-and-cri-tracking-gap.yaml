- record_id: ARENA-DLV-15830
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA — TRL and CRI tracking gap
  what_happened: The TRL (Technology Readiness Level) index had only been used to
    measure progress of solar PV and CST R&D projects. TRL and CRI information was
    not available for other emerging technologies in which ARENA had invested, including
    large-scale battery storage, making it impossible to consistently demonstrate
    technology progression across the portfolio.
  lesson_learnt: Integrate TRL and CRI reporting into standard contract requirements
    for all ARENA-funded technology programs — without consistent readiness-level
    tracking across all technology domains, it is not possible to demonstrate portfolio-level
    technology progression or identify where additional investment is needed to advance
    technologies along the commercialisation pathway.
