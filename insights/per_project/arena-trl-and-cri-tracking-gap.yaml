  evidence_excerpt: At present TRL index has been used to measure the progress of
    solar PV and CST R&D projects only. TRL and CRI information is not available for
    other emerging technologies that ARENA has invested in (i.e. Large-Scale Battery
    Storage). We recommend ARENA integrate TRL index reporting and CRI reporting into
    its BAU practice to consistently track the progress of projects across all technologies
    along the technology development chain.
