- record_id: ARENA-DLV-72221
  source_title: 'Stocktake: Database of Renewable Energy Grid Integration Projects
    - First Edition Results'
  publish_date: null
  project_name: Carnarvon High Penetration PV Study
  what_happened: The Carnarvon isolated grid experienced one recorded instance of
    multiple PV systems simultaneously disconnecting due to a system-wide frequency
    disturbance, and two recorded instances of significant LV network voltage rises.
    Both voltage problems were resolved by reconfiguring distribution transformer
    tap changers or line augmentations, while the frequency disconnection risk is
    managed by maintaining sufficient spinning reserve.
  lesson_learnt: 'Isolated grids with high PV penetration face two distinct technical
    risks — mass inverter disconnection during frequency events and LV voltage rises
    — that require different mitigations: spinning reserve for frequency stability,
    and tap-changer reconfiguration or line augmentation for voltage. Plan for both
    before penetration levels reach critical thresholds.'
