- record_id: ARENA-DLV-15807
  source_title: Evaluation of ARENA's Impact and Effectiveness
  publish_date: 2019-11
  project_name: ARENA early funding programs — project monitoring
  what_happened: ARENA's early funding program project management was onerous and
    inefficient due to a one-size-fits-all monitoring approach. The Future Needs Review
    found monitoring was 'cumbersome and inefficient' and the RAR evaluation found
    assessments could take months between milestone reporting and payment, threatening
    the cash flow of start-ups.
  lesson_learnt: Apply a risk-calibrated monitoring framework rather than a uniform
    approach — milestone payment delays caused by one-size-fits-all monitoring threatened
    start-up cash flow and created unnecessary administrative burden for all project
    types.
  issue_severity: moderate
  project_type: multi-technology/hybrid
  project_scale_band: programmatic/portfolio-level
  lifecycle_phase: operations
  proponent_type: project developer
  delay_category: internal governance/resourcing
  failure_mode: coordination & stakeholders
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: ARENA implemented a risk-based adaptive monitoring approach using
    milestone reports, overseen by a Project Portfolio Management Committee, which
    subsequent evaluations found to be efficient.
  transferability: broad
  delay_magnitude: 1-3 months
  technology_domain: null
