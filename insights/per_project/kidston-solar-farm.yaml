- record_id: ARENA-DLV-14668
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Kidston Solar Farm
  what_happened: A site fire incident occurred at the Kidston Solar Farm, an extremely
    remote 50 MWAC project on a disused mine site in a high-irradiance, low-rainfall
    environment where vegetation growth presents an ongoing fire risk. The O&M team
    handled the incident and implemented site flora monitoring and routine grass/vegetation
    management procedures in response.
  lesson_learnt: Remote solar farms in high-irradiance, low-rainfall environments
    must include proactive vegetation management and fire risk mitigation in their
    O&M plans from the outset — a reactive approach following a fire incident results
    in unplanned cost and operational disruption.
