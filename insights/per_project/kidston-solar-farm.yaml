- record_id: ARENA-DLV-14669
  source_title: 'Lessons From the Fringes: Australian Fringe-Of-Grid Projects in ARENA''s
    Portfolio'
  publish_date: 2018-06
  project_name: Kidston Solar Farm
  what_happened: The extreme remoteness of the Kidston site (a disused mine) required
    accommodation facilities to be established for the construction workforce, which
    continued to serve the O&M phase after construction completion.
  lesson_learnt: Accommodation and welfare infrastructure should be planned and budgeted
    as a capital cost item for remote mine-site or equivalent FOG projects — if designed
    well, these facilities can serve double duty during both construction and ongoing
    O&M, reducing total lifecycle cost.
