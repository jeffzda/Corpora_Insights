- record_id: ARENA-DLV-11021
  source_title: Renewable Energy Options for Industrial Process Heat
  publish_date: 2019-08
  project_name: Cleanaway ResourceCo Waste to Process Engineered Fuel Plant, Wetherill Park NSW
  what_happened: Cleanaway ResourceCo opened a waste recovery plant in Wetherill Park, NSW in 2018 — the first of its kind in NSW — to process 250,000 tonnes/year of residues into process engineered fuels
    for cement kilns, expected to replace 50,000 tonnes of coal at the Boral Berrima cement plant. The plant received debt financing from the CEFC and a grant from the NSW Environmental Trust. The fuel
    is noted as more cost effective than coal, but high transport costs mean it is most effective for nearby use.
  lesson_learnt: Process engineered fuels from waste can displace coal in cement kilns at competitive cost, but high transport costs constrain viable catchment radius — waste processing facilities must
    be located near the end-use kiln to maintain cost-effectiveness.
