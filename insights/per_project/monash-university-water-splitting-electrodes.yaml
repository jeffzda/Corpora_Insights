  source_title: Summary of ARENA Funded Hydrogen R&D Projects
  publish_date: 2023-04
  project_name: Monash University – Water Splitting Electrodes
  what_happened: Techno-economic modelling in the Monash water splitting electrodes project found that low-cost electrodes for electrolysers substantially improve cost-effectiveness of hydrogen production
    even when their efficiency is slightly lower than conventional electrodes — a counterintuitive finding that challenges standard optimisation priorities.
  lesson_learnt: Electrolyser development projects should conduct integrated techno-economic modelling alongside materials characterisation — efficiency maximisation is not always the dominant lever for
    LCOH reduction, and capital cost reduction through low-cost electrode materials may deliver greater commercial value than marginal efficiency gains.
