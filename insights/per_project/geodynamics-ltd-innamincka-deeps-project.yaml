- record_id: ARENA-DLV-14953
  source_title: 'Looking Forward: Barriers, Risks and Rewards of the Australian Geothermal
    Sector to 2020 and 2030'
  publish_date: 2014-06
  project_name: Geodynamics Ltd – Innamincka Deeps Project
  what_happened: A catastrophic casing failure occurred in one of six wells at the
    Innamincka Deeps project only days before hot commissioning of the pilot plant
    was due in early 2009, causing significant delays; two of the six wells were ultimately
    abandoned.
  lesson_learnt: Well casing integrity in high-temperature, high-pressure EGS environments
    is a critical pre-commissioning risk; projects should build contingency into commissioning
    schedules and budgets for potential well failures, and maintain redundant well
    capacity to avoid single-point-of-failure scenarios at the commissioning milestone.
