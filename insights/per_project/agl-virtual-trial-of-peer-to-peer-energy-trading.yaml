- record_id: ARENA-DLV-55765
  source_title: Peer-to-Peer Distributed Ledger Technology Assessment
  publish_date: 2017-10
  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: The project identified that geographically constraining P2P trading
    pools to DNSP service areas (or substation-level boundaries of approximately 10,000
    customers in urban settings) is necessary for the DLT-based market structure to
    function — enabling jurisdiction-specific rules, local marginal pricing by DNSPs,
    and network-constrained pool management. Without this geographic constraint, the
    market structure cannot extract network benefits or manage different state-based
    regulatory requirements.
  lesson_learnt: P2P trading platform design must incorporate geographic pool constraints
    aligned to DNSP network boundaries from the outset — defining pools at substation
    level enables network benefit extraction, appropriate regulatory jurisdiction,
    and manageable DLT transaction volumes. Platforms designed without geographic
    constraints will be unable to capture network value or comply with state-based
    regulations.
