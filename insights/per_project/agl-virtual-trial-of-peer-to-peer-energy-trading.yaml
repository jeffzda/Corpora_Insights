- record_id: ARENA-DLV-55755
  source_title: Peer-to-Peer Distributed Ledger Technology Assessment
  publish_date: 2017-10
  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: 'IBM concluded that DLT adds value only in market structures involving
    multiple retailers trading across trust boundaries (Market Structure #2), not
    in single-retailer arrangements where existing trust relationships already exist.
    Under Market Structure #1 (single retailer, existing customer relationships),
    a conventional database would suffice, making DLT unnecessary and unjustified.'
  lesson_learnt: DLT is only warranted for P2P energy trading when the market structure
    involves multiple independent entities without existing trust relationships —
    specifically multiple retailers, a separate administrator, and regulators. If
    a P2P product is deployed within a single retailer's customer pool, invest in
    traditional IT infrastructure rather than DLT to avoid unnecessary complexity
    and cost.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: 'IBM scoped the DLT suitability assessment exclusively to Market
    Structure #2, explicitly excluding single-retailer scenarios from the DLT business
    case.'
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id005
  - 54
  - 69
  evidence_excerpt: 'Market Structure #1 is essentially based on an existing trust
    relationship between a Retailer and Consumer and an assumed trust relationship
    between a Retailer and Administrator. Since Distributed Ledger Technology (DLT)
    is primarily designed to accommodate the needs of multiple business entities to
    transact across trust boundaries, this model is not expected to benefit from DLT.'
