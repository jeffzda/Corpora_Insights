  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: The project identified that interval meter data (half-hourly readings
    across all participants) is not suitable for storage in a distributed ledger due
    to volume constraints, and that this data must remain in traditional databases.
    The DLT is appropriate only for reference data (trading instructions, contract
    terms, net settlement positions) with lower frequency of change and smaller total
    volume.
  lesson_learnt: When designing a DLT-based energy trading platform, draw an explicit
    architectural boundary between data that belongs on-chain (trading instructions,
    net positions, smart contract rules) and data that belongs off-chain (interval
    metered readings, individual trade records). Failure to make this distinction
    during design will result in a system that either exceeds DLT performance limits
    or requires costly re-architecture.
