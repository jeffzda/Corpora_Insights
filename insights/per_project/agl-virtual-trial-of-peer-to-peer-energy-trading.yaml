- record_id: ARENA-DLV-55754
  source_title: Peer-to-Peer Distributed Ledger Technology Assessment
  publish_date: 2017-10
  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: The modelling demonstrated that load shifting to match solar peak
    output (shifting evening demand by six hours to coincide with 10am–3pm solar export)
    increased prosumer earnings by 84% and grew the number of P2P trades by 8% compared
    to the base P2P scenario. However, the project noted that actual customer uptake
    of time-of-use tariffs has been low, indicating low willingness to shift load,
    making this scenario optimistic.
  lesson_learnt: Load shifting is a powerful lever for unlocking P2P market value
    but requires intelligent load control technology, sufficient flexible loads, and
    customer willingness to shift — all of which are currently limited in the residential
    sector. Developers should treat load-shifting scenarios as upper-bound estimates
    only and invest in understanding actual customer demand elasticity before designing
    P2P products that depend on it.
  issue_severity: moderate
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: concept/feasibility
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: knowledge generated despite setback
  secondary_failure_mode: poor scoping
  intervention_note: Project explicitly flagged the load-shifting scenario as 'optimistic,
    but useful for demonstration purposes' and recommended a real-world trial to assess
    actual customer behaviour.
  transferability: moderate
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id004
