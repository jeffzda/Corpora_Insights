- record_id: ARENA-DLV-55753
  source_title: Peer-to-Peer Distributed Ledger Technology Assessment
  publish_date: 2017-10
  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: IBM's Stage 2 assessment found that current DLT platforms are not
    capable of processing the high frequency and high volume of individual interval-metered
    energy transactions required for a full-scale P2P market. At 48 half-hourly trading
    intervals per day across hundreds of thousands of customers, the individual transaction
    volume would exceed approximately 400 trades per second — beyond the capabilities
    of existing DLT implementations.
  lesson_learnt: DLT should not be designed to record every individual P2P energy
    transaction at interval-meter granularity — instead, the ledger should be scoped
    to record only trading instructions and net aggregated retailer positions, with
    detailed transaction data held off-chain in traditional databases. This architectural
    boundary is essential to keeping DLT workloads within current technical capabilities.
  issue_severity: major
  project_type: software/data/digital
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: utility/energy retailer
  delay_category: null
  failure_mode: poor scoping
  outcome_class: re-scoped/adapted
  secondary_failure_mode: unvalidated technical assumptions
  intervention_note: IBM proposed limiting DLT scope to trading instructions and net
    retailer settlement positions, with individual trade records held off-chain, reducing
    transaction rates to 1–116 per second — within current DLT capability.
  transferability: broad
  delay_magnitude: null
  technology_domain: DER
  source_pages: &id003
  - 9
  - 43
  - 69
  evidence_excerpt: DLTs are not currently suitable for high-frequency and very high-volume
    transactions. While it could be of intuitive interest to store all prosumers and
    consumer transactions in the ledger, the volume and frequency of such data would
    make this difficult and costly to maintain effectively in a full-scale market.
  confidence_note: null
