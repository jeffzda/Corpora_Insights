  publish_date: 2017-10
  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: The Stage 1 virtual modelling exercise used only 85 consumer and
    27 prosumer accounts from a single suburban Melbourne day, limiting the generalisability
    of findings. The project team acknowledged the sample was small and the single-day
    snapshot could not capture seasonal variation, diverse customer types, or storage-enabled
    behaviour.
  lesson_learnt: Virtual P2P trading models require a more diverse customer sample
    and longer historical load data to produce generalisable results — a single representative
    day and a small cohort are sufficient only to establish proof-of-concept, not
    to inform commercial deployment decisions.
