  source_title: Peer-to-Peer Distributed Ledger Technology Assessment
  publish_date: 2017-10
  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: The project used a 'facilitated' or pooled P2P model rather than
    direct bilateral trading, because bilateral real-time price negotiation between
    individual households was not practically achievable at the scale modelled. All
    prosumers sold into a central pool and all consumers bought from that pool, with
    the retailer continuing as FRMP. This design simplification meant individual-to-individual
    directed trades — a potential non-economic value driver — could not be properly
    assessed.
  lesson_learnt: Pooled P2P models are necessary for operability at residential scale
    under current metering and settlement arrangements, but they sacrifice the directed-trade
    value proposition that differentiates P2P from conventional retailing. Platform
    architects should explicitly choose between pooled and bilateral architectures
    early in design, as this choice determines both technical complexity and the customer
    value propositions that can be offered.
