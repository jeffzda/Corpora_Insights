- record_id: ARENA-DLV-55752
  source_title: Peer-to-Peer Distributed Ledger Technology Assessment
  publish_date: 2017-10
  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: The modelling found that P2P trading under current Australian network
    pricing rules does not create new economic value — it only redistributes value
    between market participants. The P2P market could only generate net consumer/prosumer
    benefit if a retailer or network reduced their cost to serve, because existing
    network charges are levied uniformly regardless of the consumer's proximity to
    generation.
  lesson_learnt: P2P energy trading business models are fundamentally dependent on
    network pricing reform — developers should not proceed to real-world trials without
    first confirming that the regulatory and pricing framework can accommodate localised
    network charge reductions, otherwise the economic case for P2P will not close.
