  what_happened: The project found that existing Australian network pricing does not
    differentiate between locally generated and remotely generated electricity, meaning
    consumers pay the same transmission charges regardless of the proximity of the
    source. This structure actively prevents a viable P2P market from forming under
    current rules, as the full transmission use-of-system charge consumes the economic
    headroom that would otherwise make P2P trades attractive.
  lesson_learnt: Network pricing reform — specifically the ability to reduce or waive
    transmission use-of-system charges for locally traded energy — is a prerequisite
    for a viable P2P market. Projects developing P2P platforms should engage with
    the AER and AEMC on network tariff reform pathways in parallel with technology
    development, not as a later-stage consideration.
