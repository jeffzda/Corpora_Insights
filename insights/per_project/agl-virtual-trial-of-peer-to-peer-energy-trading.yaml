- record_id: ARENA-DLV-55756
  source_title: Peer-to-Peer Distributed Ledger Technology Assessment
  publish_date: 2017-10
  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: Scenario 3 modelling showed that a low-cost new-entrant P2P administrator
    — operating with minimal overheads and acting under the auspices of an existing
    licensed retailer as FRMP — could deliver the greatest financial value to consumers
    and prosumers (45% prosumer earnings increase, 2% consumer bill reduction), but
    would reduce incumbent retailer revenues by 12%. The project identified several
    practical and regulatory obstacles preventing this scenario under current rules.
  lesson_learnt: The most financially attractive P2P market structure — a low-cost
    challenger administrator — requires regulatory reform to allow new entrants to
    operate as market administrators within the existing FRMP framework. Proponents
    planning new-entrant P2P platforms must map current licensing and settlement obligations
    early and factor the cost and timeline of regulatory engagement into project planning.
