  project_name: Peer-to-Peer Distributed Ledger Technology Assessment
  what_happened: International comparator analysis found that P2P energy trading viability
    is directly shaped by national regulatory frameworks. The Netherlands' deregulated
    market enabled Vandebron to operate since 2014, while the UK's Electricity Act
    1989 restricted residential P2P trading by requiring a full supply licence, prohibiting
    battery storage commercial use, and not allowing partial network charges — preventing
    Piclo from extending to households.
  lesson_learnt: The regulatory licensing and network charge framework is the primary
    determinant of whether a residential P2P business model is commercially viable.
    Before investing in platform development, P2P proponents in Australia should conduct
    a detailed regulatory mapping exercise to identify which specific rules (licensing,
    metering, network charge structures) would need to change and engage with regulators
    on feasible reform pathways.
