- record_id: ARENA-DLV-58953
  source_title: Towards Ultimate Performance Commercial Silicon Solar Cells
  publish_date: 2020-03
  project_name: Towards Ultimate Performance Commercial Silicon Solar Cells (2014/RND068)
  what_happened: The PLDB contacting technique, initially targeted as a drop-in replacement
    for conventional high-thermal-budget rear contacts in silicon solar cells, was
    found to be not feasible for industrial-scale replacement of conventional silicon
    contacts at this stage, but proved highly applicable for devices integrating novel
    non-silicon materials or process flows incompatible with standard silicon processing.
  lesson_learnt: Assess PLDB contacts as an enabling technology for heterogeneous
    material integration (e.g. III-V on silicon, perovskite hybrids) rather than a
    near-term industrial replacement for conventional silicon contacts — its key advantage
    is compatibility with low-temperature and unconventional process flows, not cost-competitive
    parity with incumbent silicon contact processes at scale.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: re-scoped/adapted
  secondary_failure_mode: null
  intervention_note: Redirected focus from industrial silicon replacement to novel
    material integration applications where PLDB's low-temperature process compatibility
    is a distinct advantage.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id003
  - 13
  evidence_excerpt: PLDB contacts are a viable replacement for conventional thermal
    contacts, but in terms of replacing these at an industrial level for silicon solar
    cells, this appears to not be feasible at this stage. PLDB is, however, an excellent
    choice for devices that are integrating novel materials as well as those materials
    systems with fabrication processes that are incongruent with those for silicon.
  confidence_note: failure_mode set to design assumption failure because the original
