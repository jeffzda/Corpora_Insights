  project_name: Towards Ultimate Performance Commercial Silicon Solar Cells (2014/RND068)
  what_happened: Characterising the specific contact resistivity of PLDB (Plated Laser
    Doped Boron) point contacts proved unexpectedly difficult because standard measurement
    techniques used for conventional contacts are not applicable to point-contact
    geometries, requiring the team to develop alternative multi-measurement approaches.
  lesson_learnt: When investigating point-contact architectures such as PLDB, plan
    for non-standard characterisation methods from the outset — conventional contact
    resistivity measurement techniques are not directly applicable, and a verified
    model for extracting specific contact resistivity from point contacts does not
    yet exist. Budget time and resources for methodological development.
