- record_id: ARENA-DLV-58956
  source_title: Towards Ultimate Performance Commercial Silicon Solar Cells
  publish_date: 2020-03
  project_name: Towards Ultimate Performance Commercial Silicon Solar Cells (2014/RND068)
  what_happened: Advanced hydrogenation technology developed in this project transformed
    low-cost, low-quality silicon wafers into material comparable in quality to wafers
    costing over 100 times more, and was successfully transferred to and adopted by
    multiple large commercial PERC solar cell manufacturers for mass production.
  lesson_learnt: Advanced hydrogenation is a commercially proven, high-impact cost-reduction
    lever for PERC cell manufacturing — future silicon PV projects should evaluate
    its integration as a priority, as it delivers ~0.3% absolute efficiency gain,
    reduces first-year degradation from ~10% to ~0.5%, and has been demonstrated to
    lift project IRR from 6.64% to 8.0% for a 130 MW Australian solar farm, meeting
    typical investor hurdle rates.
