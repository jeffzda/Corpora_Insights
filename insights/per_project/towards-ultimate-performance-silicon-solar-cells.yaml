- record_id: ARENA-DLV-58955
  source_title: Towards Ultimate Performance Commercial Silicon Solar Cells
  publish_date: 2020-03
  project_name: Towards Ultimate Performance Commercial Silicon Solar Cells (2014/RND068)
  what_happened: Simultaneous dual-surface electroless copper plating of bifacial
    solar cells had not been previously developed for industrial application. UNSW
    designed and built a prototype bifacial plating tool that plated both front and
    rear surfaces simultaneously, demonstrating finished cell efficiencies over 20%
    on full-size commercial wafers and reducing plating duration and cost compared
    to sequential single-surface plating.
  lesson_learnt: Simultaneous bifacial electroless copper plating is a viable, lower-cost
    alternative to sequential silver screen-printing for bifacial cells — designing
    the plating tool for dual-surface simultaneous operation from the outset reduces
    process time and cost, and the approach is scalable to commercial production.
