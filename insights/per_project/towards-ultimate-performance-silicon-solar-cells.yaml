- record_id: ARENA-DLV-58954
  source_title: Towards Ultimate Performance Commercial Silicon Solar Cells
  publish_date: 2020-03
  project_name: Towards Ultimate Performance Commercial Silicon Solar Cells (2014/RND068)
  what_happened: Conventional laser-doped selective emitter (LDSE) plated contacts
    suffered from laser-induced dielectric damage and poor adhesion due to flat-profile
    laser doping, particularly as metal fingers became thinner — a known failure mode
    when cells are made into modules. UNSW developed a deep laser-doped grooving approach
    (3–5 micron narrow grooves) that simultaneously doped groove walls, enabling dielectric
    passivation after groove formation and delivering adhesion performance superior
    to commercial screen printing.
  lesson_learnt: Use deep laser-doped grooving instead of flat-profile laser doping
    for plated contacts — the groove geometry preserves surface passivation, eliminates
    most laser-induced damage from thermal expansion mismatch, and produces adhesion
    that exceeds screen-printed contacts, making it viable and cost-competitive for
    PERC and emerging silicon heterojunction devices.
  issue_severity: moderate
  project_type: manufacturing/supply chain
  project_scale_band: demonstration
  lifecycle_phase: development/design
  proponent_type: research organisation/university
  delay_category: null
  failure_mode: unvalidated technical assumptions
  outcome_class: successful demonstration
  secondary_failure_mode: null
  intervention_note: Developed a single-step deep grooving process forming 3–5 micron
    narrow grooves with heavily doped walls, allowing SiNx passivation to be applied
    after groove formation and enabling selective copper plating only within grooves.
  transferability: moderate
  delay_magnitude: null
  technology_domain: solar PV
  source_pages: &id004
  - 14
  - 15
  evidence_excerpt: Existing techniques often suffer from laser-induced damage during
    dielectric opening which cannot be entirely removed or passivated. Furthermore,
    due to the reduced surface area when using flat-profile laser doping, in particular
    as fingers become thinner, surface adhesion between the silicon and plated metal
    remains a common failure mode once cells are made into modules.
  confidence_note: null
